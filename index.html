ές ώρες συναλλαγών. ΙΙ. Δύνανται να επικαιροποιούν τις προσφορές τους ανά πάσα στιγμή. ΙΙΙ. Επιτρέπεται να ανακαλούν τις προσφορές τους. ΙV. Επιτρέπεται να ανακαλούν τις προσφορές τους υπό εξαιρετικές συνθήκες αγοράς.","o":[{"k":"α","t":"I, II και ΙΙΙ."},{"k":"β","t":"Ι και ΙΙ."},{"k":"γ","t":"Ι, ΙΙ και IV."},{"k":"δ","t":"ΙΙ και IV."}]},{"n":39,"a":"β","q":"Η ειδική διαπραγμάτευση μετοχών αφορά:","o":[{"k":"α","t":"Στη σταθεροποίηση τιμής της μετοχής μετά την εισαγωγή στο ΧΑ."},{"k":"β","t":"Στην κάλυψη κενών ζήτησης & προσφοράς για συγκεκριμένη μετοχή."},{"k":"γ","t":"Σε εξωχρηματιστηριακές συναλλαγές."},{"k":"δ","t":"Σε συναλλαγές πακέτα στο ΧΑ."}]},{"n":40,"a":"δ","q":"Το καθεστώς συναλλακτικής διαφάνειας που προβλέπει ο Κανονισμός (ΕΕ) 600/2014 περιλαμβάνει τις ακόλουθες υποχρεώσεις: Ι. Υποχρεώσεις μετα-συναλλακτικής διαφάνειας όσον αφορά ομολογίες, δομημένα χρηματοοικονομικά προϊόντα, δικαιώματα εκπομπής ρύπων και παράγωγα. ΙΙ. Υποχρεώσεις προ-συναλλακτικής διαφάνειας όσον αφορά μετοχές, πιστοποιητικά αποθετηρίου, ΔΑΚ, πιστοποιητικά και άλλα παρόμοια χρηματοπιστωτικά μέσα. ΙΙΙ. Υποχρεώσεις προ-συναλλακτικής διαφάνειας όσον αφορά ομολογίες, δομημένα χρηματοοικονομικά προϊόντα, δικαιώματα εκπομπής ρύπων και παράγωγα. IV. Υποχρεώσεις μετα-συναλλακτικής διαφάνειας όσον αφορά μετοχές, πιστοποιητικά αποθετηρίου, ΔΑΚ, πιστοποιητικά και άλλα παρόμοια χρηματοπιστωτικά μέσα.","o":[{"k":"α","t":"I και ΙΙΙ."},{"k":"β","t":"ΙΙ και IV."},{"k":"γ","t":"I, II και ΙΙΙ."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":41,"a":"β","q":"Οι διαχειριστές τόπου διαπραγμάτευσης τηρούν στη διάθεση της αρμόδιας αρχής τα στοιχεία σχετικά με όλες τις εντολές για χρηματοπιστωτικά μέσα που ανακοινώνονται μέσω των συστημάτων τους:","o":[{"k":"α","t":"Για 3 τουλάχιστον χρόνια."},{"k":"β","t":"Για 5 τουλάχιστον χρόνια."},{"k":"γ","t":"Για 7 τουλάχιστον χρόνια."},{"k":"δ","t":"Για 10 τουλάχιστον χρόνια."}]},{"n":42,"a":"δ","q":"Η ιδιότητα του Εκκαθαριστικού Μέλους: I. Αποκτάται μετά από άδεια της ΕΤ.ΕΚ.. II. Παρέχει το δικαίωμα προσβάσεως στο σύστημα προς εκκαθάριση συναλλαγών επί Κινητών Αξιών για λογαριασμό πελατών ή για ίδιο λογαριασμό. III. Είναι μεταβιβάσιμη ή δύναται να εκχωρηθεί σε τρίτο. Ποιες από τις παραπάνω προτάσεις (I, II, III) είναι σωστές;","o":[{"k":"α","t":"I και III."},{"k":"β","t":"II και III."},{"k":"γ","t":"I, II και III."},{"k":"δ","t":"I και II."}]},{"n":43,"a":"β","q":"Ποιο από τα παρακάτω είναι ορθό;","o":[{"k":"α","t":"Ο Λογαριασμός Αξιών είναι το σύνολο των Λογαριασμών Χειριστή που ανήκουν σε μερίδα. Ο Λογαριασμός Αξιών δημιουργείται από το ΧΑ ύστερα από σχετικό αίτημα Χειριστή προς τον οποίο έχει δοθεί σχετική εντολή από τον δικαιούχο της Μερίδας. Το ΣΑΤ δε δημιουργεί Λογαριασμό Αξιών και Μερίδα Επενδυτή σε περίπτωση που ο δικαιούχος φέρεται, βάσει των καταχωρημένων στα αρχεία του στοιχεία, να έχει ήδη Μερίδα Επενδυτή σε αυτό."},{"k":"β","t":"Ο Λογαριασμός Αξιών είναι το σύνολο των Λογαριασμών Χειριστή που ανήκουν σε μερίδα. Ο Λογαριασμός Αξιών δημιουργείται από το ΣΑΤ ύστερα από σχετικό αίτημα Χειριστή προς τον οποίο έχει δοθεί σχετική εντολή από τον δικαιούχο της Μερίδας. Το ΣΑΤ δε δημιουργεί Λογαριασμό Αξιών και Μερίδα Επενδυτή σε περίπτωση που ο δικαιούχος φέρεται, βάσει των καταχωρημένων στα αρχεία του στοιχεία, να έχει ήδη Μερίδα Επενδυτή σε αυτό."},{"k":"γ","t":"Ο Λογαριασμός Αξιών είναι το σύνολο των Λογαριασμών Χειριστή που ανήκουν σε μερίδα. Ο Λογαριασμός Αξιών δημιουργείται από το ΣΑΤ ύστερα από σχετικό αίτημα Χειριστή προς τον οποίο έχει δοθεί σχετική εντολή από τον δικαιούχο της Μερίδας. Το ΣΑΤ δημιουργεί νέο Λογαριασμό Αξιών και Μερίδα Επενδυτή σε περίπτωση που ο δικαιούχος φέρεται, βάσει των καταχωρημένων στα αρχεία του στοιχεία, να έχει ήδη Μερίδα Επενδυτή σε αυτό."},{"k":"δ","t":"Ο Λογαριασμός Αξιών είναι το σύνολο των Λογαριασμών Χειριστή που ανήκουν σε μερίδα. Ο Λογαριασμός Αξιών δημιουργείται από το ΣΑΤ ύστερα από σχετικό αίτημα της Ε.Κ. προς τον οποίο έχει δοθεί σχετική εντολή από τον δικαιούχο της Μερίδας. Το ΣΑΤ δε δημιουργεί Λογαριασμό Αξιών και Μερίδα Επενδυτή σε περίπτωση που ο δικαιούχος φέρεται, βάσει των καταχωρημένων στα αρχεία του στοιχεία, να έχει ήδη Μερίδα Επενδυτή σε αυτό."}]},{"n":44,"a":"α","q":"Ως χειριστής, σύμφωνα με τον Κανονισμό Λειτουργίας του Συστήματων Άυλων Τίτλων (ΣΑΤ), νοείται το πρόσωπο το οποίο δικαιούται να κινεί Λογαριασμό Χειριστή, σύμφωνα με τον Κανονισμό αυτό και διαθέτει τα κατάλληλα τεχνολογικά και λειτουργικά μέσα που απαιτούνται για τη διασύνδεση και επικοινωνία του με το ΣΑΤ. Χειριστής μπορεί να είναι: I. Μέλος. II. Θεματοφύλακας. III. Αλλοδαπό Κεντρικό Αποθετήριο Αξιών (με τις απαιτούμενες κανονιστικές και λειτουργικές προϋποθέσεις). IV. Θεσμικός Επενδυτής. V. Το Ταμείο Παρακαταθηκών και Δανείων (ΤΠΔ). VI. Η Ελληνικό Κεντρικό Αποθετήριο Τίτλων Α.Ε. (ATHEXCSD) για όσες ενέργειες προβλέπονται ρητά σε οικείους Κανονισμούς. VII. Διαχειριστής Συστήματος που έχει συνδεθεί με το ΣΑΤ για τον διακανονισμό συναλλαγών, σύμφωνα με τους όρους του Κανονισμού ΣΑΤ. Ποια από τα παραπάνω (Ι έως VII) είναι ορθό/ά;","o":[{"k":"α","t":"I έως VII πλην IV και V."},{"k":"β","t":"I έως V."},{"k":"γ","t":"III έως VII."},{"k":"δ","t":"V έως VII."}]},{"n":45,"a":"β","q":"Κατά την ημερήσια λειτουργία της Ηλεκτρονικής Δευτερογενούς Αγοράς Τίτλων (ΗΔΑΤ) διακρίνονται τα εξής στάδια σε σχέση με τις συναλλαγές που καταρτίζονται σε αυτήν:","o":[{"k":"α","t":"Α) Στάδιο προπαρασκευαστικό. Β) Στάδιο λειτουργίας. Γ) Στάδιο κλεισίματος."},{"k":"β","t":"Α) Στάδιο προετοιμασίας. Β) Στάδιο λειτουργίας. Γ) Στάδιο κλεισίματος."},{"k":"γ","t":"Α) Στάδιο προετοιμασίας. Β) Στάδιο συναλλαγών. Γ) Στάδιο διακανονισμού."},{"k":"δ","t":"Α) Στάδιο εισαγωγής. Β) Στάδιο λειτουργίας. Γ) Στάδιο κλεισίματος."}]},{"n":46,"a":"γ","q":"Οι προσφορές στην ΗΔΑΤ (Ηλεκτρονική Δευτερογενής Αγορά Τίτλων):","o":[{"k":"α","t":"Κατατάσσονται, μαζί για το σκέλος πωλήσεως και το σκέλος αγοράς που εμπεριέχουν, από τη βέλτιστη στην επόμενη καλύτερη, βάσει της τιμής, της ποσότητας και του χρόνου εισαγωγής τους ως εξής: Καλύτερη προσφορά είναι αυτή με την καλύτερη τιμή. Σε περίπτωση ίδιας τιμής, καλύτερη είναι η προσφορά που αφορά στη μεγαλύτερη ποσότητα. Σε περίπτωση ίδιας τιμής και ίδιας ποσότητας, καλύτερη είναι η προσφορά που έχει υποβληθεί πρώτη."},{"k":"β","t":"Κατατάσσονται, ξεχωριστά για το σκέλος πωλήσεως και το σκέλος αγοράς που εμπεριέχουν, από τη βέλτιστη στην επόμενη καλύτερη, βάσει της τιμής, της ποσότητας, του τύπου και του χρόνου εισαγωγής τους ως εξής: Καλύτερη προσφορά είναι αυτή με την καλύτερη τιμή. Σε περίπτωση ίδιας τιμής, καλύτερη είναι η προσφορά που αφορά στη μεγαλύτερη ποσότητα. Σε περίπτωση ίδιας τιμής και ίδιας ποσότητας, καλύτερη είναι η προσφορά που έχει υποβληθεί πρώτη."},{"k":"γ","t":"Κατατάσσονται, ξεχωριστά για το σκέλος πωλήσεως και το σκέλος αγοράς που εμπεριέχουν, από τη βέλτιστη στην επόμενη καλύτερη, βάσει της τιμής, της ποσότητας και του χρόνου εισαγωγής τους ως εξής: Καλύτερη προσφορά είναι αυτή με την καλύτερη τιμή. Σε περίπτωση ίδιας τιμής, καλύτερη είναι η προσφορά που αφορά στη μεγαλύτερη ποσότητα. Σε περίπτωση ίδιας τιμής και ίδιας ποσότητας, καλύτερη είναι η προσφορά που έχει υποβληθεί πρώτη."},{"k":"δ","t":"Κατατάσσονται, ξεχωριστά για το σκέλος πωλήσεως και το σκέλος αγοράς που εμπεριέχουν, από τη βέλτιστη στην επόμενη καλύτερη, βάσει της τιμής, της ποσότητας και του χρόνου εισαγωγής τους ως εξής: Καλύτερη προσφορά είναι αυτή με την καλύτερη τιμή. Σε περίπτωση ίδιας τιμής, καλύτερη είναι η προσφορά που αφορά στη μικρότερη ποσότητα. Σε περίπτωση ίδιας τιμής και ίδιας ποσότητας, καλύτερη είναι η προσφορά που έχει υποβληθεί πρώτη."}]},{"n":47,"a":"β","q":"Σύμφωνα με τον Κανονισμό Εκκαθάρισης Συναλλαγών επί Παραγώγων, τα Εκκαθαριστικά Μέλη διακρίνονται σε:","o":[{"k":"α","t":"Άμεσα Εκκαθαριστικά Μέλη και Έμμεσα Εκκαθαριστικά Μέλη."},{"k":"β","t":"Άμεσα Εκκαθαριστικά Μέλη και Γενικά Εκκαθαριστικά Μέλη."},{"k":"γ","t":"Ειδικά Εκκαθαριστικά Μέλη και Γενικά Εκκαθαριστικά Μέλη."},{"k":"δ","t":"Μέλη Αγοράς και μη Μέλη Αγοράς."}]},{"n":48,"a":"δ","q":"Τα Άμεσα Εκκαθαριστικά Μέλη πρέπει να διαθέτουν:","o":[{"k":"α","t":"Μετοχικό Κεφάλαιο τουλάχιστον 500.000 Ευρώ."},{"k":"β","t":"Ίδια Κεφάλαια τουλάχιστον 500.000 Ευρώ."},{"k":"γ","t":"Μετοχικό Κεφάλαιο τουλάχιστον 700.000 Ευρώ."},{"k":"δ","t":"Ίδια Κεφάλαια τουλάχιστον 700.000 Ευρώ."}]},{"n":49,"a":"α","q":"Τα Γενικά Εκκαθαριστικά Μέλη πρέπει να διαθέτουν:","o":[{"k":"α","t":"Ίδια Κεφάλαια τουλάχιστον 3.000.000 Ευρώ."},{"k":"β","t":"Μετοχικό Κεφάλαιο τουλάχιστον 1.000.000 Ευρώ."},{"k":"γ","t":"Ίδια Κεφάλαια τουλάχιστον 1.000.000 Ευρώ."},{"k":"δ","t":"Μετοχικό Κεφάλαιο τουλάχιστον 3.000.000 Ευρώ."}]},{"n":50,"a":"γ","q":"Για την άσκηση καθηκόντων Πιστοποιημένου Εκκαθαριστή, το υποψήφιο πρόσωπο πρέπει: I. Να πληροί τις προϋποθέσεις επαγγελματικής επάρκειας που θέτει η Ένωση Θεσμικών Επενδυτών. II. Να πληροί τις προϋποθέσεις επαγγελματικής επάρκειας που θέτει η ΕΤ.ΕΚ.. III. Να διαθέτει πτυχίο τριτοβάθμιας εκπαιδεύσεως. IV. Να έχει τουλάχιστον 1 έτος επαγγελματική εμπειρία στο χρηματοπιστωτικό κλάδο. Ποια/ποιες από τις παραπάνω (I, II, III, IV) προτάσεις είναι ορθή/ές;","o":[{"k":"α","t":"I και III."},{"k":"β","t":"II και IV."},{"k":"γ","t":"II."},{"k":"δ","t":"I."}]},{"n":51,"a":"γ","q":"Ως προς τους Χρήστες του Συστήματος εκκαθάρισης συναλλαγών επί κινητών αξιών (Σύστημα), ισχύει ότι: I. Επιτρέπεται να είναι μόνο οι εξουσιοδοτημένοι από τα Εκκαθαριστικά Μέλη Πιστοποιημένοι Εκκαθαριστές. II. Δεν επιτρέπεται να είναι χρήστες του συστήματος οι εξουσιοδοτημένοι χρήστες των Μελών Αγοράς σε καμία περίπτωση. III. Τα Εκκαθαριστικά Μέλη γνωστοποιούν στην ΕΤ.ΕΚ. τα στοιχεία των χρηστών τους. IV. Ο Ορισμός Χρηστών του συστήματος πρέπει να εγκρίνεται από την ΕΚ.","o":[{"k":"α","t":"III και IV."},{"k":"β","t":"I και II."},{"k":"γ","t":"I και III."},{"k":"δ","t":"III και II."}]},{"n":52,"a":"δ","q":"Μέλη στις αγορές του ΧΑ μπορούν να είναι:","o":[{"k":"α","t":"ΑΕΠΕΥ, πιστωτικά ιδρύματα και ΑΕΔΑΚ."},{"k":"β","t":"ΑΕΠΕΥ και ΑΕΔΑΚ."},{"k":"γ","t":"ΑΕΠΕΥ, ΑΕΔΑΚ και ΑΕΕΧ."},{"k":"δ","t":"ΑΕΠΕΥ και πιστωτικά ιδρύματα."}]},{"n":53,"a":"α","q":"Οι επιχειρήσεις επενδύσεων που εκτελούν συναλλαγές σε χρηματοπιστωτικά μέσα οφείλουν να γνωστοποιούν πλήρεις και ακριβείς λεπτομέρειες των συναλλαγών αυτών στην αρμόδια αρχή το ταχύτερο δυνατόν, και το αργότερο:","o":[{"k":"α","t":"Εντός της επόμενης εργάσιμης ημέρας από εκείνη που πραγματοποιήθηκε η συναλλαγή (Τ+1)."},{"k":"β","t":"Εντός της ίδιας ημέρας που πραγματοποιήθηκε η συναλλαγή (Τ)."},{"k":"γ","t":"Εντός δύο εργάσιμων ημερών από την ημέρα που πραγματοποιήθηκε η συναλλαγή (Τ+2)."},{"k":"δ","t":"Εντός τριών εργάσιμων ημερών από την ημέρα που πραγματοποιήθηκε η συναλλαγή (Τ+3)."}]},{"n":54,"a":"γ","q":"Σύμφωνα με τον Κανονισμό (ΕΕ) 600/2014, η υποχρέωση γνωστοποίησης συναλλαγών ισχύει, μεταξύ άλλων, για: Ι. Συναλλαγές σε χρηματοπιστωτικά μέσα τα οποία είναι εισηγμένα προς διαπραγμάτευση ή τελούν υπό διαπραγμάτευση σε τόπο διαπραγμάτευσης ή για τα οποία έχει υποβληθεί αίτηση εισαγωγής προς διαπραγμάτευση, όταν οι συναλλαγές διενεργούνται σε τόπο διαπραγμάτευσης. ΙΙ. Συναλλαγές σε χρηματοπιστωτικά μέσα τα οποία είναι εισηγμένα προς διαπραγμάτευση ή τελούν υπό διαπραγμάτευση σε τόπο διαπραγμάτευσης ή για τα οποία έχει υποβληθεί αίτηση εισαγωγής προς διαπραγμάτευση, όταν οι συναλλαγές διενεργούνται εκτός τόπου διαπραγμάτευσης. ΙΙΙ. Συναλλαγές σε χρηματοπιστωτικά μέσα όπου η υποκείμενη αξία είναι χρηματοπιστωτικό μέσο που τελεί υπό διαπραγμάτευση σε τόπο διαπραγμάτευσης, όταν οι συναλλαγές διενεργούνται εκτός τόπου διαπραγμάτευσης. IV. Συναλλαγές σε μη εισηγμένα χρηματοπιστωτικά μέσα για τα οποία δεν έχει υποβληθεί αίτηση εισαγωγής προς διαπραγμάτευση, οι οποίες εκτελούνται εκτός τόπου διαπραγμάτευσης.","o":[{"k":"α","t":"ΙΙ και ΙΙΙ."},{"k":"β","t":"Ι και ΙΙ."},{"k":"γ","t":"Ι, ΙΙ, και ΙΙΙ."},{"k":"δ","t":"Ι, ΙΙΙ και ΙV."}]},{"n":55,"a":"β","q":"Σύμφωνα με τον Κανονισμό (ΕΕ) 600/2014, κατά τη γνωστοποίηση συναλλαγών, οι επιχειρήσεις επενδύσεων οφείλουν να γνωστοποιούν, μεταξύ άλλων, τις ακόλουθες λεπτομέρειες της συναλλαγής: Ι. Τον αριθμό των χρηματοπιστωτικών μέσων που αγοράστηκαν ή πωλήθηκαν. ΙΙ. Την ημερομηνία και την ώρα εκτέλεσης της συναλλαγής. ΙΙΙ. Σήμανση για το αν η συναλλαγή συμβάλλει στη διαδικασία εξεύρεσης τιμής. IV. Την τιμή της συναλλαγής.","o":[{"k":"α","t":"Ι, ΙΙ και ΙΙΙ."},{"k":"β","t":"Ι, II και IV."},{"k":"γ","t":"ΙΙ, ΙΙΙ και IV."},{"k":"δ","t":"I, III και IV."}]},{"n":56,"a":"β","q":"Ρυθμιζόμενη αγορά θεωρείται:","o":[{"k":"α","t":"Πολυμερές σύστημα, το οποίο τελεί υπό τη διεύθυνση ή τη διαχείριση ενός πελάτη της αγοράς."},{"k":"β","t":"Πολυμερές σύστημα, το οποίο έχει λάβει άδεια λειτουργίας από την εποπτική αρχή της χώρας που λειτουργεί."},{"k":"γ","t":"Πολυμερές σύστημα, το οποίο επιτρέπει τη διενέργεια συναλλαγών σύμφωνα με τους κανόνες που επιβάλλουν οι συμμετέχοντες σε αυτή."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":57,"a":"δ","q":"Σύμφωνα με τον Κανονισμό (ΕΕ) αριθ. 600/2014, κατά τη γνωστοποίηση συναλλαγών οι επιχειρήσεις επενδύσεων οφείλουν να γνωστοποιούν, μεταξύ άλλων, τις ακολουθες λεπτομέρειες της συναλλαγής: Ι. Σήμανση για τον προσδιορισμό της ανοικτής πώλησης. ΙΙ.Σήμανση για τον προσδιορισμό της ταυτότητας των προσώπων και των υπολογιστικών αλγορίθμων στο εσωτερικό της επιχείρησης επενδύσεων που είναι υπεύθυνα για την επενδυτική απόφαση και την εκτέλεση της συναλλαγής. ΙΙΙ. Σήμανση για τον προσδιορισμό της ταυτότητας των πελατών για λογαριασμό των οποίων η επιχείρηση επενδύσεων έχει εκτελέσει τη συναλλαγή. IV. Σήμανση για τον προσδιορισμό της απαλλαγής από την υποχρέωση προ-συναλλακτικής διαφάνειας στο πλαίσιο της οποίας διενεργήθηκε η συναλλαγή.","o":[{"k":"α","t":"I και ΙΙΙ."},{"k":"β","t":"ΙΙ και IV."},{"k":"γ","t":"I, II και ΙΙΙ."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":58,"a":"δ","q":"Ποιο από τα ακόλουθα χαρακτηριστικά δεν ισχύουν για τις ρυθμιζόμενες αγορές;","o":[{"k":"α","t":"Αποτελούν πολυμερή συστήματα συναλλαγών."},{"k":"β","t":"Η λειτουργία τους διέπεται από κανόνες που δεν επιτρέπουν διακριτική ευχέρεια εκτέλεσης συναλλαγών."},{"k":"γ","t":"Απαιτείται η λήψη άδειας λειτουργίας τους σύμφωνα με δεδομένες προϋποθέσεις."},{"k":"δ","t":"Επιτρέπουν την πρόσβαση τρίτων, εκτός των μελών τους."}]},{"n":59,"a":"β","q":"Σύμφωνα με το Ν.4514/2018 μέλη ή συμμετέχοντες Ρυθμιζόμενης Αγοράς μπορούν να γίνουν: I. ΑΕΠΕΥ. II. Πιστωτικά Ιδρύματα. III. Άλλα Πρόσωπα που διαθέτουν επαρκώς καλή φήμη, επαρκές επίπεδο συναλλακτικής ικανότητας γνώσεων και πείρας, επαρκείς οργανωτικές ρυθμίσεις και επαρκή μέσα για τον ρόλο που καλούνται να επιτελέσουν. IV. Διαχειριστές Αγοράς.","o":[{"k":"α","t":"I και II."},{"k":"β","t":"I, II και III."},{"k":"γ","t":"I, II και IV."},{"k":"δ","t":"I, II, III και IV."}]},{"n":60,"a":"δ","q":"Η σειρά κατάταξης κάθε εντολής στο Χρηματιστήριο Αθηνών ανά είδος, γίνεται με βάση τα ακόλουθα κριτήρια: I. Την καλύτερη τιμή. Οι εντολές αγοράς κατατάσσονται κατά προτεραιότητα με βάση τη μεγαλύτερη τιμή, ενώ οι εντολές πωλήσεως με βάση τη μικρότερη. II. Τον χρόνο. Εντολές με την αυτή τιμή κατατάσσονται με βάση τη χρονική προτεραιότητα εισαγωγής τους στο Σύστημα. III. Την ιδιότητα του εντολέως. Προηγούνται οι θεσμικοί επενδυτές έναντι των λοιπών φυσικών και νομικών προσώπων μη θεσμικών επενδυτών. IV. Το εύρος και την αποδοτικότητα της συνεργασίας με τον πελάτη - εντολέα. Προηγούνται και κατατάσσονται αναλόγως οι πελάτες - εντολείς με κριτήρια εύρους και αποδοτικότητας της συνεργασίας κατά την κρίση του μέλους. Ποιες από τις παραπάνω ( I, II, III, IV) προτάσεις είναι ορθές;","o":[{"k":"α","t":"I και IV."},{"k":"β","t":"II και III."},{"k":"γ","t":"I και III."},{"k":"δ","t":"I και II."}]},{"n":61,"a":"α","q":"Μεταξύ άλλων μία βασική υποχρέωση για ένα μέλος του ΧΑ είναι:","o":[{"k":"α","t":"Να διαθέτει επαρκές προσωπικό με κατάλληλες γνώσεις και εμπειρία και ικανότητες για την εξασφάλιση της συμμόρφωσής του προς τον Κανονισμό."},{"k":"β","t":"Να προβαίνει σε διαχείριση χαρτοφυλακίου πελατών."},{"k":"γ","t":"Να προβαίνει σε αναδοχές εταιρειών."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":62,"a":"α","q":"Κατά τη γνωστοποίηση της σήμανσης για τον προσδιορισμό της ταυτότητας των πελατών, όπως απαιτείται βάσει του Κανονισμού (ΕΕ) 600/2014, οι επιχειρήσεις επενδύσεων οφείλουν να χρησιμοποιούν έναν αναγνωριστικό κωδικό νομικής οντότητας που θεσπίζεται για τον προσδιορισμό της ταυτότητας των πελατών που είναι νομικά πρόσωπα. Ο κωδικός αυτός είναι ο:","o":[{"k":"α","t":"LEI (Legal Entity Identifier)."},{"k":"β","t":"BIC (Bank Identifier Code)."},{"k":"γ","t":"ISIN (International Securities Identification Number)."},{"k":"δ","t":"MIC (Market Identifier Code)."}]},{"n":63,"a":"γ","q":"Η διαφορά μεταξύ Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ) και Ρυθμιζόμενης Αγοράς είναι ότι:","o":[{"k":"α","t":"Η Ρυθμιζόμενη Αγορά δεν είναι πολυμερές σύστημα αλλά διμερές σύστημα."},{"k":"β","t":"Η Ρυθμιζόμενη Αγορά τελεί υπό τη διαχείριση διαχειριστή αγοράς, ενώ ο ΠΜΔ όχι."},{"k":"γ","t":"Η λειτουργία ΠΜΔ αποτελεί επενδυτική υπηρεσία, ενώ η Ρυθμιζόμενη Αγορά όχι."},{"k":"δ","t":"Η Ρυθμιζόμενη Αγορά είναι επενδυτική υπηρεσία, ενώ ο ΠΜΔ μηχανογραφικό σύστημα."}]},{"n":64,"a":"β","q":"Ποιο από τα παρακάτω στοιχεία διαφοροποιεί ουσιαστικά τη «Συστηματική Εσωτερικοποίηση» (ΣΕ) από τη Ρυθμιζόμενη Αγορά και τον Πολυμερή Μηχανισμό Διαπραγμάτευσης (ΠΜΔ);","o":[{"k":"α","t":"Το είδος των χρηματοπιστωτικών μέσων που αποτελούν αντικείμενο συναλλαγής στην ΣΕ."},{"k":"β","t":"Η διμερής βάση διενέργειας των συναλλαγών στην ΣΕ."},{"k":"γ","t":"Η προθεσμία εκκαθάρισης των συναλλαγών στην ΣΕ."},{"k":"δ","t":"Η ΣΕ υπόκειται σε ρυθμιστικό πλαίσιο."}]},{"n":65,"a":"β","q":"Το ΔΣ του ΧΑ ή άλλο εντεταλμένο προς τούτο όργανο του ΧΑ μπορεί να ακυρώνει καταχωρημένες στο σύστημα εντολές στις παρακάτω περιπτώσεις: I. Όταν αναστέλλεται η διαπραγμάτευση του χρηματοπιστωτικού μέσου, στο οποίο αφορά η εντολή. II. Όταν αναστέλλεται το δικαίωμα συμμετοχής στη διαπραγμάτευση του Μέλους που εισήγαγε την εντολή. III. Όταν αυτό επιβάλλεται για λόγους διαφύλαξης της ομαλής λειτουργίας της αγοράς και των συμφερόντων των επενδυτών. IV. Όταν ζητείται από το Υπουργείο Οικονομικών. V. Όταν ζητείται από τον Σύνδεσμο Μετοχών Χρηματιστηρίου Αθηνών (ΣΜΕΧΑ).","o":[{"k":"α","t":"I, II και V."},{"k":"β","t":"I, II και III."},{"k":"γ","t":"III, IV και V."},{"k":"δ","t":"II, III και IV."}]},{"n":66,"a":"δ","q":"Η χορήγηση άδειας λειτουργίας Ρυθμιζόμενης Αγοράς προϋποθέτει, μεταξύ άλλων:","o":[{"k":"α","t":"Άδεια από το ΧΑ."},{"k":"β","t":"Άδεια από το ΧΑ και την Επιτροπή Κεφαλαιαγοράς."},{"k":"γ","t":"Την ύπαρξη τουλάχιστον ενός ειδικού διαπραγματευτή."},{"k":"δ","t":"Την ύπαρξη μηχανισμών που να εξασφαλίζουν τον εντοπισμό και τη διαχείριση των συνεπειών από σύγκρουση συμφερόντων."}]},{"n":67,"a":"β","q":"Ποια πρόταση από τις παρακάτω είναι λανθασμένη;","o":[{"k":"α","t":"Ο Eιδικός Διαπραγματευτής υποχρεούται να διορίσει υπεύθυνο ειδικής διαπραγμάτευσης που θα πρέπει να είναι πιστοποιημένος διαπραγματευτής αξιών / παραγώγων ανάλογα με την περίπτωση & να γνωστοποιεί στο ΧΑ τα στοιχεία του, καθώς και κάθε μεταβολή αυτών."},{"k":"β","t":"Ο Eιδικός Διαπραγματευτής μπορεί να αναλάβει την ειδική διαπραγμάτευση σε ένα μόνο χρηματοπιστωτικό μέσο."},{"k":"γ","t":"Ο Eιδικός Διαπραγματευτής είναι υποχρεωτικά μέλος του ΧΑ."},{"k":"δ","t":"Καμία πρόταση δεν είναι λανθασμένη."}]},{"n":68,"a":"γ","q":"Σύμφωνα με τον Κανονισμό (ΕΕ) αριθ. 600/2014, κατά τη γνωστοποίηση συναλλαγών οι επιχειρήσεις επενδύσεων οφείλουν να γνωστοποιούν, μεταξύ άλλων, τις ακόλουθες λεπτομέρειες της συναλλαγής: Ι. Σήμανση για το αν η συναλλαγή συμβάλλει στη διαδικασία εξεύρεσης τιμής. ΙΙ. Σήμανση για τον προσδιορισμό της ταυτότητας των προσώπων και των υπολογιστικών αλγορίθμων στο εσωτερικό της επιχείρησης επενδύσεων που είναι υπεύθυνα για την επενδυτική απόφαση και την εκτέλεση της συναλλαγής. ΙΙΙ. Σήμανση για τον προσδιορισμό της ταυτότητας των πελατών για λογαριασμό των οποίων η επιχείρηση επενδύσεων έχει εκτελέσει τη συναλλαγή. IV. Σήμανση για τον προσδιορισμό της απαλλαγής από την υποχρέωση προ-συναλλακτικής διαφάνειας στο πλαίσιο της οποίας διενεργήθηκε η συναλλαγή.","o":[{"k":"α","t":"I, II και ΙΙΙ."},{"k":"β","t":"Ι, ΙΙΙ και IV."},{"k":"γ","t":"ΙΙ, ΙΙΙ και IV."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":69,"a":"β","q":"Σύμφωνα με τον Κανονισμό (ΕΕ) 600/2014, η γνωστοποίηση των συναλλαγών δύναται να πραγματοποιείται μέσω: Ι. Της επιχείρησης επενδύσεων. ΙΙ. Του Ε.ΜΗ.ΓΝΩ.ΣΥ. ΙΙΙ. Του Ε.ΜΗ.ΔΗ.ΣΥ. IV. Του τόπου διαπραγμάτευσης.","o":[{"k":"α","t":"I, II και ΙΙΙ."},{"k":"β","t":"Ι, ΙΙ και IV."},{"k":"γ","t":"ΙΙ, ΙΙΙ και IV."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":70,"a":"δ","q":"Οι χρηματοοικονομικοί αντισυμβαλλόμενοι οφείλουν να καταρτίζουν συναλλαγές με άλλους χρηματοοικονομικούς αντισυμβαλλομένους σε παράγωγα που ανήκουν σε κατηγορία παραγώγων, η οποία έχει χαρακτηριστεί ως υποκείμενη στην υποχρέωση διαπραγμάτευσης, μόνο σε: Ι.Ρυθμιζόμενες αγορές. ΙΙ. ΠΜΔ. ΙΙΙ. ΜΟΔ. ΙV. Ισοδύναμους τόπους διαπραγμάτευσης τρίτων χωρών.","o":[{"k":"α","t":"I και ΙΙΙ."},{"k":"β","t":"ΙΙ και IV."},{"k":"γ","t":"I, II και ΙΙΙ."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":71,"a":"δ","q":"Στη ρυθμιζόμενη αγορά στο ΧΑ μπορεί να έχει απευθείας πρόσβαση:","o":[{"k":"α","t":"Κάθε επενδυτής."},{"k":"β","t":"Κάθε χρηματοπιστωτικό μέσο εισηγμένο σε άλλη ρυθμιζόμενη αγορά της ΕΕ."},{"k":"γ","t":"Κάθε είδος αμοιβαίου κεφαλαίου."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":72,"a":"β","q":"Ως διαχειριστής αγοράς ανάπτυξης Μικρομεσαίων Επιχείρησης (ΜμΕ) μπορεί να λειτουργεί:","o":[{"k":"α","t":"Διαχειριστής αγοράς (χρηματιστήριο) και μόνο."},{"k":"β","t":"Διαχειριστής αγοράς, επιχείρηση επενδύσεων ή πιστωτικό ίδρυμα."},{"k":"γ","t":"Κάθε διαχειριστής αγοράς που λειτουργεί ως Μηχανισμός Οργανωμένης Διαπραγμάτευσης (ΜΟΔ)."},{"k":"δ","t":"Κάθε διαχειριστής αγοράς, επιχείρηση επενδύσεων ή πιστωτικό ίδρυμα που λειτουργεί ως Μηχανισμός Οργανωμένης Διαπραγμάτευσης (ΜΟΔ)."}]},{"n":73,"a":"β","q":"Ο Μηχανισμός Οργανωμένης Διαπραγμάτευσης (ΜΟΔ) έχει τουλάχιστον:","o":[{"k":"α","t":"3 ενεργά μέλη ή χρήστες, καθένας από τους οποίους υποχρεούται να αλληλεπιδρά με όλους τους υπόλοιπους όσον αφορά τη διαμόρφωση των τιμών."},{"k":"β","t":"3 ουσιωδώς ενεργά μέλη ή χρήστες, καθένας από τους οποίους έχει τη δυνατότητα να αλληλεπιδρά με όλους τους υπόλοιπους όσον αφορά τη διαμόρφωση των τιμών."},{"k":"γ","t":"3 ουσιωδώς ενεργά μέλη ή χρήστες, καθένας από τους οποίους υποχρεούται να αλληλεπιδρά με όλους τους υπόλοιπους όσον αφορά τη διαμόρφωση των τιμών."},{"k":"δ","t":"3 ενεργά μέλη ή χρήστες, καθένας από τους οποίους έχει τη δυνατότητα να αλληλεπιδρά με όλους τους υπόλοιπους όσον αφορά τη διαμόρφωση των τιμών."}]}],"ΧΡΗΜΑΤΟΠΙΣΤΩΤΙΚΑ ΜΕΣΑ":[{"n":1,"a":"γ","q":"Η διάρκεια της ειδικής διαπραγμάτευσης ανά χρηματοπιστωτικό μέσο είναι κατ’ ελάχιστο:","o":[{"k":"α","t":"Ετήσια και δεν δύναται να ανανεωθεί σε καμία περίπτωση."},{"k":"β","t":"Διετής και δεν δύναται να ανανεωθεί σε καμία περίπτωση."},{"k":"γ","t":"Ετήσια και μετά την πάροδο του έτους ανανεώνεται αυτόματα για αόριστο χρονικό διάστημα."},{"k":"δ","t":"Διετής και μπορεί να ανανεωθεί, μετά από έγκριση του ΧΑ, για χρονικό διάστημα όχι μικρότερο του ενός έτους κάθε φορά."}]},{"n":2,"a":"β","q":"Ποιοι τίτλοι διαπραγματεύονται σε Ρυθμιζόμενη Αγορά;","o":[{"k":"α","t":"Κινητές και Ακίνητες Αξίες."},{"k":"β","t":"Μέσα Χρηματαγοράς και Κινητές Αξίες."},{"k":"γ","t":"Μέσα Χρηματαγοράς και Ακίνητες Αξίες."},{"k":"δ","t":"Χρηματοπιστωτικά μέσα και Μετοχές."}]},{"n":3,"a":"δ","q":"Προκειμένου να συμμετέχουν οι επενδυτές σε μία δημόσια εγγραφή θα πρέπει:","o":[{"k":"α","t":"Να διατηρούν μερίδα επενδυτή και λογαριασμό αξιών στο ΣΑΤ (Σύστημα Άυλων Τίτλων)."},{"k":"β","t":"Να καταβάλλουν τη συμμετοχή τους με μετρητά ή με τραπεζική επιταγή ή με δέσμευση σε τραπεζικό λογαριασμό."},{"k":"γ","t":"Το ανώτατο όριο εγγραφής τους να είναι μικρότερο από τον αριθμό μετοχών που διατίθεται."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":4,"a":"δ","q":"Οι συναλλαγές σε χρηματοπιστωτικά μέσα διακρίνονται σε:","o":[{"k":"α","t":"Χρηματιστηριακές, εξω-χρηματιστηριακές και over-the-counter."},{"k":"β","t":"Σύνθετες, εξω-χρηματιστηριακές και εξωτερικοποιημένες."},{"k":"γ","t":"Πρωτογενείς, εξω-χρηματιστηριακές και εσωτερικοποιημένες."},{"k":"δ","t":"Χρηματιστηριακές, εξω-χρηματιστηριακές και εσωτερικοποιημένες."}]},{"n":5,"a":"α","q":"Ποιο από τα παρακάτω δεν δύναται να διαπραγματεύεται στο ΧΑ;","o":[{"k":"α","t":"Μερίδια εταιρειών ΕΠΕ."},{"k":"β","t":"Μετοχές αλλοδαπών ανωνύμων εταιρειών."},{"k":"γ","t":"Ομόλογα του ελληνικού δημοσίου."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές"}]},{"n":6,"a":"β","q":"Κινητή αξία που έχει εισαχθεί προς διαπραγμάτευση σε ρυθμιζόμενη αγορά, μπορεί στη συνέχεια να εισαχθεί προς διαπραγμάτευση σε άλλες ρυθμιζόμενες αγορές:","o":[{"k":"α","t":"Με τη συγκατάθεση του εκδότη, τηρουμένων των διατάξεων του ελληνικού και ενωσιακού δικαίου."},{"k":"β","t":"Χωρίς τη συγκατάθεση του εκδότη, τηρουμένων των διατάξεων του ελληνικού και ενωσιακού δικαίου."},{"k":"γ","t":"Μόνο εφόσον είναι ονομαστικές μετοχές, τηρουμένων των διατάξεων του ελληνικού και ενωσιακού δικαίου."},{"k":"δ","t":"Σε καμία περίπτωση."}]},{"n":7,"a":"α","q":"Μεταξύ των κανόνων που θεσπίζει η ρυθμιζόμενη αγορά για την εισαγωγή χρηματοπιστωτικών μέσων προς διαπραγμάτευση είναι: I. Προκειμένου περί κινητών αξιών, ότι είναι ελεύθερα διαπραγματεύσιμες. II. Ότι κάθε χρηματοπιστωτικό μέσο επιδέχεται δίκαιη, ομαλή και αποτελεσματική διαπραγμάτευση. III. Προκειμένου περί παραγώγων προϊόντων, ότι οι όροι του συμβολαίου του παράγωγου προϊόντος επιτρέπουν την ομαλή διαμόρφωση των τιμών τους και την ύπαρξη αποτελεσματικών όρων διακανονισμού. IV. Τα Ι και ΙΙ.","o":[{"k":"α","t":"I, II και III."},{"k":"β","t":"IV."},{"k":"γ","t":"I και II."},{"k":"δ","t":"II και III."}]},{"n":8,"a":"δ","q":"Για την εισαγωγή στο ΧΑ οι μετοχές μπορούν να εισαχθούν ως:","o":[{"k":"α","t":"Ονομαστικές."},{"k":"β","t":"Ονομαστικοποιημένες."},{"k":"γ","t":"Ανώνυμες."},{"k":"δ","t":"Ονομαστικές και ανώνυμες."}]},{"n":9,"a":"β","q":"Προκειμένου να εισαχθούν για πρώτη φορά μετοχές εταιρειών στο ΧΑ προς διαπραγμάτευση, ακολουθείται η σειρά: I. Η αίτηση εισαγωγής των μετοχών της εταιρίας στο χρηματιστήριο. II. Η έγκριση του Ενημερωτικού Δελτίου. III. Η επιλογή αναδόχου. IV. Η έναρξη διαπραγμάτευσης μετοχών.","o":[{"k":"α","t":"Το I, III, II, IV."},{"k":"β","t":"Το III, I, II, IV."},{"k":"γ","t":"Το I, II, III, IV."},{"k":"δ","t":"Το II, III, I, IV."}]},{"n":10,"a":"β","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Ο διαχειριστής αγοράς μπορεί αποκλειστικά και μόνον να διακόψει ή να αναστείλει τη διαπραγμάτευση χρηματοπιστωτικού μέσου το οποίο δεν πληροί πλέον τους κανόνες της ρυθμιζόμενης αγοράς."},{"k":"β","t":"Ο διαχειριστής αγοράς μπορεί να διακόψει ή να αναστείλει τη διαπραγμάτευση ή να διαγράψει χρηματοπιστωτικό μέσο το οποίο δεν πληροί πλέον τους κανόνες της ρυθμιζόμενης αγοράς, υποχρεούται, δε, να δημοσιοποιήσει αμέσως την απόφασή του και να την κοινοποιήσει στην ΕΚ."},{"k":"γ","t":"Ο διαχειριστής αγοράς μπορεί να διακόψει ή να αναστείλει τη διαπραγμάτευση ή να διαγράψει χρηματοπιστωτικό μέσο το οποίο δεν πληροί πλέον τους κανόνες της ρυθμιζόμενης αγοράς, κατόπιν της σύμφωνης γνώμης της ΕΚ."},{"k":"δ","t":"Η ΕΚ μπορεί αποκλειστικά και μόνον να αναστείλει τη διαπραγμάτευση ή να διαγράψει χρηματοπιστωτικό μέσο το οποίο δεν πληροί πλέον τους κανόνες της ρυθμιζόμενης αγοράς."}]},{"n":11,"a":"γ","q":"Προκειμένου το ΔΣ του ΧΑ να αποφασίσει την επαναδιαπραγμάτευση μετοχών που τελούν υπό αναστολή διαπραγμάτευσης για χρονικό διάστημα μεγαλύτερο των 6 μηνών θα πρέπει να πληρούνται, μεταξύ άλλων, οι παρακάτω προϋποθέσεις: Ι. Η εκδότρια εταιρία να παρουσιάζει πλέον θετική καθαρή θέση. ΙΙ. Η εκδότρια εταιρία να έχει ελεγχθεί φορολογικά. ΙΙΙ. Να έχουν αρθεί οι αιτίες της αναστολής. ΙV. Η εκδότρια εταιρεία να παρουσιάζει κερδοφορία.","o":[{"k":"α","t":"Ι, ΙΙ και ΙV."},{"k":"β","t":"Ι και ΙΙ."},{"k":"γ","t":"Ι, ΙΙ και ΙΙΙ."},{"k":"δ","t":"ΙV μόνο."}]},{"n":12,"a":"γ","q":"Αν η Επιτροπή Κεφαλαιαγοράς αποφασίσει να ζητήσει την αναστολή διαπραγμάτευσης ή τη διαγραφή χρηματοπιστωτικού μέσου που αποτελεί αντικείμενο διαπραγμάτευσης σε ρυθμιζόμενη αγορά ή ΠΜΔ, δημοσιοποιεί αμέσως την απόφασή της αυτή και ενημερώνει σχετικά:","o":[{"k":"α","t":"Το Υπουργείο Οικονομικών και τις Αρμόδιες Αρχές των άλλων κρατών-μελών."},{"k":"β","t":"Την Ένωση Εισηγμένων Εταιριών και την Ένωση Μετοχών ΧΑ."},{"k":"γ","t":"Την Ευρωπαϊκή Αρχή Κινητών Αξιών και Αγορών (ΕΑΚΑΑ) και τις Αρμόδιες Αρχές."},{"k":"δ","t":"Το επενδυτικό κοινό και την Ένωση Θεσμικών Επενδυτών."}]},{"n":13,"a":"γ","q":"Την αναστολή διαπραγμάτευσης κινητής αξίας μπορεί να αποφασίσει:","o":[{"k":"α","t":"O διαχειριστής αγοράς μόνο μετά από σχετική έγκριση της Επιτροπής Κεφαλαιαγοράς."},{"k":"β","t":"O διαχειριστής αγοράς χωρίς προηγούμενη έγκριση της Επιτροπής Κεφαλαιαγοράς, μόνο σε έκτακτες και επείγουσες περιστάσεις κατά τις οποίες η ανάγκη προστασίας των επενδυτών και της εύρυθμης λειτουργίας της αγοράς απαιτούν την άμεση λήψη της σχετικής απόφασης."},{"k":"γ","t":"O διαχειριστής αγοράς ενημερώνοντας ταυτόχρονα την Επιτροπή Κεφαλαιαγοράς."},{"k":"δ","t":"O διαχειριστής αγοράς και η Επιτροπή Κεφαλαιαγοράς μόνο από κοινού."}]},{"n":14,"a":"β","q":"Το ΧΑ μπορεί να αναστέλλει τη διαπραγμάτευση μετοχής:","o":[{"k":"α","t":"Ύστερα από αίτηση της εκδότριας εταιρείας, η οποία υποβάλλεται μετά από απόφαση της ΓΣ, που λαμβάνεται με πλειοψηφία 95% του συνόλου των δικαιωμάτων ψήφου."},{"k":"β","t":"Όταν δεν διασφαλίζεται ή απειλείται προσωρινά η ομαλή λειτουργία της αγοράς ή όταν επιβάλλεται για λόγους προστασίας των επενδυτών."},{"k":"γ","t":"Ύστερα από αίτηση της εκδότριας εταιρείας, η οποία υποβάλλεται μετά από απόφαση της ΓΣ, που λαμβάνεται με συνήθη απαρτία και πλειοψηφία."},{"k":"δ","t":"Ύστερα από αίτηση μετόχου της εκδότριας εταιρείας, ο οποίος κατέχει τουλάχιστον το 10% των δικαιωμάτων ψήφου."}]},{"n":15,"a":"α","q":"Ποιος αποφασίζει για την αναστολή διαπραγμάτευσης μιας μετοχής;","o":[{"k":"α","t":"Η ΕΧΑΕ."},{"k":"β","t":"Η ΕΚ."},{"k":"γ","t":"Η ΕΧΑΕ μετά από έγκριση της ΕΚ."},{"k":"δ","t":"Η εκδότρια εταιρεία."}]},{"n":16,"a":"α","q":"Ποιος φορέας ασκεί εποπτεία στην Κύρια Αγορά του ΧΑ;","o":[{"k":"α","t":"Η ΕΚ."},{"k":"β","t":"Η ΤτΕ."},{"k":"γ","t":"Το ΧΑ και λειτουργεί σύμφωνα με τους κανόνες που περιγράφονται στον Κανονισμό του Χρηματιστηρίου Αθηνών."},{"k":"δ","t":"Το Υπουργείο Οικονομικών."}]},{"n":17,"a":"δ","q":"Μια εισηγμένη ανώνυμη εταιρία μπορεί να ζητήσει από την Επιτροπή Κεφαλαιαγοράς τη διαγραφή των μετοχών της από την Αγορά Αξιών του ΧΑ:","o":[{"k":"α","t":"Με απόφαση του διοικητικού της συμβουλίου."},{"k":"β","t":"Με απόφαση της γενικής της συνέλευσης με πλειοψηφία 51% του συνόλου των δικαιωμάτων ψήφου της."},{"k":"γ","t":"Με απόφαση της γενικής της συνέλευσης με πλειοψηφία 66,67% του συνόλου των δικαιωμάτων ψήφου της."},{"k":"δ","t":"Με απόφαση της γενικής της συνέλευσης με πλειοψηφία 95% του συνόλου των δικαιωμάτων ψήφου της."}]},{"n":18,"a":"δ","q":"Διαγραφή κινητής αξίας από το χρηματιστήριο μπορεί να γίνει:","o":[{"k":"α","t":"Από την ΕΚ, είτε κατόπιν αιτήματος του ΧΑ είτε αυτεπαγγέλτως."},{"k":"β","t":"Από το Υπουργείο Οικονομικών κατόπιν αιτήματος της ΕΚ ή του ΧΑ."},{"k":"γ","t":"Από το ΧΑ με απόφαση του ΔΣ του ή άλλου εντεταλμένου οργάνου του."},{"k":"δ","t":"Από την ΕΚ, είτε κατόπιν αιτήματος του ΧΑ είτε αυτεπαγγέλτως και από το ΧΑ με απόφαση του ΔΣ του ή άλλου εντεταλμένου οργάνου του."}]},{"n":19,"a":"δ","q":"Σε ποια περίπτωση μπορούν να διαγραφούν εισηγμένες μετοχές από το ΧΑ;","o":[{"k":"α","t":"Σε κατ’ επανάληψη μη δημοσίευση των οικονομικών καταστάσεων."},{"k":"β","t":"Σε κήρυξη της εισηγμένης εταιρείας σε πτώχευση."},{"k":"γ","t":"Μετά από αίτηση της ίδιας της εταιρείας κατόπιν απόφασης της Γενικής Συνέλευσης που έχει ληφθεί με ποσοστό 95% του συνόλου των δικαιωμάτων ψήφου."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":20,"a":"δ","q":"Αν ο εκδότης έχει συνολικά αρνητικά Ίδια Κεφάλαια, οι μετοχές του εντάσσονται στην κατηγορία:","o":[{"k":"α","t":"Αναστολής."},{"k":"β","t":"Διαγραφής."},{"k":"γ","t":"Ειδικών χαρακτηριστικών."},{"k":"δ","t":"Επιτήρησης."}]},{"n":21,"a":"γ","q":"Μια κινητή αξία θεωρείται ελεύθερα διαπραγματεύσιμη εφόσον:","o":[{"k":"α","t":"Είναι ανώνυμη και δεν υπάρχει περιορισμός στην διαπραγμάτευσή της μεταξύ των συμβαλλομένων μιας συναλλαγής και στην επακόλουθη μεταβίβασή της."},{"k":"β","t":"Είναι ονομαστική και επιτρέπεται η μεταβίβασή της χωρίς περιορισμό μεταξύ των συμβαλλομένων μιας συναλλαγής και εφόσον όλοι οι τίτλοι της ίδιας κατηγορίας με την εν λόγω κινητή αξία είναι ανταλλάξιμοι."},{"k":"γ","t":"Είναι δυνατή η διαπραγμάτευσή της μεταξύ των συμβαλλομένων μιας συναλλαγής και η επακόλουθη μεταβίβασή της χωρίς περιορισμό και εφόσον όλοι οι τίτλοι της ίδιας κατηγορίας με την εν λόγω κινητή αξία είναι ανταλλάξιμοι."},{"k":"δ","t":"Επιτρέπεται, κατά περίπτωση, από την Επιτροπή Κεφαλαιαγοράς με σχετική έγκρισή της, μετά από αίτημα της εκδότριας."}]},{"n":22,"a":"δ","q":"Οι προνομιούχες μετοχές:","o":[{"k":"α","t":"Απαιτούν την πληρωμή της ονομαστικής αξίας τους στη λήξη όπως τα ομόλογα."},{"k":"β","t":"Έχουν υψηλότερο ρίσκο από τις κοινές μετοχές."},{"k":"γ","t":"Δίνουν υποχρεωτικό μέρισμα το οποίο εάν δεν πληρωθεί, η επιχείρηση οδηγείται σε χρεωκοπία."},{"k":"δ","t":"Δεν δίνουν συνήθως δικαίωμα ψήφου στις Γενικές Συνελεύσεις των κοινών μετοχών."}]},{"n":23,"a":"γ","q":"Ποια από τις παρακάτω προϋποθέσεις είναι γενικώς απαραίτητη για την εισαγωγή στην αγορά αξιών του Χρηματιστηρίου Αθηνών κινητών αξιών εκδοτών που εδρεύουν σε τρίτο κράτος εκτός Ευρωπαϊκής Ένωσης;","o":[{"k":"α","t":"Οι κινητές αξίες να αποδίδουν ελάχιστο μέρισμα."},{"k":"β","t":"Οι κινητές αξίες να είναι ονομαστικές."},{"k":"γ","t":"Οι κινητές αξίες να είναι αποϋλοποιημένες."},{"k":"δ","t":"Οι κινητές αξίες να είναι ανώνυμες."}]},{"n":24,"a":"γ","q":"Ποια από τις παρακάτω είναι προϋπόθεση σε κάθε περίπτωση για την εισαγωγή των μετοχών μιας εταιρίας στην Κύρια Αγορά;","o":[{"k":"α","t":"Ίδια Κεφάλαια σε ενοποιημένη ή ατομική βάση τουλάχιστον 3 εκατ. ευρώ, για τις δύο οικονομικές χρήσεις πριν την υποβολή της αίτησης εισαγωγής."},{"k":"β","t":"Δημοσιευμένες οικονομικές καταστάσεις για τουλάχιστον δύο οικονομικές χρήσεις."},{"k":"γ","t":"Σύνταξη των οικονομικών καταστάσεων σύμφωνα με τα Διεθνή Πρότυπα Χρηματοοικονομικής Πληροφόρησης και έλεγχος αυτών από Ορκωτό Ελεγκτή."},{"k":"δ","t":"Διασπορά τουλάχιστον 20% του συνόλου των μετοχών."}]},{"n":25,"a":"α","q":"Για τη δημόσια προσφορά και την εισαγωγή κινητών αξιών ο εκδότης υποβάλλει αίτηση:","o":[{"k":"α","t":"Στο ΧΑ καθώς επίσης και στην ΕΚ για την έγκριση ενημερωτικού δελτίου."},{"k":"β","t":"Μόνο στο ΧΑ."},{"k":"γ","t":"Μόνο στην ΕΚ."},{"k":"δ","t":"Μόνο στην ΤτΕ."}]},{"n":26,"a":"γ","q":"Για την εισαγωγή κινητών αξιών στο ΧΑ, μεταξύ των απαραιτήτων προϋποθέσεων, απαιτείται:","o":[{"k":"α","t":"Η σύμφωνη γνώμη του Επιμελητηρίου."},{"k":"β","t":"Η έγκριση του Υπουργείου Ανάπτυξης."},{"k":"γ","t":"Η κατάρτιση και έγκριση Ενημερωτικού Δελτίου."},{"k":"δ","t":"Η γνώμη της Επιτροπής Ανταγωνισμού."}]},{"n":27,"a":"β","q":"Για την εισαγωγή κινητών αξιών στην Αγορά Αξιών του ΧΑ απαιτείται μεταξύ άλλων:","o":[{"k":"α","t":"Αίτηση του εκδότη προς το ΧΑ για την εισαγωγή των κινητών αξιών και την έγκριση του Ενημερωτικού Δελτίου."},{"k":"β","t":"Αίτηση του εκδότη προς το ΧΑ για την εισαγωγή των κινητών αξιών και αίτηση στην ΕΚ για την έγκριση του Ενημερωτικού Δελτίου και την διενέργεια δημόσιας εγγραφής, εφόσον απαιτείται."},{"k":"γ","t":"Αίτηση του εκδότη προς το ΧΑ για την εισαγωγή των κινητών αξιών και την διενέργεια δημόσιας εγγραφής, εφόσον απαιτείται."},{"k":"δ","t":"Αίτηση του εκδότη προς την ΕΚ για την εισαγωγή των κινητών αξιών, την έγκριση του Ενημερωτικού Δελτίου και την διενέργεια δημόσιας εγγραφής, εφόσον απαιτείται."}]},{"n":28,"a":"α","q":"Σύμφωνα με το Ν. 3371/2005 ο οποίος προβλέπει τις προϋποθέσεις εισαγωγής κινητών αξιών σε ρυθμιζόμενη αγορά, οι εταιρίες πρέπει να έχουν ίδια κεφάλαια τουλάχιστον:","o":[{"k":"α","t":"Ένα εκατομμύριο ευρώ."},{"k":"β","t":"Δύο εκατομμύρια ευρώ."},{"k":"γ","t":"Τρία εκατομμύρια ευρώ."},{"k":"δ","t":"Μισό εκατομμύριο ευρώ."}]},{"n":29,"a":"α","q":"Η διασπορά θεωρείται επαρκής στις παρακάτω περιπτώσεις:","o":[{"k":"α","t":"Όταν οι μετοχές που πρόκειται να εισαχθούν είναι κατανεμημένες στο ευρύ κοινό σε ποσοστό τουλάχιστον 25% του συνόλου των μετοχών της ίδιας κατηγορίας."},{"k":"β","t":"Όταν οι μετοχές που πρόκειται να εισαχθούν κατανέμονται σε τουλάχιστον 2.000 πρόσωπα."},{"k":"γ","t":"Όταν οι μετοχές που πρόκειται να εισαχθούν κατανέμονται σε πρόσωπα από τα οποία κανένα δεν κατέχει ποσοστό μεγαλύτερο του 2% του συνόλου των μετοχών των οποίων ζητείται η εισαγωγή."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":30,"a":"γ","q":"Η εισαγωγή Τίτλων Παραστατικών Δικαιωμάτων προς κτήση Κινητών Αξιών προς διαπραγμάτευση σε αγορά επιτρέπεται εφόσον:","o":[{"k":"α","t":"Πληρούν αυστηρότερες προϋποθέσεις εισαγωγής με αυτές των μετοχών."},{"k":"β","t":"Πληρούν αυστηρότερες προϋποθέσεις εισαγωγής με αυτές των ομολογιών."},{"k":"γ","t":"Πληρούν τις ίδιες προϋποθέσεις εισαγωγής με αυτές των μετοχών."},{"k":"δ","t":"Δεν μπορούν να εισαχθούν σε ρυθμιζόμενη αγορά."}]},{"n":31,"a":"γ","q":"Για την πρωτογενή εισαγωγή μετοχών στην Αγορά Αξιών και την ένταξή της στη Γενική Κατηγορία Διαπραγμάτευσης πρέπει να πληρούνται οι ακόλουθες προϋποθέσεις:","o":[{"k":"α","t":"Ίδια κεφάλαια του εκδότη κατά την υποβολή της αίτησης τουλάχιστον 1.000.000 ευρώ."},{"k":"β","t":"Ίδια κεφάλαια του εκδότη κατά την υποβολή της αίτησης τουλάχιστον 2.000.000 ευρώ."},{"k":"γ","t":"Ίδια κεφάλαια του εκδότη κατά την υποβολή της αίτησης τουλάχιστον 3.000.000 ευρώ."},{"k":"δ","t":"Ίδια κεφάλαια του εκδότη κατά την υποβολή της αίτησης τουλάχιστον 4.000.000 ευρώ."}]},{"n":32,"a":"δ","q":"Όταν αξιολογείται αν μια κινητή αξία μπορεί να αποτελέσει αντικείμενο δίκαιης, ομαλής και αποτελεσματικής διαπραγμάτευσης, μια ρυθμιζόμενη αγορά μπορεί να λάβει υπόψη τις πληροφορίες που δημοσιοποιούνται με άλλο τρόπο, μεταξύ των οποίων","o":[{"k":"α","t":"Την άποψη της αγοράς για τον εκδότη."},{"k":"β","t":"Τη σχέση ιδίων κεφαλαίων προς τραπεζικό δανεισμό του εκδότη."},{"k":"γ","t":"Την κυκλοφοριακή ταχύτητα του ενεργητικού του εκδότη."},{"k":"δ","t":"Ιστορικές χρηματοοικονομικές πληροφορίες."}]},{"n":33,"a":"β","q":"Για την πρωτογενή εισαγωγή μετοχών στην Αγορά Αξιών και την ένταξή τους στη Γενική Κατηγορία Διαπραγμάτευσης πρέπει να πληρούνται οι ακόλουθες προϋποθέσεις:","o":[{"k":"α","t":"Τα ίδια κεφάλαια του εκδότη πρέπει να είναι κατά την υποβολή της αίτησης εισαγωγής τουλάχιστον 15.000.000 ευρώ."},{"k":"β","t":"Ο εκδότης πρέπει να εμφανίζει κατ’ ελάχιστον κέρδη προ φόρων τριετίας ύψους 2.000.000 ευρώ και κερδοφορία προ φόρων για τις δύο τελευταίες χρήσεις."},{"k":"γ","t":"Όλες οι απαντήσεις είναι σωστές."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":34,"a":"α","q":"Κατά την εισαγωγή προς διαπραγμάτευση μεριδίων ή μετοχών οργανισμού συλλογικών επενδύσεων, η ρυθμιζόμενη αγορά διασφαλίζει ότι:","o":[{"k":"α","t":"Επιτρέπεται η διάθεση στην αγορά αυτών των χρηματοπιστωτικών μέσων στο κράτος μέλος της ρυθμιζόμενης αγοράς."},{"k":"β","t":"Υπάρχει επαρκές αγοραστικό ενδιαφέρον από επενδυτές."},{"k":"γ","t":"Οι τιμές διαπραγμάτευσης θα κινηθούν εντός προκαθορισμένων ορίων."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":35,"a":"α","q":"Μεταξύ των προϋποθέσεων που επαληθεύει η ρυθμιζόμενη αγορά ότι πληρούνται, όταν αξιολογεί ένα παράγωγο, είναι ότι:","o":[{"k":"α","t":"Η τιμή ή άλλο μέτρο της αξίας του υποκείμενου μέσου είναι αξιόπιστη και διαθέσιμη στο κοινό."},{"k":"β","t":"Η τιμή του υποκείμενου μέσου καθορίζεται σε εύλογο ύψος από την Ε.Κ.."},{"k":"γ","t":"Το μέτρο αξίας του υποκείμενου μέσου δημοσιεύεται στον ιστότοπο της ρυθμιζόμενης αγοράς."},{"k":"δ","t":"Το επενδυτικό κοινό έχει κατανοήσει επαρκώς τη λειτουργία του παραγώγου."}]},{"n":36,"a":"β","q":"Η εισηγημένη «ΑΙΝΟΣ ομάδα περιουσίας που αποτελεί ένα αμοιβαίο κεφάλαιο:","o":[{"k":"α","t":"Ανήκει στην ΑΕΔΑΚ που τη διαχειρίζεται."},{"k":"β","t":"Ανήκει στον θεματοφύλακα της ΑΕΔΑΚ."},{"k":"γ","t":"Ανήκει στους μετόχους της ΑΕΔΑΚ."},{"k":"δ","t":"Ανήκει εξ αδιαιρέτου στους μεριδιούχους."}]},{"n":7,"a":"α","q":"Σε ποιους ανήκει η περιουσία ενός Αμοιβαίου Κεφαλαίου;","o":[{"k":"α","t":"Σε όλους τους μεριδιούχους του Αμοιβαίου Κεφαλαίου."},{"k":"β","t":"Στην ΑΕΔΑΚ η οποία διαχειρίζεται το Αμοιβαίο Κεφάλαιο."},{"k":"γ","t":"Στους μετόχους της ΑΕΔΑΚ που διαχειρίζεται το Αμοιβαίο Κεφάλαιο."},{"k":"δ","t":"Στο θεματοφύλακα ο οποίος ευθύνεται απέναντι των μεριδιούχων του Αμοιβαίου Κεφαλαίου."}]},{"n":8,"a":"δ","q":"Βάσει του Ν. 4099/2012 περί Αμοιβαίου Κεφαλαίου, ποια απάντηση είναι λανθασμένη;","o":[{"k":"α","t":"Για τη σύστασή του απαιτείται ενεργητικό € 300.000."},{"k":"β","t":"Δεν έχει νομική προσωπικότητα."},{"k":"γ","t":"Ιδρύεται & λειτουργεί με άδεια της ΕΚ."},{"k":"δ","t":"Η περιουσία του συνίσταται σε μετρητά μόνον."}]},{"n":9,"a":"γ","q":"Ποιες από τις παρακάτω προτάσεις είναι σωστές; I. Το αμοιβαίο κεφάλαιο είναι νομικό πρόσωπο. II. Οι μεριδιούχοι Αμοιβαίου Κεφαλαίου εκπροσωπούνται δικαστικώς, ως προς τις έννομες σχέσεις από τη διαχείρισή του, από την ΑΕΔΑΚ. III. Οι μεριδιούχοι δεν ευθύνονται για πράξεις ή παραλείψεις του θεματοφύλακα του Αμοιβαίου Κεφαλαίου κατά την άσκηση των καθηκόντων του. IV. Οι μεριδιούχοι Α/Κ δεν εκπροσωπούνται εξωδίκως, ως προς τα δικαιώματά τους επί του ενεργητικού του Αμοιβαίου Κεφαλαίου, από την ΑΕΔΑΚ.","o":[{"k":"α","t":"Ι και ΙΙΙ."},{"k":"β","t":"Ι και ΙΙ."},{"k":"γ","t":"ΙΙ και ΙΙΙ."},{"k":"δ","t":"III και IV."}]},{"n":10,"a":"β","q":"Οι επιτρεπόμενες επενδύσεις αμοιβαίου κεφαλαίου πραγματοποιούνται σε:","o":[{"k":"α","t":"Κινητές αξίες που διαπραγματεύονται σε ρυθμιζόμενη αγορά στην Ελλάδα μόνο."},{"k":"β","t":"Κινητές αξίες που διαπραγματεύονται σε αναγνωρισμένες διεθνώς ρυθμιζόμενες αγορές."},{"k":"γ","t":"Νεοεκδιδόμενες κινητές αξίες ύστερα από άδεια του Χρηματιστηρίου Αθηνών."},{"k":"δ","t":"Μακροπρόθεσμες ιδιωτικές καταθέσεις σε διεθνή πιστωτικά ιδρύματα."}]},{"n":11,"a":"γ","q":"Η φύλαξη των στοιχείων του ενεργητικού του αμοιβαίου κεφαλαίου:","o":[{"k":"α","t":"Πραγματοποιείται υποχρεωτικά από την ίδια την ΑΕΔΑΚ."},{"k":"β","t":"Ανατίθεται από την ΑΕΔΑΚ σε θεματοφύλακα που ενεργεί ως ταμίας με βάση τις οδηγίες της ΑΕΔΑΚ."},{"k":"γ","t":"Ανατίθεται κατόπιν άδειας της Επιτροπής Κεφαλαιαγοράς σε θεματοφύλακα που ενεργεί ως ταμίας με βάση τις οδηγίες της ΑΕΔΑΚ."},{"k":"δ","t":"Πραγματοποιείται από κοινού από την ίδια την ΑΕΔΑΚ και θεματοφύλακα που ενεργεί ως ταμίας με βάση τις οδηγίες της ΑΕΔΑΚ."}]},{"n":12,"a":"α","q":"Το αμοιβαίο κεφάλαιο (Α/Κ) λαμβάνει άδεια συστάσεως μόνο εφόσον η Επιτροπή Κεφαλαιαγοράς (ΕΚ) έχει εγκρίνει:","o":[{"k":"α","t":"Την εταιρία διαχειρίσεως, τον κανονισμό και το θεματοφύλακα του Α/Κ."},{"k":"β","t":"Τον κανονισμό και την προβλεπόμενη κατανομή του ενεργητικού του Α/Κ."},{"k":"γ","t":"Μόνο τον κανονισμό του Α/Κ."},{"k":"δ","t":"Δεν απαιτούνται οποιεσδήποτε διατυπώσεις πέραν της νομότυπης συστάσεως της διαχειρίστριας του Α/Κ ΑΕΔΑΚ."}]},{"n":13,"a":"β","q":"Τα αμοιβαία κεφάλαια (Α/Κ), ανάλογα με το είδος των χρηματοπιστωτικών μέσων στα οποία επενδύουν το ενεργητικό τους, άμεσα ή έμμεσα (με τη χρήση παραγώγων χρηματοπιστωτικών μέσων),κατατάσσονται στις εξής κατηγορίες: I. Α/Κ Χρηματαγοράς. II. Ομολογιακά Α/Κ. III. Μικτά Α/Κ. IV. Μετοχικά Α/Κ. V. Σύνθετα Α/Κ. VI. Α/Κ μεσοπρόθεσμων διαθεσίμων. VII. Α/Κ blue chips.","o":[{"k":"α","t":"II, III,IV, VI και VII."},{"k":"β","t":"I, II, III, IV, V."},{"k":"γ","t":"II εως και VII."},{"k":"δ","t":"I εως V και VII."}]},{"n":14,"a":"β","q":"Τα Αμοιβαία Κεφάλαια Χρηματαγοράς επενδύουν σε προϊόντα χρηματαγοράς:","o":[{"k":"α","t":"Ανάλογα με την εκτίμηση του διαχειριστή."},{"k":"β","t":"Σε προϊόντα χρηματαγοράς σε ποσοστό > 65%, δευτερευόντως σε τίτλους σταθερού εισοδήματος & καθόλου σε μετοχές."},{"k":"γ","t":"Σε τίτλους σταθερής απόδοσης σε ποσοστό 60% & σε μετοχές σε ποσοστό 40%."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":15,"a":"γ","q":"Τα Αμοιβαία Κεφάλαια (Α/Κ) Χρηματαγοράς, ανάλογα με τα ειδικότερα χαρακτηριστικά τους, διακρίνονται σε:","o":[{"k":"α","t":"Α/Κ Διαχειρίσεως Βραχυπρόθεσμων Διαθεσίμων και Α/Κ Μεσομακροπρόθεσμων Διαθεσίμων."},{"k":"β","t":"Α/Κ Διαθεσίμων και Α/Κ Αποθεματικών."},{"k":"γ","t":"Α/Κ Διαχειρίσεως Βραχυπρόθεσμων Διαθεσίμων και Α/Κ Διαχειρίσεως Διαθεσίμων."},{"k":"δ","t":"Α/Κ Αξιών και Α/Κ Διαθεσίμων."}]},{"n":16,"a":"γ","q":"Ο όρος «κυρίως επένδυση» νοείται ως ποσοστό επενδύσεως τουλάχιστον……. επί του καθαρού ενεργητικού του αμοιβαίου κεφαλαίου.","o":[{"k":"α","t":"25%."},{"k":"β","t":"45%."},{"k":"γ","t":"65%."},{"k":"δ","t":"85%."}]},{"n":17,"a":"β","q":"Τα Αμοιβαία Κεφάλαια (Α/Κ) όλων των κατηγοριών μπορούν να διακρίνονται περαιτέρω σε:","o":[{"k":"α","t":"Α/Κ Δείκτη και Α/Κ Συνθέσεως."},{"k":"β","t":"Α/Κ Δείκτη και Α/Κ Κεφαλαίων."},{"k":"γ","t":"Α/Κ Συνθέσεως και Α/Κ Κατανομής."},{"k":"δ","t":"Α/Κ Διασποράς και Α/Κ Συνθέσεως."}]},{"n":18,"a":"α","q":"Η εξαγορά των μεριδίων ενός αμοιβαίου κεφαλαίου:","o":[{"k":"α","t":"Είναι υποχρεωτική όταν τη ζητήσει ο μεριδιούχος."},{"k":"β","t":"Γίνεται δεκτή, κατά τη διακριτική ευχέρεια της ΑΕΔΑΚ."},{"k":"γ","t":"Είναι απολύτως απαγορευμένη."},{"k":"δ","t":"Προϋποθέτει γραπτή αίτηση στην Επιτροπή Κεφαλαιαγοράς."}]},{"n":19,"a":"γ","q":"Σε ότι αφορά στην εξαγορά μεριδίων αμοιβαίου κεφαλαίου, ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Απαιτείται γραπτή αίτηση και η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την ημέρα υποβολής της αίτησης, δίχως δυνατότητα εξαίρεσης."},{"k":"β","t":"Απαιτείται γραπτή αίτηση και η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την προηγούμενη της υποβολής της αίτησης ημέρας, δίχως δυνατότητα εξαίρεσης."},{"k":"γ","t":"Απαιτείται γραπτή αίτηση και η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την ημέρα υποβολής της αίτησης, με δυνατότητα αναστολής της εξαγοράς για τρεις μήνες κατόπιν άδειας της ΕΚ."},{"k":"δ","t":"Απαιτείται γραπτή αίτηση και η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την ημέρα υποβολής της αίτησης, με δυνατότητα αναστολής της εξαγοράς για τρεις μήνες κατά τη διακριτική ευχέρεια της ΑΕΔΑΚ."}]},{"n":20,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Σε ότι αφορά στην εξαγορά μεριδίων αμοιβαίου κεφαλαίου: (α) απαιτείται γραπτή αίτηση, (β) η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την ημέρα υποβολής της αίτησης, δίχως δυνατότητα εξαίρεσης."},{"k":"β","t":"Σε ότι αφορά στην εξαγορά μεριδίων αμοιβαίου κεφαλαίου: (α) απαιτείται γραπτή αίτηση, (β) η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την προηγούμενη της υποβολής της αίτησης ημέρας, δίχως δυνατότητα εξαίρεσης."},{"k":"γ","t":"Σε ότι αφορά στην εξαγορά μεριδίων αμοιβαίου κεφαλαίου: (α) απαιτείται γραπτή αίτηση, (β) η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την ημέρα υποβολής της αίτησης, με δυνατότητα αναστολής της εξαγοράς για τρεις μήνες κατόπιν άδειας της Επιτροπής Κεφαλαιαγοράς εφόσον τούτο επιβάλλεται από τις περιστάσεις και το συμφέρον των μεριδιούχων."},{"k":"δ","t":"Σε ότι αφορά στην εξαγορά μεριδίων αμοιβαίου κεφαλαίου: (α) απαιτείται γραπτή αίτηση, (β) η εξαγορά γίνεται στην τιμή εξαγοράς των μεριδίων την ημέρα υποβολής της αίτησης, με δυνατότητα αναστολής της εξαγοράς για τρεις μήνες κατά τη διακριτική ευχέρεια της ΑΕΔΑΚ εφόσον τούτο επιβάλλεται από τις περιστάσεις και το συμφέρον των μεριδιούχων."}]},{"n":21,"a":"α","q":"Τα μερίδια του Αμοιβαίου Κεφαλαίου εξαγοράζονται στην τιμή εξαγοράς μεριδίων της:","o":[{"k":"α","t":"Ημέρας υποβολής της αίτησης εξαγοράς."},{"k":"β","t":"Προηγούμενης εργάσιμης της ημέρας υποβολής της αίτησης εξαγοράς."},{"k":"γ","t":"Επόμενης εργάσιμης της ημέρας υποβολής της αίτησης εξαγοράς."},{"k":"δ","t":"Καλύτερης δυνατής τιμής των 3 εργάσιμων ημερών μετά την ημέρα υποβολής της αίτησης εξαγοράς."}]},{"n":22,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Τα μερίδια των αμοιβαίων κεφαλαίων δεν είναι εισηγμένα σε ρυθμιζόμενη αγορά."},{"k":"β","t":"Τα μερίδια των αμοιβαίων κεφαλαίων μπορεί να είναι εισηγμένα σε ρυθμιζόμενη αγορά και να επενδύουν ελεύθερα σε οποιαδήποτε μετοχή."},{"k":"γ","t":"Τα μερίδια των αμοιβαίων κεφαλαίων είναι σε κάθε περίπτωση εισηγμένα σε ρυθμιζόμενη αγορά."},{"k":"δ","t":"Τα μερίδια των αμοιβαίων κεφαλαίων που αναπαράγουν τη σύνθεση δεδομένου χρηματιστηριακού δείκτη μετοχών ή ομολόγων, εφόσον έχει δοθεί σχετική άδεια, μπορεί να είναι εισηγμένα σε ρυθμιζόμενη αγορά."}]},{"n":23,"a":"γ","q":"Ο συνθετικός δείκτης κινδύνου – απόδοσης ενός Αμοιβαίου Κεφαλαίου (Α/Κ):","o":[{"k":"α","t":"Δεν μεταβάλλεται κατά τη διάρκεια ζωής του Α/Κ."},{"k":"β","t":"Που είναι ίσος με τη μονάδα σημαίνει ότι το Α/Κ δεν έχει καθόλου κίνδυνο."},{"k":"γ","t":"Βασίζεται στην τυπική απόκλιση των αποδόσεων του Α/Κ."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":24,"a":"δ","q":"Η μεταβίβαση μεριδίων Αμοιβαίου Κεφαλαίου:","o":[{"k":"α","t":"Απαγορεύεται γενικά."},{"k":"β","t":"Επιτρέπεται μόνο μεταξύ συζύγων."},{"k":"γ","t":"Επιτρέπεται μόνο μεταξύ συζύγων & συγγενών α΄ βαθμού."},{"k":"δ","t":"Επιτρέπεται μόνο μεταξύ συζύγων & συγγενών α΄ βαθμού & β΄ βαθμού."}]},{"n":25,"a":"δ","q":"Για την απόκτηση μεριδίων αμοιβαίων κεφαλαίων απαιτείται:","o":[{"k":"α","t":"Γραπτή αίτηση προς την εταιρεία διαχείρισης αμοιβαίων κεφαλαίων."},{"k":"β","t":"Χορήγηση του εντύπου «Βασικές πληροφορίες για τους επενδυτές»."},{"k":"γ","t":"Η ολοσχερής καταβολή στο θεματοφύλακα της αξίας των μεριδίων σε μετρητά ή εισηγμένες κινητές αξίες (Εφόσον γίνονται δεκτές)."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":26,"a":"δ","q":"Οι βασικές πληροφορίες για τους επενδυτές περιλαμβάνουν:","o":[{"k":"α","t":"Την επωνυμία του ΟΣΕΚΑ, τα έξοδα, προμήθειες και επιβαρύνσεις."},{"k":"β","t":"Σύντομη περιγραφή του επενδυτικού σκοπού και της επενδυτικής πολιτικής του."},{"k":"γ","t":"Παρουσίαση προηγούμενων αποδόσεων ή όπου απαιτείται σεναρίων απόδοσης καθώς και τη σχέση κινδύνου και απόδοσης της επένδυσης."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":27,"a":"β","q":"Για την ΑΕΔΑΚ «MEGAMUTUALPROFIT» με έδρα την Αθήνα που έχει λάβει άδεια λειτουργίας στην Ελλάδα ισχύει ότι:","o":[{"k":"α","t":"Οι μετοχές της είναι ανώνυμες και διαπραγματεύσιμες στο Χρηματιστήριο Αθηνών."},{"k":"β","t":"Οι μετοχές της είναι ονομαστικές και μπορούν να αποτελέσουν αντικείμενο διαπραγμάτευσης στο Χρηματιστήριο Αθηνών."},{"k":"γ","t":"Το μετοχικό της κεφάλαιο μπορεί να σχηματιστεί με εισφορά ακινήτου που πρέπει να αποτιμηθεί σε αξία τουλάχιστον 1.000.000 ευρώ."},{"k":"δ","t":"Η άδεια παρέχεται από κοινού από την ΕΚ και την ΤτΕ."}]},{"n":28,"a":"δ","q":"Οι ανοικτού τύπου οργανισμοί συλλογικών επενδύσεων μπορούν να πάρουν τη μορφή:","o":[{"k":"α","t":"Αμοιβαίου κεφαλαίου."},{"k":"β","t":"Ανώνυμης εταιρίας επενδύσεων μεταβλητού κεφαλαίου ή ανώνυμης εταιρίας επενδύσεων χαρτοφυλακίου."},{"k":"γ","t":"Αμοιβαίου κεφαλαίου, ανώνυμης εταιρίας επενδύσεων μεταβλητού κεφαλαίου (ΑΕΕΜΚ) ή ανώνυμης εταιρίας επενδύσεων χαρτοφυλακίου (ΑΕΕΧ)."},{"k":"δ","t":"Αμοιβαίου κεφαλαίου ή ανώνυμης εταιρίας επενδύσεων μεταβλητού κεφαλαίου (ΑΕΕΜΚ)."}]},{"n":29,"a":"δ","q":"Ο Κανονισμός του αμοιβαίου κεφαλαίου περιλαμβάνει μεταξύ άλλων:","o":[{"k":"α","t":"Το είδος των επενδύσεων στις οποίες δύναται να επενδύεται το ενεργητικό του αμοιβαίου κεφαλαίου."},{"k":"β","t":"Τον επενδυτικό σκοπό του αμοιβαίου κεφαλαίου καθώς και την επενδυτική του πολιτική."},{"k":"γ","t":"Την τιμή των μεριδίων κατά το χρόνο σύστασης."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":30,"a":"δ","q":"Ποια από τα ακόλουθα περιέχει ο κανονισμός αμοιβαίου κεφαλαίου;","o":[{"k":"α","t":"Την ονομασία και διάρκεια του αμοιβαίου κεφαλαίου και την επωνυμία της εκδότριας ΑΕΔΑΚ."},{"k":"β","t":"Τον επενδυτικό σκοπό, την επενδυτική πολιτική της ΑΕΔΑΚ και τους επενδυτικούς περιορισμούς."},{"k":"γ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."},{"k":"δ","t":"Την ονομασία και διάρκεια του αμοιβαίου κεφαλαίου και την επωνυμία της εκδότριας ΑΕΔΑΚ και τον επενδυτικό σκοπό, την επενδυτική πολιτική της ΑΕΔΑΚ και τους επενδυτικούς περιορισμούς."}]},{"n":31,"a":"δ","q":"Ο θεματοφύλακας ενός Αμοιβαίου Κεφαλαίου οφείλει: I. Να συνυπογράφει τον κανονισμό. II.Να διασφαλίζει ότι η διάθεση, η έκδοση, η εξαγορά, η καταβολή και η αποτίμηση της καθαρής αξίας διενεργείται σύμφωνα με τη νομοθεσία και τον Κανονισμό. III.Να διασφαλίζει ότι το τίμημα από τις συναλλαγές καταβάλλεται εντός των προθεσμιών. IV.Να είναι πιστωτικό ίδρυμα.","o":[{"k":"α","t":"I και II."},{"k":"β","t":"I, II και III."},{"k":"γ","t":"I και ΙΙΙ."},{"k":"δ","t":"I, II, III και IV."}]},{"n":32,"a":"δ","q":"Ο θεματοφύλακας ενός Αμοιβαίου Κεφαλαίου δεν οφείλει:","o":[{"k":"α","t":"Να συνυπογράφει τον κανονισμό."},{"k":"β","t":"Να διασφαλίζει ότι η διάθεση, η έκδοση, η εξαγορά, η καταβολή και η αποτίμηση της καθαρής αξίας διενεργείται σύμφωνα με τη νομοθεσία και τον Κανονισμό."},{"k":"γ","t":"Να διασφαλίζει ότι το τίμημα από τις συναλλαγές καταβάλλεται εντός των προθεσμιών."},{"k":"δ","t":"Να είναι ΑΕΔΑΚ."}]},{"n":33,"a":"δ","q":"Η ΑΕΔΑΚ επιτρέπεται να παρέχει και:","o":[{"k":"α","t":"Όλες τις επενδυτικές υπηρεσίες του Ν. 4514/2018."},{"k":"β","t":"Μόνον τις παρεπόμενες υπηρεσίες του Ν. 4514/2018."},{"k":"γ","t":"Τη διαχείριση χαρτοφυλακίων επενδύσεων."},{"k":"δ","t":"Τη διαχείριση χαρτοφυλακίων επενδύσεων κατόπιν ειδικής αδείας της Επιτροπής Κεφαλαιαγοράς."}]},{"n":34,"a":"δ","q":"Οι ΑΕΔΑΚ μπορούν:","o":[{"k":"α","t":"Να λειτουργούν ως Πολυμερείς Μηχανισμοί Διαπραγμάτευσης (ΠΜΔ)."},{"k":"β","t":"Να προβαίνουν σε αγοραπωλησίες σε συνάλλαγμα."},{"k":"γ","t":"Να προβαίνουν σε υπηρεσίες λήψης και διαβίβασης μεριδίων ΟΣΕΚΑ."},{"k":"δ","t":"Να παρέχουν υπηρεσίες φύλαξης μεριδίων κατόπιν έγκρισης της ΕΚ."}]},{"n":35,"a":"β","q":"Οι ΑΕΔΑΚ δύνανται κατόπιν άδειας της Επιτροπής Κεφαλαιαγοράς:","o":[{"k":"α","t":"Να παρέχουν και την υπηρεσία της αναδοχής."},{"k":"β","t":"Να παρέχουν τις υπηρεσίες διαχείρισης αμοιβαίων κεφαλαίων και χαρτοφυλακίων επενδύσεων πελατών σε ατομική βάση, παροχής επενδυτικών συμβουλών, φύλαξης και διοικητικής διαχείρισης μεριδίων ΟΣΕΚΑ."},{"k":"γ","t":"Να παρέχουν την υπηρεσία λειτουργίας Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ)."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":36,"a":"α","q":"Ποιος ο κύριος σκοπός της ΑΕΔΑΚ;","o":[{"k":"α","t":"Η διαχείριση αμοιβαίου κεφαλαίου."},{"k":"β","t":"Η διαχείριση χαρτοφυλακίων επενδύσεων, συμπεριλαμβανομένων εκείνων που ανήκουν σε συνταξιοδοτικά ταμεία."},{"k":"γ","t":"Η φύλαξη & διοικητική διαχείριση μεριδίων ΟΣΕ."},{"k":"δ","t":"Οι επενδυτικές συμβουλές για ένα ή περισσότερα χρηματοπιστωτικά μέσα."}]},{"n":37,"a":"β","q":"Κάθε ΑΕΔΑΚ οφείλει να:","o":[{"k":"α","t":"Ετοιμάζει το έντυπο «Βασικές πληροφορίες για τους επενδυτές» και ενημερωτικό δελτίο για το σύνολο των αμοιβαίων κεφαλαίων που διαχειρίζεται."},{"k":"β","t":"Ετοιμάζει το έντυπο «Βασικές πληροφορίες για τους επενδυτές» και ενημερωτικό δελτίο για κάθε αμοιβαίο κεφάλαιο που διαχειρίζεται."},{"k":"γ","t":"Ετοιμάζει ένα πλήρες ενημερωτικό δελτίο για κάθε αμοιβαίο κεφάλαιο που διαχειρίζεται."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":38,"a":"β","q":"Υπεύθυνο/η για την οργάνωση του δικτύου διάθεσης μεριδίων αμοιβαίων κεφαλαίων είναι:","o":[{"k":"α","t":"Το Χρηματιστήριο Αθηνών (ΧΑ)."},{"k":"β","t":"Η ΑΕΔΑΚ."},{"k":"γ","t":"Η ΑΕΕΧ."},{"k":"δ","t":"Η Επιτροπή Κεφαλαιαγοράς (ΕΚ)."}]},{"n":39,"a":"γ","q":"Ως «Ανώνυμη Εταιρία Διαχειρίσεως Οργανισμών Εναλλακτικών Επενδύσεων (ΑΕΔΟΕΕ)» νοείται:","o":[{"k":"α","t":"Ο ΔΟΕΕ που είναι εταιρία οποιασδήποτε μορφής, έχει έδρα την Ελλάδα και έχει λάβει άδεια λειτουργίας από την Επιτροπή Κεφαλαιαγοράς."},{"k":"β","t":"Ο ΔΟΕΕ που είναι ανώνυμη εταιρία, έχει έδρα στην ΕΕ και έχει λάβει άδεια λειτουργίας από την Επιτροπή Κεφαλαιαγοράς."},{"k":"γ","t":"Ο ΔΟΕΕ που είναι ανώνυμη εταιρία, έχει έδρα την Ελλάδα και έχει λάβει άδεια λειτουργίας από την Επιτροπή Κεφαλαιαγοράς."},{"k":"δ","t":"Ο ΔΟΕΕ που είναι ανώνυμη εταιρία, έχει έδρα στην Ελλάδα και έχει λάβει άδεια λειτουργίας από την Ευρωπαϊκή Αρχή Κινητών Αξιών και Αγορών (ΕΑΚΑΑ)"}]},{"n":40,"a":"γ","q":"Ο Ν. 4209/2013 για τους διαχειριστές οργανισμών εναλλακτικών επενδύσεων έχει εφαρμογή σε:","o":[{"k":"α","t":"Ταμεία επαγγελματικής ασφάλισης."},{"k":"β","t":"Οντότητες ειδικού σκοπού τιτλοποίησης."},{"k":"γ","t":"Διαχειριστές οργανισμών εναλλακτικών επενδύσεων με έδρα εκτός της ΕΕ, οι οποίοι προωθούν εμπορικά στην Ελλάδα έναν ή περισσότερους ΟΕΕ."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":41,"a":"α","q":"Ως «ΟΕΕ» νοείται:","o":[{"k":"α","t":"Οποιοσδήποτε οργανισμός συλλογικών επενδύσεων, συμπεριλαμβανομένων τυχόν επενδυτικών του τμημάτων, ο οποίος: α) συγκεντρώνει κεφάλαια από επενδυτές με σκοπό την επένδυσή τους σύμφωνα με καθορισμένη επενδυτική πολιτική προς όφελος των εν λόγω επενδυτών και β) δεν χρειάζεται άδεια σύμφωνα με το άρθρο 4 του Ν. 4099/2010 ή το άρθρο 5 της Οδηγίας 2009/65/ΕΚ."},{"k":"β","t":"Οποιοσδήποτε οργανισμός συλλογικών επενδύσεων, ο οποίος: α) συγκεντρώνει κεφάλαια από επενδυτές μόνο φυσικά πρόσωπα με σκοπό την επένδυσή τους σύμφωνα με καθορισμένη επενδυτική πολιτική προς όφελος των εν λόγω επενδυτών και β) δεν χρειάζεται άδεια σύμφωνα με το άρθρο 4 του Ν. 4099/2010 ή το άρθρο 5 της Οδηγίας 2009/65/ΕΚ."},{"k":"γ","t":"Οποιοσδήποτε οργανισμός συλλογικών επενδύσεων, συμπεριλαμβανομένων τυχόν επενδυτικών του τμημάτων, ο οποίος: α) συγκεντρώνει κεφάλαια από επενδυτές-φυσικά πρόσωπα με σκοπό την επένδυσή τους σύμφωνα με καθορισμένη επενδυτική πολιτική προς όφελος των εν λόγω επενδυτών και β) δεν χρειάζεται άδεια σύμφωνα με το άρθρο 4 του Ν. 4099/2010 ή το άρθρο 5 της Οδηγίας 2009/65/ΕΚ."},{"k":"δ","t":"Οποιοσδήποτε οργανισμός συλλογικών επενδύσεων, συμπεριλαμβανομένων τυχόν επενδυτικών του τμημάτων, ο οποίος: α) συγκεντρώνει κεφάλαια από επενδυτές-νομικά πρόσωπα με σκοπό την επένδυσή τους σύμφωνα με καθορισμένη επενδυτική πολιτική προς όφελος των εν λόγω επενδυτών και β) δεν χρειάζεται άδεια σύμφωνα με το άρθρο 4 του Ν. 4099/10 ή το άρθρο 5 της Οδηγίας 2009/65/ΕΚ."}]},{"n":42,"a":"β","q":"Ως Διαχειριστής Οργανισμού Εναλλακτικών Επενδύσεων (ΔΟΕΕ) νοείται:","o":[{"k":"α","t":"Κάθε νομικό πρόσωπο ή φυσικό πρόσωπο του οποίου η συνήθης δραστηριότητα είναι η διαχείριση ενός ή περισσοτέρων ΟΕΕ."},{"k":"β","t":"Κάθε νομικό πρόσωπο του οποίου η συνήθης δραστηριότητα είναι η διαχείριση ενός ή περισσοτέρων ΟΕΕ."},{"k":"γ","t":"Κάθε φυσικό πρόσωπο του οποίου η συνήθης δραστηριότητα είναι η διαχείριση ενός ή περισσοτέρων ΟΕΕ."},{"k":"δ","t":"Κάθε καταπίστευμα του οποίου η συνήθης δραστηριότητα είναι η διαχείριση ενός ή περισσοτέρων ΟΕΕ."}]},{"n":43,"a":"γ","q":"Η διάρκεια του Αμοιβαίου Κεφαλαίου Επιχειρηματικών Συμμετοχών κλειστού τύπου (ΑΚΕΣ) δε μπορεί να υπερβαίνει τα:","o":[{"k":"α","t":"10 έτη."},{"k":"β","t":"15 έτη."},{"k":"γ","t":"20 έτη."},{"k":"δ","t":"25 έτη."}]},{"n":44,"a":"α","q":"Η Εταιρία Κεφαλαίων Επιχειρηματικών Συμμετοχών (ΕΚΕΣ) δεν επιτρέπεται:","o":[{"k":"α","t":"Να παρέχει δάνεια σε επιχειρήσεις, στις οποίες συμμετέχει."},{"k":"β","t":"Να παρέχει εγγύηση για τη χορήγηση δανείων σε επιχειρήσεις, στις οποίες συμμετέχει."},{"k":"γ","t":"Να συμμετέχει σε εισηγμένες επιχειρήσεις."},{"k":"δ","t":"Να τοποθετεί τα διαθέσιμά της σε οργανισμούς συλλογικών επενδύσεων στο εξωτερικό."}]},{"n":45,"a":"δ","q":"Το Αμοιβαίο Κεφάλαιο Επιχειρηματικών Συμμετοχών κλειστού τύπου (ΑΚΕΣ):","o":[{"k":"α","t":"Είναι ομάδα περιουσίας που αποτελείται από κινητές αξίες ενσώματες ή άυλες, εταιρικά μερίδια και μετρητά, η οποία συνιστάται για ορισμένη χρονική διάρκεια με αποκλεισμό του δικαιώματος απόκτησης και μεταβίβασης στοιχείων του ενεργητικού με όρους διαφορετικούς από τους οριζόμενους στο Νόμο και της οποίας τα επιμέρους στοιχεία ανήκουν εξαδιαιρέτου σε φυσικά ή νομικά πρόσωπα (μεριδιούχους). Η διάρκεια του ΑΚΕΣ δεν μπορεί να υπερβαίνει τα 10 έτη."},{"k":"β","t":"Είναι ομάδα περιουσίας που αποτελείται από κινητές αξίες ενσώματες ή άυλες, εταιρικά μερίδια και μετρητά, η οποία συνιστάται για ορισμένη χρονική διάρκεια με αποκλεισμό του δικαιώματος απόκτησης και μεταβίβασης στοιχείων του ενεργητικού με όρους διαφορετικούς από τους οριζόμενους στο Νόμο και της οποίας τα επιμέρους στοιχεία ανήκουν εξαδιαιρέτου σε φυσικά ή νομικά πρόσωπα (μεριδιούχους). Η διάρκεια του ΑΚΕΣ δεν μπορεί να υπερβαίνει τα 30 έτη."},{"k":"γ","t":"Είναι ομάδα περιουσίας που αποτελείται από κινητές αξίες ενσώματες ή άυλες, εταιρικά μερίδια, ακίνητα και μετρητά, η οποία συνιστάται για ορισμένη χρονική διάρκεια με αποκλεισμό του δικαιώματος απόκτησης και μεταβίβασης στοιχείων του ενεργητικού με όρους διαφορετικούς από τους οριζόμενους στο Νόμο και της οποίας τα επιμέρους στοιχεία ανήκουν εξαδιαιρέτου σε φυσικά ή νομικά πρόσωπα (μεριδιούχους). Η διάρκεια του ΑΚΕΣ δεν μπορεί να υπερβαίνει τα 20 έτη."},{"k":"δ","t":"Είναι ομάδα περιουσίας που αποτελείται από κινητές αξίες ενσώματες ή άυλες, εταιρικά μερίδια και μετρητά, η οποία συνιστάται για ορισμένη χρονική διάρκεια με αποκλεισμό του δικαιώματος απόκτησης και μεταβίβασης στοιχείων του ενεργητικού με όρους διαφορετικούς από τους οριζόμενους στο Νόμο και της οποίας τα επιμέρους στοιχεία ανήκουν εξαδιαιρέτου σε φυσικά ή νομικά πρόσωπα (μεριδιούχους). Η διάρκεια του ΑΚΕΣ δεν μπορεί να υπερβαίνει τα 20 έτη."}]},{"n":46,"a":"α","q":"Το ελάχιστο ύψος του ενεργητικού του Αμοιβαίου Κεφαλαίου Επιχειρηματικών Συμμετοχών (ΑΚΕΣ) κατά τη σύστασή του και η ελάχιστη αξία της συμμετοχής κάθε μεριδιούχου κατά τη σύσταση του αμοιβαίου κεφαλαίου είναι, αντίστοιχα:","o":[{"k":"α","t":"3.000.000 και 150.000 Ευρώ."},{"k":"β","t":"300.000 και 800.000 Ευρώ."},{"k":"γ","t":"300.000 και 100.000 Ευρώ."},{"k":"δ","t":"150.000 και 75.000 Ευρώ."}]},{"n":47,"a":"γ","q":"Απαγορεύεται η τοποθέτηση άνω του …………. του ενεργητικού του Αμοιβαίου Κεφαλαίου Επιχειρηματικών Συμμετοχών (ΑΚΕΣ) σε κινητές αξίες του ίδιου εκδότη.","o":[{"k":"α","t":"5%."},{"k":"β","t":"10%."},{"k":"γ","t":"20%."},{"k":"δ","t":"25%."}]},{"n":48,"a":"α","q":"Η Εταιρία Κεφαλαίου Επιχειρηματικών Συμμετοχών (ΕΚΕΣ) είναι:","o":[{"k":"α","t":"Ανώνυμη εταιρία με αποκλειστικό σκοπό τη συμμετοχή στο κεφάλαιο επιχειρήσεων οι οποίες εδρεύουν: α) στην Ελλάδα ή σε άλλο κράτος - μέλος της Ε.Ε. ή β) σε Τρίτη χώρα εφόσον οι επιχειρήσεις δραστηριοποιούνται στην παραγωγή ή στην παροχή υπηρεσιών στην Ελλάδα."},{"k":"β","t":"Ανώνυμη εταιρία με επικουρικό σκοπό τη συμμετοχή στο κεφάλαιο επιχειρήσεων οι οποίες εδρεύουν: α) στην Ελλάδα ή σε άλλο κράτος - μέλος της Ε.Ε. ή β) σε Τρίτη χώρα εφόσον οι επιχειρήσεις δραστηριοποιούνται στην παραγωγή ή στην παροχή υπηρεσιών στην Ελλάδα."},{"k":"γ","t":"Προσωπική εταιρία με αποκλειστικό σκοπό τη συμμετοχή στο κεφάλαιο επιχειρήσεων οι οποίες εδρεύουν: α) στην Ελλάδα ή σε άλλο κράτος - μέλος της Ε.Ε. ή β) σε Τρίτη χώρα εφόσον οι επιχειρήσεις δραστηριοποιούνται στην παραγωγή ή στην παροχή υπηρεσιών στην Ελλάδα."},{"k":"δ","t":"Ανώνυμη εταιρία με αποκλειστικό σκοπό τη συμμετοχή στο κεφάλαιο επιχειρήσεων οι οποίες εδρεύουν: α) στην Ελλάδα ή σε άλλο κράτος - μέλος της Ε.Ε. ή β) σε Τρίτη χώρα εφόσον οι επιχειρήσεις δραστηριοποιούνται στην παραγωγή ή στην παροχή υπηρεσιών εκτός Ε.Ε."}]},{"n":49,"a":"β","q":"Η είσοδος και έξοδος του επενδυτή σε ΑΕΕΧ πραγματοποιείται:","o":[{"k":"α","t":"Με την καταβολή της αξίας των μεριδίων της ΑΕΕΧ και την εξαγορά τους, αντιστοίχως."},{"k":"β","t":"Με την αγορά και πώληση των μετοχών της ΑΕΕΧ, αντιστοίχως."},{"k":"γ","t":"Με την προσφορά κινητών αξιών για την απόκτηση μεριδίων της ΑΕΕΧ και εξαγορά των μεριδίων, αντιστοίχως."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":50,"a":"δ","q":"Ποιες από τις παρακάτω επιχειρήσεις δεν επιτρέπεται να παρέχουν επενδυτικές υπηρεσίες;","o":[{"k":"α","t":"Τα πιστωτικά ιδρύματα."},{"k":"β","t":"Οι ΑΕΕΔ."},{"k":"γ","t":"Οι ΑΕΔΑΚ."},{"k":"δ","t":"Οι ΑΕΕΧ."}]},{"n":51,"a":"γ","q":"Η ΑΕΕΧ έχει ως σκοπό:","o":[{"k":"α","t":"Τη διαχείριση του χαρτοφυλακίου της και την παροχή επενδυτικών συμβουλών."},{"k":"β","t":"Τη διαχείριση του χαρτοφυλακίου της και την παροχή της υπηρεσίας της αναδοχής."},{"k":"γ","t":"Τη διαχείριση του χαρτοφυλακίου της αποκλειστικά."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":52,"a":"α","q":"Πώς μπορεί κάποιος να συμμετάσχει στην ΑΕΕΧ;","o":[{"k":"α","t":"Με την απόκτηση μετοχών."},{"k":"β","t":"Με την απόκτηση μεριδίων."},{"k":"γ","t":"Με την απόκτηση ομολόγων."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":53,"a":"β","q":"Η ΑΕΕΧ «ΜΙΔΑΣ Α.Ε.» εποπτεύεται από:","o":[{"k":"α","t":"Την Ένωση Θεσμικών Επενδυτών."},{"k":"β","t":"Την Επιτροπή Κεφαλαιαγοράς (ΕΚ)."},{"k":"γ","t":"Την Τράπεζα της Ελλάδος (ΤτΕ)."},{"k":"δ","t":"Το Χρηματιστήριο Αθηνών (ΧΑ)."}]},{"n":54,"a":"γ","q":"Τι από τα παρακάτω δεν επιτρέπεται να κάνει μία ΑΕΕΧ;","o":[{"k":"α","t":"Να επενδύει σε κινητές αξίες που αποτελούν αντικείμενο διαπραγμάτευσης σε ρυθμιζόμενη αγορά τρίτου κράτους (δηλαδή όχι κράτους-μέλους) αναγνωρισμένη και ανοικτή στο κοινό."},{"k":"β","t":"Να επενδύει σε παράγωγα χρηματοπιστωτικά μέσα."},{"k":"γ","t":"Να επενδύει σε πολύτιμα μέταλλα ούτε να αποκτά παραστατικούς τίτλους αυτών ."},{"k":"δ","t":"Να επενδύει σε μέσα χρηματαγοράς που αντικείμενο διαπραγμάτευσης σε ρυθμιζόμενη αγορά που εδρεύει ή λειτουργεί σε κράτος - μέλος της Ευρωπαϊκής Ένωσης."}]},{"n":55,"a":"δ","q":"Η ΑΕΕΧ υποχρεούται να υποβάλει αίτηση:","o":[{"k":"α","t":"Εισαγωγής των μετοχών της σε ρυθμιζόμενη αγορά που λειτουργεί στην Ελλάδα εντός 3 μηνών από την ημερομηνία αδειοδότησής της από την ΕΚ."},{"k":"β","t":"Εισαγωγής των μετοχών της σε ρυθμιζόμενη αγορά που λειτουργεί στην Ελλάδα εντός 6 μηνών από την ημερομηνία ολοκλήρωσης της συγκέντρωσης του απαιτούμενου μετοχικού κεφαλαίου της."},{"k":"γ","t":"Εισαγωγής των μετοχών της σε ρυθμιζόμενη αγορά που λειτουργεί στην Ελλάδα εντός 3 μηνών από την ημερομηνία έγκρισης του ενημερωτικού δελτίου της."},{"k":"δ","t":"Εισαγωγής των μετοχών της σε ρυθμιζόμενη αγορά που λειτουργεί στην Ελλάδα εντός 6 μηνών από την χορήγηση της άδειας λειτουργίας από την ΕΚ."}]},{"n":56,"a":"δ","q":"Η Επιτροπή Κεφαλαιαγοράς ανακαλεί την άδεια λειτουργίας μιας ΑΕΕΧ εάν:","o":[{"k":"α","t":"Δεν έχει κάνει χρήση της άδειας λειτουργίας εντός έξι μηνών."},{"k":"β","t":"Έχει λάβει την άδεια λειτουργίας βάσει ψευδών δηλώσεων ή με άλλο παράνομο τρόπο."},{"k":"γ","t":"Έχει διαπράξει σοβαρές παραβάσεις της νομοθεσίας."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":57,"a":"α","q":"Ποια από τις ακόλουθες προτάσεις είναι σωστή;","o":[{"k":"α","t":"Η εισαγωγή των μετοχών ΑΕΕΧ σε ρυθμιζόμενη αγορά είναι υποχρεωτική, ενώ οι μετοχές της ΑΕΔΑΚ έχουν τη δυνατότητα να εισαχθουν σε ρυθμιζόμενη αγορά."},{"k":"β","t":"Οι μετοχές των ΑΕΕΧ και ΑΕΔΑΚ δεν μπορούν να αποτελέσουν αντικείμενο διαπραγμάτευσης σε ρυθμιζόμενη αγορά."},{"k":"γ","t":"Η εισαγωγή των μετοχών ΑΕΔΑΚ σε ρυθμιζόμενη αγορά είναι υποχρεωτική, ενώ οι μετοχές ΑΕΕΧ δεν μπορούν να αποτελέσουν αντικείμενο διαπραγμάτευσης σε ρυθμιζόμενη αγορά."},{"k":"δ","t":"Η εισαγωγή των μετοχών ΑΕΕΧ σε ρυθμιζόμενη αγορά υπόκειται στη διακριτική ευχέρεια της ΑΕΕΧ, ενώ οι μετοχές ΑΕΔΑΚ δεν μπορούν να αποτελέσουν αντικείμενο διαπραγμάτευσης σε ρυθμιζόμενη αγορά."}]},{"n":58,"a":"α","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Οι ΑΕΔΑΚ έχουν αποκλειστικό σκοπό τη διαχείριση ΟΣΕΚΑ και μετά από άδεια της Επιτροπής Κεφαλαιαγοράς μπορούν να παρέχουν τις υπηρεσίες διαχείρισης χαρτοφυλακίου, επενδυτικών συμβουλών και φύλαξης και διοικητικής διαχείρισης μεριδίων ΟΣΕΚΑ."},{"k":"β","t":"Οι ΑΕΔΑΚ έχουν αποκλειστικό σκοπό τη διαχείριση ΟΣΕΚΑ και μετά από άδεια της Επιτροπής Κεφαλαιαγοράς μπορούν να παρέχουν τις υπηρεσίες διαχείρισης χαρτοφυλακίου, επενδυτικών συμβουλών, αναδοχής χρηματοπιστωτικών μέσων ή τοποθέτησής τους με δέσμευση ανάληψης και φύλαξης και διοικητικής διαχείρισης μεριδίων ΟΣΕΚΑ."},{"k":"γ","t":"Οι ΑΕΔΑΚ έχουν αποκλειστικό σκοπό τη διαχείριση ΟΣΕΚΑ και μετά από άδεια της Επιτροπής Κεφαλαιαγοράς μπορούν να παρέχουν τις υπηρεσίες διαχείρισης χαρτοφυλακίου, επενδυτικών συμβουλών, τοποθέτησης χρηματοπιστωτικών μέσων χωρίς δέσμευση ανάληψης και φύλαξης και διοικητικής διαχείρισης μεριδίων ΟΣΕΚΑ."},{"k":"δ","t":"Οι ΑΕΔΑΚ έχουν αποκλειστικό σκοπό τη διαχείριση ΟΣΕΚΑ και δεν επιτρέπεται να παρέχουν άλλες επενδυτικές ή παρεπόμενες υπηρεσίες."}]},{"n":59,"a":"β","q":"Η φύλαξη των στοιχείων του ενεργητικού του ΟΣΕΚΑ:","o":[{"k":"α","t":"Γίνεται από την ίδια την ΑΕΔΑΚ/ΑΕΕΜΚ (Ανώνυμη Εταιρεία Επενδύσεων Μεταβλητού Κεφαλαίου) μετά από άδεια της Επιτροπής Κεφαλαιαγοράς."},{"k":"β","t":"Ανατίθεται από την ΑΕΔΑΚ/ΑΕΕΜΚ σε θεματοφύλακα μετά από άδεια της Επιτροπής Κεφαλαιαγοράς."},{"k":"γ","t":"Ανατίθεται από την ΑΕΔΑΚ/ΑΕΕΜΚ σε θεματοφύλακα, πιστωτικό ίδρυμα μετά από άδεια της Τράπεζας της Ελλάδος."},{"k":"δ","t":"Γίνεται από την ίδια την ΑΕΔΑΚ/ΑΕΕΜΚ."}]},{"n":60,"a":"γ","q":"Οι ΑΕΔΑΚ, μετά από άδεια της Επιτροπής Κεφαλαιαγοράς, μπορούν επίσης να παρέχουν τις ακόλουθες υπηρεσίες:","o":[{"k":"α","t":"Διαχείριση χαρτοφυλακίων επενδύσεων, επενδυτικές συμβουλές και έρευνα στον τομέα των επενδύσεων και χρηματοοικονομική ανάλυση."},{"k":"β","t":"Διαχείριση χαρτοφυλακίων επενδύσεων, εκτέλεση εντολών για λογαριασμό πελατών και φύλαξη και διοικητική διαχείριση μεριδίων ΟΣΕΚΑ."},{"k":"γ","t":"Διαχείριση χαρτοφυλακίων επενδύσεων, επενδυτικές συμβουλές και φύλαξη και διοικητική διαχείριση μεριδίων ΟΣΕΚΑ."},{"k":"δ","t":"Μόνο υπηρεσίες ανάλυσης αγορών και χρηματοπιστωτικών μέσων."}]},{"n":61,"a":"γ","q":"Ο ΟΣΕΚΑ που έχει τη μορφή Ανώνυμης Εταιρείας Επενδύσεων Μεταβλητού Κεφαλαίου (ΑΕΕΜΚ):","o":[{"k":"α","t":"Έχει σαν αποκλειστικό σκοπό τη διαχείριση του δικού του χαρτοφυλακίου."},{"k":"β","t":"Δεν επιτρέπεται να αναλαμβάνει τη διαχείριση περιουσιακών στοιχείων για λογαριασμό τρίτου."},{"k":"γ","t":"Έχει σαν αποκλειστικό σκοπό τη διαχείριση του δικού του χαρτοφυλακίου και δεν επιτρέπεται να αναλαμβάνει τη διαχείριση περιουσιακών στοιχείων για λογαριασμό τρίτου."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":62,"a":"γ","q":"Ο ΟΣΕΚΑ που έχει τη μορφή Ανώνυμης Εταιρείας Επενδύσεων Μεταβλητού Κεφαλαίου (ΑΕΕΜΚ):","o":[{"k":"α","t":"Έχει ως αποκλειστικό σκοπό τη διαχείριση του δικού του χαρτοφυλακίου και επιτρέπεται να αναλαμβάνει τη διαχείριση περιουσιακών στοιχείων για λογαριασμό τρίτου. Δύναται είτε να διαχειρίζεται η ίδια το χαρτοφυλάκιό της είτε να ορίζει εταιρία διαχειρίσεως καθώς και να συνιστά περισσοτέρων του ενός (1) επενδυτικά τμήματα."},{"k":"β","t":"Έχει ως αποκλειστικό σκοπό τη διαχείριση του δικού του χαρτοφυλακίου και δεν επιτρέπεται να αναλαμβάνει τη διαχείριση περιουσιακών στοιχείων για λογαριασμό τρίτου. Δύναται είτε να διαχειρίζεται η ίδια το χαρτοφυλάκιό της είτε να ορίζει εταιρία διαχειρίσεως αλλά να μη συνιστά περισσότερα του ενός (1) επενδυτικά τμήματα."},{"k":"γ","t":"Έχει ως αποκλειστικό σκοπό τη διαχείριση του δικού του χαρτοφυλακίου και δεν επιτρέπεται να αναλαμβάνει τη διαχείριση περιουσιακών στοιχείων για λογαριασμό τρίτου. Δύναται είτε να διαχειρίζεται η ίδια το χαρτοφυλάκιό της είτε να ορίζει εταιρία διαχειρίσεως καθώς και να συνιστά περισσότερα του ενός (1) επενδυτικά τμήματα."},{"k":"δ","t":"Έχει ως αποκλειστικό σκοπό τη διαχείριση του δικού του χαρτοφυλακίου και δεν επιτρέπεται να αναλαμβάνει τη διαχείριση περιουσιακών στοιχείων για λογαριασμό τρίτου πάνω από ορισμένο ποσό. Δύναται είτε να διαχειρίζεται η ίδια το χαρτοφυλάκιό της είτε να ορίζει εταιρία διαχειρίσεως καθώς και να συνιστά περισσότερα του ενός (1) επενδυτικά τμήματα."}]},{"n":63,"a":"α","q":"Μια Ανώνυμη Εταιρεία Επενδύσεων Μεταβλητού Κεφαλαίου (ΑΕΕΜΚ) αδειοδοτείται από την ΕΚ μόνο εφόσον η ΕΚ έχει εγκρίνει:","o":[{"k":"α","t":"Τα καταστατικά έγγραφα, το θεματοφύλακα και την εταιρία διαχειρίσεως, εφόσον έχει οριστεί."},{"k":"β","t":"Τη νομότυπη κατανομή του ενεργητικού."},{"k":"γ","t":"Την ύπαρξη του ελαχίστου απαιτουμένου μετοχικού κεφαλαίου."},{"k":"δ","t":"Τη συνδρομή των προϋποθέσεων εγγραφής στο ΓΕΜΗ."}]},{"n":64,"a":"β","q":"Το Αμοι
