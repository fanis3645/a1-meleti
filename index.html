Όλες οι απαντήσεις είναι σωστές."}]},{"n":9,"a":"δ","q":"Ποια από τις παρακάτω υπηρεσίες δεν αποτελεί επενδυτική υπηρεσία;","o":[{"k":"α","t":"Οι επενδυτικές συμβουλές."},{"k":"β","t":"Η λήψη και διαβίβαση εντολών σχετικών με ένα ή περισσότερα χρηματοπιστωτικά μέσα."},{"k":"γ","t":"Η διαχείριση χαρτοφυλακίου."},{"k":"δ","t":"Η φύλαξη και διαχείριση χρηματοπιστωτικών μέσων για λογαριασμό πελατών."}]},{"n":10,"a":"δ","q":"Ποια από τις παρακάτω υπηρεσίες δεν αποτελεί επενδυτική υπηρεσία;","o":[{"k":"α","t":"Η λήψη και διαβίβαση εντολών σχετικών με ένα ή περισσότερα χρηματοπιστωτικά μέσα."},{"k":"β","t":"Η διαχείριση χαρτοφυλακίου πελατών."},{"k":"γ","t":"Η αναδοχή της έκδοσης τίτλων."},{"k":"δ","t":"Η φύλαξη τίτλων."}]},{"n":11,"a":"β","q":"Ποιες από τις παρακάτω επιχειρήσεις δεν επιτρέπεται να παρέχουν επενδυτικές υπηρεσίες;","o":[{"k":"α","t":"Τα πιστωτικά ιδρύματα."},{"k":"β","t":"Οι ΑΕΕΧ."},{"k":"γ","t":"Οι ΑΕΕΔ."},{"k":"δ","t":"Οι ΑΕΔΑΚ."}]},{"n":12,"a":"γ","q":"Οι ΑΕΠΕΥ:","o":[{"k":"α","t":"Προσδιορίζουν λεπτομερειακά τη δυνητική αγορά-στόχο για κάθε χρηματοπιστωτικό μέσο."},{"k":"β","t":"Καθορίζουν την κατηγορία/κατηγορίες πελατών με τις ανάγκες, τα χαρακτηριστικά και τους στόχους των οποίων είναι συμβατό το χρηματοπιστωτικό μέσο."},{"k":"γ","t":"Προσδιορίζουν λεπτομερειακά τη δυνητική αγορά-στόχο για κάθε χρηματοπιστωτικό μέσο και καθορίζουν την κατηγορία/κατηγορίες πελατών με τις ανάγκες, τα χαρακτηριστικά και τους στόχους των οποίων είναι συμβατό το χρηματοπιστωτικό μέσο."},{"k":"δ","t":"Δημιουργούν υποχρεωτικά 3 τουλάχιστον κατηγορίες αγορών-στόχων με κριτήριο την εταιρική μορφή των πελατών."}]},{"n":13,"a":"α","q":"Στην Ελλάδα, η εποπτεία των επενδυτικών υπηρεσιών κατανέμεται ως εξής:","o":[{"k":"α","t":"Τα πιστωτικά ιδρύματα εποπτεύονται από (i) την ΤτΕ ως προς τις ρυθμίσεις πρόληψης και (ii) την ΕΚ ως προς τους κανόνες δεοντολογίας, ενώ οι ΑΕΠΕΥ εποπτεύονται από την ΕΚ τόσο ως προς τις ρυθμίσεις πρόληψης όσο και ως προς τους κανόνες δεοντολογίας."},{"k":"β","t":"Τα πιστωτικά ιδρύματα εποπτεύονται από την ΤτΕ τόσο ως προς τις ρυθμίσεις πρόληψης όσο και ως προς τους κανόνες δεοντολογίας, ενώ οι ΑΕΠΕΥ εποπτεύονται από την ΕΚ τόσο ως προς τις ρυθμίσεις πρόληψης όσο και ως προς τους κανόνες δεοντολογίας."},{"k":"γ","t":"Τα πιστωτικά ιδρύματα και οι ΑΕΠΕΥ εποπτεύονται από την ΕΚ τόσο ως προς τις ρυθμίσεις πρόληψης όσο και ως προς τους κανόνες δεοντολογίας."},{"k":"δ","t":"Τα πιστωτικά ιδρύματα εποπτεύονται από (i) την ΤτΕ ως προς τους κανόνες συμπεριφοράς και (ii) την ΕΚ ως προς τις ρυθμίσεις πρόληψης, ενώ οι ΑΕΠΕΥ εποπτεύονται από την ΕΚ τόσο ως προς τις ρυθμίσεις πρόληψης όσο και ως προς τους κανόνες δεοντολογίας."}]},{"n":14,"a":"β","q":"Ποιες από τις παρακάτω αναφερόμενες εταιρείες, όταν παρέχουν επενδυτικές και παρεπόμενες υπηρεσίες ή ασκούν επενδυτικές δραστηριότητες, υποχρεούνται να θεσπίζουν κατάλληλες διαδικασίες προκειμένου οι εργαζόμενοι σ’ αυτές να μπορούν να καταγγέλλουν εσωτερικά παραβάσεις ή ενδεχόμενες παραβάσεις της νομοθεσίας για τις αγορές χρηματοπιστωτικών μέσων, μέσω ειδικού ανεξάρτητου και αυτόνομου διαύλου;","o":[{"k":"α","t":"ΑΕΠΕΥ, ΑΕΕΔ , ΑΕΕΧ , και ΑΕΔΑΚ."},{"k":"β","t":"ΑΕΠΕΥ, Διαχειριστές Αγοράς, ΑΕΔΑΚ, ΑΕΔΟΕ, Πάροχοι Υπηρεσιών Αναφοράς Δεδομένων και Πιστωτικά Ιδρύματα."},{"k":"γ","t":"ΑΕΠΕΥ, Πιστωτικά Ιδρύματα και ΑΕΔΑΚ."},{"k":"δ","t":"ΑΕΠΕΥ, Πιστωτικά Ιδρύματα και ΑΕΕΧ."}]},{"n":15,"a":"β","q":"Οι ΑΕΠΕΥ και τα πιστωτικά ιδρύματα που παρέχουν την επενδυτική υπηρεσία της λήψης και διαβίβασης εντολών:","o":[{"k":"α","t":"Πρέπει σε κάθε περίπτωση να προβαίνουν σε έλεγχο συμβατότητας."},{"k":"β","t":"Δεν χρειάζεται να προβαίνουν σε έλεγχο συμβατότητας εάν η υπηρεσία παρέχεται κατόπιν πρωτοβουλίας του πελάτη, αφορά μη πολύπλοκη συναλλαγή και ο πελάτης έχει ενημερωθεί σχετικά."},{"k":"γ","t":"Πρέπει να προβαίνουν σε έλεγχο συμβατότητας αν ο πελάτης είναι διατεθειμένος να καλύψει το επιπλέον κόστος."},{"k":"δ","t":"Πρέπει να προβαίνουν σε έλεγχο συμβατότητας εκτός αν προβλέπεται κάτι διαφορετικό στη σύμβαση με τον πελάτη."}]},{"n":16,"a":"δ","q":"Ποιο από τα παρακάτω πρόσωπα δεν περιλαμβάνεται στην έννοια του επαγγελματία επενδυτή;","o":[{"k":"α","t":"Τα πιστωτικά ιδρύματα."},{"k":"β","t":"Οι ΑΕΠΕΥ."},{"k":"γ","t":"Οι ασφαλιστικές επιχειρήσεις."},{"k":"δ","t":"Οι εισηγμένες εταιρίες."}]},{"n":17,"a":"γ","q":"Οι Α.Ε.Π.Ε.Υ. που διενεργούν αλγοριθμικές συναλλαγές ενημερώνουν σχετικά:","o":[{"k":"α","t":"Την Τράπεζα της Ελλάδος και την αρμόδια αρχή του τόπου διαπραγμάτευσης στον οποίο δραστηριοποιούνται μέσω αλγοριθμικών συναλλαγών ως μέλη ή συμμετέχουσες."},{"k":"β","t":"Την Επιτροπή Κεφαλαιαγοράς και την συνεργαζόμενη Α.Ε.Π.Ε.Υ.-μέλος του τόπου διαπραγμάτευσης στον οποίο δραστηριοποιούνται μέσω αλγοριθμικών συναλλαγών ως μέλη ή συμμετέχουσες."},{"k":"γ","t":"Την Επιτροπή Κεφαλαιαγοράς και την αρμόδια αρχή του τόπου διαπραγμάτευσης στον οποίο δραστηριοποιούνται μέσω αλγοριθμικών συναλλαγών ως μέλη ή συμμετέχουσες."},{"k":"δ","t":"Την Ένωση Θεσμικών Επενδυτών, την Επιτροπή Κεφαλαιαγοράς, και την συνεργαζόμενη Α.Ε.Π.Ε.Υ.-μέλος του τόπου διαπραγμάτευσης στον οποίο δραστηριοποιούνται μέσω αλγοριθμικών συναλλαγών ως μέλη ή συμμετέχουσες."}]},{"n":18,"a":"β","q":"Επαγγελματίας πελάτης αλλάζει κατηγορία σε ιδιώτη:","o":[{"k":"α","t":"Εφόσον το ζητήσει ο ίδιος."},{"k":"β","t":"Εφόσον το ζητήσει ο ίδιος εγγράφως και ο πάροχος της επενδυτικής υπηρεσίας ενημερώσει σχετικά για την αλλαγή αυτή."},{"k":"γ","t":"Αυτόματα εάν διαπιστωθεί ότι μεταβλήθηκαν τα δεδομένα βάσει των οποίων είχε κατηγοριοποιηθεί ως επαγγελματίας."},{"k":"δ","t":"Δεν μπορεί να αλλάξει κατηγορία."}]},{"n":19,"a":"δ","q":"Ποιο από τα ακόλουθα είναι επενδυτική συμβουλή;","o":[{"k":"α","t":"Παροχή διαφημιστικού υλικού σχετικά με τα προϊόντα της ΑΕΠΕΥ."},{"k":"β","t":"Δημοσιοποίηση λεπτομερειών για συναλλαγές μελών ΔΣ επί μετοχών της εταιρίας τους."},{"k":"γ","t":"Η παραπομπή πελάτη σε δημοσιευμένες αναλύσεις εκδοτριών εταιριών."},{"k":"δ","t":"Σύσταση σχετικά με τον κατάλληλο χρόνο εκτέλεσης εντολής."}]},{"n":20,"a":"α","q":"Ποια από τα ακόλουθα αποτελούν επενδυτική συμβουλή: I. Προσωπική σύσταση για τον κατάλληλο χρόνο διενέργειας συναλλαγών. II. Προτροπή για τη διενέργεια συναλλαγών με βάση προνομιακή πληροφόρηση. III. Ρευστοποίηση υπαρχόντων επενδύσεων και μετατροπή τους σε καταθέσεις ταμιευτηρίου. IV. Σύγκριση πλεονεκτημάτων και κινδύνων μεταξύ μέσων.","o":[{"k":"α","t":"Ι και ΙΙΙ μόνο."},{"k":"β","t":"Ι, III και ΙV μόνο."},{"k":"γ","t":"Ι, ΙΙ και ΙΙΙ μόνο."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":21,"a":"δ","q":"Αντικείμενο διαπραγμάτευσης σε Μηχανισμό Οργανωμένης Διαπραγμάτευσης (ΜΟΔ) είναι:","o":[{"k":"α","t":"Παράγωγα και μόνο."},{"k":"β","t":"Δομημένα χρηματοοικονομικά προϊόντα και παράγωγα."},{"k":"γ","t":"Ομόλογα και δομημένα χρηματοοικονομικά προϊόντα εκτός των παραγώγων."},{"k":"δ","t":"Ομόλογα, δομημένα χρηματοοικονομικά προϊόντα και παράγωγα."}]},{"n":22,"a":"α","q":"Η παροχή προσωπικών συστάσεων σε πελάτη σχετικά με μια ή περισσότερες συναλλαγές που αφορούν χρηματοπιστωτικά μέσα αποτελεί:","o":[{"k":"α","t":"Επενδυτική υπηρεσία ή δραστηριότητα."},{"k":"β","t":"Παρεπόμενη επενδυτική υπηρεσία."},{"k":"γ","t":"Χρηματοπιστωτικό μέσο."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":23,"a":"γ","q":"Ποια από τις παρακάτω είναι παρεπόμενη επενδυτική υπηρεσία; I. Η έρευνα στον τομέα των επενδύσεων και χρηματοοικονομική ανάλυση. II. Η εκτέλεση εντολών για λογαριασμό πελατών. III. Η αναδοχή χρηματοπιστωτικών μέσων. IV. Παροχή συμβουλών σε επιχειρήσεις σχετικά µε τη διάρθρωση του κεφαλαίου τους.","o":[{"k":"α","t":"Ι και ΙΙ μόνο."},{"k":"β","t":"ΙΙ και ΙΙΙ μόνο."},{"k":"γ","t":"Ι και ΙV μόνο."},{"k":"δ","t":"ΙΙ και ΙV μόνο."}]},{"n":24,"a":"β","q":"Η Επιτροπή Κεφαλαιαγοράς χορηγεί άδεια λειτουργίας σε ΑΕΠΕΥ μόνον εφόσον γνωρίζει την ταυτότητα:","o":[{"k":"α","t":"Των μετόχων που κατέχουν τουλάχιστον το 5% του μετοχικού κεφαλαίου της ΑΕΠΕΥ."},{"k":"β","t":"Των μετόχων που κατέχουν τουλάχιστον το 10% του μετοχικού κεφαλαίου της ΑΕΠΕΥ."},{"k":"γ","t":"Των μετόχων που κατέχουν τουλάχιστον το 15% του μετοχικού κεφαλαίου της ΑΕΠΕΥ."},{"k":"δ","t":"Όλων των μετόχων της ΑΕΠΕΥ ανεξαρτήτως ποσοστού συμμετοχής τους στο μετοχικό της κεφάλαιο."}]},{"n":25,"a":"α","q":"Προκειμένου να χορηγήσει άδεια λειτουργίας σε μια υποψήφια ΑΕΠΕΥ, η ΕΚ εξετάζει μεταξύ άλλων:","o":[{"k":"α","t":"Το μετοχικό κεφάλαιο της εταιρίας, την ποιότητα και ταυτότητα της διοίκησης της εταιρίας, την ποιότητα και ταυτότητα των προσώπων με ειδικές συμμετοχές στην εταιρία καθώς και την ικανοποίηση μιας σειράς οργανωτικών προϋποθέσεων."},{"k":"β","t":"Το μετοχικό κεφάλαιο της εταιρίας, την ποιότητα και ταυτότητα της διοίκησης της εταιρίας, την ποιότητα και ταυτότητα των προσώπων με ειδικές συμμετοχές στην εταιρία, την ικανοποίηση μιας σειράς οργανωτικών προϋποθέσεων και επιπλέον τη σκοπιμότητα παροχής των επενδυτικών υπηρεσιών ως προς τις οποίες υποβάλλεται η αίτηση."},{"k":"γ","t":"Το μετοχικό κεφάλαιο της εταιρίας, την ποιότητα και ταυτότητα της διοίκησης της εταιρίας καθώς και την ικανοποίηση μιας σειράς οργανωτικών προϋποθέσεων."},{"k":"δ","t":"Το μετοχικό κεφάλαιο της εταιρίας, την ταυτότητα της διοίκησης της εταιρίας, την ποιότητα και ταυτότητα των προσώπων με ειδικές συμμετοχές στην εταιρία καθώς και την ικανοποίηση μιας σειράς οργανωτικών προϋποθέσεων."}]},{"n":26,"a":"β","q":"Ποιους μετόχους μιας ΑΕΠΕΥ πρέπει να ελέγξει η Επιτροπή Κεφαλαιαγοράς προκειμένου να χορηγήσει άδεια λειτουργίας;","o":[{"k":"α","t":"Μετόχους με ποσοστό μεγαλύτερο του 5%."},{"k":"β","t":"Μετόχους με ποσοστό μεγαλύτερο του 10%."},{"k":"γ","t":"Μετόχους με ποσοστό μεγαλύτερο του 15%."},{"k":"δ","t":"Όλους τους μετόχους ανεξαρτήτου ποσοστού."}]},{"n":27,"a":"α","q":"Ποιο από τα παρακάτω ισχύει;","o":[{"k":"α","t":"Η αίτηση για άδεια λειτουργίας μιας ΑΕΠΕΥ πρέπει να απαριθμεί όλες τις επενδυτικές υπηρεσίες που προτίθεται να παρέχει και τα χρηματοπιστωτικά μέσα στα οποία προτίθεται να δραστηριοποιηθεί."},{"k":"β","t":"Η άδεια λειτουργίας μιας ΑΕΠΕΥ έχει ισχύ για συγκεκριμένο χρονικό διάστημα."},{"k":"γ","t":"Η ΑΕΠΕΥ δεν μπορεί να είναι μέλος ρυθμιζόμενης αγοράς."},{"k":"δ","t":"Η ΑΕΠΕΥ-ανάδοχος μπορεί να παρέχει και τραπεζικές υπηρεσίες."}]},{"n":28,"a":"δ","q":"Μια ΑΕΠΕΥ δύναται, με βάση την άδεια που έχει λάβει από την ΕΚ, να παρέχει σε άλλο Κράτος - Μέλος:","o":[{"k":"α","t":"Οποιαδήποτε από τις υπηρεσίες που περιλαμβάνονται στην άδειά της, είτε μέσω υποκαταστήματος είτε μέσω θυγατρικής."},{"k":"β","t":"Οποιαδήποτε παρεπόμενη υπηρεσία, είτε μέσω υποκαταστήματος είτε απευθείας."},{"k":"γ","t":"Οποιαδήποτε από τις επενδυτικές υπηρεσίες που περιλαμβάνονται στην άδειά της, είτε μέσω υποκαταστήματος είτε μέσω θυγατρικής."},{"k":"δ","t":"Οποιαδήποτε από τις επενδυτικές και παρεπόμενες υπηρεσίες που περιλαμβάνονται στην άδειά της, είτε μέσω υποκαταστήματος είτε απευθείας."}]},{"n":29,"a":"β","q":"Κατά την παροχή από μια ΑΕΠΕΥ επενδυτικών υπηρεσιών σε άλλο Κράτος-Μέλος:","o":[{"k":"α","t":"Η ΕΚ εποπτεύει την ΑΕΠΕΥ σε κάθε περίπτωση και ως προς όλες τις πτυχές παροχής των επενδυτικών υπηρεσιών (δηλαδή τόσο ως προς τις ρυθμίσεις πρόληψης όσο και ως προς τους κανόνες δεοντολογίας)."},{"k":"β","t":"Η ΕΚ (i) ασκεί την προληπτική εποπτεία σε κάθε περίπτωση, (ii) εποπτεύει την τήρηση των κανόνων δεοντολογίας εφόσον οι υπηρεσίες παρέχονται στο έτερο Κράτος - Μέλος απευθείας (διασυνοριακά), ενώ οι αρμόδιες εποπτικές αρχές του Κράτους - Μέλους υποδοχής εποπτεύουν τους κανόνες δεοντολογίας της ΑΕΠΕΥ εφόσον αυτή παρέχει τις υπηρεσίες της εντός του εδάφους του μέσω υποκαταστήματος."},{"k":"γ","t":"Η ΕΚ ασκεί την προληπτική εποπτεία σε κάθε περίπτωση, ενώ οι αρμόδιες εποπτικές αρχές του Κράτους - Μέλους υποδοχής εποπτεύουν τους κανόνες δεοντολογίας της ΑΕΠΕΥ σε κάθε περίπτωση."},{"k":"δ","t":"Η ΕΚ ασκεί την προληπτική εποπτεία σε κάθε περίπτωση ενώ οι αρμόδιες εποπτικές αρχές του Κράτους - Μέλους υποδοχής εποπτεύουν τους κανόνες δεοντολογίας της ΑΕΠΕΥ εφόσον αυτή παρέχει τις υπηρεσίες της εντός του εδάφους του απευθείας (διασυνοριακά)."}]},{"n":30,"a":"δ","q":"Στο πλαίσιο ανάθεσης από ΑΕΠΕΥ σε τρίτους της εκτέλεσης επιχειρησιακών λειτουργιών ουσιώδους σημασίας:","o":[{"k":"α","t":"Η ευθύνη μεταβιβάζεται από την ΑΕΠΕΥ."},{"k":"β","t":"Ο επόπτης της ΑΕΠΕΥ εποπτεύει τη συμμόρφωση του τρίτου-παρόχου με τις υποχρεώσεις του."},{"k":"γ","t":"Η Επιτροπή Κεφαλαιαγοράς διενεργεί το due diligence του τρίτου-παρόχου."},{"k":"δ","t":"Η Επιτροπή Κεφαλαιαγοράς εποπτεύει τη συμμόρφωση της ΑΕΠΕΥ με όλες τις υποχρεώσεις της."}]},{"n":31,"a":"δ","q":"Το περιεχόμενο του εγγράφου βασικών πληροφοριών για τα συσκευασμένα επενδυτικά προιόντα για ιδιώτες επενδυτές και επενδυτικά προιόντα βασιζόμενα σε ασφάλιση (PRIIP), μεταξύ άλλων τμημάτων, πρέπει να περιέχει και τα ακόλουθα: I. Το τμήμα «τι είναι αυτό το προιόν;» II. Το τμήμα «ποιοι είναι οι κίνδυνοι και τι μπορώ να κερδίσω;» III. Το τμήμα «σε ποιους πελάτες διατίθεται το προιόν;» IV. Το τμήμα «ποιο είναι το κόστος;»","o":[{"k":"α","t":"I και III."},{"k":"β","t":"I."},{"k":"γ","t":"I , II και III."},{"k":"δ","t":"I , II και IV."}]},{"n":32,"a":"γ","q":"Για μία ΑΕΠΕΥ ο κίνδυνος κανονιστικής συμμόρφωσης (compliance risk) είναι:","o":[{"k":"α","t":"Η πιθανότητα εμφάνισης ζημιών εξαιτίας θέσεων σε έξω-χρηματιστηριακά παράγωγα."},{"k":"β","t":"Η πιθανότητα εμφάνισης ζημιών εξαιτίας θέσεων σε μη εποπτευόμενες αγορές."},{"k":"γ","t":"Η πιθανότητα εμφάνισης ζημιών εξαιτίας αδυναμίας συμμόρφωσης με νομικό πλαίσιο."},{"k":"δ","t":"Η πιθανότητα εμφάνισης ζημιών εξαιτίας τοξικών ομολόγων."}]},{"n":33,"a":"α","q":"Το πρόσωπο που παρέχει επενδυτικές συμβουλές σχετικά με ένα PRIIP ή το πωλεί, εκτιμά τον χρόνο που χρειάζεται κάθε ιδιώτης επενδυτής για να εξετάσει το έγγραφο βασικών Πληροφοριών, λαμβάνοντας υπόψη, μεταξύ άλλων:","o":[{"k":"α","t":"Τη γνώση και την εμπειρία του ιδιώτη επενδυτή στο PRIIP ή σε PRIIP παρόμοιας φύσεως ή σε κινδύνους παρόμοιους με εκείνους που προκύπτουν από το PRIIP."},{"k":"β","t":"Τις οικονομικές δυνατότητες του ιδιώτη επενδυτή."},{"k":"γ","t":"Την συνολική υφιστάμενη σχέση του ιδιώτη επενδυτή με την ΑΕΠΕΥ ή το Πιστωτικό Ιδρυμα."},{"k":"δ","t":"Τους επενδυτικούς στόχους του ιδιώτη επενδυτή."}]},{"n":34,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Η επιχείρηση επενδύσεων που κατέχει κεφάλαια ή χρηματοπιστωτικά μέσα πελατών αποστέλλει στους πελάτες της, με σταθερό μέσο, κατά το πρώτο δεκαήμερο κάθε μήνα, κατάσταση περιουσιακών στοιχείων."},{"k":"β","t":"Η επιχείρηση επενδύσεων που κατέχει κεφάλαια ή χρηματοπιστωτικά μέσα πελατών αποστέλλει μόνο στους ιδιώτες- πελάτες της, με σταθερό μέσο, κατά το πρώτο δεκαήμερο κάθε μήνα, κατάσταση περιουσιακών στοιχείων."},{"k":"γ","t":"Η επιχείρηση επενδύσεων που κατέχει κεφάλαια ή χρηματοπιστωτικά μέσα πελατών δεν υποχρεούται να αποστείλει στους πελάτες κατάσταση περιουσιακών στοιχείων."},{"k":"δ","t":"Η επιχείρηση επενδύσεων που κατέχει κεφάλαια ή χρηματοπιστωτικά μέσα πελατών αποστέλλει στους πελάτες της, με σταθερό μέσο, τουλάχιστον μια φορά το χρόνο, κατάσταση περιουσιακών στοιχείων."}]},{"n":35,"a":"β","q":"Σε περίπτωση εκτέλεσης από μία επιχείρηση επενδύσεων εντολής για λογαριασμό ιδιώτη πελάτη, το καλύτερο δυνατό αποτέλεσμα προσδιορίζεται:","o":[{"k":"α","t":"Βάσει της περιουσιακής κατάστασης του πελάτη."},{"k":"β","t":"Βάσει του συνολικού τιμήματος που καταβάλει ο πελάτης για την εκτέλεση της εντολής, το οποίο αντιστοιχεί στην τιμή του χρηματοπιστωτικού μέσου και στο κόστος που σχετίζεται με την εκτέλεση."},{"k":"γ","t":"Βάσει αξιολόγησης της ρυθμιζόμενης αγοράς στην οποία εκτελέσθηκε η εντολή."},{"k":"δ","t":"Βάσει των κριτηρίων που χρησιμοποιεί στις συναλλαγές της η ΑΕΠΕΥ."}]},{"n":36,"a":"α","q":"Η πληροφόρηση που απευθύνει επιχείρηση επενδύσεων σε ιδιώτες πελάτες της:","o":[{"k":"α","t":"Μπορεί να δίνει έμφαση στα ενδεχόμενα οφέλη από μια συγκεκριμένη επένδυση, αρκεί να επισημαίνει με σαφήνεια κάθε σχετικό κίνδυνο."},{"k":"β","t":"Απαγορεύεται να δίνει έμφαση στα οφέλη από μια συγκεκριμένη επένδυση."},{"k":"γ","t":"Επιτρέπεται να δίνει έμφαση στα ενδεχόμενα οφέλη από μια συγκεκριμένη επένδυση."},{"k":"δ","t":"Απαγορεύεται να δίνει έμφαση στα οφέλη από μια συγκεκριμένη επένδυση, χωρίς προηγούμενη ειδική άδεια της Επιτροπής Κεφαλαιαγοράς."}]},{"n":37,"a":"δ","q":"Η πληροφόρηση που αντλεί η ΑΕΠΕΥ αναφορικά με την οικονομική κατάσταση του πελάτη, περιλαμβάνει, κατά περίπτωση, στοιχεία σχετικά με:","o":[{"k":"α","t":"Την προέλευση και το ύψος των τακτικών του εισοδημάτων."},{"k":"β","t":"Τα περιουσιακά του στοιχεία, περιλαμβανομένων των ρευστών διαθεσίμων του, των επενδύσεων και των ακινήτων του."},{"k":"γ","t":"Τις τακτικές οικονομικές του υποχρεώσεις."},{"k":"δ","t":"Ολες οι απαντήσεις είναι σωστές."}]},{"n":38,"a":"β","q":"Κάθε φυσικό ή νομικό πρόσωπο που προτίθεται να αποκτήσει ειδική συμμετοχή σε ΑΕΠΕΥ, έτσι ώστε η αναλογία των δικαιωμάτων ψήφου ή των μεριδίων κεφαλαίου που κατέχει να φθάνει ή να υπερβαίνει το........., γνωστοποιεί προηγουμένως στην ΕΚ το ύψος της συμμετοχής που θα προκύψει.","o":[{"k":"α","t":"20%, 30%, 50%."},{"k":"β","t":"20%, 33,3%, 50%."},{"k":"γ","t":"10%,30%, 75%."},{"k":"δ","t":"10%, 33,5%, 50%."}]},{"n":39,"a":"γ","q":"Επιχείρηση επενδύσεων, η οποία πρόκειται να παράσχει σε νέο ιδιώτη πελάτη επενδυτικές υπηρεσίες:","o":[{"k":"α","t":"Συνάπτει με αυτόν γραπτή ή προφορική σύμβαση."},{"k":"β","t":"Του γνωστοποιεί τηλεφωνικά τους βασικούς όρους της μεταξύ τους συμβάσεως και προχωρεί στην παροχή της επενδυτικής υπηρεσίας."},{"k":"γ","t":"Συνάπτει με αυτόν γραπτή σύμβαση."},{"k":"δ","t":"Συνάπτει με αυτόν γραπτή σύμβαση, εφόσον ο ίδιος το ζητήσει."}]},{"n":40,"a":"α","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Η ΑΕΠΕΥ παρέχει αμέσως στον πελάτη τις ουσιώδεις πληροφορίες που αφορούν στην εκτέλεση της εντολής μέσω σταθερού μέσου και αποστέλλει στους ιδιώτες πελάτες, το αργότερο την επόμενη της εκτέλεσης της εντολής εργάσιμη ημέρα, μέσω σταθερού μέσου, ειδοποίηση για την επιβεβαίωση εκτέλεσης της εντολής."},{"k":"β","t":"Η ΑΕΠΕΥ παρέχει αμέσως στον πελάτη τις ουσιώδεις πληροφορίες που αφορούν στην εκτέλεση της εντολής μέσω σταθερού μέσου και αποστέλλει στους ιδιώτες πελάτες, το αργότερο εντός τους πρώτου δεκαημέρου του μηνός που έπεται της συναλλαγής, μέσω σταθερού μέσου, ειδοποίηση για την επιβεβαίωση εκτέλεσης της εντολής."},{"k":"γ","t":"Η ΑΕΠΕΥ παρέχει αμέσως στον πελάτη τις ουσιώδεις πληροφορίες που αφορούν στην εκτέλεση της εντολής μέσω σταθερού μέσου και δεν αποστέλλει ειδοποίηση για την επιβεβαίωση εκτέλεσης της εντολής."},{"k":"δ","t":"Η ΑΕΠΕΥ δεν παρέχει αμέσως στον ιδιώτη πελάτη ουσιώδεις πληροφορίες που αφορούν στην εκτέλεση της εντολής μέσω σταθερού μέσου και απλώς αποστέλλει στους ιδιώτες πελάτες, το αργότερο την επόμενη της εκτέλεσης της εντολής εργάσιμη ημέρα, μέσω σταθερού μέσου, ειδοποίηση για την επιβεβαίωση εκτέλεσης της εντολής."}]},{"n":41,"a":"γ","q":"Εάν η επιχείρηση επενδύσεων διαπιστώσει ότι ένας πελάτης δεν πληρεί πλέον τους όρους βάσει των οποίων ταξινομήθηκε ως επαγγελματίας πελάτης:","o":[{"k":"α","t":"Ενημερώνει σχετικά την Επιτροπή Κεφαλαιαγοράς."},{"k":"β","t":"Αυξάνει τις χρεώσεις της προς αυτόν."},{"k":"γ","t":"Λαμβάνει κατάλληλα μέτρα."},{"k":"δ","t":"Αναμένει αίτημα του πελάτη για αλλαγή ταξινόμησής του."}]},{"n":42,"a":"γ","q":"ΑΕΠΕΥ που έχει αποφασίσει να παύσει να παρέχει συγκεκριμένες επενδυτικές υπηρεσίες:","o":[{"k":"α","t":"Δύναται να μεταβιβάσει τις συμβάσεις των πελατών της μόνον σε άλλη ΑΕΠΕΥ."},{"k":"β","t":"Δύναται να μεταβιβάσει τις συμβάσεις των πελατών της σε άλλη ΑΕΠΕΥ ή πιστωτικό ίδρυμα."},{"k":"γ","t":"Δύναται να μεταβιβάσει τις συμβάσεις των πελατών της σε άλλη ΑΕΠΕΥ ή πιστωτικό ίδρυμα, αν ο πελάτης δεν προβάλει αντιρρήσεις εντός 30 ημερών από την αποστολή ενημέρωσης σε αυτόν από την ΑΕΠΕΥ αναφορικά με τη μεταβίβαση."},{"k":"δ","t":"Απαγορεύεται να μεταβιβάσει τις συμβάσεις των πελατών της και τίθεται σε εκκαθάριση."}]},{"n":43,"a":"α","q":"Τι χρειάζεται ένα Πιστωτικό Ίδρυμα άλλου κράτους μέλους για να δραστηριοποιηθεί στην Ελλάδα:","o":[{"k":"α","t":"Μπορεί να δραστηριοποιηθεί εφόσον υπάρχει έγκριση από την αρμόδια αρχή του κράτους-μέλους και γνωστοποίηση προς την Τράπεζα της Ελλάδος."},{"k":"β","t":"Μπορεί να δραστηριοποιηθεί εφόσον υπάρχει το κατά νόμο αρχικό μετοχικό κεφάλαιο."},{"k":"γ","t":"Μπορεί να δραστηριοποιηθεί εφόσον υπάρχει γνωστοποίηση προς την Τράπεζα της Ελλάδος από την αρμόδια αρχή του κράτους-μέλους προέλευσης."},{"k":"δ","t":"Μπορεί να δραστηριοποιηθεί χωρίς προϋποθέσεις σύμφωνα με τις διατάξεις για την ελεύθερη εγκατάσταση σε κοινοτική χώρα."}]},{"n":44,"a":"δ","q":"Επιχείρηση επενδύσεων που εδρεύει σε άλλο κράτος-μέλος της ΕΕ, μπορεί να ασκεί δραστηριότητες μέσω υποκαταστήματος στην Ελλάδα, εφόσον:","o":[{"k":"α","t":"Οι δραστηριότητες αυτές καλύπτονται από την άδεια λειτουργίας της Επιτροπής Κεφαλαιαγοράς."},{"k":"β","t":"Οι δραστηριότητες αυτές καλύπτονται από την άδεια λειτουργίας του ιδρύματος από τις αρμόδιες αρχές του κράτους-μέλους προέλευσης χωρίς να απαιτείται η οποιαδήποτε γνωστοποίηση στην Επιτροπή Κεφαλαιαγοράς."},{"k":"γ","t":"Οι δραστηριότητες αυτές καλύπτονται από την άδεια λειτουργίας του ιδρύματος από τις αρμόδιες αρχές του κράτους-μέλους προέλευσης, μετά από έγκριση της Επιτροπής Κεφαλαιαγοράς."},{"k":"δ","t":"Οι δραστηριότητες αυτές καλύπτονται από την άδεια λειτουργίας του ιδρύματος από τις αρμόδιες αρχές του κράτους-μέλους προέλευσης και υπό την προϋπόθεση γνωστοποίησης στην Επιτροπή Κεφαλαιαγοράς."}]},{"n":45,"a":"δ","q":"Μια ΑΕΠΕΥ δύναται, με βάση την άδεια που έχει λάβει από την ΕΚ, να παρέχει σε άλλο Κράτος - Μέλος:","o":[{"k":"α","t":"Οποιαδήποτε από τις υπηρεσίες (κύριες ή/και παρεπόμενες) που περιλαμβάνονται στην άδειά της, είτε μέσω υποκαταστήματος είτε μέσω θυγατρικής."},{"k":"β","t":"Οποιαδήποτε επενδυτική υπηρεσία, είτε μέσω υποκαταστήματος είτε απευθείας."},{"k":"γ","t":"Οποιαδήποτε από τις (κύριες) επενδυτικές υπηρεσίες που περιλαμβάνονται στην άδειά της καθώς και οποιαδήποτε παρεπόμενη επενδυτική υπηρεσία, μέσω υποκαταστήματος είτε απευθείας."},{"k":"δ","t":"Οποιαδήποτε από τις υπηρεσίες (κύριες και παρεπόμενες) που περιλαμβάνονται στην άδειά της, είτε μέσω υποκαταστήματος είτε απευθείας."}]},{"n":46,"a":"δ","q":"Οι ιδιώτες πελάτες:","o":[{"k":"α","t":"Δύνανται, χωρίς προϋποθέσεις, να παραιτηθούν από την προστασία που τους παρέχουν οι κανόνες δεοντολογίας των επιχειρήσεων επενδύσεων."},{"k":"β","t":"Δεν δύνανται να παραιτηθούν από την προστασία που τους παρέχουν οι κανόνες δεοντολογίας των επιχειρήσεων επενδύσεων."},{"k":"γ","t":"Υποχρεούνται να παραιτηθούν από την προστασία που τους παρέχουν οι κανόνες δεοντολογίας, εφόσον το ζητήσει η επιχείρηση επενδύσεων."},{"k":"δ","t":"Δύνανται, υπό προϋποθέσεις και με συγκεκριμένη διαδικασία, να παραιτηθούν από την προστασία που τους παρέχουν οι κανόνες δεοντολογίας των επιχειρήσεων επενδύσεων."}]},{"n":47,"a":"β","q":"Βρείτε τη λάθος πρόταση:","o":[{"k":"α","t":"Οι συστημικές τράπεζες εποπτεύονται από την ΕΚΤ."},{"k":"β","t":"Οι επιχειρήσεις επενδύσεων εποπτεύονται από την ΤτΕ."},{"k":"γ","t":"Οι Εταιρίες Επενδύσεων Χαρτοφυλακίου εποπτεύονται από την ΕΚ."},{"k":"δ","t":"Οι ασφαλιστικές εταιρίες εποπτεύονται από την ΤτΕ."}]},{"n":48,"a":"β","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Ιδιώτης πελάτης μπορεί να ζητήσει να αντιμετωπισθεί ως επαγγελματίας πελάτης, και η ΑΕΠΕΥ οφείλει δίχως άλλο να αποδεχθεί το εν λόγω αίτημα."},{"k":"β","t":"Ιδιώτης πελάτης μπορεί να ζητήσει να αντιμετωπισθεί ως επαγγελματίας πελάτης, και η ΑΕΠΕΥ οφείλει, πριν αποδεχθεί το αίτημα, να διαπιστώσει τις γνώσεις και πείρα του πελάτη, να ειδοποιήσει τον πελάτη για τη μείωση του επιπέδου προστασίας και να λάβει γραπτή δήλωση από τον πελάτη ότι αναγνωρίζει τις συνέπειες της απώλειας του αυξημένου επιπέδου προστασίας."},{"k":"γ","t":"Ιδιώτης πελάτης δεν μπορεί να ζητήσει να αντιμετωπισθεί ως επαγγελματίας πελάτης σε καμία περίπτωση."},{"k":"δ","t":"Ιδιώτης πελάτης μπορεί να ζητήσει να αντιμετωπισθεί ως επαγγελματίας πελάτης, και η ΑΕΠΕΥ οφείλει, πριν αποδεχθεί το αίτημα, να ειδοποιήσει τον πελάτη για τη μείωση του επιπέδου προστασίας."}]},{"n":49,"a":"β","q":"Το Συνεγγυητικό Κεφάλαιο συστήθηκε με σκοπό την καταβολή:","o":[{"k":"α","t":"Αποζημιώσεων προς πελάτες πιστωτικών ιδρυμάτων για τη ζημία που υπέστησαν εξαιτίας της θέσης τους σε εκκαθάριση."},{"k":"β","t":"Αποζημιώσεων προς επενδυτές σε περίπτωση διαπιστωμένης οριστικής ή μη αναστρέψιμης αδυναμίας επιχείρησης επενδύσεων να εκπληρώσει τις υποχρεώσεις της που απορρέουν από την παροχή επενδυτικών υπηρεσιών."},{"k":"γ","t":"Αποζημιώσεων προς επενδυτές για τη ζημία που υπέστησαν εξαιτίας των ελλείψεων ενημερωτικού δελτίου."},{"k":"δ","t":"Αποζημιώσεων προς επενδυτές για τη ζημία που υπέστησαν εξαιτίας της αναστολής διαπραγμάτευσης των μετοχών της εκδότριας εταιρίας."}]},{"n":50,"a":"α","q":"Η παροχή αποζημίωσης από το Συνεγγυητικό Κεφάλαιο:","o":[{"k":"α","t":"Προϋποθέτει την οριστική, μόνιμη και μη αναστρέψιμη αδυναμία μέλους να εκπληρώσει τις υποχρεώσεις του από καλυπτόμενες επενδυτικές υπηρεσίες προς εντολείς."},{"k":"β","t":"Καλύπτει έως € 100.000 ανά επενδυτή-εντολέα ή αντισυμβαλλόμενο μέλος."},{"k":"γ","t":"Καλύπτει συμψηφιστικά έως €30.000 ανά επενδυτή ή αντισυμβαλλόμενο μέλος."},{"k":"δ","t":"Παραγράφεται ως υποχρέωση την 31η/12 του έτους εκτέλεσης της πράξης που γέννησε το νόμιμο δικαίωμα."}]},{"n":51,"a":"α","q":"Η μέγιστη αποζημίωση ανά επενδυτή από το Συνεγγυητικό Κεφάλαιο μπορεί να φθάσει:","o":[{"k":"α","t":"Τα 30.000 ευρώ."},{"k":"β","t":"Τα 50.000 ευρώ."},{"k":"γ","t":"Τα 100.000 ευρώ."},{"k":"δ","t":"Τα 150.000 ευρώ."}]},{"n":52,"a":"β","q":"Το Συνεγγυητικό Κεφάλαιο τελεί υπό την Εποπτεία:","o":[{"k":"α","t":"Της ΤτΕ."},{"k":"β","t":"Της ΕΚ."},{"k":"γ","t":"Του Υπουργείου Οικονομικών."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":53,"a":"α","q":"Σε ποια περίπτωση δεν υποχρεούται το Συνεγγυητικό Κεφάλαιο να ενεργοποιήσει τη διαδικασία καταβολής αποζημιώσεων;","o":[{"k":"α","t":"Εάν παρήλθε το επόμενο ημερολογιακό έτος από την ημερομηνία έκδοσης του σχετικού προς την καλυπτόμενη υπηρεσία παραστατικού."},{"k":"β","t":"Εάν εκδοθεί οριστική πτωχευτική απόφαση κατά ΑΕΠΕΥ."},{"k":"γ","t":"Εάν υποβληθεί αίτηση αποζημίωσης προς το Συνεγγυητικό Κεφάλαιο από εντολέα."},{"k":"δ","t":"Εάν γνωστοποιηθεί στο Συνεγγυητικό Κεφάλαιο από την ΕΧΑΕ ότι μέλος δεν έχει εκπληρώσει εμπρόθεσμα υποχρεώσεις παράδοσης μετρητών για την εκκαθάριση χρηματιστηριακής συναλλαγής."}]},{"n":54,"a":"γ","q":"Οι επαγγελματίες πελάτες:","o":[{"k":"α","t":"Δεν δύνανται να αλλάξουν κατηγορία."},{"k":"β","t":"Αλλάζουν κατηγορία μόνον με αποκλειστική πρωτοβουλία της ΑΕΠΕΥ."},{"k":"γ","t":"Έχουν τη δυνατότητα να ζητούν να αντιμετωπισθούν ως μη επαγγελματίες."},{"k":"δ","t":"Αλλάζουν κατηγορία αυτόματα όταν εκλείψουν οι προϋποθέσεις ταξινόμησής τους ως επαγγελματιών πελατών."}]},{"n":55,"a":"δ","q":"Ποιοι από τους παρακάτω επενδυτές δεν είναι επαγγελματίες πελάτες;","o":[{"k":"α","t":"Πιστωτικά ιδρύματα."},{"k":"β","t":"Ασφαλιστικές επιχειρήσεις."},{"k":"γ","t":"Συνταξιοδοτικά ταμεία."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":56,"a":"δ","q":"Ποιοι από τους παρακάτω επενδυτές είναι επαγγελματίες πελάτες:","o":[{"k":"α","t":"Πιστωτικά ιδρύματα."},{"k":"β","t":"Ασφαλιστικές επιχειρήσεις."},{"k":"γ","t":"Συνταξιοδοτικά ταμεία."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":57,"a":"δ","q":"Ποιοι από τους παρακάτω θεωρούνται ιδιώτες επενδυτές;","o":[{"k":"α","t":"Οι ΑΕΠΕΥ κάτω από ορισμένο όριο ιδίων κεφαλαίων και κύκλου εργασιών."},{"k":"β","t":"Πιστωτικά ιδρύματα κάτω από ορισμένο όριο ιδίων κεφαλαίων και κύκλου εργασιών."},{"k":"γ","t":"Ασφαλιστικές επιχειρήσεις κάτω από ορισμένο όριο ιδίων κεφαλαίων και κύκλου εργασιών."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":58,"a":"α","q":"Ποια η σημασία της διάκρισης μεταξύ ιδιωτών και επαγγελματιών πελατών;","o":[{"k":"α","t":"Ο ιδιώτης πελάτης απολαμβάνει μεγαλύτερης προστασίας, ιδίως σε θέματα παροχής πληροφόρησης από την ΑΕΠΕΥ."},{"k":"β","t":"Δεν έχει σημασία η διάκριση."},{"k":"γ","t":"Ο ιδιώτης εξασφαλίζει ευνοϊκότερους οικονομικούς όρους από την ΑΕΠΕΥ κατά τη σύναψη της σχετικής σύμβασης."},{"k":"δ","t":"Ο ιδιώτης πελάτης έχει προτεραιότητα κατά την εκτέλεση εντολών έναντι του επαγγελματία πελάτη."}]},{"n":59,"a":"γ","q":"Μπορεί ιδιώτης πελάτης να αλλάξει κατηγορία;","o":[{"k":"α","t":"Δεν μπορεί σε καμιά περίπτωση."},{"k":"β","t":"Μπορεί σε κάθε περίπτωση."},{"k":"γ","t":"Μπορεί υπό προϋποθέσεις και διαδικασίες."},{"k":"δ","t":"Μπορεί εφόσον το ζητήσει εγγράφως και η ΑΕΠΕΥ οφείλει να τον αλλάξει κατηγορία."}]},{"n":60,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Ο επαγγελματίας πελάτης δεν μπορεί σε καμία περίπτωση να αντιμετωπισθεί ως ιδιώτης πελάτης."},{"k":"β","t":"Ο επαγγελματίας πελάτης μπορεί να ζητήσει να αντιμετωπισθεί ως ιδιώτης πελάτης και η ΑΕΠΕΥ υποχρεούται δίχως άλλο να τον αντιμετωπίσει ως ιδιώτη πελάτη."},{"k":"γ","t":"Ο επαγγελματίας πελάτης μπορεί να ζητήσει να αντιμετωπισθεί ως ιδιώτης πελάτης και η ΑΕΠΕΥ δικαιούται να τον αντιμετωπίσει ως ιδιώτη πελάτη εφόσον συναφθεί σχετική σύμβαση ότι ο πελάτης θα αντιμετωπίζεται ως ιδιώτης πελάτης για τους σκοπούς εφαρμογής των κανόνων συμπεριφοράς."},{"k":"δ","t":"Ο επαγγελματίας πελάτης μπορεί να ζητήσει να αντιμετωπισθεί ως ιδιώτης πελάτης και η ΑΕΠΕΥ δικαιούται να τον αντιμετωπίσει ως ιδιώτη πελάτη δίχως άλλη προϋπόθεση."}]},{"n":61,"a":"γ","q":"Μπορεί μια ΑΕΠΕΥ να χορηγήσει δάνειο σε επενδυτή για αγορά κινητών αξιών/χρηματοπιστωτικών μέσων;","o":[{"k":"α","t":"Σε καμία περίπτωση."},{"k":"β","t":"Είναι στη διακριτική ευχέρεια της ΑΕΠΕΥ."},{"k":"γ","t":"Ναι, εφόσον υπάρχει σχετική σύμβαση."},{"k":"δ","t":"Ναι, χωρίς άλλες προϋποθέσεις."}]},{"n":62,"a":"δ","q":"Η κατάρτιση συναλλαγών με πίστωση (margin account) από μέλος του ΧΑ:","o":[{"k":"α","t":"Απαγορεύεται."},{"k":"β","t":"Επιτρέπεται μόνο σε συναλλαγή πακέτου."},{"k":"γ","t":"Επιτρέπεται μόνο από έγκριση της ΕΚ."},{"k":"δ","t":"Επιτρέπεται μόνο έπειτα από γραπτή σύμβαση."}]},{"n":63,"a":"δ","q":"Οι πληροφορίες σχετικά με τη διάρκεια του PRIIP στο τμήμα με τίτλο «Τι είναι αυτό το προιόν;» του εγγράφου βασικών πληροφοριών ,μεταξύ άλλων , περιλαμβάνουν :","o":[{"k":"α","t":"Την ημερομηνία διάθεσης του PRIIP."},{"k":"β","t":"Την επωνυμία του παραγωγού PRIIP."},{"k":"γ","t":"Το επίπεδο κινδύνου του PRIIP."},{"k":"δ","t":"Την ημερομηνία λήξης του PRIIP ή την ένδειξη ότι δεν υπάρχει ημερομηνία λήξης."}]},{"n":64,"a":"γ","q":"Ως ΑΕΠΕΥ νοείται:","o":[{"k":"α","t":"Η επιχείρηση που έχει λάβει άδεια από τις αρμόδιες αρχές οποιουδήποτε Κράτους Μέλους προκειμένου να παρέχει αποκλειστικά και μόνον οποιαδήποτε από τις επενδυτικές υπηρεσίες."},{"k":"β","t":"Η επιχείρηση που έχει λάβει άδεια από τις αρμόδιες αρχές οποιουδήποτε Κράτους Μέλους προκειμένου να παρέχει τουλάχιστον μια επενδυτική υπηρεσία και οποιαδήποτε από τις παρεπόμενες επενδυτικές υπηρεσίες."},{"k":"γ","t":"Η επιχείρηση που έχει λάβει άδεια από την ελληνική ΕΚ προκειμένου να παρέχει τουλάχιστον μια επενδυτική υπηρεσία και οποιαδήποτε από τις παρεπόμενες επενδυτικές υπηρεσίες."},{"k":"δ","t":"Η επιχείρηση που έχει λάβει άδεια από την ελληνική ΕΚ προκειμένου να παρέχει αποκλειστικά και μόνον οποιαδήποτε από τις επενδυτικές υπηρεσίες."}]},{"n":65,"a":"β","q":"Όταν η παρεχόμενη από την ΑΕΠΕΥ πληροφόρηση στους πελάτες περιλαμβάνει ένδειξη προηγούμενων επιδόσεων ενός χρηματοπιστωτικού μέσου:","o":[{"k":"α","t":"Η ένδειξη αυτή δύναται να αποτελεί το προεξέχον στοιχείο της σχετικής ανακοίνωσης."},{"k":"β","t":"Η ένδειξη αυτή δεν πρέπει να αποτελεί το προεξέχον στοιχείο της σχετικής ανακοίνωσης."},{"k":"γ","t":"Η πληροφόρηση πρέπει να περιλαμβάνει κατάλληλες πληροφορίες για τις επιδόσεις τουλάχιστον κατά το αμέσως προηγούμενο εξάμηνο."},{"k":"δ","t":"Εάν η ένδειξη βασίζεται σε αριθμητικά στοιχεία εκφρασμένα σε νόμισμα διαφορετικό από εκείνο του κράτους μέλους στο οποίο είναι εγκατεστημένος ο ιδιώτης πελάτης, πρέπει να γίνεται με σαφήνεια η μετατροπή στο αντίστοιχο νόμισμα."}]},{"n":66,"a":"β","q":"Οι ΑΕΠΕΥ καταθέτουν χρηματοπιστωτικά μέσα πελατών τους σε τρίτο, μόνον σε δικαιοδοσία: I. Όπου η φύλαξη χρηματοπιστωτικών μέσων για λογαριασμό άλλου προσώπου υπόκειται σε ειδικές ρυθμίσεις και εποπτεία. II. Όπου ο τρίτος υπόκειται σε συγκεκριμένη ρύθμιση και εποπτεία. III. Όπου ο τρίτος διατηρεί την καταστατική του έδρα. IV. Η οποία αποτελεί έδαφος της Ε.Ε. και όπου η φύλαξη χρηματοπιστωτικών μέσων για λογαριασμό άλλου προσώπου υπόκειται σε ειδικές ρυθμίσεις και εποπτεία.","o":[{"k":"α","t":"I, II , III και IV."},{"k":"β","t":"I και II."},{"k":"γ","t":"III και IV."},{"k":"δ","t":"II και III."}]},{"n":67,"a":"δ","q":"Όταν η ΑΕΠΕΥ λαμβάνει οδηγίες για την παροχή επενδυτικών υπηρεσιών για λογαριασμό πελάτη μέσω άλλης επιχείρησης επενδύσεων:","o":[{"k":"α","t":"Η ΑΕΠΕΥ δεν αρκεί να βασίζεται στις σχετικές με τον πελάτη πληροφορίες που της γνωστοποιεί η μεσολαβούσα επιχείρηση επενδύσεων, αλλά οφείλει να προβεί και στο δικό της έλεγχο συμβατότητας."},{"k":"β","t":"Η ΑΕΠΕΥ υποχρεούται να βασίζεται στις πληροφορίες που παρέχουν οι πελάτες της."},{"k":"γ","t":"Η ΑΕΠΕΥ παραμένει υπεύθυνη για την πληρότητα και την ακρίβεια των διαβιβαζόμενων πληροφοριών."},{"k":"δ","t":"Η επιχείρηση επενδύσεων μέσω της οποίας λαμβάνονται οι οδηγίες, παραμένει υπεύθυνη για την πληρότητα και την ακρίβεια των διαβιβαζόμενων πληροφοριών."}]},{"n":68,"a":"γ","q":"Ποια πληροφορία δεν είναι υποχρεωμένη μια ΑΕΠΕΥ να παρέχει στους ιδιώτες πελάτες της;","o":[{"k":"α","t":"Τους τρόπους επικοινωνίας που πρέπει να χρησιμοποιούνται μεταξύ της ΑΕΠΕΥ και του πελάτη."},{"k":"β","t":"Την επωνυμία και τη διεύθυνση της ΑΕΠΕΥ."},{"k":"γ","t":"Τα ονόματα των μελών του ΔΣ της ΑΕΠΕΥ."},{"k":"δ","t":"Συνοπτική περιγραφή της πολιτικής που εφαρμόζει η ΑΕΠΕΥ όσον αφορά τις συγκρούσεις συμφερόντων."}]},{"n":69,"a":"γ","q":"Ποια πληροφορία δεν είναι υποχρεωμένη μια ΑΕΠΕΥ να παρέχει στους ιδιώτες πελάτες της;","o":[{"k":"α","t":"Τους τρόπους επικοινωνίας που πρέπει να χρησιμοποιούνται μεταξύ της ΑΕΠΕΥ και του πελάτη."},{"k":"β","t":"Την επωνυμία και τη διεύθυνση της ΑΕΠΕΥ."},{"k":"γ","t":"Τα ονόματα των μετόχων της."},{"k":"δ","t":"Συνοπτική περιγραφή της πολιτικής που εφαρμόζει η ΑΕΠΕΥ όσον αφορά τις συγκρούσεις συμφερόντων."}]},{"n":70,"a":"β","q":"Οι ΑΕΠΕΥ και τα πιστωτικά ιδρύματα μπορούν να αναθέτουν σε τρίτον επιχειρησιακές λειτουργίες:","o":[{"k":"α","t":"Σε συνεχή βάση."},{"k":"β","t":"Σε συνεχή βάση εφόσον έχουν λάβει μέτρα για την αποφυγή αδικαιολόγητης ανάληψης πρόσθετου λειτουργικού κινδύνου."},{"k":"γ","t":"Σε περιοδική μόνο βάση."},{"k":"δ","t":"Σε καμία περίπτωση."}]},{"n":71,"a":"δ","q":"Σύμφωνα με τον Ν. 4514/2018, οι ΑΕΠΕΥ οφείλουν να αναγράφουν ότι εποπτεύονται από την Επιτροπή Κεφαλαιαγοράς καθώς και τον αριθμό της άδειας λειτουργίας τους:","o":[{"k":"α","t":"Σε οποιαδήποτε ανάρτηση στα κοινωνικά δίκτυα."},{"k":"β","t":"Σε κάθε έντυπο ή ηλεκτρονικό μέσο."},{"k":"γ","t":"Μόνο στις έντυπες δημοσιεύσεις και ανακοινώσεις."},{"k":"δ","t":"Σε κάθε έντυπο, δημοσίευση, ανακοίνωση, διαφήμιση, καθώς και στην ιστοσελίδα τους."}]},{"n":72,"a":"β","q":"Οι ΑΕΠΕΥ:","o":[{"k":"α","t":"Οφείλουν να αποτρέπουν τη χρησιμοποίηση χρηματοπιστωτικών μέσων πελατών για ίδιο λογαριασμό σε κάθε περίπτωση."},{"k":"β","t":"Οφείλουν να αποτρέπουν τη χρησιμοποίηση χρηματοπιστωτικών μέσων πελατών για ίδιο λογαριασμό, εκτός αν ο πελάτης έχει δώσει τη ρητή συγκατάθεσή του."},{"k":"γ","t":"Δύνανται να χρησιμοποιούν τα χρηματοπιστωτικά μέσα πελατών για ίδιο λογαριασμό σε κάθε περίπτωση."},{"k":"δ","t":"Δύνανται να χρησιμοποιούν τα χρηματοπιστωτικά μέσα πελατών για λογαριασμό τρίτου προσώπου σε κάθε περίπτωση."}]},{"n":73,"a":"γ","q":"Οι ΑΕΠΕΥ υποχρεούνται να τηρούν όλα τα αρχεία που απαιτούνται σύμφωνα με το Ν. 4514/2018 τουλάχιστο για:","o":[{"k":"α","t":"Δύο έτη."},{"k":"β","t":"Τρία έτη."},{"k":"γ","t":"Πέντε έτη και, αν ζητηθεί από την ΕΚ, επτά έτη."},{"k":"δ","t":"Δέκα έτη."}]},{"n":74,"a":"γ","q":"Οι ΑΕΠΕΥ, όταν κατέχουν κεφάλαια πελατών:","o":[{"k":"α","t":"Υποχρεούνται να μη χρησιμοποιούν τα κεφάλαια των επενδυτών σε κάθε περίπτωση."},{"k":"β","t":"Δύνανται να χρησιμοποιούν τα κεφάλαια των επενδυτών σε κάθε περίπτωση."},{"k":"γ","t":"Υποχρεούνται να μη χρησιμοποιούν τα κεφάλαια των επενδυτών, εκτός από την περίπτωση των πιστωτικών ιδρυμάτων."},{"k":"δ","t":"Δύνανται να χρησιμοποιούν τα κεφάλαια των επενδυτών για συγκεκριμένες επενδύσεις."}]},{"n":75,"a":"α","q":"Ποια από τα παρακάτω είναι ορθά; I. Στην άδεια λειτουργίας ΑΕΠΕΥ απαριθμούνται όλες οι επενδυτικές υπηρεσίες που μπορεί να παρέχει. II. Η άδεια λειτουργίας ΑΕΠΕΥ έχει ισχύ για συγκεκριμένο χρονικό διάστημα. III. Η ΑΕΠΕΥ μπορεί να υποβάλει αίτηση επεκτάσεως της άδειας λειτουργίας. IV. Η ΑΕΠΕΥ-ανάδοχος μπορεί να παρέχει και τραπεζικές υπηρεσίες.","o":[{"k":"α","t":"Ι και ΙΙΙ μόνο."},{"k":"β","t":"Ι, II και III μόνο."},{"k":"γ","t":"Ι και IV μόνο."},{"k":"δ","t":"ΙI και IΙΙ μόνο."}]},{"n":76,"a":"δ","q":"Ποιος φορέας είναι αρμόδιος για τη χορήγηση άδειας σύστασης σε ΑΕΠΕΥ;","o":[{"k":"α","t":"Η ΕΚ."},{"k":"β","t":"Η ΕΧΑΕ."},{"k":"γ","t":"Η ΤτΕ."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":77,"a":"β","q":"Για την παροχή επενδυτικών υπηρεσιών από ΑΕ απαιτείται σχετική άδεια λειτουργίας:","o":[{"k":"α","t":"Από το ΧΑ."},{"k":"β","t":"Από την ΕΚ."},{"k":"γ","t":"Από το ΧΑ και την ΕΚ."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":78,"a":"γ","q":"Σε μια τυπική συμφωνία αναδοχής, η ανάδοχος εταιρεία:","o":[{"k":"α","t":"Αγοράζει μετοχές της εκδότριας από το επενδυτικό κοινό μέσω του δικτύου του αναδόχου."},{"k":"β","t":"Πουλά τις μετοχές στην εκδότρια."},{"k":"γ","t":"Αναλαμβάνει όλο τον κίνδυνο μη πώλησης των μετοχών στην προσφερόμενη τιμή."},{"k":"δ","t":"Συμφωνεί να βοηθήσει την εκδότρια να πωλήσει την έκδοση στο κοινό, αλλά δεν αγοράζει τις μετοχές."}]},{"n":79,"a":"γ","q":"Η ΑΕΠΕΥ οφείλει να έχει δύο τουλάχιστον διευθυντικά στελέχη, τα οποία διαθέτουν πιστοποιητικό καταλληλότητας:","o":[{"k":"α","t":"Τύπου Α1."},{"k":"β","t":"Τύπου Α2."},{"k":"γ","t":"Τύπου Β."},{"k":"δ","t":"Τύπου Γ."}]},{"n":80,"a":"γ","q":"Ποιες από τις παρακάτω υπηρεσίες πρέπει να προσφέρονται από τις ΑΕΠΕΥ μέσω επαγγελματικά πιστοποιημένων υπαλλήλων; I. Λήψη, διαβίβαση εντολών και εκτέλεση εντολών. II. Αγορά παραγώγων προϊόντων από το ΧΑ. III. Καταθέσεις ταμιευτηρίου. IV. Αγορά μετοχών από ΧΑ.","o":[{"k":"α","t":"I και III μόνο."},{"k":"β","t":"I και II μόνο."},{"k":"γ","t":"I, II και IV μόνο."},{"k":"δ","t":"Ι, ΙΙ, III και IV."}]},{"n":81,"a":"γ","q":"Όταν η ακολουθούμενη πολιτική εκτέλεσης εντολών προβλέπει τη δυνατότητα εκτέλεσης εντολών εκτός ρυθμιζόμενων αγορών, Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ) ή Μηχανισμού Οργανωμένης Διαπραγμάτευσης (ΜΟΔ):","o":[{"k":"α","t":"Οι ΑΕΠΕΥ δεν υποχρεούνται να ενημερώσουν τους πελάτες τους πριν εκτελέσουν την εντολή."},{"k":"β","t":"Οι ΑΕΠΕΥ ενημερώνουν σχετικά τους πελάτες τους πριν εκτελέσουν την εντολή."},{"k":"γ","t":"Οι ΑΕΠΕΥ εξασφαλίζουν τη ρητή συναίνεση των πελατών πριν εκτελέσουν την εντολή εκτός τόπου διαπραγμάτευσης."},{"k":"δ","t":"Η πολιτική εκτέλεσης εντολών δεν μπορεί να προβλέπει εκτέλεση εντολών εκτός ρυθμιζόμενων αγορών ή ΠΜΔ ή ΜΟΔ."}]},{"n":82,"a":"α","q":"Οι ΑΕΠΕΥ οφείλουν να καταρτίζουν πολιτική εκτέλεσης εντολών:","o":[{"k":"α","t":"Για κάθε κατηγορία χρηματοπιστωτικού μέσου, η οποία περιλαμβάνει τους τόπους, οι οποίοι επιτρέπουν στις ΑΕΠΕΥ να επιτυγχάνουν συστηματικά το βέλτιστο δυνατό αποτέλεσμα, καθώς και τους παράγοντες που επηρεάζουν την επιλογή των τόπων διαπραγμάτευσης."},{"k":"β","t":"Για κάθε κατηγορία χρηματοπιστωτικού μέσου, η οποία περιλαμβάνει τις ρυθμιζόμενες αγορές, οι οποίες επιτρέπουν στις ΑΕΠΕΥ να επιτυγχάνουν συστηματικά το βέλτιστο δυνατό αποτέλεσμα, καθώς και τους παράγοντες που επηρεάζουν την επιλογή των εν λόγω ρυθμιζόμενων αγορών."},{"k":"γ","t":"Για το σύνολο των χρηματοπιστωτικών μέσων εν γένει, το οποίο περιλαμβάνει τους τόπους, οι οποίοι επιτρέπουν στις ΑΕΠΕΥ να επιτυγχάνουν συστηματικά το βέλτιστο δυνατό αποτέλεσμα, καθώς και τους παράγοντες που επηρεάζουν την επιλογή των τόπων διαπραγμάτευσης."},{"k":"δ","t":"Για μετοχές, oι οποίες περιλαμβάνουν τους τόπους, οι οποίοι επιτρέπουν στις ΑΕΠΕΥ να επιτυγχάνουν συστηματικά το βέλτιστο δυνατό αποτέλεσμα, καθώς και τους παράγοντες που επηρεάζουν την επιλογή των τόπων διαπραγμάτευσης."}]},{"n":83,"a":"γ","q":"Οι ΑΕΠΕΥ οφείλουν:","o":[{"k":"α","t":"Απλώς να παρέχουν στους πελάτες τις κατάλληλες πληροφορίες σχετικά με την πολιτική εκτέλεσης εντολών που ακολουθούν πριν την παροχή υπηρεσιών σε αυτούς."},{"k":"β","t":"Να παρέχουν στους πελάτες τις κατάλληλες πληροφορίες σχετικά με την πολιτική εκτέλεσης εντολών που ακολουθούν πριν την παροχή υπηρεσιών σε αυτούς, και να είναι σε θέση να τεκμηριώσουν στους πελάτες τους, εφόσον αυτοί το ζητήσουν, ότι οι εντολές τους εκτελέσθηκαν σύμφωνα με την πολιτική εκτέλεσης εντολών που ακολουθούν."},{"k":"γ","t":"Να παρέχουν στους πελάτες τις κατάλληλες πληροφορίες σχετικά με την πολιτική εκτέλεσης εντολών που ακολουθούν πριν την παροχή υπηρεσιών σε αυτούς και να λαμβάνουν την προηγούμενη συναίνεσή τους σχετικά με την πολιτική εκτέλεσης εντολών, και να είναι σε θέση να τεκμηριώσουν στους πελάτες τους, εφόσον αυτοί το ζητήσουν, ότι οι εντολές τους εκτελέσθηκαν σύμφωνα με την πολιτική εκτέλεσης εντολών που ακολουθούν."},{"k":"δ","t":"Να παρέχουν στους πελάτες τις κατάλληλες πληροφορίες σχετικά με την πολιτική εκτέλεσης εντολών που ακολουθούν πριν την παροχή υπηρεσιών σε αυτούς και να λαμβάνουν την προηγούμενη συναίνεσή τους σχετικά με την πολιτική εκτέλεσης εντολών, δίχως να υποχρεούνται οι ΑΕΠΕΥ να είναι σε θέση να τεκμηριώσουν εκ των υστέρων την εκτέλεση των εντολών σύμφωνα με την πολιτική εκτέλεσης εντολών που ακολουθούν."}]},{"n":84,"a":"α","q":"Οι ΑΕΠΕΥ:","o":[{"k":"α","t":"Οφείλουν να ενημερώνουν τους πελάτες τους, ανάλογα με την κατηγοριοποίησή τους, σχετικά με τις παρεχόμενες υπηρεσίες, τη φύση και κινδύνους των χρηματοπιστωτικών μέσων, τους τόπους εκτέλεσης και τις χρεώσεις."},{"k":"β","t":"Δεν έχουν καμία υποχρέωση πληροφόρησης."},{"k":"γ","t":"Οφείλουν να ενημερώνουν τους πελάτες τους, ανάλογα με την κατηγοριοποίησή τους, μόνον αναφορικά με τη φύση και κινδύνους των χρηματοπιστωτικών μέσων."},{"k":"δ","t":"Οφείλουν να ενημερώνουν αποκλειστικά και μόνον τους ιδιώτες πελάτες τους, ανάλογα με την κατηγοριοποίησή τους, σχετικά με τις παρεχόμενες υπηρεσίες, τη φύση και κινδύνους των χρηματοπιστωτικών μέσων, τους τόπους εκτέλεσης και τις χρεώσεις."}]},{"n":85,"a":"α","q":"Η συμμετοχή ΑΕΠΕΥ στο Συνεγγυητικό Κεφάλαιο:","o":[{"k":"α","t":"Είναι υποχρεωτική, εκτός αν έχει λάβει άδεια λειτουργίας σε άλλο Κράτος-Μέλος της EE με κάλυψη ισοδύναμη αυτής του Συνεγγυητικού."},{"k":"β","t":"Είναι υποχρεωτική, ανεξαρτήτως αν έχουν λάβει άδεια λειτουργίας στην Ελλάδα, σε άλλο Κράτος-Μέλος της EE ή σε τρίτη χώρα."},{"k":"γ","t":"Είναι προαιρετική."},{"k":"δ","t":"Είναι προαιρετική, εκτός αν η EK διαπιστώσει σημαντικά προβλήματα λειτουργίας που θέτουν σε κίνδυνο τους επενδυτές."}]},{"n":86,"a":"δ","q":"Οι ΑΕΕΔ επιτρέπεται να παρέχουν επενδυτικές υπηρεσίες που συνίστανται:","o":[{"k":"α","t":"Στη λήψη και διαβίβαση εντολών και στην εκτέλεση εντολών επί κινητών αξιών και μεριδίων που εκδίδονται από οργανισμούς συλλογικών επενδύσεων."},{"k":"β","t":"Στη λήψη και διαβίβαση εντολών επί κινητών αξιών και μεριδίων που εκδίδονται από οργανισμούς συλλογικών επενδύσεων."},{"k":"γ","t":"Στη λήψη και διαβίβαση εντολών επί κινητών αξιών και μεριδίων που εκδίδονται από οργανισμούς συλλογικών επενδύσεων και στη διαπραγμάτευση για ίδιο λογαριασμό."},{"k":"δ","t":"Στη λήψη και διαβίβαση εντολών επί κινητών αξιών και μεριδίων που εκδίδονται από οργανισμούς συλλογικών επενδύσεων και στην παροχή επενδυτικών συμβουλών που αφορούν κινητές αξίες και μερίδια που εκδίδονται από οργανισμούς συλλογικών επενδύσεων."}]},{"n":87,"a":"β","q":"Ποια από τα ακόλουθα ισχύουν για την έρευνα στον τομέα των επενδύσεων και τη χρηματοοικονομική ανάλυση;","o":[{"k":"α","t":"Είναι επενδυτική υπηρεσία και δραστηριότητα."},{"k":"β","t":"Είναι παρεπόμενη επενδυτ σία;","o":[{"k":"α","t":"Η λήψη και εκτέλεση εντολών για λογαριασμό πελατών."},{"k":"β","t":"Η παροχή πιστώσεων ή δανείων σε επενδυτή προς διενέργεια συναλλαγής σε ένα ή περισσότερα χρηματοπιστωτικά μέσα, στην οποία μεσολαβεί η επιχείρηση επενδύσεων, η οποία παρέχει την πίστωση ή το δάνειο."},{"k":"γ","t":"Η παροχή επενδυτικών συμβουλών, η οποία συνίσταται στην παροχή προσωπικών συμβουλών σε πελάτη, είτε κατόπιν αιτήσεως του είτε με πρωτοβουλία της επιχείρησης επενδύσεων, σχετικά με μία ή περισσότερες συναλλαγές που αφορούν χρηματοπιστωτικά μέσα."},{"k":"δ","t":"Η διαχείριση χαρτοφυλακίων, η οποία συνίσταται στη διαχείριση, κατά τη διακριτική ευχέρεια της επιχείρησης επενδύσεων, χαρτοφυλακίων πελατών, στο πλαίσιο εντολής τους, που περιλαμβάνουν ένα ή περισσότερα χρηματοπιστωτικά μέσα."}]},{"n":97,"a":"δ","q":"Στην παρεπόμενη υπηρεσία της φύλαξης και διαχείρισης χρηματοπιστωτικών μέσων για λογαριασμό πελατών περιλαμβάνονται:","o":[{"k":"α","t":"Η θεματοφυλακή."},{"k":"β","t":"Η διαχείριση χρηματικών διαθεσίμων."},{"k":"γ","t":"Υπηρεσίες παρεχόμενων ασφαλειών."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":98,"a":"β","q":"Σύμφωνα με το Ν. 4514/2018 η θεματοφυλακή είναι:","o":[{"k":"α","t":"Επενδυτική υπηρεσία."},{"k":"β","t":"Παρεπόμενη επενδυτική υπηρεσία."},{"k":"γ","t":"Παρεπόμενη επενδυτική υπηρεσία μόνον εφόσον συνδέεται με την παροχή επενδυτικών υπηρεσιών."},{"k":"δ","t":"Εναλλακτική επενδυτική υπηρεσία η οποία παρέχεται εφόσον έχει ληφθεί άδεια της ΕΚ."}]},{"n":99,"a":"β","q":"Η παροχή πιστώσεων ή δανείων σε επενδυτή προς διενέργεια συναλλαγής σε ένα ή περισσότερα χρηματοπιστωτικά μέσα αποτελεί:","o":[{"k":"α","t":"Επενδυτική υπηρεσία."},{"k":"β","t":"Παρεπόμενη επενδυτική υπηρεσία."},{"k":"γ","t":"Αρμοδιότητα της ΕΚ."},{"k":"δ","t":"Αρμοδιότητα της ΤτΕ."}]},{"n":100,"a":"δ","q":"Η παροχή πιστώσεων ή δανείων σε επενδυτή για αγορά αξιών μέσω του ΧΑ είναι:","o":[{"k":"α","t":"Επενδυτική υπηρεσία, την οποία έχουν το δικαίωμα να παρέχουν ΑΕΠΕΥ, πιστωτικά ιδρύματα και ΑΕΕΔ με άδεια της ΕΚ."},{"k":"β","t":"Επενδυτική υπηρεσία, την οποία έχουν το δικαίωμα να παρέχουν ΑΕΠΕΥ και πιστωτικά ιδρύματα με άδεια της ΕΚ."},{"k":"γ","t":"Παρεπόμενη υπηρεσία, την οποία έχουν το δικαίωμα να παρέχουν ΑΕΠΕΥ, πιστωτικά ιδρύματα και ΑΕΕΔ με άδεια της ΕΚ."},{"k":"δ","t":"Παρεπόμενη υπηρεσία, την οποία έχουν το δικαίωμα να παρέχουν ΑΕΠΕΥ με άδεια της ΕΚ."}]},{"n":101,"a":"α","q":"Τα δικαιώματα εκπομπής ρύπων είναι:","o":[{"k":"α","t":"Χρηματοπιστωτικά μέσα."},{"k":"β","t":"Παράγωγα."},{"k":"γ","t":"Κινητές αξίες που περιλαμβάνουν δικαιώματα προαίρεσης σε μονάδες εκπομπής ρύπων."},{"k":"δ","t":"Παράγωγα με υποκείμενη αξία μονάδες εκπομπής ρύπων."}]},{"n":102,"a":"γ","q":"Αν Α.Ε.Π.Ε.Υ. ενεργεί ως κατασκευαστής χρηματοπιστωτικού μέσου και σε σχέση με αυτό λαμβάνουν χώρα κρίσιμα γεγονότα που θα μπορούσαν να επηρεάσουν τον πιθανό κίνδυνο ή τις εκτιμώμενες αποδόσεις του χρηματοπιστωτικού μέσου (π.χ. κίνδυνοι σε σχέση με τη φερεγγυότητα ορισμένων εκδοτών των οποίων οι τίτλοι ή οι εγγυήσεις μπορεί να επηρεάσουν την απόδοση του χρηματοπιστωτικού μέσου), ένα κατάλληλο μέτρο που λαμβάνει η Α.Ε.Π.Ε.Υ. είναι:","o":[{"k":"α","t":"Η ανάθεση της διαχείρισης κινδύνου των σχετικών θέσεων των πελατών σε σύστημα περιθωρίου ασφάλισης ή κεντρικού αντισυμβαλλομένου."},{"k":"β","t":"Η εξασφάλιση των υποχρεώσεων του πιστωτικού ιδρύματος ως κατασκευαστή με πρόσθετες εγγυήσεις ή ασφάλειες."},{"k":"γ","t":"Η διακοπή της περαιτέρω έκδοσης του χρηματοπιστωτικού μέσου."},{"k":"δ","t":"Η διακοπή της περαιτέρω έκδοσης του χρηματοπιστωτικού μέσου και η σταδιακή ρευστοποίηση των σχετικών θέσεων των πελατών κατόπιν ενημέρωσής τους."}]},{"n":103,"a":"β","q":"Ποια από τις ακόλουθες αποτελεί παρεπόμενη υπηρεσία;","o":[{"k":"α","t":"Η λήψη και εκτέλεση εντολών για λογαριασμό πελατών."},{"k":"β","t":"Η παροχή συμβουλών σε επιχειρήσεις σχετικά με τη διάρθρωση του κεφαλαίου τους, την κλαδική στρατηγική και συναφή θέματα."},{"k":"γ","t":"Η παροχή επενδυτικών συμβουλών, η οποία σ ηματοπιστωτικών μέσων χωρίς δέσμευση ανάληψης."},{"k":"β","t":"Η παροχή υπηρεσιών σχετιζόμενων με την αναδοχή."},{"k":"γ","t":"Η θεματοφυλακή."},{"k":"δ","t":"Η παροχή υπηρεσιών ξένου συναλλάγματος εφόσον συνδέονται με την παροχή επενδυτικών υπηρεσιών."}]},{"n":108,"a":"α","q":"Ποια από τα ακόλουθα ισχύουν για την παροχή υπηρεσιών σχετιζόμενων με την αναδοχή;","o":[{"k":"α","t":"Είναι παρεπόμενη επενδυτική υπηρεσία."},{"k":"β","t":"Είναι επενδυτική υπηρεσία."},{"k":"γ","t":"Είναι παρεπόμενη επενδυτική υπηρεσία, η παροχή της οποίας επιτρέπεται μόνο από ΑΕΠΕΥ ή πιστωτικά ιδρύματα."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":109,"a":"α","q":"Οι επιχειρήσεις επενδύσεων υποχρεούνται να συμμορφώνονται με την πολιτική της «βέλτιστης εκτέλεσης» (best execution) εντολών που καταρτίζουν:","o":[{"k":"α","t":"Για ιδιώτες και για επαγγελματίες πελάτες."},{"k":"β","t":"Για ιδιώτες πελάτες."},{"k":"γ","t":"Για επαγγελματίες πελάτες."},{"k":"δ","t":"Για κάθε πελάτη, εφόσον ο ίδιος το ζητήσει."}]},{"n":110,"a":"δ","q":"Ως υποχρέωση «βέλτιστης εκτέλεσης» των εντολών των πελατών νοείται:","o":[{"k":"α","t":"Η υποχρέωση των ΑΕΠΕΥ να λαμβάνουν επαρκή μέτρα, ώστε να επιτυγχάνουν, κατά την εκτέλεση εντολών, το βέλτιστο αποτέλεσμα για τον πελάτη, λαμβάνοντας υπόψη την τιμή εκτέλεσης της εντολής."},{"k":"β","t":"Η υποχρέωση των ΑΕΠΕΥ να λαμβάνουν κάθε επαρκή μέτρα, ώστε να επιτυγχάνουν, κατά την εκτέλεση εντολών σε χρηματοπιστωτικά μέσα που διαπραγματεύονται μόνον σε ρυθμιζόμενη αγορά, το βέλτιστο αποτέλεσμα για τον πελάτη, λαμβάνοντας υπόψη την τιμή, το κόστος, την ταχύτητα, την πιθανότητα εκτέλεσης και διακανονισμού, τον όγκο, τη φύση και οποιονδήποτε άλλον παράγοντα που σχετίζεται με την εκτέλεση της εντολής."},{"k":"γ","t":"Η υποχρέωση των ΑΕΠΕΥ να λαμβάνουν επαρκή μέτρα, ώστε να επιτυγχάνουν, κατά την εκτέλεση εντολών σε χρηματοπιστωτικά μέσα που διαπραγματεύονται σε ρυθμιζόμενη αγορά ή/και Πολυμερή Μηχανισμό Διαπραγμάτευσης (ΠΜΔ), το βέλτιστο αποτέλεσμα για τον πελάτη, λαμβάνοντας υπόψη την τιμή, το κόστος, την ταχύτητα, την πιθανότητα εκτέλεσης και διακανονισμού, τον όγκο, τη φύση και οποιονδήποτε άλλον παράγοντα που σχετίζεται με την εκτέλεση της εντολής."},{"k":"δ","t":"Η υποχρέωση των ΑΕΠΕΥ να λαμβάνουν επαρκή μέτρα, ώστε να επιτυγχάνουν, κατά την εκτέλεση εντολών, το βέλτιστο αποτέλεσμα για τον πελάτη, λαμβάνοντας υπόψη την τιμή, το κόστος, την ταχύτητα, την πιθανότητα εκτέλεσης και διακανονισμού, τον όγκο, τη φύση και οποιονδήποτε άλλον παράγοντα που σχετίζεται με την εκτέλεση της εντολής."}]},{"n":111,"a":"δ","q":"Ποιοι παράγοντες λαμβάνονται υπόψη προκειμένου να επιτευχθεί η βέλτιστη εκτέλεση (best execution); I. Η τιμή. II. Το κόστος. III. Η ταχύτητα εκτέλεσης. IV. Ο όγκος.","o":[{"k":"α","t":"Ι, ΙΙ."},{"k":"β","t":"Ι, ΙΙ, ΙΙΙ."},{"k":"γ","t":"Ι, ΙΙΙ, ΙV."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ, ΙV."}]},{"n":112,"a":"γ","q":"Κατά την εκτέλεση εντολών για λογαριασμό των πελατών, ποιος/ποιοι παράγοντες λαμβάνονται υπόψη προκειμένου να επιτευχθεί η βέλτιστη εκτέλεση (best execution);","o":[{"k":"α","t":"Η τιμή."},{"k":"β","t":"Ο όγκος."},{"k":"γ","t":"Η τιμή, ο όγκος και επιπλέον η ταχύτητα εκτέλεσης, το κόστος, καθώς και η φύση της εντολής."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":113,"a":"γ","q":"Σε τι συνίσταται η πολιτική «βέλτιστης εκτέλεσης» εντολών;","o":[{"k":"α","t":"Στη διασφάλιση ευνοϊκών όρων, όπως η αγορά ή πώληση με τη μέθοδο της δημοπρασίας."},{"k":"β","t":"Την εκκαθάριση συναλλαγών εκτός ρυθμιζόμενης αγοράς."},{"k":"γ","t":"Τη διασφάλιση, μεταξύ άλλων, της καλύτερης τιμής αγοράς ή πώλησης."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":114,"a":"γ","q":"Ποια από τα ακόλουθα εμπίπτουν στην έννοια των χρηματοπιστωτικών μέσων κατά τον Ν. 4514/2018;","o":[{"k":"α","t":"Tα μη δεκτικά διαπραγμάτευσης μερίδια εταιριών περιορισμένης ευθύνης."},{"k":"β","t":"Οι ασφαλίσεις ζωής που συνδέονται με επενδύσεις."},{"k":"γ","t":"Τα αποδεικτικά κατάθεσης."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":115,"a":"δ","q":"Οι συναλλαγές επί χρηματοπιστωτικών μέσων διακρίνονται σε:","o":[{"k":"α","t":"Χρηματιστηριακές, εξω-χρηματιστηριακές και OTC (over-the-counter)."},{"k":"β","t":"Σύνθετες, εξω-χρηματιστηριακές και εξωτερικοποιημένες."},{"k":"γ","t":"Πρωτογενείς, εξω-χρηματιστηριακές και εσωτερικοποιημένες."},{"k":"δ","t":"Χρηματιστηριακές, εξω-χρηματιστηριακές και εσωτερικοποιημένες."}]},{"n":116,"a":"δ","q":"Ποια από τα ακόλουθα χρηματοπιστωτικά μέσα δεν εμπίπτουν στο πεδίο εφαρμογής του Ν. 4514/2018;","o":[{"k":"α","t":"Το δικαίωμα προαιρέσεως (option) σε μετοχή."},{"k":"β","t":"Η ανταλλαγή χρηματοπιστωτικών μέσων (swap)."},{"k":"γ","t":"Παράγωγα κλιματικών μεταβλητών (weather derivatives)."},{"k":"δ","t":"Αγορά συναλλάγματος."}]},{"n":117,"a":"α","q":"Προκειμένου η ΑΕΠΕΥ να τοποθετήσει κεφάλαια πελατών της σε αναγνωρισμένο Α/Κ διαχείρισης διαθεσίμων:","o":[{"k":"α","t":"Διασφαλίζει τη ρητή συγκατάθεση των πελατών."},{"k":"β","t":"Ζητεί τη σχετική άδεια της ΕΚ."},{"k":"γ","t":"Πραγματοποιεί σχετική δημόσια ανακοίνωση."},{"k":"δ","t":"Ζητεί τη σχετική άδεια της ΕΚ και πραγματοποιεί σχετική δημόσια ανακοίνωση."}]},{"n":118,"a":"β","q":"Όταν οι ΑΕΠΕΥ καταθέτουν κεφάλαια πελατών σε πιστωτικό ίδρυμα, τράπεζα ή Α/Κ διαχείρισης διαθεσίμων του ίδιου ομίλου με την ΑΕΠΕΥ, πρέπει τα κεφάλαια αυτά να μην υπερβαίνουν , στο σύνολο των εν λόγω κεφαλαίων, το ποσοστό του:","o":[{"k":"α","t":"10%."},{"k":"β","t":"20%."},{"k":"γ","t":"25%."},{"k":"δ","t":"30%."}]},{"n":119,"a":"δ","q":"Ποια από τα παρακάτω είναι χρηματοπιστωτικά μέσα σύμφωνα με τον Ν. 4514/2018;","o":[{"k":"α","t":"Συμβόλαια δικαιωμάτων προαίρεσης (options)."},{"k":"β","t":"Συμβόλαια μελλοντικής εκπλήρωσης (futures)."},{"k":"γ","t":"Συμβάσεις ανταλλαγής (swaps)."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":120,"a":"α","q":"Ποια από τα ακόλουθα χρηματοπιστωτικά μέσα εμπίπτουν στο πεδίο εφαρμογής του Ν. 4514/2018;","o":[{"k":"α","t":"Αγορά και πώληση αμοιβαίων κεφαλαίων διαχείρισης διαθεσίμων."},{"k":"β","t":"Αγορά δολαρίων έναντι ευρώ."},{"k":"γ","t":"Προθεσμιακά προϊόντα κλιμακούμενου επιτοκίου."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":121,"a":"β","q":"Ποια από τα ακόλουθα είναι αληθή σύμφωνα με τον Ν. 4514/2018: I. Η παροχή πιστώσεων για διενέργεια συναλλαγών σε χρηματοπιστωτικά μέσα είναι επενδυτική υπηρεσία. ΙΙ. Η παροχή υπηρεσιών σχετιζομένων με την αναδοχή είναι επενδυτική υπηρεσία. ΙΙΙ.Η λειτουργία πολυμερούς μηχανισμού διαπραγμάτευσης είναι παρεπόμενη επενδυτική υπηρεσία. ΙV. Η τοποθέτηση χρηματοπιστωτικών μέσων χωρίς δέσμευση ανάληψης είναι επενδυτική υπηρεσία.","o":[{"k":"α","t":"ΙΙΙ μόνο."},{"k":"β","t":"ΙV μόνο."},{"k":"γ","t":"ΙΙ, ΙΙΙ και ΙV."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":122,"a":"β","q":"Ποια από τα ακόλουθα είναι αληθή σύμφωνα με τον Ν. 4514/2018: Ι. Οι επενδυτικές συμβουλές είναι επενδυτική υπηρεσία. ΙΙ. Η τοποθέτηση χρηματοπιστωτικών μέσων με δέσμευση ανάληψης είναι επενδυτική υπηρεσία. ΙΙΙ. Η συμβουλευτική (μη-διακριτική) διαχείριση χαρτοφυλακίου είναι παρεπόμενη επενδυτική υπηρεσία. ΙV. Η παροχή υπηρεσιών χρηματοοικονομικής ανάλυσης είναι παρεπόμενη επενδυτική υπηρεσία.","o":[{"k":"α","t":"Ι, ΙΙ και ΙΙΙ."},{"k":"β","t":"Ι, ΙΙ και ΙV."},{"k":"γ","t":"ΙΙ, ΙΙΙ και ΙV."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":123,"a":"α","q":"Η παροχή πιστώσεων ή δανείων για διενέργεια συναλλαγών σε χρηματοπιστωτικά μέσα είναι παρεπόμενη επενδυτική υπηρεσία σύμφωνα με τον Ν. 4514/2018. Αυτό σημαίνει:","o":[{"k":"α","t":"Η ΑΕΠΕΥ / το πιστωτικό ίδρυμα μπορεί να παρέχει δάνεια για αγορά μετοχών με κάλυμμα ένα χαρτοφυλάκιο ασφαλείας."},{"k":"β","t":"Η ΑΕΠΕΥ / το πιστωτικό ίδρυμα μπορεί να παρέχει δάνεια κεφαλαίου κίνησης."},{"k":"γ","t":"Η ΑΕΠΕΥ / το πιστωτικό ίδρυμα μπορεί να παρέχει οποιαδήποτε μορφή δανείου με κάλυψη χρηματοπιστωτικών μέσων."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":124,"a":"α","q":"Ποια από τα παρακάτω είναι χρηματοπιστωτικά μέσα χρηματαγοράς στο πλαίσιο της εφαρμογής του Ν. 4514/2018; Ι. Τα έντοκα γραμμάτια του Δημοσίου. ΙΙ. Τα αποδεικτικά καταθέσεων. ΙΙΙ. Οι ομολογίες. ΙV. Οι μετοχές.","o":[{"k":"α","t":"Ι και ΙΙ μόνο."},{"k":"β","t":"ΙΙ και ΙΙΙ μόνο."},{"k":"γ","t":"Ι και ΙV μόνο."},{"k":"δ","t":"ΙV και ΙΙ μόνο."}]},{"n":125,"a":"δ","q":"Οι ΑΕΠΕΥ θεσπίζουν ειδικές ρυθμίσεις για όλους τους πελάτες για να διασφαλίζεται ότι :","o":[{"k":"α","t":"Ο δανειζόμενος των χρηματοπιστωτικών μέσων του πελάτη παρέχει την κατάλληλη ασφάλεια."},{"k":"β","t":"Η επιχείρηση παρακολουθεί σε συνεχή βάση την καταλληλότητα της εν λόγω ασφάλειας και λαμβάνει τα απαραίτητα μέτρα για να διατηρείται η κάλυψη της αξίας των μέσων των πελατών."},{"k":"γ","t":"Ο δανειζόμενος των χρηματοπιστωτικών μέσων του πελάτη, όταν είναι ανώνυμη εταιρεία, παρέχει αποκλειστικά εμπράγματες εξασφαλίσεις."},{"k":"δ","t":"Ο δανειζόμενος των χρηματοπιστωτικών μέσων του πελάτη παρέχει την κατάλληλη ασφάλεια και η επιχείρηση παρακολουθεί σε συνεχή βάση την καταλληλότητα της εν λόγω ασφάλειας και λαμβάνει τα απαραίτητα μέτρα για να διατηρείται η κάλυψη της αξίας των μέσων των πελατών."}]},{"n":126,"a":"α","q":"Ο Ν. 4514/2018 (MiFID ΙΙ) δεν εφαρμόζεται στο σύνολό του (δηλαδή, ως προς καμία διάταξή του):","o":[{"k":"α","t":"Στις ασφαλιστικές εταιρίες, στα συνταξιοδοτικά ταμεία και στους ΟΣΕΚΑ (εκτός από τις ΑΕΔΑΚ οι οποίες παρέχουν τις επενδυτικές υπηρεσίες της διαχείρισης χαρτοφυλακίου για κάθε πελάτη ή/και παροχής επενδυτικών συμβουλών ή/και φύλαξης- διοικητικής μεταχείρισης μεριδίων ΟΣΕΚΑ)."},{"k":"β","t":"Στα πιστωτικά ιδρύματα."},{"k":"γ","t":"Στις επιχειρήσεις επενδύσεων που έχουν λάβει άδεια από τις αρμόδιες αρχές άλλου Κράτους- Μέλους."},{"k":"δ","t":"Στις ΑΕΕΔ."}]},{"n":127,"a":"α","q":"Οι ΑΕΠΕΥ αναλύουν τις πιθανές συγκρούσεις συμφερόντων κάθε φορά που κατασκευάζεται ένα χρηματοπιστωτικό μέσο. Μεταξύ άλλων, εκτιμά κατά πόσον το χρηματοπιστωτικό μέσον δημιουργεί μια κατάσταση κατά την οποία οι τελικοί πελάτες μπορεί να επηρεαστούν αρνητικά αν λάβουν:","o":[{"k":"α","t":"Ένα άνοιγμα αντίθετο προς εκείνο που κατείχε προηγουμένως η ίδια η επιχείρηση."},{"k":"β","t":"Ένα άνοιγμα ίδιο προς εκείνο που η επιχείρηση επιθυμεί να κατέχει μετά την πώληση του προιόντος."},{"k":"γ","t":"Ένα άνοιγμα ίδιο προς εκείνο που κατείχε προηγουμένως η ίδια η επιχείρηση."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":128,"a":"β","q":"Ποια από τις ακόλουθες προτάσεις είναι σωστή;","o":[{"k":"α","t":"Τα πιστωτικά ιδρύματα που έχουν λάβει άδεια από την ΤτΕ για να παρέχουν επενδυτικές υπηρεσίες θα πρέπει να αδειοδοτηθούν εκ νέου από την ΕΚ ως προς τις παρεχόμενες επενδυτικές υπηρεσίες."},{"k":"β","t":"Τα πιστωτικά ιδρύματα που έχουν λάβει άδεια από την ΤτΕ για να παρέχουν επενδυτικές υπηρεσίες δεν χρειάζεται να αδειοδοτηθούν εκ νέου από την ΕΚ ως προς τις παρεχόμενες επενδυτικές υπηρεσίες."},{"k":"γ","t":"Τα πιστωτικά ιδρύματα που έχουν λάβει άδεια από την ΤτΕ για να παρέχουν τραπεζικές υπηρεσίες οφείλουν να λάβουν άδεια από την ΕΚ προκειμένου να προσφέρουν και επενδυτικές υπηρεσίες."},{"k":"δ","t":"Τα πιστωτικά ιδρύματα παρέχουν μόνον τραπεζικές υπηρεσίες (για τις οποίες λαμβάνουν άδεια από την ΤτΕ) αλλά δεν μπορούν να προσφέρουν τα ίδια επενδυτικές υπηρεσίες παρά μόνον δια μέσου θυγατρικών εταιριών τους (οι οποίες αδειοδοτούνται από την ΕΚ)."}]},{"n":129,"a":"β","q":"Οι ΑΕΠΕΥ οφείλουν να λαμβάνουν κατάλληλα μέτρα για τον εντοπισμό και την πρόληψη ή τη διαχείριση των καταστάσεων συγκρούσεων συμφερόντων:","o":[{"k":"α","t":"Μεταξύ αυτών και πελατών τους, και εφόσον τα μέτρα δεν είναι ικανοποιητικά να γνωστοποιούν με σαφήνεια στον πελάτη τη γενική φύση ή τις πηγές των συγκρούσεων συμφερόντων και τα μέτρα που έχουν ληφθεί για τον περιορισμό τους, προτού αναλάβει να ασκήσει δραστηριότητα για λογαριασμό του."},{"k":"β","t":"Μεταξύ αυτών και πελατών τους, ή μεταξύ πελατών τους, και εφόσον τα μέτρα δεν είναι ικανοποιητικά να γνωστοποιούν με σαφήνεια στον πελάτη τη γενική φύση ή τις πηγές των συγκρούσεων συμφερόντων και τα μέτρα που έχουν ληφθεί για τον περιορισμό τους, προτού αναλάβει να ασκήσει δραστηριότητα για λογαριασμό του."},{"k":"γ","t":"Μεταξύ πελατών τους, και εφόσον τα μέτρα δεν είναι ικανοποιητικά να γνωστοποιούν με σαφήνεια στον πελάτη τη γενική φύση ή τις πηγές των συγκρούσεων συμφερόντων και τα μέτρα που έχουν ληφθεί για τον περιορισμό τους, προτού αναλάβει να ασκήσει δραστηριότητα για λογαριασμό του."},{"k":"δ","t":"Μεταξύ αυτών και πελατών τους, ή μεταξύ πελατών τους, καθώς και να γνωστοποιούν σε κάθε περίπτωση με σαφήνεια στον πελάτη τη γενική φύση ή τις πηγές των συγκρούσεων συμφερόντων και τα μέτρα που έχουν ληφθεί για τον περιορισμό τους, προτού αναλάβει να ασκήσει δραστηριότητα για λογαριασμό του."}]},{"n":130,"a":"α","q":"Οι ΑΕΠΕΥ οφείλουν να λαμβάνουν κάθε εύλογο μέτρο για τον εντοπισμό των συγκρούσεων συμφερόντων μεταξύ αυτών και των πελατών τους. Σε περίπτωση που οι ρυθμίσεις στις οποίες έχουν προβεί δεν διασφαλίζουν την αποφυγή των καταστάσεων αυτών, οι ΑΕΠΕΥ:","o":[{"k":"α","t":"Γνωστοποιούν στον πελάτη τη γενική φύση της σύγκρουσης συμφερόντων."},{"k":"β","t":"Γνωστοποιούν στον πελάτη τις πηγές συγκρούσεων συμφερόντων και δεν του παρέχουν επενδυτικές υπηρεσίες."},{"k":"γ","t":"Παρέχουν στον πελάτη επενδυτικές υπηρεσίες και γνωστοποιούν εκ των υστέρων την ύπαρξη τυχόν ζητήματος σύγκρουσης συμφερόντων."},{"k":"δ","t":"Γνωστοποιούν τις συγκρούσεις συμφερόντων στην Επιτροπή Κεφαλαιαγοράς."}]},{"n":131,"a":"β","q":"Οι ΑΕΠΕΥ γνωστοποιούν στον πελάτη τυχόν συγκρούσεις συμφερόντων:","o":[{"k":"α","t":"Σε κάθε περίπτωση."},{"k":"β","t":"Μόνο εφόσον οι σχετικές οργανωτικές ή διοικητικές τους ρυθμίσεις δεν επαρκούν για να εξασφαλιστεί με εύλογη βεβαιότητα η αποτροπή του κινδύνου βλάβης των συμφερόντων των πελατών."},{"k":"γ","t":"Μόνο εφόσον δεν τις έχει επιλύσει η Επιτροπή Κεφαλαιαγοράς."},{"k":"δ","t":"Μόνο εφόσον αυτές συνιστούν συγκρούσεις συμφερόντων μεταξύ των ιδίων πελατών."}]},{"n":132,"a":"γ","q":"Εάν οι οργανωτικές και διοικητικές ρυθμίσεις που εφαρμόζει η ΑΕΠΕΥ για να προληφθούν οι αρνητικές συνέπειες των συγκρούσεων συμφερόντων στα συμφέροντα του πελάτη της, δεν επαρκούν για να εξασφαλιστεί με εύλογη βεβαιότητα η αποτροπή του κινδύνου βλάβης των συμφερόντων των πελατών, η ΑΕΠΕΥ:","o":[{"k":"α","t":"Γνωστοποιεί με σαφήνεια στην ΕΚ τη γενική φύση των σύγκρουσεων συμφερόντων προτού αναλάβει να ασκήσει δραστηριότητα για λογαριασμό του πελάτη."},{"k":"β","t":"Γνωστοποιεί με σαφήνεια στην ΕΚ και την ΤτΕ τη γενική φύση των σύγκρουσεων συμφερόντων προτού αναλάβει να ασκήσει δραστηριότητα για λογαριασμό του πελάτη."},{"k":"γ","t":"Γνωστοποιεί με σαφήνεια στον πελάτη τη γενική φύση ή τις πηγές των συγκρούσεων συμφερόντων προτού αναλάβει να ασκήσει δραστηριότητα για λογαριασμό του."},{"k":"δ","t":"Είναι υποχρεωμένη να αρνηθεί να αναλάβει δραστηριότητα για λογαριασμό του πελάτη."}]},{"n":133,"a":"δ","q":"Ως σύστημα αλγοριθμικών συναλλαγών μπορεί να λειτουργεί:","o":[{"k":"α","t":"Ένα σύστημα μέσω του οποίου η επιχείρηση επενδύσεων διενεργεί αντιστοιχισμένες συναλλαγές για ίδιο λογαριασμό ως ειδικός διαπραγματευτής με μεθόδους ηλεκτρονικής διαπραγμάτευσης."},{"k":"β","t":"Ένα σύστημα δρομολόγησης εντολών η δρομολόγηση των οποίων υπάγεται σε κριτήρια που καθορίζει ειδικός αλγόριθμος (π.χ. σύστημα άμεσης ηλεκτρονικής πρόσβασης)."},{"k":"γ","t":"Ένα πολυμερές σύστημα συναλλαγών η διενέργεια των οποίων υπάγεται σε αλγοριθμικά κριτήρια που θέτει ο διαχειριστής του συστήματος."},{"k":"δ","t":"Ένα σύστημα που χρησιμοποιεί ειδικός διαπραγματευτής για την παροχή τιμών ειδικής διαπραγμάτευσης βάσει παραμέτρων που καθορίζονται από αλγόριθμο υπολογιστή."}]},{"n":134,"a":"γ","q":"Τι πληροφορίες περιλαμβάνει το Τμήμα «Τι συμβαίνει αν [όνομα του παραγωγού PRΙΙΡ] δεν είναι σε θέση να πληρώσει;» στο έγγραφο βασικών πληροφοριών PRIIP; Ι. Ένδειξη για το κατά πόσον ο ιδιώτης επενδυτής μπορεί να αντιμετωπίσει οικονομική ζημία λόγω της αθέτησης υποχρεώσεων του παραγωγού PRIIP ή της αθέτησης υποχρεώσεων φορέα διαφορετικού από τον παραγωγό PRIIP, και την ταυτότητα του εν λόγω φορέα. II.Διευκρίνιση κατά πόσον οικονομική ζημία λόγω της αθέτησης υποχρεώσεων του παραγωγού PRIIP ή της αθέτησης υποχρεώσεων φορέα διαφορετικού από τον παραγωγό PRIIP καλύπτεται από ένα σύστημα αποζημίωσης των επενδυτών ή εγγύησης, και κατά πόσον υπάρχουν τυχόν περιορισμοί ή προϋποθέσεις για την εν λόγω κάλυψη. III. Ένδειξη για πιθανή μέγιστη ζημία και πληροφορίες ότι η επένδυση ενδέχεται να χαθεί αν δεν προστατευθεί ή εφόσον ο παραγωγός PRIIP δεν είναι σε θέση να πληρώσει, ή ότι ενδέχεται να απαιτηθούν οι απαραίτητες πρόσθετες επενδυτικές πληρωμές προς την αρχική επένδυση και ότι η συνολική ζημία ενδέχεται να υπερβεί σημαντικά τη συνολική αρχική επένδυση. IV. Ένδειξη για πιθανή μέγιστη ζημία και πληροφορίες ότι η επένδυση ενδέχεται να χαθεί αν δεν προστατευθεί ή εφόσον ο παραγωγός PRIIP ή κεντρικός αντισυμβαλλόμενος που ενεργεί για λογαριασμό του δεν είναι σε θέση να πληρώσει.","o":[{"k":"α","t":"Ι, ΙΙ, ΙΙΙ, IV."},{"k":"β","t":"Ι, ΙΙΙ, IV."},{"k":"γ","t":"Ι, ΙΙ."},{"k":"δ","t":"Ι, ΙΙ, IV."}]},{"n":135,"a":"γ","q":"Ο εντοπισμός των καταστάσεων σύγκρουσης συμφερόντων από τις ΑΕΠΕΥ αφορά σε συγκρούσεις:","o":[{"k":"α","t":"Μεταξύ των ΑΕΠΕΥ και των πελατών τους."},{"k":"β","t":"Μεταξύ των πελατών τους."},{"k":"γ","t":"Μεταξύ των ΑΕΠΕΥ και των πελατών τους και μεταξύ των πελατών των ΑΕΠΕΥ."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":136,"a":"δ","q":"Οι Πολυμερείς Μηχανισμοί Διαπραγμάτευσης (ΠΜΔ):","o":[{"k":"α","t":"Καθορίζουν υποκειμενικά κριτήρια για την αποτελεσματική εκτέλεση των εντολών."},{"k":"β","t":"Λειτουργούν με κανόνες που παρέχουν διακριτική ευχέρεια."},{"k":"γ","t":"Δεν παρέχουν επαρκείς πληροφορίες, όπως άλλες ρυθμιζόμενες αγορές."},{"k":"δ","t":"Εποπτεύονται από την Επιτροπή Κεφαλαιαγοράς."}]},{"n":137,"a":"γ","q":"Ο έλεγχος καταλληλότητας αφορά:","o":[{"k":"α","t":"Μόνον την παροχή επενδυτικών συμβουλών."},{"k":"β","t":"Μόνον τη διαχείριση χαρτοφυλακίων."},{"k":"γ","t":"Την παροχή επενδυτικών συμβουλών και τη διαχείριση χαρτοφυλακίου."},{"k":"δ","t":"Όλες τις επενδυτικές υπηρεσίες."}]},{"n":138,"a":"β","q":"Ως «έλεγχος καταλληλότητας» νοείται:","o":[{"k":"α","t":"Κατά την παροχή επενδυτικών υπηρεσιών, η υποχρέωση των ΑΕΠΕΥ να αντλούν πληροφορίες σχετικά με τη γνώση και την εμπειρία του πελάτη καθώς και σχετικά με τη χρηματοοικονομική κατάσταση περιλαμβανομένης της δυνατότητάς του να υποστεί ζημίες και τους επενδυτικούς στόχους του."},{"k":"β","t":"Κατά την παροχή επενδυτικών συμβουλών ή διαχείρισης χαρτοφυλακίου, η υποχρέωση των ΑΕΠΕΥ να αντλούν πληροφορίες σχετικά με τη γνώση και την εμπειρία του πελάτη καθώς και σχετικά με τη χρηματοοικονομική κατάσταση περιλαμβανομένης της δυνατότητάς του να υποστεί ζημίες και τους επενδυτικούς στόχους του."},{"k":"γ","t":"Κατά την παροχή επενδυτικών συμβουλών ή διαχείρισης χαρτοφυλακίου, η υποχρέωση των ΑΕΠΕΥ να αντλούν πληροφορίες σχετικά με τη γνώση και την εμπειρία του πελάτη."},{"k":"δ","t":"Κατά την παροχή της υπηρεσίας εκτέλεσης εντολών, η υποχρέωση των ΑΕΠΕΥ να αντλούν πληροφορίες σχετικά με τη γνώση και την εμπειρία του πελάτη καθώς και σχετικά με τη χρηματοοικονομική κατάσταση περιλαμβανομένης της δυνατότητάς του να υποστεί ζημίες και τους επενδυτικούς στόχους του."}]},{"n":139,"a":"δ","q":"Ο έλεγχος συμβατότητας αφορά:","o":[{"k":"α","t":"Την οικονομική κατάσταση του πελάτη."},{"k":"β","t":"Τους επενδυτικούς στόχους του πελάτη."},{"k":"γ","t":"Την οικονομική κατάσταση και τους επενδυτικούς στόχους του πελάτη."},{"k":"δ","t":"Τις γνώσεις και την εμπειρία του πελάτη στον τομέα και την κατηγορία του προϊόντος στο οποίο σκοπεύει να επενδύσει."}]},{"n":140,"a":"β","q":"Ο έλεγχος συμβατότητας αφορά:","o":[{"k":"α","t":"Παροχή επενδυτικών συμβουλών και διαχείριση χαρτοφυλακίων πελατών."},{"k":"β","t":"Λήψη και διαβίβαση εντολών και εκτέλεση εντολών πελατών."},{"k":"γ","t":"Παροχή επενδυτικών υπηρεσιών γενικά."},{"k":"δ","t":"Μόνον εκτέλεση εντολών πελατών."}]},{"n":141,"a":"γ","q":"Η αξιολόγηση της «συμβατότητας» αφορά:","o":[{"k":"α","t":"Στην παροχή επενδυτικών συμβουλών."},{"k":"β","t":"Στην παροχή επενδυτικών συμβουλών και διαχείριση χαρτοφυλακίων πελατών."},{"k":"γ","t":"Σε κάθε επενδυτική υπηρεσία πλην της παροχής επενδυτικών συμβουλών και διαχείρισης χαρτοφυλακίου."},{"k":"δ","t":"Σε κάθε περίπτωση παροχής επενδυτικών υπηρεσιών."}]},{"n":142,"a":"γ","q":"Ως «έλεγχος συμβατότητας» νοείται:","o":[{"k":"α","t":"Κατά την παροχή επενδυτικών υπηρεσιών, η υποχρέωση των ΑΕΠΕΥ να ζητούν από τον πελάτη να παρέχει πληροφορίες σχετικά με τον επενδυτικό του ορίζοντα."},{"k":"β","t":"Κατά την παροχή οποιονδήποτε επενδυτικών υπηρεσιών η υποχρέωση των ΑΕΠΕΥ να ζητούν από τον πελάτη να παρέχει πληροφορίες σχετικά με τις γνώσεις και την εμπειρία του."},{"k":"γ","t":"Κατά την παροχή επενδυτικών υπηρεσιών (εκτός από τις υπηρεσίες παροχής επενδυτικών συμβουλών ή διαχείρισης χαρτοφυλακίου), η υποχρέωση των ΑΕΠΕΥ να ζητούν από τον πελάτη να παρέχει πληροφορίες σχετικά με τις γνώσεις και την εμπειρία του."},{"k":"δ","t":"Κατά την παροχή της υπηρεσίας εκτέλεσης εντολών, η υποχρέωση των ΑΕΠΕΥ να ζητούν από τον πελάτη να παρέχει πληροφορίες σχετικά με τις γνώσεις και την εμπειρία του."}]},{"n":143,"a":"α","q":"Στο πλαίσιο του ελέγχου συμβατότητας, εάν ο πελάτης δεν παράσχει τις πληροφορίες σχετικά με τις γνώσεις και την εμπειρία του ή αν παράσχει ανεπαρκείς σχετικές πληροφορίες, οι ΑΕΠΕΥ οφείλουν:","o":[{"k":"α","t":"Να τον προειδοποιήσουν ότι δεν είναι σε θέση να κρίνουν κατά πόσον η σκοπούμενη επενδυτική υπηρεσία ή το προσφερόμενο ή ζητούμενο προϊόν είναι ενδεδειγμένο γι' αυτόν."},{"k":"β","t":"Να παρέχουν στον πελάτη την επενδυτική υπηρεσία."},{"k":"γ","t":"Να παρέχουν στον πελάτη την επενδυτική υπηρεσία εφόσον ενημερώσουν σχετικά την ΕΚ."},{"k":"δ","t":"Να παρέχουν στον πελάτη την επενδυτική υπηρεσία εφόσον ενημερώσουν σχετικά το προϊστάμενο διευθυντικό στέλεχος."}]},{"n":144,"a":"α","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Δεν απαιτείται έλεγχος συμβατότητας, εφόσον πρόκειται για μη-πολύπλοκο χρηματοπιστωτικό μέσο, ο πελάτης έχει ειδοποιηθεί σχετικά, η υπηρεσία παρέχεται κατόπιν πρωτοβουλίας του πελάτη, και η ΑΕΠΕΥ πληροί όλες τις νόμιμες προϋποθέσεις σχετικά με τον εντοπισμό και την πρόληψη ή τη διαχείριση συγκρούσεων συμφερόντων."},{"k":"β","t":"Ο έλεγχος συμβατότητας είναι σε κάθε περίπτωση υποχρεωτικός."},{"k":"γ","t":"Ο έλεγχος συμβατότητας υπόκειται στη διακριτική ευχέρεια της ΑΕΠΕΥ."},{"k":"δ","t":"Δεν απαιτείται έλεγχος συμβατότητας εφόσον πρόκειται για μη-πολύπλοκο χρηματοπιστωτικό μέσο, η υπηρεσία παρέχεται κατόπιν πρωτοβουλίας του πελάτη, και η ΑΕΠΕΥ πληροί όλες τις νόμιμες προϋποθέσεις σχετικά με την αντιμετώπιση συγκρούσεων συμφερόντων."}]},{"n":145,"a":"β","q":"Ιδιώτης πελάτης ΑΕΠΕΥ/πιστωτικού ιδρύματος κάτοχος μεγάλου χρηματικού ποσού ζητά την αγορά δομημένου ομολόγου του ελληνικού δημοσίου. Πώς πρέπει να ενεργήσει ένας πιστοποιημένος υπάλληλος;","o":[{"k":"α","t":"Διενεργεί έλεγχο καταλληλότητας."},{"k":"β","t":"Διενεργεί έλεγχο συμβατότητας."},{"k":"γ","t":"Δεν απαιτείται κανένας έλεγχος γιατί η υπηρεσία δεν καλύπτεται από τον Ν. 4514/2018 (MiFID ΙΙ) και παρέχεται η επενδυτική υπηρεσία."},{"k":"δ","t":"Δεν απαιτείται κανένας έλεγχος γιατί η υπηρεσία ζητείται με πρωτοβουλία του πελάτη και παρέχεται η επενδυτική υπηρεσία."}]},{"n":146,"a":"β","q":"Κατά τον έλεγχο καταλληλότητας σε επαγγελματίες πελάτες, στους οποίους παρέχεται η υπηρεσία διαχείρισης χαρτοφυλακίων, αντλούνται πληροφορίες:","o":[{"k":"α","t":"Για τη γνώση και την εμπειρία του πελάτη στον επενδυτικό τομέα σε σχέση με το προϊόν ή την υπηρεσία που του παρέχεται."},{"k":"β","t":"Για την οικονομική δυνατότητα του πελάτη να αναλάβει τους σχετικούς επενδυτικούς κινδύνους και για τους επενδυτικούς του στόχους."},{"k":"γ","t":"Για τη γνώση και την εμπειρία του πελάτη στον επενδυτικό τομέα σε σχέση με το προϊόν ή την υπηρεσία που του παρέχεται, την οικονομική δυνατότητα του πελάτη να αναλάβει τους σχετικούς επενδυτικούς κινδύνους και τους επενδυτικούς του στόχους."},{"k":"δ","t":"Για τη γνώση και την εμπειρία του πελάτη στον επενδυτικό τομέα σε σχέση με το προϊόν ή την υπηρεσία που του παρέχεται και τους επενδυτικούς του στόχους."}]},{"n":147,"a":"α","q":"Ο έλεγχος καταλληλότητας τον οποίο οφείλει να διενεργεί η ΑΕΠΕΥ, σε περίπτωση παροχής επενδυτικών συμβουλών ή διαχείρισης χαρτοφυλακίου, περιλαμβάνει την αξιολόγηση/διάγνωση:","o":[{"k":"α","t":"Των επενδυτικών στόχων, της οικονομικής δυνατότητας και της πείρας/ γνώσης του πελάτη ως προς τους σχετικούς επενδυτικούς κινδύνους."},{"k":"β","t":"Της σχέσης μεταξύ της επιθυμούμενης απόδοσης και των οικονομικών δυνατοτήτων του πελάτη."},{"k":"γ","t":"Της καλύτερης δυνατής ισορροπίας μεταξύ κινδύνου, επενδυτικού ορίζοντα και απόδοσης."},{"k":"δ","t":"Της κατάλληλης τιμολόγησης των παρεχόμενων επενδυτικών υπηρεσιών σε σχέση με τις οικονομικές δυνατότητες του πελάτη."}]},{"n":148,"a":"γ","q":"Στον έλεγχο καταλληλότητας και στον έλεγχο συμβατότητας, η ΑΕΠΕΥ:","o":[{"k":"α","t":"Οφείλει να βασίζεται στις πληροφορίες που παρέχουν οι πελάτες της."},{"k":"β","t":"Αρκεί να βασίζεται σε πληροφορίες που διαθέτει η ίδια."},{"k":"γ","t":"Δικαιούται να βασίζεται σε πληροφορίες που παρέχουν οι πελάτες της, εκτός εάν γνωρίζει ή όφειλε να γνωρίζει ότι η πληροφόρηση αυτή είναι καταφανώς παρωχημένη, ανακριβής ή ελλιπής."},{"k":"δ","t":"Δικαιούται να μη λαμβάνει υπόψη πληροφορίες που παρέχουν οι πελάτες της."}]},{"n":149,"a":"β","q":"Όταν οι ΑΕΠΕΥ κρίνουν από τον έλεγχο συμβατότητας ότι το προϊόν ή η υπηρεσία δεν είναι κατάλληλα για τον πελάτη ή το δυνητικό πελάτη:","o":[{"k":"α","t":"Τον ειδοποιούν για την ακαταλληλότητα και αρνούνται την υπηρεσία."},{"k":"β","t":"Τον προειδοποιούν σχετικά πριν την παροχή της υπηρεσίας."},{"k":"γ","t":"Τον ειδοποιούν για την ακαταλληλότητα και ενημερώνουν την Επιτροπή Κεφαλαιαγοράς."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":150,"a":"β","q":"Οι ΑΕΠΕΥ και τα πιστωτικά ιδρύματα δεν χρειάζεται να έχουν προβεί σε έλεγχο συμβατότητας, εάν η υπηρεσία παρέχεται κατόπιν πρωτοβο
