ς είναι σωστή;","o":[{"k":"α","t":"Τα πρόσωπα που ασκούν διευθυντικά καθήκοντα σε εκδότη και οι έχοντες στενό δεσμό με αυτά τα πρόσωπα (υπόχρεα πρόσωπα) οφείλουν να γνωστοποιούν στον εκδότη τις συναλλαγές που διενεργούνται για δικό τους λογαριασμό και αφορούν μετοχές που εκδίδονται από τον ανωτέρω εκδότη, ή παράγωγα ή άλλα χρηματοπιστωτικά μέσα που είναι συνδεδεμένα με αυτές."},{"k":"β","t":"Τα πρόσωπα που ασκούν διευθυντικά καθήκοντα σε εκδότη οφείλουν να γνωστοποιούν στον εκδότη τις συναλλαγές που διενεργούνται για δικό τους λογαριασμό και αφορούν μετοχές που εκδίδονται από τον ανωτέρω εκδότη, ή παράγωγα ή άλλα χρηματοπιστωτικά μέσα που είναι συνδεδεμένα με αυτές."},{"k":"γ","t":"Οι εργαζόμενοι σε εκδότη οφείλουν να γνωστοποιούν στον εκδότη τις συναλλαγές που διενεργούνται για δικό τους λογαριασμό και αφορούν μετοχές που εκδίδονται από τον ανωτέρω εκδότη, ή παράγωγα ή άλλα χρηματοπιστωτικά μέσα που είναι συνδεδεμένα με αυτές."},{"k":"δ","t":"Τα μέλη του ΔΣ εκδότη οφείλουν να γνωστοποιούν στον εκδότη τις συναλλαγές που διενεργούνται για δικό τους λογαριασμό και αφορούν μετοχές που εκδίδονται από τον ανωτέρω εκδότη, ή παράγωγα ή άλλα χρηματοπιστωτικά μέσα που είναι συνδεδεμένα με αυτές."}]},{"n":39,"a":"β","q":"Τα πρόσωπα που ασκούν διευθυντικά καθήκοντα σε εκδότη και οι έχοντες στενό δεσμό με αυτά τα πρόσωπα οφείλουν να γνωστοποιούν στον εκδότη τις συναλλαγές τους:","o":[{"k":"α","t":"Σε μετοχές του εκδότη ή παράγωγα ή άλλα χρηματοπιστωτικά μέσα που είναι συνδεδεμένα με αυτές, όταν οι συναλλαγές αυτές ξεπερνούν αθροιστικά τις 5.000 € μηνιαίως."},{"k":"β","t":"Σε μετοχές του εκδότη ή παράγωγα ή άλλα χρηματοπιστωτικά μέσα που είναι συνδεδεμένα με αυτές, όταν οι συναλλαγές αυτές ξεπερνούν αθροιστικά τις 5.000 € ετησίως."},{"k":"γ","t":"Σε μετοχές του εκδότη, όταν οι συναλλαγές αυτές ξεπερνούν αθροιστικά τις 5.000 € μηνιαίως."},{"k":"δ","t":"Σε μετοχές του εκδότη όταν οι συναλλαγές αυτές ξεπερνούν αθροιστικά τις 5,000 € ετησίως."}]},{"n":40,"a":"α","q":"Οι εκδότες ή οποιοδήποτε πρόσωπο ενεργεί εξ ονόματός τους ή για λογαριασμό τους διατηρούν τον κατάλογο προσώπων που κατέχουν προνομιακή πληροφορία για περίοδο τουλάχιστον:","o":[{"k":"α","t":"5 ετών μετά την κατάρτιση ή επικαιροποίησή του."},{"k":"β","t":"5 ετών μετά την ημερομηνία σύστασης της εταιρείας στο ΓΕ.ΜΗ."},{"k":"γ","t":"10 ετών μετά την κατάρτιση ή επικαιροποίησή του."},{"k":"δ","t":"6 μηνών από τη διενέργεια οποιασδήποτε συναλλαγής επί κινητών αξιών του εκδότη."}]},{"n":41,"a":"γ","q":"Η Επιτροπή Κεφαλαιαγοράς τηρεί αρχεία καταγραφής για κάθε αναφορά παράβασης που παραλαμβάνεται και:","o":[{"k":"α","t":"Ενημερώνει τηλεφωνικά για την παραλαβή τον αναφέροντα."},{"k":"β","t":"Δημοσιοποιεί τις αναφορές για ενημέρωση του επενδυτικού κοινού."},{"k":"γ","t":"Αποστέλλει αμέσως αποδεικτικό παραλαβής των γραπτών αναφορών παραβάσεων στην ταχυδρομική ή ηλεκτρονική διεύθυνση που αναγράφεται από τον αναφέροντα, εκτός αν ζητηθεί ρητά κάτι διαφορετικό από τον αναφέροντα."},{"k":"δ","t":"Τις διαβιβάζει αμελλητί στην Εισαγγελία Πλημμελειοδικών."}]},{"n":42,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Η έρευνα και οι εκτιμήσεις που εκπονούνται µε βάση δεδομένα που είναι διαθέσιμα στο κοινό δεν συνιστούν προνομιακές πληροφορίες ."},{"k":"β","t":"Η απαγόρευση διαπραγμάτευσης με βάση προνομιακές πληροφορίες δεν εφαρμόζεται στις συναλλαγές που πραγματοποιούνται από πρόσωπο προς εκπλήρωση μιας απαιτητής υποχρέωσης για την απόκτηση ή διάθεση χρηματοπιστωτικών μέσων, όταν η υποχρέωση αυτή απορρέει από συμφωνία συναφθείσα πριν από την απόκτηση της προνομιακής πληροφορίας από το εν λόγω πρόσωπο."},{"k":"γ","t":"Η πρόσβαση σε προνομιακές πληροφορίες για μια άλλη εταιρία και η χρησιμοποίησή τους στο πλαίσιο μιας δημόσιας προσφοράς εξαγοράς προς απόκτηση του ελέγχου της συγκεκριμένης εταιρίας ή συγχώνευσής µε αυτήν, δεν θα πρέπει να θεωρείται αυτή καθαυτή ως κατάχρηση προνομιακών πληροφοριών."},{"k":"δ","t":"Πληροφορία που αφορά στην προσέγγιση μιας πιθανής εταιρίας-στόχου ή στο τίμημα μελλοντικής εξαγοράς δεν συνιστά σε καμία περίπτωση προνομιακή πληροφορία."}]},{"n":43,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Πληροφορία για κάθε επιμέρους στάδιο μιας διαδικασίας που εξελίσσεται σε στάδια (πχ, πρόταση εξαγοράς), καθώς και για την διαδικασία στο σύνολό της μπορεί να συνιστά «συγκεκριμένη» πληροφορία, ανεξάρτητα από το εάν τελικά η διαδικασία ολοκληρώθηκε."},{"k":"β","t":"Η προσέγγιση μια εταιρίας-στόχου στο πλαίσιο πρότασης εξαγοράς μπορεί να συνιστά «συγκεκριμένη» πληροφορία, ακόμη και αν δεν έχουν αποσαφηνισθεί όλες οι πτυχές της πρότασης εξαγοράς."},{"k":"γ","t":"Μια πληροφορία δύναται να χαρακτηριστεί ως «συγκεκριμένη» ακόμη και αν αφορά σε εναλλακτικά γεγονότα."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":44,"a":"α","q":"Οι εταιρίες υποχρεούνται:","o":[{"k":"α","t":"Σε περίπτωση δημοσιοποίησης πληροφοριών που είναι βάσιμες, να διευκρινίσουν το στάδιο εξέλιξης στο οποίο βρίσκονται τα γεγονότα, ενώ αν οι πληροφορίες είναι ανυπόστατες, ψευδείς ή ανακριβείς, να επισημάνουν την ανακρίβεια των πληροφοριών αυτών."},{"k":"β","t":"Μόνον σε περίπτωση δημοσιοποίησης πληροφοριών που είναι ανυπόστατες, ψευδείς ή ανακριβείς, να επισημάνουν την ανακρίβεια των πληροφοριών αυτών."},{"k":"γ","t":"Μόνον σε περίπτωση δημοσιοποίησης πληροφοριών που είναι βάσιμες, να διευκρινίσουν το στάδιο εξέλιξης στο οποίο βρίσκονται τα γεγονότα."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή (δηλαδή, δεν υφίσταται καμία σχετική υποχρέωση για τις εταιρίες)."}]},{"n":45,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Η απαγόρευση κατάχρησης προνομιακών πληροφοριών συνίσταται στο ότι οι κάτοχοι προνομιακών πληροφοριών απαγορεύεται να χρησιμοποιούν τις πληροφορίες αυτές για να διαπραγματευθούν, για λογαριασμό τους ή για λογαριασμό τρίτων, αμέσως ή εμμέσως, σε χρηματοπιστωτικά μέσα στα οποία αφορούν οι πληροφορίες αυτές."},{"k":"β","t":"Η απαγόρευση κατάχρησης προνομιακών πληροφοριών συνίσταται στο ότι οι κάτοχοι προνομιακών πληροφοριών απαγορεύεται να ανακοινώνουν προνομιακή πληροφορία σε άλλο πρόσωπο, εκτός εάν τα ενεργούν στο σύνηθες πλαίσιο άσκησης της εργασίας, του επαγγέλματος ή των καθηκόντων τους."},{"k":"γ","t":"Η απαγόρευση κατάχρησης προνομιακών πληροφοριών συνίσταται στο ότι οι κάτοχοι προνομιακών πληροφοριών απαγορεύεται να χρησιμοποιούν τις πληροφορίες αυτές για να διαπραγματευθούν, για λογαριασμό τους ή για λογαριασμό τρίτων, αμέσως ή εμμέσως, σε χρηματοπιστωτικά μέσα στα οποία αφορούν οι πληροφορίες αυτές και η απαγόρευση κατάχρησης προνομιακών πληροφοριών συνίσταται στο ότι οι κάτοχοι προνομιακών πληροφοριών απαγορεύεται να ανακοινώνουν προνομιακή πληροφορία σε άλλο πρόσωπο, εκτός εάν τα ενεργούν στο σύνηθες πλαίσιο άσκησης της εργασίας, του επαγγέλματος ή των καθηκόντων τους."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":46,"a":"δ","q":"Κάτοχοι προνομιακών πληροφοριών σε σχέση με εισηγμένες σε ρυθμιζόμενη αγορά κινητές αξίες εκδότη χαρακτηρίζονται από το νόμο:","o":[{"k":"α","t":"Μόνο τα πρόσωπα που κατέχουν στον εκδότη θέση διευθυντικού στελέχους."},{"k":"β","t":"Κάθε πρόσωπο που απασχολείται στον εκδότη."},{"k":"γ","t":"Μόνο τα μέλη του διοικητικού συμβουλίου του εκδότη."},{"k":"δ","t":"Τα πρόσωπα που έχουν πρόσβαση στις πληροφορίες αυτές κατά την άσκηση της εργασίας, τους επαγγέλματος ή των καθηκόντων τους."}]},{"n":47,"a":"α","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Το πρόσωπο που εκπονεί την ανάλυση δεν επιτρέπεται να διατηρεί συμμετοχές που υπερβαίνουν το 5% του συνόλου του μετοχικού κεφαλαίου του εκδότη."},{"k":"β","t":"Το πρόσωπο που εκπονεί την ανάλυση γνωστοποιεί στην ανάλυση ότι ήταν κατά τη διάρκεια των προηγούμενων δώδεκα μηνών κύριος ανάδοχος ή ανάδοχος σε δημόσια εγγραφή ή προσφορά χρηματοπιστωτικών μέσων του εκδότη."},{"k":"γ","t":"Το πρόσωπο που εκπονεί την ανάλυση γνωστοποιεί στην ανάλυση ότι είναι ειδικός διαπραγματευτής για χρηματοπιστωτικά μέσα του εκδότη."},{"k":"δ","t":"Το πρόσωπο που εκπονεί την ανάλυση γνωστοποιεί στην ανάλυση ότι έχει συμβληθεί με τον εκδότη για την εκπόνηση της ανάλυσης."}]},{"n":48,"a":"β","q":"Το σχετικό μέτρο για τον υπολογισμό του ορίου άνω του οποίου απαιτείται κοινοποίηση των καθαρών αρνητικών θέσεων στους εκδοθέντες κρατικούς χρεωστικούς τίτλους ενός κρατικού εκδότη στη σχετική αρμόδια αρχή είναι:","o":[{"k":"α","t":"Ένα ποσοστό της συνολικής αξίας των εκδοθέντων κρατικών χρεωστικών τίτλων για κάθε κρατικό εκδότη."},{"k":"β","t":"Ένα ποσοστό της συνολικής ποσότητας των εκδοθέντων κρατικών χρεωστικών τίτλων για κάθε κρατικό εκδότη."},{"k":"γ","t":"Εκείνο που καθορίζεται από την ένωση κρατικών εκδοτών."},{"k":"δ","t":"Το προσδιοριζόμενο από τον ανάδοχο της έκδοσης."}]},{"n":49,"a":"β","q":"Δεν συνιστά χειραγώγηση αγοράς η διενέργεια συναλλαγών με τις οποίες:","o":[{"k":"α","t":"Δίδονται ψευδείς ή παραπλανητικές ενδείξεις για την τιμή ενός χρηματοπιστωτικού μέσου."},{"k":"β","t":"Ο πωλητής μετοχών αποκομίζει υψηλά κέρδη εξαιτίας της χαμηλότερης τιμής στην οποία αγόρασε προγενέστερα τις μετοχές."},{"k":"γ","t":"Δίδονται ψευδείς ή παραπλανητικές ενδείξεις για τη ζήτηση ή την προσφορά ενός χρηματοπιστωτικού μέσου."},{"k":"δ","t":"Διαμορφώνεται η τιμή ενός χρηματοπιστωτικού μέσου σε τεχνητό επίπεδο."}]},{"n":50,"a":"α","q":"Οι περιορισμοί σε ακάλυπτες ανοιχτές πωλήσεις κρατικών χρεωστικών τίτλων δύνανται να ανασταλούν προσωρινά όταν ο όγκος συναλλαγών ενός μήνα μειωθεί κάτω από ένα ποσοστό του μηνιαίου όγκου που τελούσε υπό διαπραγμάτευση τους προηγούμενους 12 μήνες. Το ποσοστό αυτό είναι:","o":[{"k":"α","t":"5%."},{"k":"β","t":"10%."},{"k":"γ","t":"15%."},{"k":"δ","t":"25%."}]},{"n":51,"a":"γ","q":"Ο περιορισμός στις ακάλυπτες ανοικτές πωλήσεις μετοχών / κρατικών χρεωστικών τίτλων:","o":[{"k":"α","t":"Εφαρμόζεται πάντα όταν υπάρχουν ανεπιθύμητα συμβάντα για τη χρηματοπιστωτική σταθερότητα."},{"k":"β","t":"Εφαρμόζεται όταν έχει αρνητική επίπτωση στην αποτελεσματικότητα των χρηματοπιστωτικών αγορών δυσανάλογη προς τα οφέλη του."},{"k":"γ","t":"Εφαρμόζεται σε ανεπιθύμητες εξελίξεις της χρηματοπιστωτικής σταθερότητας υπό προϋποθέσεις."},{"k":"δ","t":"Κατά την κρίση της ΤτΕ."}]},{"n":52,"a":"β","q":"Με μια κάποια τυποποίηση η «χειραγώγηση αγοράς» δύναται να συντελείται:","o":[{"k":"α","t":"Με «συναλλαγές/εντολές» και με «εσωτερική πληροφόρηση»."},{"k":"β","t":"Με «συναλλαγές/εντολές» και με «διαδόσεις...»."},{"k":"γ","t":"Με «διαδόσεις...» και με «εκβίαση»."},{"k":"δ","t":"Με «παραβίαση λογισμικού» και με «πρόκληση εξωτερικών γεγονότων»."}]},{"n":53,"a":"δ","q":"Η χειραγώγηση αγοράς με διαδόσεις συντελείται όταν η διάδοση γίνεται:","o":[{"k":"α","t":"Μόνο μέσω ΜΜΕ."},{"k":"β","t":"Μόνο μέσω διαδικτύου."},{"k":"γ","t":"Με διαδόσεις σε άτυπη βάση (π.χ. ψίθυροι, ηλεκτρονικό ταχυδρομείο)."},{"k":"δ","t":"Με οποιοδήποτε μέσο."}]},{"n":54,"a":"α","q":"Χειραγώγηση μέσω της διάδοσης ψευδών ή παραπλανητικών πληροφοριών σε σχέση με εισηγμένο σε ρυθμιζόμενη αγορά χρηματοπιστωτικό μέσο υπάρχει όταν:","o":[{"k":"α","t":"Ο διαδίδων την πληροφορία γνώριζε κατά τη διάδοση ότι η πληροφορία ήταν ψευδής ή παραπλανητική."},{"k":"β","t":"Ο διαδίδων την πληροφορία δεν γνώριζε κατά τη διάδοση ότι η πληροφορία ήταν ψευδής ή παραπλανητική."},{"k":"γ","t":"Όταν μετά τη διάδοση της πληροφορίας η τιμή του χρηματοπιστωτικού μέσου διαμορφώθηκε σε μη κανονικό ή τεχνητό επίπεδο."},{"k":"δ","t":"Ο διαδίδων την πληροφορία προέβη ταυτοχρόνως σε πράξεις επί του χρηματοπιστωτικού μέσου που είχαν ως αποτέλεσμα τον αθέμιτο επηρεασμό των τιμών του σχετικού μέσου."}]},{"n":55,"a":"α","q":"Ο βαθμός στον οποίο δίδονται εντολές ή διενεργούνται συναλλαγές κατά το χρονικό διάστημα στο οποίο υπολογίζονται οι τιμές αναφοράς, οι τιμές εκκαθάρισης και οι αποτιμήσεις, συνιστά ένδειξη χειραγώγησης της αγοράς:","o":[{"k":"α","t":"Εάν οι εντολές ή συναλλαγές έχουν ως αποτέλεσμα τη μεταβολή ή τον επηρεασμό των τιμών αναφοράς, ή εκκαθάρισης ή των αποτιμήσεων κατ’ επανάληψη."},{"k":"β","t":"Ασχέτως εάν έχουν ως αποτέλεσμα τη μεταβολή ή τον επηρεασμό των τιμών αναφοράς, ή εκκαθάρισης ή των αποτιμήσεων κατ’ επανάληψη."},{"k":"γ","t":"Εάν αυτός που έδωσε τις εντολές ή διενήργησε τις συναλλαγές είχε πρόθεση να χειραγωγήσει την αγορά, ασχέτως εάν απεκόμισε κέρδος από αυτή τη συμπεριφορά."},{"k":"δ","t":"Εάν αυτός που έδωσε τις εντολές ή διενήργησε τις συναλλαγές απεκόμισε κέρδος από τις συγκεκριμένες συναλλαγές."}]},{"n":56,"a":"δ","q":"Χειραγώγηση της αγοράς μπορεί να πραγματοποιηθεί:","o":[{"k":"α","t":"Μόνον μέσω συναλλαγών ή εντολών για τη διενέργεια συναλλαγών ή συμβουλών για μη διενέργεια συναλλαγών."},{"k":"β","t":"Μόνον μέσω εντολών για τη διενέργεια συναλλαγών."},{"k":"γ","t":"Μόνον μέσω συναλλαγών ή εντολών για τη διενέργεια συναλλαγών."},{"k":"δ","t":"Μέσω συναλλαγών ή εντολών για τη διενέργεια συναλλαγών καθώς και μέσω της διάδοσης πληροφοριών οι οποίες δίνουν ή είναι πιθανόν να δώσουν ψευδείς ή παραπλανητικές ενδείξεις σχετικά με χρηματοπιστωτικά μέσα."}]},{"n":57,"a":"γ","q":"Ποιο από τα ακόλουθα χαρακτηριστικά δεν ισχύει για τις ρυθμιζόμενες αγορές;","o":[{"k":"α","t":"Αποτελούν πολυμερή συστήματα συναλλαγών."},{"k":"β","t":"Η λειτουργία τους διέπεται από κανόνες που δεν επιτρέπουν διακριτική ευχέρεια εκτέλεσης συναλλαγών."},{"k":"γ","t":"Εφαρμόζεται προαιρετικά η νομοθεσία για κατάχρηση αγορών."},{"k":"δ","t":"Μπορούν να διαπραγματεύονται χρηματοπιστωτικά μέσα που έχουν εισαχθεί σε άλλη ρυθμιζόμενη αγορά του ΕΟΧ, χωρίς επιπλέον υποχρεώσεις για τους εκδότες."}]},{"n":58,"a":"γ","q":"Η απαγόρευση χειραγώγησης της αγοράς μέσω συναλλαγών αφορά:","o":[{"k":"α","t":"Τους εντολείς των συναλλαγών."},{"k":"β","t":"Τους επαγγελματίες διαμεσολαβητές."},{"k":"γ","t":"Τους εντολείς των συναλλαγών και τους επαγγελματίες διαμεσολαβητές."},{"k":"δ","t":"Ούτε τους εντολείς των συναλλαγών ούτε τους επαγγελματίες διαμεσολαβητές."}]},{"n":59,"a":"γ","q":"Οι πράξεις επί ιδίων μετοχών εξαιρούνται από την κατάχρηση προνομιακής πληροφόρησης και τη χειραγώγηση της αγοράς:","o":[{"k":"α","t":"Σε κάθε περίπτωση."},{"k":"β","t":"Μόνον για τον εκδότη των ίδιων μετοχών."},{"k":"γ","t":"Μόνον εάν διενεργούνται σύμφωνα με τις προϋποθέσεις του Κανονισμού 596/2014 (MAR) της Ευρωπαϊκής Επιτροπής."},{"k":"δ","t":"Μόνον εάν η ονομαστική αξία των ίδιων μετοχών δεν υπερβαίνει το 1/10 του καταβεβλημένου μετοχικού κεφαλαίου του εκδότη."}]},{"n":60,"a":"α","q":"Το πρόγραμμα αγοράς ιδίων μετοχών δεν συνιστά κατάχρηση αγοράς (safe harbour):","o":[{"k":"α","t":"Εάν αποσκοπεί αποκλειστικά στη μείωση του κεφαλαίου της εταιρίας, ή στην εκπλήρωση υποχρεώσεων που απορρέουν από τίτλους ανταλλάξιμους σε μετοχικούς ή στη διάθεση μετοχών στο προσωπικό."},{"k":"β","t":"Εάν ο αριθμός των ιδίων μετοχών που αγοράζονται κάθε μέρα δεν υπερβαίνει το 50% της μέσης ημερήσιας συναλλακτικής δραστηριότητας (ημερήσιος όγκος) της συγκεκριμένης μετοχής κατά τον προηγούμενο μήνα."},{"k":"γ","t":"Εάν γίνεται για στήριξη της τιμής μετοχής."},{"k":"δ","t":"Σε καμία περίπτωση."}]},{"n":61,"a":"α","q":"Τους τρόπους κατάχρησης αγοράς τους διακρίνουμε σε:","o":[{"k":"α","t":"Κατάχρηση προνομιακών πληροφοριών και χειραγώγηση αγοράς."},{"k":"β","t":"Κατάχρηση αγοράς και χειραγώγηση αγοράς."},{"k":"γ","t":"Χειραγώγηση αγοράς και επηρεασμό αγοράς."},{"k":"δ","t":"Καταδολίευση αγοράς και επηρεασμό αγοράς."}]},{"n":62,"a":"δ","q":"Ποιο από τα παρακάτω δε συνιστά χειραγώγηση:","o":[{"k":"α","t":"Η διενέργεια πράξεων σε χρηματοπιστωτικό μέσο κατά την περίοδο υπολογισμού της τιμής κλεισίματος του σχετικού μέσου."},{"k":"β","t":"Η διενέργεια πράξεων σε χρηματοπιστωτικό μέσο που δεν συνεπάγονται πραγματική μεταβολή των ιδιοκτησιακών δικαιωμάτων επ’ αυτού."},{"k":"γ","t":"Η διενέργεια πράξεων σε χρηματοπιστωτικό μέσο στις οποίες τόσο οι εντολές πώλησης όσο και οι εντολές αγοράς εισάγονται ταυτόχρονα στην ίδια τιμή και στον ίδιο όγκο από διαφορετικά αλλά συνεργούντα πρόσωπα."},{"k":"δ","t":"Η διενέργεια πράξεων που βασίζονται σε πληροφορίες ότι έχει κατατεθεί αίτηση πτώχευσης σε θυγατρική εταιρία του εκδότη η οποία μπορεί να επηρεάσει ουσιωδώς την οικονομική κατάσταση και τα αποτελέσματα του εκδότη."}]},{"n":63,"a":"δ","q":"Η προσπάθεια παρέμβασης στην τιμή μετοχής μέσω προ-συνεννοημένων συναλλαγών είναι παράνομη πρακτική διότι:","o":[{"k":"α","t":"Αποσκοπεί στην πραγματοποίηση μεγάλου κεφαλαιακού κέρδους."},{"k":"β","t":"Παραβιάζει την αρχή της ίσης μεταχείρισης των επενδυτών."},{"k":"γ","t":"Αποσκοπεί στη διάδοση εσωτερικής πληροφόρησης."},{"k":"δ","t":"Αποσκοπεί στη τεχνητή μεταβολή της τιμής της μετοχής."}]},{"n":64,"a":"γ","q":"Θεωρείται σημαντική πτώση της αξίας ενός μέσου χρηματαγοράς όταν η μείωση της τιμής του στη διάρκεια μιας μέρας διαπραγμάτευσης είναι:","o":[{"k":"α","t":"0,5% ή περισσότερο."},{"k":"β","t":"1% ή περισσότερο."},{"k":"γ","t":"1,5% ή περισσότερο."},{"k":"δ","t":"2% ή περισσότερο."}]},{"n":65,"a":"α","q":"Κατάχρηση προνομιακής πληροφορίας συντρέχει και όταν ένα πρόσωπο κατέχει προνομιακή πληροφορία και προβαίνει σε χρήση της προνομιακής πληροφορίας δια της ακύρωσης ή της τροποποίησης μιας υφισταμένης εντολής σχετικά με χρηματοπιστωτικό μέσο που αφορά η εν λόγω πληροφορία:","o":[{"k":"α","t":"Εάν η εντολή δόθηκε πριν αποκτήσει το πρόσωπο την προνομιακή πληροφορία."},{"k":"β","t":"Εάν η εντολή δόθηκε ταυτόχρονα με την απόκτηση από το πρόσωπο της προνομιακής πληροφορίας."},{"k":"γ","t":"Εάν η εντολή δόθηκε μετά την απόκτηση από το πρόσωπο της προνομιακής πληροφορίας."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":66,"a":"γ","q":"Η σύσταση, παρότρυνση ή η υπόδειξη για αγορά ή διάθεση χρηματοπιστωτικού μέσου σ’ άλλον από πρόσωπο που κατέχει σχετικές προνομιακές πληροφορίες:","o":[{"k":"α","t":"Είναι διοικητική παράβαση."},{"k":"β","t":"Είναι νομικά αδιάφορη."},{"k":"γ","t":"Είναι αξιόποινη πράξη."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":67,"a":"β","q":"Συναλλαγές κατά την περίοδο διαμόρφωσης της τιμής κλεισίματος της μετοχής:","o":[{"k":"α","t":"Συνιστούν πράξη χειραγώγησης της αγοράς και απαγορεύονται."},{"k":"β","t":"Μπορούν να οδηγήσουν σε χειραγώγηση της αγοράς υπό προϋποθέσεις."},{"k":"γ","t":"Συνιστούν πράξη χειραγώγησης της αγοράς μόνον για τους επαγγελματίες διαμεσολαβητές."},{"k":"δ","t":"Συνιστούν πράξη χειραγώγησης της αγοράς μόνον για τους πελάτες – εντολείς των συναλλαγών."}]},{"n":68,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Συναλλαγές χωρίς πραγματική μεταβίβαση κυριότητας των χρηματοπιστωτικών μέσων συνιστούν χειραγώγηση."},{"k":"β","t":"Συναλλαγές στις οποίες τόσο οι εντολές πώλησης όσο και οι εντολές αγοράς εισάγονται ταυτόχρονα, στην ίδια τιμή και για τον ίδιο όγκο, από διαφορετικά αλλά συνεργούντα μέρη συνιστούν χειραγώγηση."},{"k":"γ","t":"Πράξεις επί ιδίων μετοχών, που διενεργούνται στο πλαίσιο προγραμμάτων επαναγοράς ιδίων μετοχών, και πληρούν τις προϋποθέσεις του Κανονισμού 596/2014, συνιστούν χειραγώγηση."},{"k":"δ","t":"Η διάδοση πληροφοριών, οι οποίες δίνουν ή είναι πιθανόν να δώσουν ψευδείς ή παραπλανητικές ενδείξεις σχετικά με χρηματοπιστωτικά μέσα, εάν ο διαδίδων γνώριζε ή όφειλε να γνωρίζει ότι οι πληροφορίες αυτές ήταν ψευδείς ή παραπλανητικές συνιστά χειραγώγηση."}]},{"n":69,"a":"γ","q":"Ποιες πράξεις δεν συνιστούν χειραγώγηση της αγοράς;","o":[{"k":"α","t":"Συναλλαγές με τις οποίες δίνονται παραπλανητικές ενδείξεις για τις τιμές αγοράς και πώλησης μιας μετοχής."},{"k":"β","t":"Διάδοση ψευδών ή παραπλανητικών ειδήσεων για μια μετοχή."},{"k":"γ","t":"Ο επενδυτής αποκόμισε υψηλά κέρδη από πώληση μετοχών που αγόρασε σε πολύ χαμηλή τιμή προγενέστερα."},{"k":"δ","t":"Αγορά μετοχών σε τιμές που διαμορφώθηκαν σε τεχνητό επίπεδο."}]},{"n":70,"a":"δ","q":"Ποιο από τα παρακάτω συνιστά κατάχρηση προνομιακής πληροφόρησης;","o":[{"k":"α","t":"Διενέργεια πράξεων σε χρηματοπιστωτικό μέσο κατά την περίοδο υπολογισμού της τιμής κλεισίματος."},{"k":"β","t":"Διενέργεια πράξεων σε χρηματοπιστωτικό μέσο που όμως δεν συνιστούν πραγματικά μεταβολή του ιδιοκτησιακού δικαιώματος επ΄ αυτού."},{"k":"γ","t":"Διενέργεια πράξεων σε χρηματοπιστωτικό μέσο όπου τόσο οι εντολές πώλησης όσο και αγοράς εισάγονται ταυτόχρονα στην ίδια τιμή και στον ίδιο όγκο από διαφορετικά αλλά συνεργούντα πρόσωπα."},{"k":"δ","t":"Διενέργεια πράξεων σε χρηματοπιστωτικό μέσο που βασίζονται σε πληροφορία ότι θυγατρική εταιρεία του εκδότη έχει καταθέσει αίτηση πτώχευσης και η πληροφορία αυτή έχει σημαντική επίπτωση στον εκδότη."}]},{"n":71,"a":"δ","q":"Ως χειραγώγηση αγοράς νοείται η διενέργεια συναλλαγών με τις οποίες:","o":[{"k":"α","t":"Δίδονται ψευδείς ή παραπλανητικές ενδείξεις για την τιμή ενός χρηματοπιστωτικού μέσου."},{"k":"β","t":"Δίδονται ψευδείς ή παραπλανητικές πληροφορίες για τη ζήτηση ή την προσφορά ενός χρηματοπιστωτικού μέσου."},{"k":"γ","t":"Διαμορφώνεται η τιμή ενός χρηματοπιστωτικού μέσου σε τεχνητό επίπεδο."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":72,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Η εισαγωγή εντολών (στο ηλεκτρονικό σύστημα συναλλαγών) οι οποίες είναι ανώτερες/κατώτερες από την προηγούμενη τιμή αγοράς/πώλησης, χωρίς να υπάρχει σκοπός εκτέλεσής τους συνιστά χειραγώγηση."},{"k":"β","t":"Συναλλαγές ή εντολές συναλλαγών, κυρίως από εκδότες ή πρόσωπα που ελέγχουν τους εκδότες για να διατηρήσουν την τιμή σε ορισμένο επίπεδο, ιδίως προκειμένου να αποφύγουν την πτώση των τιμών των μετοχών τους ή την έκδοση αρνητικής αξιολόγησης πιστοληπτικής ικανότητας συνιστά χειραγώγηση."},{"k":"γ","t":"Η διατύπωση γνώμης στα μέσα ενημέρωσης είτε άμεσα για ένα χρηματοπιστωτικό μέσο είτε έμμεσα για τον εκδότη του, ενώ ο εκφέρων τη γνώμη έχει επενδύσει στο εν λόγω χρηματοπιστωτικό μέσο ή σε συνδεδεμένο με αυτό παράγωγο χρηματοπιστωτικό μέσο και η εν συνεχεία άντληση, άμεσα ή έμμεσα, οφέλους από τον αντίκτυπο που έχει η γνώμη αυτή στην τιμή του χρηματοπιστωτικού μέσου, εφόσον δεν έχει δημοσιοποιηθεί ταυτόχρονα με τη διατύπωση της γνώμης η συγκεκριμένη σύγκρουση συμφερόντων με σαφήνεια και ευκρίνεια συνιστά χειραγώγηση."},{"k":"δ","t":"Πράξεις σταθεροποίησης ενός χρηματοπιστωτικού μέσου, οι οποίες δεν πληρούν τις προϋποθέσεις περί απαλλαγής του άρθρου 5 του Κανονισμούν MAR, συνιστούν χειραγώγηση."}]},{"n":73,"a":"γ","q":"Είναι αξιόποινη η πραγματοποίηση συναλλαγών ώστε να παρέχονται ψευδείς ή παραπλανητικές ενδείξεις σχετικά με την προσφορά ή ζήτηση ή την τιμή ενός χρηματοπιστωτικού μέσου, εφόσον η μέση ημερήσια αξία των παράνομων συναλλαγών υπερβαίνει το ποσό των:","o":[{"k":"α","t":"50.000 ευρώ."},{"k":"β","t":"100.000 ευρώ."},{"k":"γ","t":"150.000 ευρώ."},{"k":"δ","t":"200.000 ευρώ."}]},{"n":74,"a":"γ","q":"Σε δίκες για τις αξιόποινες πράξεις κατάχρησης αγοράς, η Επιτροπή Κεφαλαιαγοράς έχει δικαίωμα, σε κάθε περίπτωση, να:","o":[{"k":"α","t":"Υποκαθιστά την Εισαγγελική Αρχή."},{"k":"β","t":"Μετέχει με Στέλεχός της στη σύνθεση του Δικαστηρίου."},{"k":"γ","t":"Παρίσταται ως πολιτικώς ενάγουσα."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":75,"a":"α","q":"Το στέλεχος του μέλους ρυθμιζόμενης αγοράς που αναλαμβάνει να εκτελέσει εντολή πελάτη για αγορά μετοχών:","o":[{"k":"α","t":"Δεν επιτρέπεται να γνωστοποιήσει σε τρίτον την πληροφορία αυτή ή να ενεργήσει βάσει αυτής."},{"k":"β","t":"Μπορεί να γνωστοποιήσει την πληροφορία αυτή μόνο στο τμήμα διαχείρισης χαρτοφυλακίων πελατών"},{"k":"γ","t":"Μπορεί να γνωστοποιήσει την πληροφορία αυτή σε πελάτη της εταιρίας, υπό την προϋπόθεση ότι ο πελάτης θα την τηρήσει εμπιστευτική."},{"k":"δ","t":"Δεν έχει καμία υποχρέωση να τηρήσει εμπιστευτική την πληροφορία αυτή."}]},{"n":76,"a":"δ","q":"Στέλεχος μέλους της ρυθμιζόμενης αγοράς που αναλαμβάνει να εκτελέσει εντολή πελάτη για αγορά μετοχών:","o":[{"k":"α","t":"Δεν επιτρέπεται να γνωστοποιήσει την πληροφορία στον προϊστάμενο του."},{"k":"β","t":"Δεν επιτρέπεται να ενεργήσει με βάση αυτή."},{"k":"γ","t":"Δεν επιτρέπεται να γνωστοποιήσει σε τρίτον την πληροφορία."},{"k":"δ","t":"Δεν επιτρέπεται να ενεργήσει με βάση αυτή και να γνωστοποιήσει σε τρίτον την πληροφορία."}]},{"n":77,"a":"γ","q":"Μια εταιρία με μετοχές εισηγμένες στο ΧΑ μπορεί να αναβάλει τη δημοσιοποίηση μιας προνομιακής πληροφορίας που την αφορά άμεσα και να μην τη δημοσιοποιήσει αμέσως εάν πληρούνται οι προϋποθέσεις του νόμου και:","o":[{"k":"α","t":"Έχει ενημερώσει προηγουμένως το ΧΑ."},{"k":"β","t":"Αφενός έχει ενημερώσει την Επιτροπή Κεφαλαιαγοράς και αφετέρου έχει δημιουργήσει (i) στεγανά πληροφόρησης, (ii) έχει συντάξει συμβάσεις εμπιστευτικότητας με όσους έχουν πρόσβαση στην προνομιακή πληροφορία και (iii) τους έχει ενημερώσει για τις απειλούμενες κυρώσεις σε περίπτωση παράβασης της σύμβασης εμπιστευτικότητας."},{"k":"γ","t":"Έχει δημιουργήσει (i) στεγανά πληροφόρησης, (ii) έχει συντάξει συμβάσεις εμπιστευτικότητας με όσους έχουν πρόσβαση στην προνομιακή πληροφορία και (iii) τους έχει ενημερώσει για τις απειλούμενες κυρώσεις σε περίπτωση παράβασης της σύμβασης εμπιστευτικότητας."},{"k":"δ","t":"Κρίνει ότι το επενδυτικό κοινό έχει ενημερωθεί επαρκώς από ανώνυμα δημοσιεύματα των εφημερίδων."}]},{"n":78,"a":"γ","q":"Για την πρόσβαση της ΕΚ σε οποιοδήποτε στοιχείο στο πλαίσιο διερεύνησης ενδεχομένων κατάχρησης αγοράς:","o":[{"k":"α","t":"Μπορεί, ως προς καταθετικά / επενδυτικά προϊόντα/λογαριασμούς, να αντιταχθεί το τραπεζικό/χρηματιστηριακό απόρρητο."},{"k":"β","t":"Δεν μπορεί να αντιταχθεί οποιοδήποτε επαγγελματικό απόρρητο, εφόσον η ΕΚ έχει προηγουμένως ενημερώσει την οικεία ένωση (Ένωση Τραπεζών, Ένωση Θεσμικών Επενδυτών κ.τ.λ.)."},{"k":"γ","t":"Δεν μπορεί να αντιταχθεί επαγγελματικό απόρρητο."},{"k":"δ","t":"Προαπαιτείται ομόφωνη απόφαση του ΔΣ της ΕΚ."}]},{"n":79,"a":"δ","q":"Οι φορείς, οι πράξεις των οποίων εξαιρούνται από τις διατάξεις περί κατάχρησης αγοράς είναι:","o":[{"k":"α","t":"Οι διαχειριστές αγορών, οι εθνικές κεντρικές τράπεζες και τα κράτη-μέλη της ΕΕ."},{"k":"β","t":"Τα κράτη-μέλη της ευρωζώνης, το Ε.Σ.Κ.Τ., και οι εθνικές κεντρικές τράπεζες."},{"k":"γ","t":"Οι επαγγελματικές ενώσεις, οι εθνικές κεντρικές τράπεζες και τα κράτη-μέλη της ΕΕ."},{"k":"δ","t":"Τα κράτη - μέλη της ΕΕ, το Ε.Σ.Κ.Τ. και οι εθνικές κεντρικές τράπεζες."}]},{"n":80,"a":"β","q":"Αναλυτές που εκπονούν προτάσεις επενδυτικής στρατηγικής για χρηματοπιστωτικά μέσα εισηγμένων εταιριών:","o":[{"k":"α","t":"Γνωστοποιούν τυχόν συγκρούσεις συμφερόντων, εφόσον δεν υφίσταται σύμφωνο εμπιστευτικότητας."},{"k":"β","t":"Γνωστοποιούν τυχόν συγκρούσεις συμφερόντων, σε κάθε περίπτωση."},{"k":"γ","t":"Δεν γνωστοποιούν τυχόν συγκρούσεις συμφερόντων."},{"k":"δ","t":"Υποχρεούνται να έχουν συνάξει σύμφωνο εμπιστευτικότητας με την εισηγμένη."}]},{"n":81,"a":"δ","q":"Τα πρόσωπα που διαμεσολαβούν κατ’επάγγελμα στην κατάρτιση συναλλαγών:","o":[{"k":"α","t":"Δεν έχουν καμία ευθύνη για τις συναλλαγές πελατών τους που συνιστούν κατάχρηση αγοράς."},{"k":"β","t":"Έχουν την ίδια ευθύνη με τους πελάτες τους για συναλλαγές τους που συνιστούν κατάχρηση αγοράς."},{"k":"γ","t":"Οφείλουν να απέχουν από συναλλαγές προσώπων στα οποία έχουν επιβληθεί κυρώσεις για κατάχρηση αγοράς."},{"k":"δ","t":"Οφείλουν να ειδοποιούν την Επιτροπή Κεφαλαιαγοράς, όταν υπάρχουν σοβαρές υπόνοιες, ότι συναλλαγές που έχουν καταρτισθεί θα μπορούσαν να συνιστούν κατάχρηση αγοράς."}]},{"n":82,"a":"δ","q":"Περιορισμοί στη διενέργεια συναλλαγών που περιλαμβάνουν εσωτερική πληροφόρηση ισχύουν για όλα τα ακόλουθα πρόσωπα, εκτός από:","o":[{"k":"α","t":"Τα διευθυντικά στελέχη και τα μέλη διοικητικού συμβουλίου."},{"k":"β","t":"Τους συγγενείς των διευθυντικών στελεχών και των μελών ΔΣ."},{"k":"γ","t":"Τους βασικούς μετόχους."},{"k":"δ","t":"Τα διευθυντικά στελέχη, τα μέλη διοικητικού συμβουλίου, οι συγγενείς των διευθυντικών στελεχών και των μελών διοικητικού συμβουλίου, καθώς και οι βασικοί μέτοχοι υφίστανται περιορισμούς."}]},{"n":83,"a":"γ","q":"Η απόκτηση ιδίων μετοχών από την εισηγμένη εταιρία δεν συνιστά κατάχρηση της αγοράς:","o":[{"k":"α","t":"Όταν δεν υπερβαίνει σε ποσοστό το 10% του συνόλου των μετοχών της εταιρίας."},{"k":"β","t":"Όταν γίνεται ύστερα από έγκριση της Επιτροπής Κεφαλαιαγοράς."},{"k":"γ","t":"Όταν διενεργείται στο πλαίσιο προγράμματος αγοράς ιδίων μετοχών σύμφωνα με τον Ευρωπαϊκό Κανονισμό 596/2014."},{"k":"δ","t":"Όταν για την απόκτηση λαμβάνεται απόφαση με την καταστατική πλειοψηφία των διατάξεων του κ.ν. 2910/1920 η οποία εγκρίνεται από την Επιτροπή Κεφαλαιαγοράς."}]},{"n":84,"a":"δ","q":"Κατάχρηση προνομιακής πληροφορίας συνιστά:","o":[{"k":"α","t":"Η χρήση μιας προνομιακής πληροφορίας για την απόκτηση ή διάθεση για ίδιο λογαριασμό χρηματοπιστωτικών μέσων που αφορά αυτή η πληροφορία."},{"k":"β","t":"Η χρήση μιας προνομιακής πληροφορίας για την απόκτηση ή διάθεση για λογαριασμό τρίτου χρηματοπιστωτικών μέσων που αφορά αυτή η πληροφορία."},{"k":"γ","t":"Η χρήση μιας προνομιακής πληροφορίας δια της ακύρωσης ή τροποποίησης μιας εντολής σχετικά με το χρηματοπιστωτικό μέσο στο οποίο αφορά η πληροφορία, η οποία εντολή δόθηκε πριν αποκτήσει το πρόσωπο την προνομιακή πληροφορία."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":85,"a":"β","q":"Για τους σκοπούς του Κανονισμού 236/2012, μια θέση που προκύπτει από ποιό από τα παρακάτω θα θεωρείται αρνητική θέση σχετικά με το εκδοθέν μετοχικό κεφάλαιο μιας εταιρείας ή τους εκδοθέντες κρατικούς χρεωστικούς τίτλους;","o":[{"k":"α","t":"Η κατοχή ενός χρεωστικού τίτλου που εκδόθηκε από έναν κρατικό εκδότη."},{"k":"β","t":"Η ανοικτή πώληση μιας μετοχής που εκδόθηκε από την εταιρία."},{"k":"γ","t":"Η διενέργεια μιας συναλλαγής, όπου το αποτέλεσμα ή ένα εκ των αποτελεσμάτων της οποίας είναι η παροχή χρηματοπιστωτικού πλεονεκτήματος στο συναλλασσόμενο φυσικό ή νομικό πρόσωπο σε περίπτωση αύξησης της τιμής ή της αξίας της μετοχής ή του χρεωστικού τίτλου."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":86,"a":"δ","q":"Αρνητική Θέση, σχετικά με το εκδοθέν μετοχικό κεφάλαιο μιας εταιρίας ή τους εκδοθέντες κρατικούς χρεωστικούς τίτλους, θεωρείται μια θέση που προκύπτει από οποιοδήποτε από τα παρακάτω:","o":[{"k":"α","t":"Ανοικτή πώληση μιας μετοχής που εκδόθηκε από την εταιρία ή διενέργεια μιας συναλλαγής η οποία δημιουργεί ή σχετίζεται ρακτική συνιστά πιθανή απειλή για τη χρηματοπιστωτική σταθερότητα ή την εμπιστοσύνη των αγορών στην Ένωση. Η ΕΑΚΑΑ δημοσιεύει έκθεση με τα ευρήματά της και τυχόν συστάσεις ή κυρώσεις για το ζήτημα ή την πρακτική εντός 3 μηνών από το τέλος της εν λόγω έρευνας."},{"k":"δ","t":"Κατόπιν αιτήσεως μιας ή περισσοτέρων αρμοδίων αρχών, του Ευρωπαϊκού Κοινοβουλίου, του Συμβουλίου ή της Επιτροπής ή Εισαγγελικής Αρχής ή με δική της πρωτοβουλία, να διεξαγάγει έρευνα σχετικά με συγκεκριμένο ζήτημα ή πρακτική που αφορά τις ανοικτές πωλήσεις ή τη χρήση των συμβολαίων πιστωτικής αθετήσεως, για να αξιολογήσει εάν το ζήτημα ή η πρακτική συνιστά πιθανή απειλή για τη χρηματοπιστωτική σταθερότητα ή την εμπιστοσύνη των αγορών στην Ένωση. Η ΕΑΚΑΑ δημοσιεύει έκθεση με τα ευρήματά της και τυχόν συστάσεις για το ζήτημα ή την πρακτική εντός 3 μηνών από το τέλος της εν λόγω έρευνας."}]},{"n":92,"a":"γ","q":"«Ανοικτή πώληση» σε σχέση με μετοχή ή χρεωστικό τίτλο νοείται:","o":[{"k":"α","t":"Κάθε πώληση μετοχής ή χρεωστικού τίτλου που ο πωλητής δεν κατέχει κατά το χρόνο συνάψεως της συμφωνίας πωλήσεως, συμπεριλαμβανομένης μιας πωλήσεως στην οποία κατά το χρόνο συνάψεως της συμφωνίας πωλήσεως ο πωλητής έχει δανειστεί ή έχει συμφωνήσει να δανειστεί τη μετοχή ή το χρεωστικό τίτλο για παράδοση κατά το διακανονισμό, η οποία δεν περιλαμβάνει: i) Πώληση από οιοδήποτε συμβαλλόμενο μέρος βάσει συμφωνίας επαναγοράς όπου το ένα συμβαλλόμενο μέρος συμφωνεί να πωλήσει στο άλλο μέρος έναν τίτλο σε καθορισμένη τιμή δεσμεύοντας το τελευταίο να επαναπωλήσει τον τίτλο σε μεταγενέστερη ημερομηνία σε διαφορετική καθορισμένη τιμή, ή ii) σύναψη συμβολαίου μελλοντικής εκπληρώσεως ή άλλου συμβολαίου παραγώγων δια του οποίου συμφωνείται η πώληση τίτλων σε καθορισμένη τιμή σε κάποια μελλοντική ημερομηνία."},{"k":"β","t":"Κάθε πώληση μετοχής ή χρεωστικού τίτλου που ο πωλητής δεν κατέχει κατά το χρόνο συνάψεως της συμφωνίας πωλήσεως, συμπεριλαμβανομένης μιας πωλήσεως στην οποία κατά το χρόνο συνάψεως της συμφωνίας πωλήσεως ο συμβόλαιο ανταλλαγής πιστωτικής αθέτησης» νοείται:","o":[{"k":"α","t":"Μια σύμβαση παραγώγου στην οποία ο ένας συμβαλλόμενος καταβάλλει εντόκως τίμημα σε έναν άλλο συμβαλλόμενο ως αντάλλαγμα για πληρωμή ή άλλου είδους παροχή σε περίπτωση πιστωτικού συμβάντος που αφορά τη συγκεκριμένη οντότητα αναφοράς καθώς και για οποιαδήποτε άλλη αθέτηση πληρωμής σχετιζόμενη με την εν λόγω σύμβαση παραγώγου, που έχει παρόμοια οικονομική επίπτωση."},{"k":"β","t":"Μια σύμβαση παραγώγου στην οποία ο ένας συμβαλλόμενος καταβάλλει τίμημα σε έναν άλλο συμβαλλόμενο ως αντάλλαγμα για πληρωμή ή άλλου είδους παροχή σε περίπτωση πιστωτικού συμβάντος που αφορά τη συγκεκριμένη οντότητα αναφοράς καθώς και για οποιαδήποτε άλλη αθέτηση πληρωμής σχετιζόμενη με την εν λόγω σύμβαση παραγώγου, που έχει παρόμοια οικονομική επίπτωση."},{"k":"γ","t":"Μια σύμβαση παραγώγου στην οποία ο ένας συμβαλλόμενος καταβάλλει τίμημα σε έναν άλλο συμβαλλόμενο ως αντάλλαγμα για πληρωμή ή άλλου είδους παροχή σε περίπτωση πιστωτικού ή άλλου συμβάντος που αφορά τη συγκεκριμένη οντότητα αναφοράς καθώς και για οποιαδήποτε άλλη αθέτηση πληρωμής σχετιζόμενη με την εν λόγω σύμβαση παραγώγου, που έχει παρόμοια οικονομική επίπτωση."},{"k":"δ","t":"Μια σύμβαση παραγώγου στην οποία ο ένας συμβαλλόμενος καταβάλλει τίμημα σε έναν άλλο συμβαλλόμενο ως αντάλλαγμα για πληρωμή ή άλλου είδους παροχή σε περίπτωση πιστωτικού συμβάντος που αφορά τη συγκεκριμένη οντότητα αναφοράς καθώς και για οποιαδήποτε άλλη αθέτηση πληρωμής ή φυσική καταστροφή σχετιζόμενη με την εν λόγω σύμβαση παραγώγου, που έχει παρόμοια οικονομική επίπτωση."}]},{"n":94,"a":"δ","q":"Ενδεικτικά, νόμιμο συμφέρον που θα μπορούσε να δικαιολογήσει την αναβολή δημοσιοποίησης προνομιακών πληροφοριών από τις εταιρίες είναι:","o":[{"k":"α","t":"Διαπραγματεύσεις που βρίσκονται σε εξέλιξη, ή σχετικά με αυτές στοιχεία, των οποίων η δημοσιοποίηση ενδέχεται να επηρεάσει καθοριστικά την έκβαση ή την ομαλή τους ροή."},{"k":"β","t":"Ύπαρξη παρατεταμένης διαδικασίας που εξελίσσεται σε στάδια."},{"k":"γ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."},{"k":"δ","t":"Διαπραγματεύσεις που βρίσκονται σε εξέλιξη, ή σχετικά με αυτές στοιχεία, των οποίων η δημοσιοποίηση ενδέχεται να επηρεάσει καθοριστικά την έκβαση ή την ομαλή τους ροή και η ύπαρξη παρατεταμένης διαδικασίας που εξελίσσεται σε στάδια."}]},{"n":95,"a":"γ","q":"Η προστασία από τις πράξεις κατάχρησης αγοράς παρέχεται σε σχέση με τα παρακάτω χρηματοπιστωτικά μέσα:","o":[{"k":"α","t":"Εκείνα που είναι εισηγμένα προς διαπραγμάτευση σε ρυθμιζόμενη αγορά."},{"k":"β","t":"Εκείνα που είναι εισηγμένα προς διαπραγμάτευση σε ρυθμιζόμενη αγορά και εκείνα που τυγχάνουν διαπραγμάτευσης σε πολυμερή μηχανισμό διαπραγμάτευσης (ΠΜΔ)."},{"k":"γ","t":"Εκείνα που τυγχάνουν διαπραγμάτευσης σε έναν από τους παρακάτω τόπους διαπραγμάτευσης: ρυθμιζόμενη αγορά, ΠΜΔ και μηχανισμό οργανωμένης διαπραγμάτευσης (ΜΟΔ)."},{"k":"δ","t":"Εκείνα που είναι εισηγμένα προς διαπραγμάτευση σε ρυθμιζόμενη αγορά σε σχέση με πράξεις που διενεργούνται επ’ αυτών μόνο εντός ρυθμιζόμενης αγοράς και όχι σε ΠΜΔ ή ΜΟΔ διότι τότε διενεργούνται εξωχρηματιστηριακώς."}]},{"n":96,"a":"α","q":"Οι προνομιακές πληροφορίες κατά το δίκαιο της κεφαλαιαγοράς μπορεί να αφορούν: I. Μετοχές και άλλες κινητές αξίες της κεφαλαιαγοράς ως και παράγωγα χρηματοπιστωτικά μέσα επ’ αυτών. IΙ. Χρηματιστηριακές συναλλαγές τοις μετρητοίς επί εμπορευμάτων. III. Παράγωγα χρηματοπιστωτικά μέσα επί εμπορευμάτων διακανονιζόμενα με φυσική παράδοση. IV. Δικαιώματα εκπομπής ρύπων.","o":[{"k":"α","t":"I, III και ΙV μόνο."},{"k":"β","t":"I και μόνο."},{"k":"γ","t":"II, III και IV μόνο."},{"k":"δ","t":"I, II, III και IV."}]},{"n":97,"a":"γ","q":"Δεν συνιστά παράνομη ανακοίνωση προνομιακής πληροφορίας:","o":[{"k":"α","t":"Η αποκάλυψή της στο πλαίσιο βολιδοσκόπησης της αγοράς από «συμμετέχοντα στην αγορά ο οποίος αποκαλύπτει πληροφορίες» ανεξαρτήτως αν ο αποδέκτης της βολιδοσκόπησης της αγοράς έχει συγκατατεθεί στη λήψη της προνομιακής πληροφορίας ή όχι."},{"k":"β","t":"Η αποκάλυψή της σε τρίτο, από το πρόσωπο στο οποίο ανακοινώνεται (επακόλουθη ανακοίνωση), εφόσον το εν λόγω πρόσωπο αλλά και ο τρίτος γνώριζαν ή όφειλαν να γνωρίζουν τον προνομιακό χαρακτήρα της."},{"k":"γ","t":"Η αποκάλυψή της σε τρίτο, από το πρόσωπο στο οποίο ανακοινώνεται (επακόλουθη ανακοίνωση), εφόσον το εν λόγω πρόσωπο δεν γνώριζε και ούτε όφειλε να γνωρίζει τον προνομιακό χαρακτήρα της."},{"k":"δ","t":"Η αποκάλυψή της από το πρόσωπο στο οποίο ανακοινώνεται (επακόλουθη ανακοίνωση), όταν το πρόσωπο αυτό δεν προβαίνει το ίδιο σε συναλλαγή βάσει της πληροφορίας αλλά ο τρίτος."}]},{"n":98,"a":"γ","q":"Τα πρόσωπα που ασκούν διευθυντικά καθήκοντα, καθώς και τα πρόσωπα που έχουν στενούς δεσμούς με αυτά, γνωστοποιούν στον εκδότη ή στον συμμετέχοντα σε αγορά δικαιωμάτων εκπομπής και στην αρμόδια αρχή: I. Κάθε συναλλαγή που πραγματοποιείται για ίδιο λογαριασμό και η οποία σχετίζεται με τις μετοχές ή τους χρεωστικούς τίτλους του εν λόγω εκδότη. II. κάθε συναλλαγή που πραγματοποιείται για ίδιο λογαριασμό και η οποία σχετίζεται με τις μετοχές ή τους χρεωστικούς τίτλους του εν λόγω εκδότη ή με παράγωγα μέσα ή άλλα συνδεδεμένα χρηματοπιστωτικά μέσα; III. Κάθε συναλλαγή δανεισμού χρηματοπιστωτικών μέσων όπου συντρέχει περίπτωση. IV. Κάθε συναλλαγή που διενεργούν επί δικαιωμάτων εκπομπής μέσω χώρου πλειστηριασμού.","o":[{"k":"α","t":"I και IΙ μόνο."},{"k":"β","t":"I, II και ΙΙΙ μόνο."},{"k":"γ","t":"I, II, ΙΙΙ και IV μόνο."},{"k":"δ","t":"I και μόνο."}]},{"n":99,"a":"γ","q":"Σε περίπτωση πράξεων σταθεροποίησης, τα στοιχεία όλων των συναλλαγών των σχετικών πράξεων σταθεροποίησης πρέπει να κοινοποιούνται από τους εκδότες, τους προσφέροντες ή τις οντότητες που αναλαμβάνουν τις πράξεις σταθεροποίησης, ανεξάρτητα από το αν ενεργούν ή όχι για λογαριασμό των προσώπων αυτών, στην αρμόδια αρχή του τόπου διαπραγμάτευσης το αργότερο μέχρι:","o":[{"k":"α","t":"Τη λήξη της δεύτερης ημερήσιας συνεδρίασης μετά την ημερομηνία σύναψης των συναλλαγών αυτών."},{"k":"β","t":"Τη λήξη της έβδομης ημερήσιας συνεδρίασης μετά την ημερομηνία διακανονισμού των συναλλαγών αυτών."},{"k":"γ","t":"Τη λήξη της έβδομης ημερήσιας συνεδρίασης μετά την ημερομηνία εκτέλεσης των συναλλαγών αυτών."},{"k":"δ","t":"Τη λήξη της δεύτερης ημερήσιας συνεδρίασης μετά την ημερομηνία διακανονισμού των συναλλαγών αυτών."}]},{"n":100,"a":"δ","q":"Ποια πρόσωπα από τα παρακάτω οφείλουν να δημοσιοποιούν προνομιακές πληροφορίες που αφορούν δικαιώματα εκπομπής:","o":[{"k":"α","t":"Κάθε επιχείρηση που διαθέτει σχετικά δικαιώματα εκπομπής εφόσον είναι εισηγμένη."},{"k":"β","t":"Οι επιχειρήσεις επενδύσεων και οι τράπεζες εφόσον διενεργούν συναλλαγές επί μετοχών εισηγμένων επιχειρήσεων που διαθέτουν σχετικά δικαιώματα εκπομπής."},{"k":"γ","t":"Κάθε συμμετέχων σε αγορά δικαιωμάτων εκπομπής εφόσον κατέχει τέτοιες πληροφορίες στο πλαίσιο εντολών που λαμβάνει από επενδυτές πελάτες του προς διενέργεια σχετικών συναλλαγών."},{"k":"δ","t":"Κάθε συμμετέχων σε αγορά δικαιωμάτων εκπομπής, εφόσον κατέχει τέτοιες πληροφορίες σχετικά με την επιχείρησή του."}]},{"n":101,"a":"γ","q":"Οι εκδότες επικαιροποιούν άμεσα τον κατάλογο προσώπων που κατέχουν προνομιακή πληροφορία: Ι) όταν υπάρχει κάποια αλλαγή όσον αφορά την αιτία για την οποία περιλαμβάνεται ήδη ένα πρόσωπο στον κατάλογο των προσώπων που κατέχουν προνομιακή πληροφορία. II) όταν υπάρχει κάποιο νέο πρόσωπο το οποίο έχει πρόσβαση σε προνομιακή πληροφορία και το οποίο πρέπει, κατά συνέπεια, να προστεθεί στον κατάλογο προσώπων που έχουν πρόσβαση σε προνομιακή πληροφορία. III) σε κάθε περίπτωση σε ετήσια βάση. IV) όταν ένα πρόσωπο παύει να έχει πρόσβαση σε προνομιακή πληροφορία.","o":[{"k":"α","t":"I, ΙΙ, ΙΙΙ και IV."},{"k":"β","t":"I, II και ΙΙΙ και μόνο."},{"k":"γ","t":"I, II, IV και μόνο."},{"k":"δ","t":"I και II μόνο."}]},{"n":102,"a":"β","q":"Η προνομιακή πληροφορία που αφορά εκδότες, των οποίων τα χρηματοπιστωτικά μέσα έχουν εισαχθεί προς διαπραγμάτευση σε αγορά ανάπτυξης ΜΜΕ:","o":[{"k":"α","t":"Αναρτάται υποχρεωτικά τόσο στον δικτυακό τόπο του εκδότη όσο και σε αυτόν του τόπου διαπραγμάτευσης όπου έχουν εισαχθεί."},{"k":"β","t":"Δύναται να αναρτηθεί στον δικτυακό τόπο του τόπου διαπραγμάτευσης όπου έχουν εισαχθεί και όχι στον δικτυακό τόπο του εκδότη, εφόσον ο τόπος διαπραγμάτευσης επιλέξει να παράσχει αυτή την υπηρεσία στους εκδότες της εν λόγω αγοράς."},{"k":"γ","t":"Αναρτάται μόνο στον δικτυακό τόπο του τόπου διαπραγμάτευσης όπου έχουν εισαχθεί και προαιρετικά στον δικτυακό τόπο του εκδότη, σε κάθε περίπτωση."},{"k":"δ","t":"Αναρτάται προαιρετικά στον τόπο διαπραγμάτευσης όπου έχουν εισαχθεί και υποχρεωτικά στον δικτυακό τόπο του εκδότη και της αρμόδιας αρχής."}]},{"n":103,"a":"δ","q":"Η προστασία από τις πράξεις κατάχρησης αγοράς εφαρμόζεται:","o":[{"k":"α","t":"Μόνο στις συναλλαγές σε χρηματοπιστωτικά μέσα που διενεργούνται σε τόπο διαπραγμάτευσης."},{"k":"β","t":"Στις συναλλαγές ή εντολές προς διενέργεια συναλλαγών σε χρηματοπιστωτικά μέσα μόνο εφόσον διενεργούνται σε τόπο διαπραγμάτευσης."},{"k":"γ","t":"Μόνο σε συναλλαγές σε χρηματοπιστωτικά μέσα, και όχι σε εντολές προς διενέργεια τέτοιων συναλλαγών, ανεξάρτητα από το αν αυτές διενεργούνται σε τόπο διαπραγμάτευσης."},{"k":"δ","t":"Σε συναλλαγές και εντολές που αφορούν σε χρηματοπιστωτικά μέσα ανεξάρτητα από το αν αυτές λαμβάνουν ή όχι χώρα σε τόπο διαπραγμάτευσης."}]},{"n":104,"a":"δ","q":"Σε ποια από τα παρακάτω χρηματοπιστωτικά μέσα εφαρμόζονται οι προϋποθέσεις του Κανονισμού ΕΕ 596/2014 για την κατάχρηση αγοράς;","o":[{"k":"α","t":"Χρηματοπιστωτικά μέσα που έχουν εισαχθεί, ή που έχουν υποβάλει αίτηση εισαγωγής, προς διαπραγμάτευση σε ΟΑ."},{"k":"β","t":"Χρηματοπιστωτικά μέσα που διαπραγματεύονται σε ΠΜΔ, ή που έχουν υποβάλει αίτηση εισαγωγής για διαπραγμάτευση."},{"k":"γ","t":"Χρηματοπιστωτικά μέσα που διαπραγματεύονται σε Μηχανισμό Οργανωμένης Διαπραγμάτευσης (ΜΟΔ)."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":105,"a":"α","q":"Η Ελληνική Επιτροπή Κεφαλαιαγοράς σχετικά με την εφαρμογή του πλαισίου Κατάχρησης Αγοράς είναι αρμόδια για: I. Πράξεις ή παραλείψεις που λαμβάνουν χώρα στην ημεδαπή και σχετίζονται με χρηματοπιστωτικά ή άλλα μέσα που διαπραγματεύονται σε τόπους διαπραγμάτευσης που λειτουργούν στην ημεδαπή ή σε άλλα κράτη μέλη. II. Πράξεις ή παραλείψεις που λαμβάνουν χώρα στην αλλοδαπή και σχετίζονται με χρηματοπιστωτικά ή άλλα μέσα που διαπραγματεύονται σε τόπους διαπραγμάτευσης που λειτουργούν στην ημεδαπή. III. Πράξεις ή παραλείψεις που λαμβάνουν χώρα στην αλλοδαπή και σχετίζονται με χρηματοπιστωτικά ή άλλα μέσα που διαπραγματεύονται σε τόπους διαπραγμάτευσης που λειτουργούν στην αλλοδαπή ή σε άλλα κράτη μέλη. IV. Πράξεις ή παραλείψεις που λαμβάνουν χώρα στην ημεδαπή και σχετίζονται με χρηματοπιστωτικά ή άλλα μέσα που διαπραγματεύονται σε τόπους διαπραγμάτευσης που λειτουργούν σε τρίτα κράτη.","o":[{"k":"α","t":"I, II."},{"k":"β","t":"III, IV."},{"k":"γ","t":"II, III."},{"k":"δ","t":"I, II, III, IV."}]},{"n":106,"a":"β","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Πρόσωπο κάτοχος προνομιακής πληροφόρησης δεν συνεπάγεται ότι την έχει χρησιμοποιήσει, και επομένως έχει προβεί σε κατάχρηση αυτής, βάσει μιας πράξης απόκτησης ή διάθεσης, εφόσον είναι διαχειριστής αμοιβαίων κεφαλαίων."},{"k":"β","t":"Πρόσωπο κάτοχος προνομιακής πληροφόρησης δεν συνεπάγεται ότι την έχει χρησιμοποιήσει, και επομένως έχει προβεί σε κατάχρηση αυτής, βάσει μιας πράξης απόκτησης ή διάθεσης, εφόσον για το χρηματοπιστωτικό μέσο που αφορά η πληροφορία είναι ειδικός διαπραγματευτής."},{"k":"γ","t":"Πρόσωπο κάτοχος προνομιακής πληροφόρησης δεν συνεπάγεται ότι την έχει χρησιμοποιήσει, και επομένως έχει προβεί σε κατάχρηση αυτής, βάσει μιας πράξης απόκτησης ή διάθεσης, όταν διαχειρίζεται κεφάλαια πελατών του."},{"k":"δ","t":"Πρόσωπο κάτοχος προνομιακής πληροφόρησης δεν συνεπάγεται ότι την έχει χρησιμοποιήσει, και επομένως έχει προβεί σε κατάχρηση αυτής, βάσει μιας πράξης απόκτησης ή διάθεσης, εφόσον για το χρηματοπιστωτικό μέσο που αφορά η πληροφορία η ΑΕΠΕΥ στην οποία εργάζεται είναι ανάδοχος σε αύξηση μετοχικού κεφαλαίου."}]},{"n":107,"a":"γ","q":"Ποιες από τις παρακάτω ενέργειες αποτελούν ενδεικτικές συμπεριφορές χειραγώγησης; I. Η χρησιμοποίηση στρατηγικών αλγοριθμικών συναλλαγών και συναλλαγών υψηλής συχνότητας, οι οποίες έχουν ως αποτέλεσμα τον τεχνητό προσδιορισμό των τιμών ή τη διαμόρφωση της τιμής ανοίγματος ή κλεισίματος. II. Πώληση από τον οικονομικό διευθυντή εισηγμένης στο ΧΑ εταιρίας του συνόλου των μετοχών που κατείχε σε αυτή πριν την ανακοίνωση των ετήσιων οικονομικών της αποτελεσμάτων. III. Η αγορά ή η πώληση στη δευτερογενή αγορά δικαιωμάτων εκπομπής ή συνδεόμενων παραγώγων πριν τον σχετικό πλειστηριασμό με αποτέλεσμα τον προσδιορισμό της τιμής εκκαθάρισης των εκπλειστηριαζόμενων προϊόντων σε μη κανονικό ή τεχνητό επίπεδο. IV. Αυξημένος αριθμός εντολών για διενέργεια συναλλαγών επικεντρωμένος σε μικρό χρονικό διάστημα με αποτέλεσμα τη μεταβολή της τιμής.","o":[{"k":"α","t":"I, II."},{"k":"β","t":"II, IV."},{"k":"γ","t":"I, III, IV."},{"k":"δ","t":"II."}]},{"n":108,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Πρακτική αγοράς που έχει καθιερωθεί από αρμόδια αρχή ως αποδεκτή σε συγκεκριμένη αγορά θεωρείται εφαρμοστέα σε όλες τις αγορές της ευρωπαϊκής ένωσης."},{"k":"β","t":"Πρακτική αγοράς που έχει καθιερωθεί από αρμόδια αρχή ως αποδεκτή σε συγκεκριμένη αγορά δεν θεωρείται εφαρμοστέα σε άλλες αγορές, παρά μόνο εάν υπάρχουν παράλληλα εισηγμένα χρηματοπιστωτικά μέσα σε αυτήν."},{"k":"γ","t":"Πρακτική αγοράς που έχει καθιερωθεί από αρμόδια αρχή ως αποδεκτή σε συγκεκριμένη αγορά δεν θεωρείται εφαρμοστέα σε άλλες αγορές, εκτός εάν η εν λόγω πρακτική έχει γίνει αποδεκτή και από τις αρμόδιες αρχές των άλλων αγορών."},{"k":"δ","t":"Πρακτική αγοράς που έχει καθιερωθεί από αρμόδια αρχή ως αποδεκτή σε συγκεκριμένη αγορά θεωρείται εφαρμοστέα σε όλες τις αγορές της ευρωπαϊκής ένωσης, εάν η εν λόγω πρακτική γίνει αποδεκτή και από ακόμα δύο αρμόδιες αρχές άλλων αγορών."}]},{"n":109,"a":"δ","q":"Ποια από τις παρακάτω συμπεριφορές δεν αποτελεί ένδειξη κατάχρησης προνομιακής πληροφόρησης;","o":[{"k":"α","t":"Ο πελάτης ανοίγει λογαριασμό με την ΕΠΕΥ (ΠΙ) και αμέσως δίνει εντολή για τη διενέργεια συναλλαγής σημαντικού όγκου."},{"k":"β","t":"Η επενδυτική συμπεριφορά του πελάτη αποκλίνει από την προηγούμενη συναλλακτική του δραστηριότητα (προϊόν, ποσό, όγκος , χρόνος διακράτησης)."},{"k":"γ","t":"Ο πελάτης ζητάει άμεση εκτέλεση χωρίς να ενδιαφέρεται για την τιμή."},{"k":"δ","t":"Παρατηρείται ασυνήθιστη συγκέντρωση εντολών μεταξύ μικρού αριθμού πελατών που συνδέονται μεταξύ τους με αποτέλεσμα την αύξηση της τιμής της μετοχής."}]},{"n":110,"a":"α","q":"Χειραγώγηση μέσω της διάδοσης ψευδών ή παραπλανητικών πληροφοριών σε σχέση με εισηγμένο σε ρυθμιζόμενη αγορά χρηματοπιστωτικό μέσο υπάρχει όταν:","o":[{"k":"α","t":"Ο διαδίδων την πληροφορία γνώριζε κατά τη διάδοση ότι η πληροφορία ήταν ψευδής ή παραπλανητική."},{"k":"β","t":"Ο διαδίδων την πληροφορία δεν γνώριζε κατά τη διάδοση ότι η πληροφορία ήταν ψευδής ή παραπλανητική."},{"k":"γ","t":"Μετά τη διάδοση της πληροφορίας η τιμή του χρηματοπιστωτικού μέσου διαμορφώθηκε σε μη κανονικό ή τεχνητό επίπεδο."},{"k":"δ","t":"Ο διαδίδων την πληροφορία προέβη ταυτοχρόνως σε πράξεις επί του χρηματοπιστωτικού μέσου που είχαν ως αποτέλεσμα τον αθέμιτο επηρεασμό των τιμών του σχετικού μέσου."}]},{"n":111,"a":"δ","q":"Ποια από τις παρακάτω πρακτικές δεν συνιστά χειραγώγηση αγοράς;","o":[{"k":"α","t":"Η συμπεριφορά, που οδηγεί στην εξασφάλιση δεσπόζουσας θέσης επί της προσφοράς ενός χρηματοπιστωτικού μέσου, με αποτέλεσμα τον άμεσο ή έμμεσο τεχνητό προσδιορισμό της τιμής πώλησης."},{"k":"β","t":"Η αγορά ενός χρηματοπιστωτικού μέσου κατά την περίοδο διαμόρφωσης της τιμής κλεισίματος της αγοράς με αποτέλεσμα την παραπλάνηση των επενδυτών που ενεργούν βάσει της τιμής αυτής."},{"k":"γ","t":"Η διάδοση παραπλανητικών πληροφοριών από μέλη του διοικητικού συμβουλίου εταιριών, μέσω των ετήσιων ή περιοδικών οικονομικών καταστάσεων, των ενημερωτικών δελτίων ή άλλων δημοσιευμάτων."},{"k":"δ","t":"Η εισαγωγή ελεύθερων εντολών αγοράς ή πώλησης χρηματοπιστωτικών μέσων ανεξαρτήτως μεγέθους."}]},{"n":112,"a":"α","q":"Το στέλεχος του μέλους ρυθμιζόμενης αγοράς που αναλαμβάνει να εκτελέσει εντολή πελάτη για αγορά μετοχών:","o":[{"k":"α","t":"Δεν επιτρέπεται να γνωστοποιήσει σε τρίτον την πληροφορία αυτή ή να ενεργήσει βάσει αυτής."},{"k":"β","t":"Μπορεί να γνωστοποιήσει την πληροφορία αυτή μόνο στο τμήμα διαχείρισης χαρτοφυλακίου πελατών."},{"k":"γ","t":"Μπορεί να γνωστοποιήσει την πληροφορία αυτή σε πελάτη της εταιρείας, υπό την προϋπόθεση ότι ο πελάτης θα την τηρήσει εμπιστευτική."},{"k":"δ","t":"Δεν έχει καμία υποχρέωση να τηρήσει εμπιστευτική την πληροφορία αυτή."}]}],"ΠΡΟΛΗΨΗ":[{"n":1,"a":"δ","q":"Τα υπόχρεα πρόσωπα κατά το Ν. 4557/2018 για την πρόληψη και καταστολή της νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες:","o":[{"k":"α","t":"Οφείλουν πάντοτε να απέχουν υποχρεωτικώς από τη διενέργεια συναλλαγών για τις οποίες γνωρίζουν ή υποπτεύονται ότι σχετίζονται με προϊόντα εγκληματικών δραστηριοτήτων ή συνδέονται με χρηματοδότηση της τρομοκρατίας."},{"k":"β","t":"Οφείλουν να προβαίνουν πάντοτε στη διενέργεια συναλλαγών για τις οποίες γνωρίζουν ή υποπτεύονται ότι σχετίζονται με προϊόντα εγκληματικών δραστηριοτήτων ή συνδέονται με χρηματοδότηση της τρομοκρατίας, έτσι ώστε να αποκαλύπτονται οι δράστες."},{"k":"γ","t":"Έχουν απόλυτη διακριτική ευχέρεια να προβαίνουν ή να αποφεύγουν τη διενέργεια συναλλαγών για τις οποίες γνωρίζουν ή υποπτεύονται ότι συνδέονται με βασικά αδικήματα."},{"k":"δ","t":"Οφείλουν να απέχουν υποχρεωτικώς, από τη διενέργεια συναλλαγών για τις οποίες γνωρίζουν ή υποπτεύονται ότι σχετίζονται με προϊόντα εγκληματικών δραστηριοτήτων ή συνδέονται με χρηματοδότηση της τρομοκρατίας, εκτός εάν η αποφυγή της διενέργειας των ανωτέρω συναλλαγών είναι αδύνατη ή ενδέχεται να εμποδίσει τις προσπάθειες δίωξης των δικαιούχων αυτών."}]},{"n":2,"a":"β","q":"Τα υπόχρεα πρόσωπα για την πρόληψη νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες έχουν υποχρέωση να αναφέρουν στην Αρχή που είναι κατά το νόμο αρμόδια για την καταπολέμηση της σχετικής νομιμοποίησης εσόδων:","o":[{"k":"α","t":"Τα μέτρα δέουσας επιμέλειας που λαμβάνουν για τους πελάτες τους."},{"k":"β","t":"Τις ενδείξεις ή υποψίες διάπραξης νομιμοποίησης."},{"k":"γ","t":"Σε ετήσια βάση τα στοιχεία των προσώπων που διενεργούν συναλλαγές για το έτος αναφοράς συνολικού ύψους άνω των 15.000€."},{"k":"δ","t":"Τις ενδείξεις ή υποψίες διάπραξης εγκλημάτων χειραγώγησης αγοράς."}]},{"n":3,"a":"δ","q":"Στην κατηγορία υψηλού κινδύνου περιλαμβάνονται βάσει της ΠΔ/ΤΕ 2652/29.2.12 οι ελεύθεροι επαγγελματίες που διατηρούν ή είναι πραγματικοί δικαιούχοι λογαριασμών:","o":[{"k":"α","t":"Στους οποίους πιστώθηκαν & χρεώθηκαν κατά το προηγούμενο ημερολογιακό έτος ποσά άνω των €200.000."},{"k":"β","t":"Των οποίων οι συνολικές καταθέσεις & αναλήψεις μετρητών στο προηγούμενο έτος υπερέβησαν το ποσό των € 300.000."},{"k":"γ","t":"Των οποίων οι συνολικές καταθέσεις μετρητών στο προηγούμενο έτος υπερέβησαν το ποσό των € 300.000."},{"k":"δ","t":"Στους οποίους πιστώθηκαν κατά το προηγούμενο ημερολογιακό έτος ποσά άνω των €200.000."}]},{"n":4,"a":"γ","q":"Τα μέτρα Δέουσας Επιμέλειας εφαρμόζονται:","o":[{"k":"α","t":"Εφάπαξ κατά την έναρξη της επιχειρηματικής σχέσης με τους πελάτες."},{"k":"β","t":"Μόνο στις περιπτώσεις που κρίνεται αναγκαίο από το Διευθυντή ή το αρμόδιο διευθυντικό στέλεχος."},{"k":"γ","t":"Σε περιοδική βάση ανάλογα με το βαθμό κινδύνου."},{"k":"δ","t":"Όταν απαιτείται από την αρμόδια Αρχή Καταπολέμησης στο πλαίσιο της συνεχούς παρακολούθησης των διενεργούμενων συναλλαγών του πελάτη."}]},{"n":5,"a":"α","q":"Τα υπόχρεα πρόσωπα εφαρμόζουν μέτρα αυξημένης δέουσας επιμέλειας για:","o":[{"k":"α","t":"Πελάτες που προέρχονται από χώρες που χαρακτηρίζονται από τη FATF ως μη συνεργάσιμες."},{"k":"β","t":"Πελάτες που κατέχουν ανώνυμους λογαριασμούς."},{"k":"γ","t":"Πελάτες που κατέχουν αριθμημένους λογαριασμούς."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]}
