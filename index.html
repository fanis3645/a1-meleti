 αντισυμβαλλόμενος μπορεί να ζητήσει να αντιμετωπισθεί (i) ως επαγγελματίας πελάτης, και (ii) ως ιδιώτης πελάτης εφόσον συναφθεί σχετική σύμβαση ότι ο πελάτης θα αντιμετωπίζεται ως ιδιώτης για τους σκοπούς εφαρμογής των κανόνων δεοντολογίας της επιχείρησης επενδύσεων."}]},{"n":178,"a":"α","q":"Ποιος από τους παρακάτω επενδυτές μπορεί ενδεχομένως να χαρακτηρισθεί ως επιλέξιμος αντισυμβαλλόμενος;","o":[{"k":"α","t":"Μικρό πιστωτικό ίδρυμα."},{"k":"β","t":"Μεγάλη επιχείρηση που είναι εισηγμένη σε ρυθμιζόμενη αγορά."},{"k":"γ","t":"Μεγάλη επιχείρηση που δεν ανήκει στον χρηματοπιστωτικό τομέα."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":179,"a":"β","q":"Οι συνδεδεμένοι αντιπρόσωποι:","o":[{"k":"α","t":"Παρέχουν επενδυτικές υπηρεσίες για λογαριασμό της ΑΕΠΕΥ."},{"k":"β","t":"Πρέπει να εγγράφονται σε ειδικό μητρώο της ΤτΕ ή ΕΚ."},{"k":"γ","t":"Δεν μπορούν να διαφημίζουν υπηρεσίες της ΑΕΠΕΥ."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":180,"a":"β","q":"Οι συνδεδεμένοι αντιπρόσωποι:","o":[{"k":"α","t":"Ενεργούν για λογαριασμό μίας ή περισσότερων ΑΕΠΕΥ ή πιστωτικού ιδρύματος."},{"k":"β","t":"Ενεργούν υπό την πλήρη και άνευ όρων ευθύνη της ΑΕΠΕΥ για λογαριασμό της οποίας ενεργούν."},{"k":"γ","t":"Επιτρέπεται να κατέχουν χρηματοπιστωτικά μέσα και χρήματα μέσω πελατών."},{"k":"δ","t":"Ενεργούν αυτόνομα από την ΑΕΠΕΥ που αντιπροσωπεύουν."}]},{"n":181,"a":"β","q":"Οι συνδεδεμένοι αντιπρόσωποι:","o":[{"k":"α","t":"Μπορούν να κατέχουν χρήματα & χρηματοπιστωτικά μέσα για λογαριασμό πελατών."},{"k":"β","t":"Μπορεί να είναι φυσικά πρόσωπα και ενεργούν υπό την πλήρη & άνευ όρων ευθύνη της ΑΕΠΕΥ."},{"k":"γ","t":"Είναι φυσικά πρόσωπα ή νομικά πρόσωπα και ενεργούν για λογαριασμό μιας ή περισσότερων ΑΕΠΕΥ ή πιστωτικό ίδρυμα."},{"k":"δ","t":"Ενεργούν αυτόνομα από την ΑΕΠΕΥ που αντιπροσωπεύουν."}]},{"n":182,"a":"δ","q":"Σε μία «Αντιστοιχισμένη συναλλαγή για ίδιο λογαριασμό» ο φορέας διευκόλυνσης:","o":[{"k":"α","t":"Μπορεί να πραγματοποιήσει κέρδος ή ζημία, πέραν της προμήθειας, αμοιβής ή χρέωσης για τη συναλλαγή, στην περίπτωση όπου ένα από τα μέρη της συναλλαγής έχει εκτελεστεί προγενέστερα σε διαφορετική τιμή από την τιμή εκτέλεσης."},{"k":"β","t":"Μπορεί να πραγματοποιήσει κέρδος ή ζημία, πέραν της προμήθειας, αμοιβής ή χρέωσης για τη συναλλαγή, στην περίπτωση όπου η τιμή του σκέλους αγοράς είναι χαμηλότερη την τιμή του σκέλους πώλησης."},{"k":"γ","t":"Μπορεί να πραγματοποιήσει κέρδος ή ζημία, πέραν της προμήθειας, αμοιβής ή χρέωσης για τη συναλλαγή, στην περίπτωση όπου η συναλλαγή του χρηματοπιστωτικού μέσου λαμβάνει χώρα σε μία μη ρευστή αγορά."},{"k":"δ","t":"Δεν πραγματοποιεί κανένα κέρδος ή ζημία, πέραν της προμήθειας, αμοιβής ή χρέωσης για τη συναλλαγή."}]},{"n":183,"a":"β","q":"Για τους σκοπούς του Ν. 4514/2018, «Συμβάσεις ενεργειακών παραγώγων Γ.6»: συμβόλαια δικαιωμάτων προαίρεσης (options), συμβόλαια μελλοντικής εκπλήρωσης (futures), συμβάσεις ανταλλαγής (swaps) και κάθε άλλη σύμβαση παράγωγου μέσου η οποία:","o":[{"k":"α","t":"Σχετίζεται με φυσικό αέριο υπό διαπραγμάτευση σε ΜΟΔ και πρέπει να εκκαθαριστεί με φυσική παράδοση."},{"k":"β","t":"Σχετίζεται με άνθρακα ή πετρέλαιο υπό διαπραγμάτευση σε ΜΟΔ και πρέπει να εκκαθαριστεί με φυσική παράδοση."},{"k":"γ","t":"Σχετίζεται με άνθρακα ή πετρέλαιο υπό διαπραγμάτευση σε ΠΜΔ και πρέπει να εκκαθαριστεί με φυσική παράδοση."},{"k":"δ","t":"Σχετίζεται με άνθρακα ή πετρέλαιο υπό διαπραγμάτευση σε ΜΟΔ και πρέπει να εκκαθαριστεί με χρηματικό διακανονισμό."}]},{"n":184,"a":"β","q":"Οι συνδεδεμένοι αντιπρόσωποι:","o":[{"k":"α","t":"Επιτρέπεται να παρέχουν επενδυτικές υπηρεσίες για λογαριασμό της ΑΕΠΕΥ."},{"k":"β","t":"Επιτρέπεται να προβαίνουν σε προώθηση των υπηρεσιών της ΑΕΠΕΥ."},{"k":"γ","t":"Επιτρέπεται να κατέχουν χρηματοπιστωτικά μέσα πελατών."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":185,"a":"α","q":"Οι συνδεδεμένοι αντιπρόσωποι ΑΕΠΕΥ ενεργούν για λογαριασμό:","o":[{"k":"α","t":"Μιας και μόνο ΑΕΠΕΥ υπό την πλήρη και άνευ όρων ευθύνη της."},{"k":"β","t":"Περισσότερων ΑΕΠΕΥ υπό την πλήρη και άνευ όρων ευθύνη αυτών των ΑΕΠΕΥ."},{"k":"γ","t":"Μιας και μόνο ΑΕΠΕΥ υπό την πλήρη και άνευ όρων ευθύνη των συνδεδεμένων αντιπροσώπων."},{"k":"δ","t":"Περισσότερων ΑΕΠΕΥ υπό την πλήρη και άνευ όρων ευθύνη των συνδεδεμένων αντιπροσώπων."}]},{"n":186,"a":"α","q":"Μια ΑΕΠΕΥ δύναται να παρέχει επενδυτικές υπηρεσίες μέσω συνδεδεμένου αντιπροσώπου:","o":[{"k":"α","t":"Ο οποίος λειτουργεί για λογαριασμό αυτής και μόνο της ΑΕΠΕΥ, υπό την πλήρη και άνευ όρων ευθύνη της και εφόσον ο αντιπρόσωπος είναι εγγεγραμμένος σε ειδικό μητρώο."},{"k":"β","t":"Εφόσον ο αντιπρόσωπος είναι εγγεγραμμένος σε ειδικό μητρώο."},{"k":"γ","t":"Ο οποίος κατέχει χρηματοπιστωτικά μέσα και κεφάλαια για λογαριασμό πελατών."},{"k":"δ","t":"Ο οποίος είναι υποχρεωτικά εγκατεστημένος και εγγεγραμμένος σε μητρώο στην Ελλάδα."}]},{"n":187,"a":"δ","q":"Οι ΑΕΠΕΥ και τα πιστωτικά ιδρύματα μπορούν να αναθέτουν σε τρίτο επιχειρησιακές λειτουργίες:","o":[{"k":"α","t":"Σε εξαιρετικές περιπτώσεις, κάτω από συγκεκριμένες συνθήκες."},{"k":"β","t":"Εφόσον έχουν λάβει μέτρα αποφυγής αύξησης του κινδύνου αγοράς."},{"k":"γ","t":"Σε καμία περίπτωση."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":188,"a":"γ","q":"Οι συνδεδεμένοι αντιπρόσωποι των ΑΕΠΕΥ δεν επιτρέπεται να:","o":[{"k":"α","t":"Διαφημίζουν τις επενδυτικές και παρεπόμενες υπηρεσίες που δύναται να παρέχει η ΑΕΠΕΥ."},{"k":"β","t":"Διαβιβάζουν εντολές πελατών σχετικά με παράγωγα χρηματοπιστωτικά μέσα."},{"k":"γ","t":"Κατέχουν χρήματα ή χρηματοπιστωτικά μέσα για λογαριασμό πελατών."},{"k":"δ","t":"Παρέχουν συμβουλές σε πελάτες σχετικά με υπηρεσίες που παρέχει η ΑΕΠΕΥ."}]},{"n":189,"a":"β","q":"Τα Φυσικά ή Νομικά Πρόσωπα που έχουν στόχο την προώθηση της παροχής υπηρεσιών μίας ΑΕΠΕΥ, την προσέλκυση πελατών και την λήψη και διαβίβαση εντολών, και την παροχή συμβουλών αναφορικά με τα μέσα ή υπηρεσίες που παρέχονται από την ΑΕΠΕΥ ονομάζονται:","o":[{"k":"α","t":"Επιλέξιμοι Αντισυμβαλλόμενοι."},{"k":"β","t":"Συνδεδεμένοι Αντιπρόσωποι."},{"k":"γ","t":"Ειδικοί Διαπραγματευτές."},{"k":"δ","t":"Συστηματικοί Εσωτερικοποιητές."}]},{"n":190,"a":"δ","q":"Το Συνεγγυητικό Κεφάλαιο χρηματοδοτείται από:","o":[{"k":"α","t":"Τον κρατικό προϋπολογισμό."},{"k":"β","t":"Εισφορές των πιστωτικών ιδρυμάτων."},{"k":"γ","t":"Από τη ΤτΕ."},{"k":"δ","t":"Εισφορές ΑΕΠΕΥ."}]},{"n":191,"a":"δ","q":"Ποια από τις παρακάτω υπηρεσίες δεν προβλέπεται ως υποχρεωτική σύμφωνα με τον Ν. 3016/2002:","o":[{"k":"α","t":"Υπηρεσία εσωτερικού ελέγχου."},{"k":"β","t":"Υπηρεσία εξυπηρέτησης μετόχων."},{"k":"γ","t":"Υπηρεσία εταιρικών ανακοινώσεων."},{"k":"δ","t":"Υπηρεσία διαχείρισης κινδύνων."}]},{"n":192,"a":"α","q":"Για τους σκοπούς του Ν. 4514/2018, η «Πρακτική διασταυρούμενων πωλήσεων (cross-selling practices)» είναι:","o":[{"k":"α","t":"Η προσφορά μιας επενδυτικής υπηρεσίας μαζί με μια άλλη υπηρεσία ή προϊόν ως μέρος πακέτου ή ως προϋπόθεση για την ίδια συμφωνία ή πακέτο."},{"k":"β","t":"Όταν μία επιχείρηση επενδύσεων διενεργεί συναλλαγές για ίδιο λογαριασμό κατά τρόπο οργανωμένο, συχνά, και συστηματικά."},{"k":"γ","t":"Ο φορέας διευκόλυνσης μπορεί να πραγματοποιήσει κέρδος ή ζημία, πέραν της προμήθειας, αμοιβής ή χρέωσης για τη συναλλαγή, στην περίπτωση όπου ένα από τα μέρη της συναλλαγής έχει εκτελεστεί προγενέστερα σε διαφορετική τιμή από την τιμή εκτέλεσης."},{"k":"δ","t":"Οι συναλλαγές σε χρηματοπιστωτικά μέσα, όπου ένας αλγόριθμος υπολογιστή καθορίζει αυτόματα επιμέρους παραμέτρους εντολών αγοράς και πώλησης."}]},{"n":193,"a":"α","q":"Ο «Eγκεκριμένος μηχανισμός δημοσιοποίησης συναλλαγών» ή «Ε.ΜΗ.ΔΗ.ΣΥ.» είναι:","o":[{"k":"α","t":"Πρόσωπο το οποίο έχει λάβει, άδεια παροχής της υπηρεσίας δημοσιοποίησης αναφορών συναλλαγών για λογαριασμό επιχείρησης επενδύσεων, σύμφωνα με τα άρθρα 20 και 21 του Κανονισμού (ΕΕ) 600/2014."},{"k":"β","t":"Πρόσωπο το οποίο έχει λάβει, άδεια παροχής της υπηρεσίας συγκέντρωσης των αναφορών συναλλαγών σε χρηματοπιστωτικά μέσα από ρυθμιζόμενες αγορές, ΠΜΔ, ΜΟΔ, σύμφωνα με τα άρθρα 20 και 21 του Κανονισμού (ΕΕ) 600/2014."},{"k":"γ","t":"Πρόσωπο το οποίο έχει λάβει, άδεια ενοποίησής των αναφορών συναλλαγών σε χρηματοπιστωτικά μέσα από ρυθμιζόμενες αγορές, ΠΜΔ, ΜΟΔ, σύμφωνα με τα άρθρα 20 και 21 του Κανονισμού (ΕΕ) 600/2014."},{"k":"δ","t":"Πρόσωπο το οποίο έχει λάβει, άδεια παροχής της υπηρεσίας γνωστοποίησης των λεπτομερειών των συναλλαγών στις αρμόδιες αρχές ή την Ευρωπαϊκή Αρχή Κινητών Αξιών και Αγορών (ΕΑΚΑΑ) για λογαριασμό επιχείρησης επενδύσεων, σύμφωνα με τα άρθρα 20 και 21 του Κανονισμού (ΕΕ) 600/2014."}]},{"n":194,"a":"γ","q":"Παρεπόμενες επενδυτικές υπηρεσίες είναι: I. Παροχή συμβουλών σε επιχειρήσεις σχετικά με τη διάρθρωση του κεφαλαίου τους, καθώς και παροχή συμβουλών και υπηρεσιών σχετικά με συγχωνεύσεις ή εξαγορές. II. Παροχή επενδυτικών συμβουλών προσωπικά σε πελάτη σχετικά με μια ή περισσότερες συναλλαγές που αφορούν σε χρηματοπιστωτικά μέσα. III. Παροχή υπηρεσιών σχετιζόμενων με την αναδοχή. IV. Παροχή πιστώσεων ή δανείων σε επενδυτή προς διενέργεια συναλλαγής σε ένα ή περισσότερα χρηματοπιστωτικά μέσα, στην οποία μεσολαβεί η επενδυτική επιχείρηση η οποία παρέχει την πίστωση ή το δάνειο.","o":[{"k":"α","t":"I, II και III"},{"k":"β","t":"I, II και IV"},{"k":"γ","t":"I, III και IV"},{"k":"δ","t":"I, II, III και IV"}]},{"n":195,"a":"β","q":"Ποιο είναι κατ’ ελάχιστο το αρχικό κεφάλαιο που πρέπει να διαθέτει μία επιχείρηση επενδύσεων που παρέχει την επενδυτική υπηρεσία της αναδοχής χρηματοπιστωτικών μέσων ή της τοποθέτησης χρηματοπιστωτικών μέσων με δέσμευση ανάληψης;","o":[{"k":"α","t":"125.000 ευρώ."},{"k":"β","t":"730.000 ευρώ."},{"k":"γ","t":"50.000 ευρώ."},{"k":"δ","t":"1.000.000 ευρώ."}]},{"n":196,"a":"δ","q":"Ποια μορφή μπορεί να λαμβάνει η κάλυψη για επιχειρήσεις επενδύσεων που δεν επιτρέπεται να κατέχουν κεφάλαια ή τίτλους πελατών;","o":[{"k":"α","t":"Αρχικό κεφάλαιο 50.000 ευρώ."},{"k":"β","t":"Ασφάλιση επαγγελματικής ευθύνης καλύπτουσα ολόκληρο το έδαφος της Ευρωπαϊκής Ένωσης ή ισοδύναμη εγγύηση έναντι της ευθύνης από επαγγελματική αμέλεια για ποσό ύψους τουλάχιστον 1.000.000 ευρώ ανά απαίτηση και συνολικά 1.500.000 ευρώ κατ’ έτος για όλες τις απαιτήσεις."},{"k":"γ","t":"Συνδυασμό αρχικού κεφαλαίου και ασφάλισης επαγγελματικής ευθύνης."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":197,"a":"α","q":"Ποια από τις παρακάτω προτάσεις ισχύουν;","o":[{"k":"α","t":"Η λειτουργία Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ) αποτελεί επενδυτική υπηρεσία που επιτρέπεται να την παρέχουν επενδυτικές επιχειρήσεις και διαχειριστές αγοράς."},{"k":"β","t":"Η λειτουργία της Ρυθμιζόμενης Αγοράς αποτελεί επενδυτική υπηρεσία που επιτρέπεται να την παρέχουν πιστωτικά ιδρύματα, επενδυτικές επιχειρήσεις και διαχειριστές αγοράς."},{"k":"γ","t":"Η λειτουργία της Ρυθμιζόμενης Αγοράς αποτελεί επενδυτική υπηρεσία που επιτρέπεται να την παρέχουν μόνο διαχειριστές αγοράς."},{"k":"δ","t":"Η λειτουργία Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ) αποτελεί επενδυτική υπηρεσία που επιτρέπεται να την παρέχουν επενδυτικές επιχειρήσεις και διαχειριστές αγοράς και η λειτουργία της Ρυθμιζόμενης Αγοράς αποτελεί επενδυτική υπηρεσία που επιτρέπεται να την παρέχουν μόνο διαχειριστές αγοράς."}]},{"n":198,"a":"β","q":"Η κάλυψη του αρχικού περιθωρίου για την αγορά μετοχών με πίστωση πραγματοποιείται με:","o":[{"k":"α","t":"Καταβολή μετρητών αποκλειστικά."},{"k":"β","t":"Καταβολή μετρητών και δέσμευση κινητών αξιών που δεν περιέχονται στο Χαρτοφυλάκιο Ασφαλείας."},{"k":"γ","t":"Δέσμευση χαρτοφυλακίου ομολόγων."},{"k":"δ","t":"Εγγυητική επιστολή."}]},{"n":199,"a":"γ","q":"Επενδυτικές υπηρεσίες παρέχουν:","o":[{"k":"α","t":"ΑΕΕΧ και πιστωτικά ιδρύματα."},{"k":"β","t":"ΑΕΔΑΚ και ΑΕΕΧ."},{"k":"γ","t":"ΑΕΔΑΚ, ΑΕΕΔ και πιστωτικά ιδρύματα."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":200,"a":"α","q":"Επενδυτική υπηρεσία αποτελεί:","o":[{"k":"α","t":"Η τοποθέτηση χρηματοπιστωτικών μέσων χωρίς δέσμευση ανάληψης."},{"k":"β","t":"Η παροχή πιστώσεων ή δανείων σε επενδυτή προς διενέργεια συναλλαγής."},{"k":"γ","t":"Κάθε διαμεσολαβητική χρηματοοικονομική εργασία."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":201,"a":"γ","q":"Σε περίπτωση που μια ΑΕΠΕΥ δεν μπόρεσε να εξακριβώσει εκ των προτέρων το ποσό οποιασδήποτε πληρωμής ή οφέλους που πρόκειται να εισπραχθεί ή καταβληθεί και αντ’ αυτού γνωστοποίησε στον πελάτη τη μέθοδο υπολογισμού του εν λόγω ποσού .","o":[{"k":"α","t":"Δεν προβαίνει σε καμμιά περαιτέρω ενέργεια."},{"k":"β","t":"Λαμβάνει από τον πελάτη έγγραφη δήλωσή του ότι ενημερώθηκε."},{"k":"γ","t":"Του παρέχει τις πληροφορίες για το ακριβές ποσό της πληρωμής ή του οφέλους που εισπράχθηκε ή καταβλήθηκε εκ των υστέρων."},{"k":"δ","t":"Ενημερώνει ,παράλληλα , την Επιτροπή Κεφαλαιαγοράς για την αδυναμία της αυτή."}]},{"n":202,"a":"α","q":"Μια ΑΕΕΔ μπορεί:","o":[{"k":"α","t":"Να λάβει άδεια για παροχή επενδυτικών υπηρεσιών λήψης και διαβίβασης εντολών."},{"k":"β","t":"Να κατέχει χρηματοπιστωτικά μέσα πελατών της."},{"k":"γ","t":"Να λειτουργεί στη μορφή Εταιρίας Περιορισμένης Ευθύνης."},{"k":"δ","t":"Να έχει ανώνυμες μετοχές."}]},{"n":203,"a":"δ","q":"Ιδιώτες και επαγγελματίες πελάτες:","o":[{"k":"α","t":"Απολαμβάνουν ίσης προστασίας σε θέματα πληροφόρησης από μια ΑΕΠΕΥ."},{"k":"β","t":"Δεν υπάρχει τέτοια διάκριση."},{"k":"γ","t":"Εξασφαλίζουν ίσους σημαντικούς όρους από μια ΑΕΠΕΥ, κατά τη σύνοψη σύμβασης."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":204,"a":"δ","q":"Η αποζημίωση ενός επενδυτή από το Συνεγγυητικό Κεφάλαιο:","o":[{"k":"α","t":"Είναι πάντοτε ίση προς το ύψος της ζημιάς του επενδυτή."},{"k":"β","t":"Μπορεί να ξεπεράσει τα 100.000 ευρώ."},{"k":"γ","t":"Έχει ένα κατώτατο όριο."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":205,"a":"α","q":"Οι ΑΕΠΕΥ, οι οποίες παρέχουν επενδυτικές συμβουλές σε ανεξάρτητη βάση, επιστρέφουν στους πελάτες οποιεσδήποτε αμοιβές καταβάλλονται ή παρέχονται από κάθε τρίτο σε σχέση με τις υπηρεσίες που παρέχονται στον πελάτη:","o":[{"k":"α","t":"Το συντομότερο δυνατό μετά τη λήψη τους."},{"k":"β","t":"Εφόσον ζητηθούν από τον πελάτη."},{"k":"γ","t":"Μετά από σχετική έγκριση της Επιτροπής Κεφαλαιαγοράς."},{"k":"δ","t":"Μετά την παρέλευση 6 μηνών από τη λήψη τους."}]},{"n":206,"a":"δ","q":"Πρωτογενή χρηματοπιστωτικά μέσα είναι:","o":[{"k":"α","t":"Μετοχές και ομόλογα."},{"k":"β","t":"Μερίδια ΟΣΕΚΑ."},{"k":"γ","t":"Δικαιώματα προαίρεσης και συμβόλαια μελλοντικής εκπλήρωσης."},{"k":"δ","t":"Μετοχές, ομόλογα και μερίδια ΟΣΕΚΑ."}]},{"n":207,"a":"δ","q":"Χρηματοπιστωτικά μέσα θεωρούνται:","o":[{"k":"α","t":"Οι επενδύσεις σε ακίνητα."},{"k":"β","t":"Οι επιταγές που εκδίδουν ανώνυμες εταιρίες."},{"k":"γ","t":"Οι τοποθετήσεις σε πολύτιμα μέταλλα."},{"k":"δ","t":"Μετοχές και μερίδια αμοιβαίων κεφαλαίων."}]},{"n":208,"a":"β","q":"Έλεγχο καταλληλότητας διενεργεί:","o":[{"k":"α","t":"Το χρηματιστήριο."},{"k":"β","t":"Η ΑΕΠΕΥ."},{"k":"γ","t":"Η Επιτροπή Κεφαλαιαγοράς."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":209,"a":"γ","q":"Ο έλεγχος συμβατότητας ασκείται από:","o":[{"k":"α","t":"Την Επιτροπή Κεφαλαιαγοράς."},{"k":"β","t":"Το χρηματιστήριο."},{"k":"γ","t":"Την ΑΕΠΕΥ."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":210,"a":"α","q":"Η παροχή χρηματοοικονομικής ασφάλειας με μεταβίβαση τίτλου:","o":[{"k":"α","t":"Από πελάτη προς Α.Ε.Π.Ε.Υ. δεν επιτρέπεται αν ο πελάτης είναι ιδιώτης."},{"k":"β","t":"Από πελάτη προς πάροχο επενδυτικής υπηρεσίας επιτρέπεται σε κάθε περίπτωση αν ο πάροχος της επενδυτικής υπηρεσίας είναι πιστωτικό ίδρυμα."},{"k":"γ","t":"Από πελάτη προς Α.Ε.Π.Ε.Υ. επιτρέπεται σε κάθε περίπτωση εφόσον παρέχεται για την κάλυψη υποχρεώσεων του πελάτη προς την Α.Ε.Π.Ε.Υ. από πίστωση που του έχει χορηγήσει."},{"k":"δ","t":"Από πελάτη προς Α.Ε.Π.Ε.Υ. επιτρέπεται μόνο εφόσον ο πελάτης είναι επιλέξιμος αντισυμβαλλόμενος."}]},{"n":211,"a":"β","q":"Παρεπόμενη επενδυτική υπηρεσία είναι:","o":[{"k":"α","t":"Η λειτουργία ρυθμιζόμενης αγοράς αξιών."},{"k":"β","t":"Η παροχή υπηρεσιών που σχετίζονται με την αναδοχή."},{"k":"γ","t":"Η λειτουργία ρυθμιζόμενης αγοράς παραγώγων."},{"k":"δ","t":"Η λήψη και εκτέλεση εντολών για λογαριασμό πελατών."}]},{"n":212,"a":"α","q":"Ο «Πάροχος ενοποιημένου δελτίου συναλλαγών» ή «Π.Ε.ΔΕ.ΣΥ.» είναι:","o":[{"k":"α","t":"Πρόσωπο το οποίο έχει λάβει, άδεια παροχής της υπηρεσίας συγκέντρωσης των αναφορών συναλλαγών σε χρηματοπιστωτικά μέσα από ρυθμιζόμενες αγορές, ΠΜΔ, ΜΟΔ και Ε.ΜΗ.ΔΗ.ΣΥ. και ενοποίησής τους σε συνεχή ηλεκτρονική ροή δεδομένων απευθείας μετάδοσης, παρέχοντας δεδομένα τιμών και όγκου ανά χρηματοπιστωτικό μέσο."},{"k":"β","t":"Πρόσωπο το οποίο έχει λάβει, άδεια παροχής της υπηρεσίας συγκέντρωσης και γνωστοποίησης των λεπτομερειών των συναλλαγών σε χρηματοπιστωτικά μέσα από ρυθμιζόμενες αγορές, ΠΜΔ, ΜΟΔ και Ε.ΜΗ.ΔΗ.ΣΥ."},{"k":"γ","t":"Πρόσωπο το οποίο έχει λάβει, άδεια παροχής της υπηρεσίας δημοσιοποίησης αναφορών συναλλαγών για λογαριασμό επιχείρησης επενδύσεων, σύμφωνα με τα άρθρα 20 και 21 του Κανονισμού (ΕΕ) 600/2014."},{"k":"δ","t":"Πρόσωπο το οποίο έχει λάβει, άδεια παροχής της υπηρεσίας γνωστοποίησης των λεπτομερειών των συναλλαγών στις αρμόδιες αρχές ή την Ευρωπαϊκή Αρχή Κινητών Αξιών και Αγορών (ΕΑΚΑΑ) για λογαριασμό επιχείρησης επενδύσεων, σύμφωνα με τα άρθρα 20 και 21 του Κανονισμού (ΕΕ) 600/2014."}]},{"n":213,"a":"δ","q":"Ο «Εγκεκριμένος μηχανισμός γνωστοποίησης συναλλαγών» ή «Ε.ΜΗ.ΓΝΩ.ΣΥ.» είναι:","o":[{"k":"α","t":"Πρόσωπο το οποίο έχει λάβει, σύμφωνα με τις διατάξεις του Ν. 3371/2005, άδεια παροχής της υπηρεσίας γνωστοποίησης των λεπτομερειών των συναλλαγών στις αρμόδιες αρχές ή την Ευρωπαϊκή Αρχή Κινητών Αξιών και Αγορών (ΕΑΚΑΑ) για λογαριασμό της Επιτροπής Κεφαλαιαγοράς"},{"k":"β","t":"Πρόσωπο το οποίο έχει λάβει, δυνάμει των διατάξεων του Ν. 4514/2018 και της Οδηγίας 2014/65/ΕΕ, άδεια παροχής της υπηρεσίας δημοσιοποίησης αναφορών συναλλαγών για λογαριασμό επιχείρησης επενδύσεων, σύμφωνα με τα άρθρα 20 και 21 του Κανονισμού (ΕΕ) 600/2014."},{"k":"γ","t":"Πρόσωπο το οποίο έχει λάβει, σύμφωνα με τις διατάξεις του Ν. 4514/2018 και της Οδηγίας 2014/65/ΕΕ, άδεια παροχής της υπηρεσίας συγκέντρωσης των αναφορών συναλλαγών σε χρηματοπιστωτικά μέσα από ρυθμιζόμενες αγορές, ΠΜΔ, ΜΟΔ και Ε.ΜΗ.ΔΗ.ΣΥ. και ενοποίησής τους σε συνεχή ηλεκτρονική ροή δεδομένων απευθείας μετάδοσης, παρέχοντας δεδομένα τιμών και όγκου ανά χρηματοπιστωτικό μέσο."},{"k":"δ","t":"Πρόσωπο το οποίο έχει λάβει, σύμφωνα με τις διατάξεις του Ν. 4514/2018 και της Οδηγίας 2014/65/ΕΕ, άδεια παροχής της υπηρεσίας γνωστοποίησης των λεπτομερειών των συναλλαγών στις αρμόδιες αρχές ή την Ευρωπαϊκή Αρχή Κινητών Αξιών και Αγορών (ΕΑΚΑΑ) για λογαριασμό επιχείρησης επενδύσεων."}]},{"n":214,"a":"α","q":"214. Ο «Μηχανισμός οργανωμένης διαπραγμάτευσης» ή «ΜΟΔ» είναι:","o":[{"k":"α","t":"Πολυμερές Σύστημα."},{"k":"β","t":"Ρυθμιζόμενη Αγορά ."},{"k":"γ","t":"Πολυμερής Μηχανισμός Διαπραγμάτευσης ."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":215,"a":"δ","q":"Η Α.Ε.Π.Ε.Υ. που δημιουργεί χρηματοπιστωτικά μέσα προς πώληση σε πελάτες, διαθέτει, χρησιμοποιεί και επανεξετάζει την διαδικασία για την έγκριση κάθε χρηματοπιστωτικού μέσου και των σημαντικών προσαρμογών σε υφιστάμενα χρηματοπιστωτικά μέσα: Ι.Τουλάχιστον μία φορά ετησίως. ΙΙ.Τουλάχιστον μία φορά το εξάμηνο. ΙΙΙ.Πριν από την προώθησή τους στην αγορά. ΙV.Πριν τη διανομή τους σε πελάτες.","o":[{"k":"α","t":"Το Ι και ΙΙ."},{"k":"β","t":"Το ΙΙ και ΙΙΙ."},{"k":"γ","t":"Το Ι και ΙΙΙ."},{"k":"δ","t":"To III και IV."}]},{"n":216,"a":"β","q":"Έστω Α.Ε.Π.Ε.Υ. που λαμβάνει μέσω άλλης επιχείρησης επενδύσεων οδηγίες για την παροχή επενδυτικών ή παρεπόμενων υπηρεσιών για λογαριασμό ενός πελάτη. Υπεύθυνη για την πληρότητα και την ακρίβεια των διαβιβαζόμενων πληροφοριών σχετικές με τον πελάτη είναι:","o":[{"k":"α","t":"Η Α.Ε.Π.Ε.Υ. που λαμβάνει τις οδηγίες."},{"k":"β","t":"Η επιχείρηση επενδύσεων, μέσω της οποίας παρέχονται οι οδηγίες."},{"k":"γ","t":"Και οι δύο."},{"k":"δ","t":"Καμία από τις δύο, ο πελάτης πρέπει να μεριμνήσει σχετικά."}]},{"n":217,"a":"α","q":"Οι Α.Ε.Π.Ε.Υ. δεν συνάπτουν συμφωνίες για συναλλαγές χρηματοδότησης τίτλων σε σχέση με χρηματοπιστωτικά μέσα που κατέχουν για λογαριασμό πελάτη και δεν χρησιμοποιούν με άλλο τρόπο τα εν λόγω χρηματοπιστωτικά μέσα για ίδιο λογαριασμό ή για λογαριασμό οποιουδήποτε άλλου προσώπου ή πελάτη της επιχείρησης, εκτός εάν πληρούνται σωρευτικά οι ακόλουθες προϋποθέσεις: I.Ο πελάτης έχει δώσει προηγουμένως ρητή συγκατάθεση για τη χρησιμοποίηση των μέσων με συγκεκριμένους όρους, όπως αποδεικνύεται εγγράφως μέσω υπογραφής ή με ισοδύναμο τρόπο. II.Η χρησιμοποίηση των χρηματοπιστωτικών μέσων του πελάτη περιορίζεται στους συγκεκριμένους όρους, στους οποίους συγκατατίθεται ο πελάτης. III.Η χρησιμοποίηση των χρηματοπιστωτικών μέσων του πελάτη θα οδηγήσει σε κέρδη για το χαρτοφυλάκιο του πελάτη . IV.Τα χρηματοπιστωτικά μέσα του πελάτη που χρησιμοποιεί η Α.Ε.Π.Ε.Υ. είναι αξίες εισηγμένες σε οργανωμένη αγορά ή ΠΜΔ κράτους μέλους της ΕΕ ή σε τρίτη χώρα με προστασία τουλάχιστον ισοδύναμη με αυτή που έχει ο επενδυτής στην ΕΕ.","o":[{"k":"α","t":"Το Ι και ΙΙ."},{"k":"β","t":"Το Ι, το ΙΙ και το ΙΙΙ."},{"k":"γ","t":"Το ΙΙ, το ΙΙΙ και το IV."},{"k":"δ","t":"To Ι, το ΙΙ, το ΙΙΙ και το IV."}]},{"n":218,"a":"β","q":"Το τμήμα στο έγγραφο βασικών πληροφοριών που σχετίζεται με την ταυτότητα του παραγωγού PRIIP και την αρμόδια αρχή του περιλαμβάνει, μεταξύ άλλων, τις παρακάτω πληροφορίες: I.Το όνομα του PRIIP που έχει αποδοθεί από τον παραγωγό PRIIP και, εφόσον υπάρχει, τον διεθνή αριθμό αναγνώρισης τίτλων. II.Τη νομική επωνυμία του παραγωγού PRIIP. III.Το όνομα της αρμόδιας αρχής που είναι υπεύθυνη για την εποπτεία του παραγωγού PRIIP σε σχέση με το έγγραφο βασικών πληροφοριών. IV.Πληροφορίες σχετικά με τη μητρική εταιρεία ή/και τους βασικούς μετόχους του παραγωγού PRIIP, εάν είναι διαφορετικοί.","o":[{"k":"α","t":"Το Ι και ΙΙ."},{"k":"β","t":"Το Ι, το ΙΙ και το ΙΙΙ."},{"k":"γ","t":"Το ΙΙ, το ΙΙΙ και το IV."},{"k":"δ","t":"To Ι, το ΙΙ, το ΙΙΙ και το IV."}]},{"n":219,"a":"α","q":"Ένα PRIIP μπορεί να ταξινομηθεί σχετ τάργηση της δημοσίευσης οικονομικών καταστάσεων για το α' εξάμηνο και το β' εξάμηνο της οικονομικής χρήσης."},{"k":"β","t":"Την κατάργηση της δημοσίευσης οικονομικών καταστάσεων για το α' τρίμηνο και το γ' τρίμηνο της οικονομικής χρήσης."},{"k":"γ","t":"Την κατάργηση της δημοσίευσης οικονομικών καταστάσεων για το α' εξάμηνο και το β' εξάμηνο της οικονομικής χρήσης και την κατάργηση της δημοσίευσης οικονομικών καταστάσεων για το α' τρίμηνο και το γ' τρίμηνο της οικονομικής χρήσης."},{"k":"δ","t":"Την κατάργηση της δημοσίευσης οικονομικών καταστάσεων για το β΄ τρίμηνο και το δ΄ τρίμηνο της οικονομικής χρήσης."}]},{"n":18,"a":"α","q":"Πότε μια εταιρεία εκδίδει υποχρεωτικά ενημερωτικό δελτίο;","o":[{"k":"α","t":"Στην αρχική εισαγωγή κινητών αξιών για διαπραγμάτευση σε ρυθμιζόμενη αγορά που βρίσκεται ή λειτουργεί στην Ελλάδα."},{"k":"β","t":"Στην εισαγωγή για διαπραγμάτευση στη ρυθμιζόμενη αγορά προκειμένου στη συνέχεια να γίνει ανάκληση και διαγραφή."},{"k":"γ","t":"Εισαγωγή για διαπραγμάτευση στη ρυθμιζόμενη αγορά προκειμένου στη συνέχεια να διαπραγματευτεί στην Κατηγορία Χαμηλής Διασποράς."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":19,"a":"γ","q":"Απαιτείται Ενημερωτικό Δελτίο για κινητές αξίες που διανέμονται ή πρόκειται να διανεμηθούν λόγω συγχώνευσης ή διάσπασης;","o":[{"k":"α","t":"Απαιτείται μόνον για κινητές αξίες που εκδίδονται από Μικρομεσαίες Επιχειρήσεις."},{"k":"β","t":"Απαιτείται μόνον για κινητές αξίες που εκδίδονται από Ανώνυμες Εταιρείες."},{"k":"γ","t":"Δεν απαιτείται ενημερωτικό δελτίο."},{"k":"δ","t":"Απαιτείται μόνον το έγγραφο αναφοράς."}]},{"n":20,"a":"δ","q":"Σε ποια πρόσωπα πρέπει να αποδίδεται αστική ευθύνη;","o":[{"k":"α","t":"Μόνο στον εκδότη."},{"k":"β","t":"Μόνο στα διαχειριστικά ή εποπτικά όργανα του εκδότη."},{"k":"γ","t":"Μόνο στον προσφέρων ή στο πρόσωπο που ζητεί την εισαγωγή προς διαπραγμάτευση σε ρυθμιζόμενη αγορά"},{"k":"δ","t":"Αστική ευθύνη μπορεί να αποδοθεί μόνο στα πρόσωπα εκείνα που υπέβαλαν το περιληπτικό σημείωμα, συμπεριλαμβανομένης οποιασδήποτε μετάφρασής του, αλλά μόνο εάν το περιληπτικό σημείωμα είναι παραπλανητικό, ανακριβές ή ασυνεπές, σε συνδυασμό με τα άλλα μέρη του ενημερωτικού δελτίου ή δεν παρέχει, σε συνδυασμό με τα άλλα μέρη του ενημερωτικού δελτίου, βασικές πληροφορίες που να διευκολύνουν τους επενδυτές όταν εξετάζουν εάν θα επενδύσουν στις κινητές αξίες."}]},{"n":21,"a":"γ","q":"Στην περίπτωση εκδότη του οποίου οι κινητές αξίες εισάγονται για πρώτη φορά σε ρυθμιζόμενη αγορά, η αρχική προθεσμία παρατείνεται και το ενημερωτικό δελτίο εγκρίνεται από την ΕΚ εντός:","o":[{"k":"α","t":"2 μηνών."},{"k":"β","t":"1 μηνός."},{"k":"γ","t":"20 ημερών."},{"k":"δ","t":"10 ημερών."}]},{"n":22,"a":"δ","q":"Στο πλαίσιο παροχής διευκολύνσεων και πληροφοριών προς κατόχους μετοχών, ο εκδότης μεριμνά ιδίως:","o":[{"k":"α","t":"Για την παροχή πληροφοριών σχετικά με τον τόπο, την ημερομηνία και την ημερήσια διάταξη των συνελεύσεων, το συνολικό αριθμό των μετοχών και τα δικαιώματα ψήφου και τα δικαιώματα συμμετοχής των μετόχων στις συνελεύσεις."},{"k":"β","t":"Για τη διανομή εντύπου πληρεξουσιότητας, καθώς και για τη δημοσίευση ανακοινώσεων ή την κυκλοφορία οδηγιών σχετικά με τη διανομή και την πληρωμή μερισμάτων και την έκδοση νέων μετοχών."},{"k":"γ","t":"Για την παροχή πληροφοριών σχετικά με τον τόπο, την ημερομηνία και την ημερήσια διάταξη των συνελεύσεων, το συνολικό αριθμό των μετοχών και τα δικαιώματα ψήφου και τα δικαιώματα συμμετοχής των μετόχων στις συνελεύσεις, καθώς και για τη διανομή εντύπου πληρεξουσιότητας, καθώς και για τη δημοσίευση ανακοινώσεων ή την κυκλοφορία οδηγιών σχετικά με τη διανομή και την πληρωμή μερισμάτων και την έκδοση νέων μετοχών."},{"k":"δ","t":"Για την παροχή πληροφοριών σχετικά με τον τόπο, την ημερομηνία και την ημερήσια διάταξη των συνελεύσεων, το συνολικό αριθμό των μετοχών και τα δικαιώματα ψήφου και τα δικαιώματα συμμετοχής των μετόχων στις συνελεύσεις, για τη διανομή εντύπου πληρεξουσιότητας και για τη δημοσίευση ανακοινώσεων ή την κυκλοφορία οδηγιών σχετικά με τη διανομή και την πληρωμή μερισμάτων και την έκδοση νέων μετοχών, καθώς και για τον ορισμό ως εντολοδόχου ενός πιστωτικού ιδρύματος ή ΑΕΠΕΥ μέσω του οποίου οι μέτοχοι μπορούν να ασκήσουν τα δικαιώματά τους με περιουσιακό περιεχόμενο."}]},{"n":23,"a":"β","q":"Μέτοχος με συμμετοχή ύψους 21% των δικαιωμάτων ψήφου, προβαίνει σε αγορά μετοχών που είναι εισηγμένες σε ρυθμιζόμενη αγορά και αυξάνει το ποσοστό στο 23%. Τι πρέπει να πράξει από πλευράς ενημέρωσης;","o":[{"k":"α","t":"Να ενημερώσει τον εκδότη και την ΕΚ."},{"k":"β","t":"Δεν απαιτείται καμίας μορφής ενημέρωση."},{"k":"γ","t":"Να ενημερώσει την ΕΚ."},{"k":"δ","t":"Να ενημερώσει το επενδυτικό κοινό."}]},{"n":24,"a":"α","q":"Μέτοχος που αποκτά ειδική συμμετοχή:","o":[{"k":"α","t":"Ενημερώνει την ΕΚ & τον εκδότη."},{"k":"β","t":"Ενημερώνει την ΕΚ, η οποία στη συνέχεια ενημερώνει το ευρύ επενδυτικό κοινό."},{"k":"γ","t":"Ενημερώνει τον εκδότη, ο οποίος δεν απαιτείται να προβεί σε κάποια περαιτέρω ενέργεια."},{"k":"δ","t":"Ενημερώνει απευθείας το ευρύ επενδυτικό κοινό με καταχώριση σε μία τουλάχιστον εφημερίδα ευρείας κυκλοφορίας."}]},{"n":25,"a":"α","q":"Ο εκδότης που προβαίνει σε δημόσια προσφορά μετοχών του οφείλει εκ του νόμου να αποζημιώσει, για τη ζημία που υπέστησαν λόγω ελλείψεων του ενημερωτικού δελτίου:","o":[{"k":"α","t":"Τους επενδυτές που απέκτησαν τις μετοχές αυτές κατά τους δώδεκα μήνες που ακολούθησαν τη δημοσίευση του ενημερωτικού δελτίου."},{"k":"β","t":"Τους επενδυτές που απέκτησαν τις μετοχές αυτές κατά τους δώδεκα μήνες που ακολούθησαν τη δημοσίευση του ενημερωτικού δελτίου και το σύμβουλο που συνέταξε το ενημερωτικό δελτίο."},{"k":"γ","t":"Το σύμβουλο που συνέταξε το ενημερωτικό δελτίο."},{"k":"δ","t":"Το σύμβουλο που συνέταξε το ενημερωτικό δελτίο και τον ανάδοχο."}]},{"n":26,"a":"α","q":"Σε ποια από τις παρακάτω περιπτώσεις εφαρμόζεται υποχρεωτικά το ενημερωτικό δελτίο;","o":[{"k":"α","t":"Στα μερίδια αμοιβαίου κεφαλαίου."},{"k":"β","t":"Στις κινητές αξίες που διανέμονται ή πρόκειται να διανεμηθούν λόγω συγχώνευσης ή διάσπασης."},{"k":"γ","t":"Στις κινητές αξίες των οποίων η αξία είναι μικρότερη των 2.500.000 ευρώ κατά τους τελευταίους 12 μήνες."},{"k":"δ","t":"Στις μετοχές της Τράπεζας της Ελλάδος."}]},{"n":27,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Ο ζημιωθείς από παραλείψεις/λάθη του ενημερωτικού δελτίου φέρει το βάρος αποδείξεως της ζημίας που υπέστη και της αιτιώδους συνάφειας μεταξύ της υπαιτιότητας των υπεύθυνων προσώπων και της ζημίας."},{"k":"β","t":"Τα υπεύθυνα πρόσωπα για την ορθότητα και πληρότητα του ενημερωτικού δελτίου φέρουν το βάρος απόδειξης της έλλειψης υπαιτιότητας."},{"k":"γ","t":"Αξιώσεις για αποζημίωση κατά των υπεύθυνων προσώπων για την ορθότητα και πληρότητα του ενημερωτικού δελτίου παραγράφονται μετά την πάροδο 3 ετών από τη δημοσίευση του ενημερωτικού δελτίου."},{"k":"δ","t":"Είναι δυνατή η εισαγωγή στο ενημερωτικό δελτίο ρητρών περιορισμού ή αποκλεισμού της ευθύνης των υπεύθυνων προσώπων για την ορθότητα και πληρότητα του ενημερωτικού δελτίου."}]},{"n":28,"a":"α","q":"Τα εγκεκριμένα ενημερωτικά δελτία θα πρέπει να παραμένουν στη διάθεση του κοινού για τουλάχιστον:","o":[{"k":"α","t":"10 έτη μετά τη δημοσίευσή τους."},{"k":"β","t":"2 έτη μετά τη δημοσίευσή τους."},{"k":"γ","t":"1 έτος μετά τη δημοσίευσή τους."},{"k":"δ","t":"15 έτη μετά τη δημοσίευσή τους."}]},{"n":29,"a":"α","q":"Κάθε νέο σημαντικό στοιχείο, ουσιώδης ανακρίβεια ή ουσιώδες σφάλμα σχετικά με τις πληροφορίες που περιέχονται στο ενημερωτικό δελτίο, που μπορεί να επηρεάσει την αξιολόγηση των κινητών αξιών και το οποίο ανακύπτει ή διαπιστώνεται κατά το χρόνο που μεσολαβεί από την έγκριση του ενημερωτικού δελτίου έως την οριστική λήξη της δημόσιας προσφοράς ή, ανάλογα με την περίπτωση, την έναρξη της διαπραγμάτευσης σε ρυθμιζόμενη αγορά, όποια από τις δύο περιπτώσεις είναι μεταγενέστερη, αναφέρεται σε:","o":[{"k":"α","t":"Συμπλήρωμα του ενημερωτικού δελτίου."},{"k":"β","t":"Σχετική ανάρτηση στην ιστοσελίδα του εκδότη και της ΕΚ."},{"k":"γ","t":"Νέο ενημερωτικό δελτίο."},{"k":"δ","t":"Υποσημείωση του ενημερωτικού δελτίου."}]},{"n":30,"a":"γ","q":"Το Συμπλήρωμα Ενημερωτικού Δελτίου πρέπει να υποβάλλεται στην Επιτροπή Κεφαλαιαγοράς και να εγκρίνεται:","o":[{"k":"α","t":"Κάθε 6 μήνες."},{"k":"β","t":"Κάθε 12 μήνες."},{"k":"γ","t":"Στις περιπτώσεις κατά τις οποίες επέρχεται κάποιο σημαντικό γεγονός μετά την έγκριση του Ενημερωτικού Δελτίου και μέχρι τη λήξη της δημόσιας προσφοράς ή την έναρξη διαπραγμάτευσης σε ρυθμιζόμενη αγορά."},{"k":"δ","t":"Δεν υπάρχει υποχρέωση για κατάρτιση Συμπληρώματος Ενημερωτικού Δελτίου όταν το εγκεκριμένο Ενημερωτικό Δελτίο είναι εν ισχύ."}]},{"n":31,"a":"β","q":"Αν μετά την έγκριση του ενημερωτικού δελτίου από την Επιτροπή Κεφαλαιαγοράς και πριν είτε τη δημόσια προσφορά είτε την έναρξη διαπραγμάτευσης των μετοχών που βγαίνουν σε δημόσια προσφορά, προκύψουν ουσιώδεις αλλαγές στην εταιρεία, τότε:","o":[{"k":"α","t":"Πρέπει να εκδοθεί νέο ενημερωτικό δελτίο."},{"k":"β","t":"Πρέπει να εκδοθεί συμπλήρωμα ενημερωτικού δελτίου."},{"k":"γ","t":"Πρέπει να κοινοποιηθούν στον ημερήσιο τύπο και την ιστοσελίδα της εταιρείας."},{"k":"δ","t":"Δεν απαιτείται κάποια ενέργεια."}]},{"n":32,"a":"α","q":"Σχετικά με την υποχρέωση κάθε μετόχου να ενημερώσει τον εκδότη σχετικά με το ποσοστό των δικαιωμάτων ψήφου που κατέχει όταν αυτό υπερβαίνει ορισμένα όρια:","o":[{"k":"α","t":"Η ενημέρωση του εκδότη πραγματοποιείται ταχέως σε κάθε περίπτωση το αργότερο εντός 3 ημερών διαπραγμάτευσης."},{"k":"β","t":"Η ενημέρωση του εκδότη πραγματοποιείται το αργότερο εντός 5 ημερών διαπραγμάτευσης."},{"k":"γ","t":"Η ενημέρωση του εκδότη πραγματοποιείται σε εύλογο χρονικό διάστημα."},{"k":"δ","t":"Η ενημέρωση του εκδότη δεν είναι υποχρεωτική."}]},{"n":33,"a":"β","q":"Στέλεχος ανώνυμης εταιρείας εισηγμένης στο χρηματιστήριο οφείλει να ενημερώσει για συναλλαγές που πραγματοποίησε σε μετοχές της εταιρείας σε:","o":[{"k":"α","t":"2 ημέρες διαπραγμάτευσης."},{"k":"β","t":"3 ημέρες διαπραγμάτευσης."},{"k":"γ","t":"2 ημερολογιακές ημέρες."},{"k":"δ","t":"3 ημερολογιακές ημέρες."}]},{"n":34,"a":"β","q":"Σχετικά με την υποχρέωση κάθε μετόχου να ενημερώσει τον εκδότη σχετικά με το ποσοστό των δικαιωμάτων ψήφου που κατέχει όταν αυτό υπερβαίνει ορισμένα όρια:","o":[{"k":"α","t":"Τα υπόχρεα πρόσωπα και ο εκδότης οφείλουν να υποβάλλουν ταυτόχρονα τις σχετικές πληροφορίες στην ΕΚ."},{"k":"β","t":"Τα υπόχρεα πρόσωπα, οφείλουν να υποβάλλουν ταυτόχρονα τις σχετικές πληροφορίες στην ΕΚ και στον εκδότη."},{"k":"γ","t":"Ο εκδότης, αλλά όχι τα υπόχρεα πρόσωπα, οφείλει να υποβάλλει ταυτόχρονα τις σχετικές πληροφορίες στην ΕΚ."},{"k":"δ","t":"Ούτε τα υπόχρεα πρόσωπα, ούτε ο εκδότης υποχρεούνται να υποβάλλουν τις σχετικές πληροφορίες στην ΕΚ."}]},{"n":35,"a":"δ","q":"Ο εκδότης δημοσιοποιεί ετήσια οικονομική έκθεση και διασφαλίζει ότι η έκθεση αυτή είναι στη διάθεση του επενδυτικού κοινού για διάστημα τουλάχιστον:","o":[{"k":"α","t":"15 ετών."},{"k":"β","t":"2 ετών."},{"k":"γ","t":"1 έτους."},{"k":"δ","t":"10 ετών."}]},{"n":36,"a":"γ","q":"Ποιες από τις παρακάτω προτάσεις ισχύουν;","o":[{"k":"α","t":"Ο εκδότης μετοχών οι οποίες έχουν εισαχθεί προς διαπραγμάτευση σε ρυθμιζόμενη αγορά οφείλει να δημοσιοποιεί χωρίς υπαίτια βραδύτητα κάθε μεταβολή στα δικαιώματα που ενσωματώνονται στις διάφορες κατηγορίες μετοχών."},{"k":"β","t":"Ο εκδότης κινητών αξιών, εκτός μετοχών, οι οποίες έχουν εισαχθεί προς διαπραγμάτευση σε ρυθμιζόμενη αγορά, υποχρεούται να δημοσιοποιεί χωρίς υπαίτια βραδύτητα κάθε μεταβολή στα δικαιώματα των κατόχων αυτών των κινητών αξιών."},{"k":"γ","t":"Ο εκδότης μετοχών οι οποίες έχουν εισαχθεί προς διαπραγμάτευση σε ρυθμιζόμενη αγορά οφείλει να δημοσιοποιεί χωρίς υπαίτια βραδύτητα κάθε μεταβολή στα δικαιώματα που ενσωματώνονται στις διάφορες κατηγορίες μετοχών και ο εκδότης κινητών αξιών, εκτός μετοχών, οι οποίες έχουν εισαχθεί προς διαπραγμάτευση σε ρυθμιζόμενη αγορά, υποχρεούται να δημοσιοποιεί χωρίς υπαίτια βραδύτητα κάθε μεταβολή στα δικαιώματα των κατόχων αυτών των κινητών αξιών."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":37,"a":"γ","q":"Το έγγραφο αναφοράς αποτελεί:","o":[{"k":"α","t":"Έγγραφο του ενημερωτικού δελτίου, το οποίο περιέχει πληροφορίες για τις κινητές αξίες που αποτελούν αντικείμενο δημόσιας προσφοράς ή εισαγωγής για διαπραγμάτευση σε ρυθμιζόμενη αγορά."},{"k":"β","t":"Έγγραφο του ενημερωτικού δελτίου, το οποίο περιέχει συνοπτικά τις σημαντικότερες πληροφορίες που περιλαμβάνονται στο ενημερωτικό δελτίο."},{"k":"γ","t":"Έγγραφο του ενημερωτικού δελτίου, το οποίο περιέχει τις πληροφορίες που αφορούν τον εκδότη."},{"k":"δ","t":"Συμπλήρωμα του ενημερωτικού δελτίου, το οποίο εκδίδεται στις περιπτώσεις μεταβολής των στοιχείων και πληροφοριών που δηλώνονται με αυτό."}]},{"n":38,"a":"α","q":"Το «έγγραφο αναφοράς» του ενημερωτικού δελτίου περιέχει, μεταξύ άλλων:","o":[{"k":"α","t":"Πληροφορίες για την επιχειρηματική δραστηριότητα του εκδότη."},{"k":"β","t":"Πληροφορίες για βασικά οικονομικά μεγέθη."},{"k":"γ","t":"Πληροφορίες για την έκθεση των ορκωτών ελεγκτών."},{"k":"δ","t":"Πληροφορίες για τον τρόπο προσδιορισμού της τιμής διάθεσης των κινητών αξιών."}]},{"n":39,"a":"β","q":"Το έγγραφο αναφοράς, ως χωριστό έγγραφο, περιέχει τις πληροφορίες που αφορούν:","o":[{"k":"α","t":"Τις κινητές αξίες προς διαπραγμάτευση."},{"k":"β","t":"Τον εκδότη των κινητών αξιών."},{"k":"γ","t":"Το κλαδικό επιχειρηματικό περιβάλλον του εκδότη."},{"k":"δ","t":"Την αξιοποίηση των κεφαλαίων που θα αντληθούν."}]},{"n":40,"a":"γ","q":"Το ενημερωτικό δελτίο αποτελείται:","o":[{"k":"α","t":"Από το «περιληπτικό σημείωμα» και το «έγγραφο αναφοράς»."},{"k":"β","t":"Υποχρεωτικά από χωριστά έγγραφα και συγκεκριμένα από το «περιληπτικό σημείωμα», το «σημείωμα κινητών αξιών» και το «έγγραφο αναφοράς»."},{"k":"γ","t":"Από τρία μέρη ή από χωριστά έγγραφα και συγκεκριμένα από το «περιληπτικό σημείωμα», το «σημείωμα κινητών αξιών» και το «έγγραφο αναφοράς»."},{"k":"δ","t":"Από το «σημείωμα κινητών αξιών» και το «έγγραφο αναφοράς»."}]},{"n":41,"a":"α","q":"Η εισηγμένη ανώνυμη εταιρία:","o":[{"k":"α","t":"Μπορεί, υπό προϋποθέσεις, να αποκτήσει ίδιες μετοχές."},{"k":"β","t":"Δεν μπορεί να αποκτήσει ίδιες μετοχές."},{"k":"γ","t":"Μπορεί ελεύθερα να αποκτήσει ίδιες μετοχές."},{"k":"δ","t":"Μπορεί να αποκτήσει ίδιες μετοχές, αλλά μόνον προκειμένου να τις διανείμει στους εργαζομένους σε αυτήν."}]},{"n":42,"a":"δ","q":"Η ετήσια έκθεση του διοικητικού συμβουλίου περιλαμβάνει τουλάχιστον:","o":[{"k":"α","t":"Κάθε συμφωνία που ο εκδότης έχει συνάψει με μέλη του διοικητικού του συμβουλίου ή με το προσωπικό του, η οποία προβλέπει αποζημίωση σε περίπτωση παραίτησης ή απόλυσης χωρίς βάσιμο λόγο ή τερματισμού της θητείας ή της απασχόλησής τους εξαιτίας της δημόσιας πρότασης."},{"k":"β","t":"Περιγραφή των κυριότερων κινδύνων και αβεβαιοτήτων για την τρέχουσα οικονομική χρήση."},{"k":"γ","t":"Τη διάρθρωση του μετοχικού κεφαλαίου του εκδότη."},{"k":"δ","t":"Κάθε συμφωνία που ο εκδότης έχει συνάψει με μέλη του διοικητικού του συμβουλίου ή με το προσωπικό του, η οποία προβλέπει αποζημίωση σε περίπτωση παραίτησης ή απόλυσης χωρίς βάσιμο λόγο ή τερματισμού της θητείας ή της απασχόλησής τους εξαιτίας της δημόσιας πρότασης, καθώς και τη διάρθρωση του μετοχικού κεφαλαίου του εκδότη."}]},{"n":43,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Ο εκδότης μετοχών ή χρεωστικών τίτλων υποχρεούται να δημοσιοποιεί ετήσια οικονομική έκθεση που αφορά στην προηγούμενη οικονομική χρήση."},{"k":"β","t":"Η ετήσια οικονομική έκθεση συντάσσεται εντός 4 μηνών από τη λήξη της οικονομικής χρήσης."},{"k":"γ","t":"Ο εκδότης διασφαλίζει ότι η ετήσια οικονομική έκθεση είναι στη διάθεση του επενδυτικού κοινού για διάστημα τουλάχιστον 10 ετών."},{"k":"δ","t":"Ο εκδότης μετοχών ή χρεωστικών τίτλων δύναται να δημοσιοποιεί ετήσια οικονομική έκθεση που αφορά στην προηγούμενη οικονομική χρήση."}]},{"n":44,"a":"α","q":"Η εισαγωγή κινητών αξιών προς διαπραγμάτευση σε ρυθμιζόμενη αγορά η οποία βρίσκεται ή λειτουργεί εντός της Ένωσης, επιτρέπεται μόνο μετά τη δημοσίευση ενημερωτικού δελτίου, εκτός αν:","o":[{"k":"α","t":"Πρόκειται για ανταλλάξιμες κινητές αξίες με κινητές αξίες που έχουν ήδη εισαχθεί προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά, υπό την προϋπόθεση ότι αντιπροσωπεύουν, σε περίοδο 12 μηνών ποσοστό μικρότερο του 20% του αριθμού των κινητών αξιών που εισήχθησαν προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά."},{"k":"β","t":"Πρόκειται για ανταλλάξιμες κινητές αξίες με κινητές αξίες που έχουν ήδη εισαχθεί προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά, υπό την προϋπόθεση ότι αντιπροσωπεύουν, σε περίοδο 12 μηνών ποσοστό μικρότερο του 33,3% του αριθμού των κινητών αξιών που εισήχθησαν προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά."},{"k":"γ","t":"Πρόκειται για ανταλλάξιμες κινητές αξίες με κινητές αξίες που έχουν ήδη εισαχθεί προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά, υπό την προϋπόθεση ότι αντιπροσωπεύουν, σε περίοδο 6 μηνών ποσοστό μικρότερο του 10% του αριθμού των κινητών αξιών που εισήχθησαν προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά."},{"k":"δ","t":"Πρόκειται για ανταλλάξιμες κινητές αξίες με κινητές αξίες που έχουν ήδη εισαχθεί προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά, υπό την προϋπόθεση ότι αντιπροσωπεύουν, σε περίοδο 6 μηνών ποσοστό μικρότερο του 33,3 % του αριθμού των κινητών αξιών που εισήχθησαν προς διαπραγμάτευση στην ίδια ρυθμιζόμενη αγορά."}]},{"n":45,"a":"β","q":"Οι υποχρεώσεις σύνταξης και δημοσιοποίησης οικονομικών καταστάσεων:","o":[{"k":"α","t":"Είναι ίδιες για εισηγμένες και μη εισηγμένες ανώνυμες εταιρίες."},{"k":"β","t":"Είναι περισσότερες και αυξημένης βαρύτητας για τις εισηγμένες εταιρίες."},{"k":"γ","t":"Επιβάλλονται μόνον σε εισηγμένες εταιρίες που πληρούν συγκεκριμένα κριτήρια διασποράς."},{"k":"δ","t":"Επιβάλλονται μόνον σε εισηγμένες εταιρίες."}]},{"n":46,"a":"δ","q":"Ο προτείνων που, μετά την υποβολή δημόσιας πρότασης προς όλους τους κατόχους κινητών αξιών, κατέχει κινητές αξίες που αντιπροσωπεύουν τουλάχιστον συγκεκριμένο ποσοστό του συνόλου των δικαιωμάτων ψήφου της υπό εξαγοράς εταιρείας, μπορεί να απαιτήσει τη μεταβίβαση σε αυτόν όλων των υπολοίπων κινητών αξιών της υπό εξαγορά εταιρείας. Το ελάχιστο αυτό ποσοστό είναι:","o":[{"k":"α","t":"51%."},{"k":"β","t":"66,6%."},{"k":"γ","t":"75%."},{"k":"δ","t":"90%."}]},{"n":47,"a":"γ","q":"Η ετήσια οικονομική έκθεση πρέπει να δημοσιοποιείται από τον εκδότη:","o":[{"k":"α","t":"Εντός 2 μηνών από τη λήξη της οικονομικής χρήσης."},{"k":"β","t":"Εντός 6 μηνών από τη λήξη της οικονομικής χρήσης."},{"k":"γ","t":"Εντός 4 μηνών από τη λήξη της οικονομικής χρήσης."},{"k":"δ","t":"Εντός 45 ημερών από τη λήξη της οικονομικής χρήσης."}]},{"n":48,"a":"α","q":"Μέτοχος ο οποίος αποκτά ή διαθέτει μετοχές με δικαίωμα ψήφου που έχουν εισαχθεί προς διαπραγμάτευση σε ρυθμιζόμενη αγορά υποχρεούται να ενημερώσει τον εκδότη σχετικά με το ποσοστό των δικαιωμάτων ψήφου που κατέχει ως αποτέλεσμα αυτής της απόκτησης ή διάθεσης, εφόσον το ποσοστό των δικαιωμάτων ψήφου που κατέχει, φθάνει, υπερβαίνει ή κατέρχεται των ορίων:","o":[{"k":"α","t":"5%, 10%, 15%, 20%, 25%, 1/3, 50%, 2/3."},{"k":"β","t":"5%, 25%, 50%, 2/3."},{"k":"γ","t":"10%, 20%, 30%, 40%, 50%."},{"k":"δ","t":"5%, 10%, 15%, 20%, 25%, 30%, 40%, 50% και 2/3."}]},{"n":49,"a":"α","q":"Ο εκδότης που παραλαμβάνει γνωστοποίηση μεταβολής σημαντικής συμμετοχής μετόχου οφείλει να τη δημοσιοποιήσει:","o":[{"k":"α","t":"Στα μέσα ενημέρωσης και στο διαδικτυακό του τόπο."},{"k":"β","t":"Σε έντυπα μέσα ενημέρωσης."},{"k":"γ","t":"Σε ειδικό έντυπο που εκδίδει και διανέμει στους επενδυτές."},{"k":"δ","t":"Σε όποια έντυπα εκάστοτε ορίζει η Επιτροπή Κεφαλαιαγοράς."}]},{"n":50,"a":"δ","q":"Μέτοχος ο οποίος κατέχει ποσοστό δικαιωμάτων ψήφου 12% σε κάθε περίπτωση που μειώνεται το ποσοστό του αυτό σε 9%:","o":[{"k":"α","t":"Υποχρεούται να ενημερώσει τον εκδότη."},{"k":"β","t":"Υποχρεούται να ενημερώσει την ΕΚ."},{"k":"γ","t":"Υποχρεούται να ενημερώσει το ευρύ επενδυτικό κοινό."},{"k":"δ","t":"Υποχρεούται να ενημερώσει τον εκδότη και την ΕΚ."}]},{"n":51,"a":"β","q":"Ο εκδότης μετοχών εισηγμένων σε ρυθμιζόμενη αγορά για συναλλαγή επί ιδίων μετοχών οφείλει:","o":[{"k":"α","t":"Να δημοσιοποιήσει τη συναλλαγή το αργότερο εντός δύο (2) ημερολογιακών ημερών εφόσον από την απόκτηση ή διάθεση το ποσοστό του φθάνει, υπερβαίνει ή κατέρχεται των ορίων του 5% ή του 10% των δικαιωμάτων ψήφου."},{"k":"β","t":"Να δημοσιοποιήσει τη συναλλαγή το αργότερο εντός δύο (2) ημερών διαπραγμάτευσης εφόσον από την απόκτηση ή διάθεση το ποσοστό του φθάνει, υπερβαίνει ή κατέρχεται των ορίων του 5% ή του 10% των δικαιωμάτων ψήφου."},{"k":"γ","t":"Να δημοσιοποιήσει τη συναλλαγή το αργότερο εντός δύο (2) ημερών διαπραγμάτευσης εφόσον από την απόκτηση ή διάθεση το ποσοστό του φθάνει, υπερβαίνει ή κατέρχεται των ορίων του 20% των δικαιωμάτων ψήφου."},{"k":"δ","t":"Δεν έχει καμιά υποχρέωση δημοσιοποίησης συναλλαγών του σε ίδιες μετοχές."}]},{"n":52,"a":"β","q":"Σύμφωνα με το Ν.3556/2007 για τη «ρυθμιζόμενη πληροφόρηση» ο εκδότης υποχρεούται: I. Να την αποστέλλει στην ΕΚ μέσω ηλεκτρονικού συστήματος ΕΡΜΗΣ. II. Να τη θέτει στη διάθεση του κοινού μέσω του επίσημα καθορισμένου μηχανισμού κεντρικής αποθήκευσης της ρυθμιζόμενης πληροφόρησης, για την Ελλάδα η «Ελληνικά Χρηματιστήρια ΑΕ». III. Να την αναρτά σε διακριτό σημείο του διαδικτυακού τόπου. IV. Να τη δημοσιοποιεί σε ηλεκτρονικά και έντυπα μέσα ενημέρωσης με εθνική και πανευρωπαϊκή εμβέλεια.","o":[{"k":"α","t":"I, II, III και IV."},{"k":"β","t":"II και III."},{"k":"γ","t":"I, II και IV."},{"k":"δ","t":"II, III και IV."}]},{"n":53,"a":"β","q":"Σύμφωνα με το Ν.3556/2007 η «ρυθμιζόμενη πληροφόρηση» αφορά:","o":[{"k":"α","t":"Τις πληροφορίες που περιλαμβάνονται στο Συμπλήρωμα Ενημερωτικού Δελτίου."},{"k":"β","t":"Την περιοδική και διαρκή πληροφόρηση που υποχρεούνται να παρέχουν οι εκδότες των οποίων οι κινητές αξίες έχουν εισαχθεί για διαπραγμάτευση σε ρυθμιζόμενη αγορά."},{"k":"γ","t":"Τις προνομιακές πληροφορίες βάσει των οποίων απαγορεύεται η διενέργεια συναλλαγών από πρωτογενείς κατόχους."},{"k":"δ","t":"Τις προνομιακές πληροφορίες βάσει των οποίων απαγορεύεται η διενέργεια συναλλαγών από δευτερογενείς κατόχους."}]},{"n":54,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Η αρχική προθεσμία έγκρισης Ενημερωτικού Δελτίου από την ΕΚ είναι 30 εργάσιμες ημέρες."},{"k":"β","t":"Η αρχική προθεσμία έγκρισης Ενημερωτικού Δελτίου από την ΕΚ είναι 20 εργάσιμες ημέρες."},{"k":"γ","t":"Η αρχική προθεσμία έγκρισης Ενημερωτικού Δελτίου από την ΕΚ είναι 10 εργάσιμες ημέρες."},{"k":"δ","t":"Η αρχική προθεσμία έγκρισης Ενημερωτικού Δελτίου από την ΕΚ είναι 7 εργάσιμες ημέρες."}]},{"n":55,"a":"β","q":"Ποια η σημασία της διάκρισης μεταξύ δημόσιας προσφοράς και ιδιωτικής τοποθέτησης;","o":[{"k":"α","t":"Δεν έχει σημασία η διάκριση."},{"k":"β","t":"Στη δημόσια προσφορά απαιτείται ενημερωτικό δελτίο το οποίο συντάσσεται από ανάδοχο και έγκριση από την ΕΚ, ενώ στην ιδιωτική τοποθέτηση τίποτα από τα παραπάνω."},{"k":"γ","t":"Στη δημόσια προσφορά απαιτείται ενημερωτικό δελτίο το οποίο συντάσσεται από ανάδοχο και έγκριση από την ΕΚ, ενώ στην ιδιωτική τοποθέτηση απαιτείται απλώς έγκριση από την ΕΚ."},{"k":"δ","t":"Στη δημόσια προσφορά απαιτείται έγκριση από την ΕΚ, ενώ στην ιδιωτική τοποθέτηση απαιτείται απλώς ενημερωτικό δελτίο το οποίο συντάσσεται από ανάδοχο."}]},{"n":56,"a":"δ","q":"Στην έννοια της «δημόσιας προσφοράς» του Ν. 3401/2005 περιλαμβάνεται:","o":[{"k":"α","t":"Η προσφορά μετοχών προς το ευρύ επενδυτικό κοινό."},{"k":"β","t":"Η πρωτογενής προσφορά κινητών αξιών προς το ευρύ επενδυτικό κοινό."},{"k":"γ","t":"Η προσφορά κινητών αξιών από αύξηση μετοχικού κεφαλαίου προς το ευρύ επενδυτικό κοινό."},{"k":"δ","t":"Η διάθεση κινητών αξιών προς το ευρύ επενδυτικό κοινό ανεξαρτήτως του λόγου της διάθεσης."}]},{"n":57,"a":"α","q":"Ποιες από τις παρακάτω προτάσεις είναι σωστές; i. Ο εκδότης δημοσιοποιεί την ετήσια οικονομική του έκθεση οποιαδήποτε χρονική στιγμή μετά τη λήξη της χρήσης. ii. Ο εκδότης δημοσιοποιεί την ετήσια οικονομική του έκθεση το αργότερο τέσσερις (4) μήνες μετά τη λήξη κάθε οικονομικής χρήσης. iii. Ο εκδότης δημοσιοποιεί εξαμηνιαία οικονομική έκθεση που αφορά στο πρώτο εξάμηνο της οικονομικής χρήσης το συντομότερο δυνατό και, το αργότερο, εντός τριών (3) μηνών μετά τη λήξη της περιόδου αναφοράς. iv. Ο εκδότης δημοσιοποιεί εξαμηνιαία οικονομική έκθεση που αφορά στο πρώτο εξάμηνο της οικονομικής χρήσης το συντομότερο δυνατό και, το αργότερο, εντός δύο (2) μηνών μετά τη λήξη της περιόδου αναφοράς.","o":[{"k":"α","t":"ii και iii."},{"k":"β","t":"i, ii και iii."},{"k":"γ","t":"ii και iv."},{"k":"δ","t":"i, ii, iii και iv."}]},{"n":58,"a":"β","q":"Ποια από τις παρακάτω προτάσεις είναι λανθασμένη;","o":[{"k":"α","t":"Ιδιωτική τοποθέτηση θεωρείται η προσφορά κινητών αξιών που απευθύνεται μόνο σε ειδικούς επενδυτές."},{"k":"β","t":"Ιδιωτική τοποθέτηση θεωρείται η προσφορά κινητών αξιών με συνολική αξία μικρότερη από 50.000 €."},{"k":"γ","t":"Ιδιωτική τοποθέτηση θεωρείται η προσφορά κινητών αξιών που απευθύνεται σε λιγότερα από 150 φυσικά ή νομικά πρόσωπα ανά κράτος-μέλος, τα οποία δεν είναι ειδικοί επενδυτές."},{"k":"δ","t":"Ιδιωτική τοποθέτηση θεωρείται η προσφορά κινητών αξιών, η ονομαστική αξία των οποίων ανά μονάδα ανέρχεται σε τουλάχιστον 100.000 €."}]},{"n":59,"a":"γ","q":"Ανώνυμη εταιρία με έδρα στην Ελλάδα εισάγει τις μετοχές της στο ΧΑ και παράλληλα επιθυμεί να προσφέρει τις μετοχές και σε επενδυτές σε άλλο κράτος-μέλος της ΕΕ. Για αυτή τη δημόσια προσφορά απαιτείται:","o":[{"k":"α","t":"Έγκριση του ενημερωτικού δελτίου από την αρμόδια αρχή του κράτους-μέλους της ΕΕ στο οποίο πρόκειται να πραγματοποιηθεί η δημόσια προσφορά."},{"k":"β","t":"Έγκριση του ενημερωτικού δελτίου από την αρμόδια αρχή του κράτους-μέλους της ΕΕ στο οποίο πρόκειται να πραγματοποιηθεί η δημόσια προσφορά και επιπλέον, για την εισαγωγή στην ρυθμιζόμενη αγορά, και έγκριση του σχετικού δελτίου από το διαχειριστή της ρυθμιζόμενης αγοράς."},{"k":"γ","t":"Διαβίβαση από την ΕΚ του πιστοποιητικού έγκρισης, που έχει εκδώσει για το σχετικό εκδότη, στην αρμόδια αρχή του κράτους-μέλους της ΕΕ στο οποίο πρόκειται να πραγματοποιηθεί η δημόσια προσφορά."},{"k":"δ","t":"Έκδοση πιστοποιητικού έγκρισης για τη δημόσια προσφορά ή την εισαγωγή τόσο από την ΕΚ όσο και από την αρμόδια αρχή του κράτους-μέλους της ΕΕ στο οποίο πρόκειται να πραγματοποιηθεί η δημόσια προσφορά."}]},{"n":60,"a":"β","q":"Σε περίπτωση που εκδότης διαθέτει εγκεκριμένο ενημερωτικό δελτίο:","o":[{"k":"α","t":"Δύναται να προσφέρει κινητές αξίες σε οποιοδήποτε κράτος-μέλος κατόπιν έγκρισης από τις αρμόδιες αρχές του κράτους-μέλους υποδοχής."},{"k":"β","t":"Δύναται να προσφέρει κινητές αξίες σε οποιοδήποτε κράτος-μέλος με τη διαβίβαση πιστοποιητικού έγκρισης στις αρμόδιες αρχές του κράτους-μέλους υποδοχής δίχως να απαιτείται έγκριση από τις τελευταίες."},{"k":"γ","t":"Δύναται να προσφέρει κινητές αξίες σε οποιοδήποτε κράτος-μέλος εφόσον πραγματοποιήσει νέα δημόσια προσφορά και συντάξει νέο ενημερωτικό δελτίο ενώπιον των αρμόδιων αρχών του κράτους-μέλους υποδοχής."},{"k":"δ","t":"Δύναται να προσφέρει κινητές αξίες σε οποιοδήποτε κράτος-μέλος αυτομάτως και δίχως καμία άλλη διαδικαστική προϋπόθεση και δίχως να απαιτείται έγκριση από τις αρμόδιες αρχές του κράτους-μέλους υποδοχής."}]},{"n":61,"a":"δ","q":"Μέτοχος εισηγμένης εταιρίας, ο οποίος, κατόπιν αποκτήσεως μετοχών, υπερβαίνει το 1/3 του μετοχικού κεφαλαίου της εταιρίας:","o":[{"k":"α","t":"Δεν έχει καμία υποχρέωση."},{"k":"β","t":"Υποχρεούται να προβεί σε γνωστοποίηση μόνον κατά το Ν. 3556/2007."},{"k":"γ","t":"Υποχρεούται να κατέλθει άμεσα του ποσοστού αυτού, εκποιώντας τον αναγκαίο αριθμό μετοχών."},{"k":"δ","t":"Υποχρεούται σε γνωστοποίηση κατά το Ν. 3556/2007 και σε υποβολή δημοσίας προτάσεως αγοράς μετοχών προς τους λοιπούς μετόχους."}]},{"n":62,"a":"γ","q":"Ο γενικός διευθυντής εταιρίας με εισηγμένες μετοχές οφείλει να γνωστοποιεί εγγράφως:","o":[{"k":"α","t":"Στον εργοδότη του κάθε συναλλαγή που κάνει ο ίδιος ή η σύζυγός του με αντικείμενο μετοχές της εταιρίας κατά τη διάρκεια ενός ημερολογιακού έτους."},{"k":"β","t":"Στην Επιτροπή Κεφαλαιαγοράς κάθε συναλλαγή που κάνει ο ίδιος ή η σύζυγός του με αντικείμενο μετοχές της εταιρίας κατά τη διάρκεια ενός ημερολογιακού έτους."},{"k":"γ","t":"Στον εργοδότη του κάθε συναλλαγή που κάνει ο ίδιος και η σύζυγός του με αντικείμενο μετοχές της εταιρίας, εφόσον το συνολικό ύψος των συναλλαγών τους υπερβαίνει το ποσό των 5.000 ευρώ κατά τη διάρκεια ενός ημερολογιακού έτους."},{"k":"δ","t":"Στον εργοδότη του και στην ΕΚ κάθε συναλλαγή που κάνει ο ίδιος και η σύζυγός του με αντικείμενο μετοχές της εταιρίας με αξία μεγαλύτερη των 25.000 ευρώ."}]},{"n":63,"a":"α","q":"Πρόσωπα που ασκούν διευθυντικά καθήκοντα οφείλουν να γνωστοποιούν τις συναλλαγές σε μετοχές εισηγμένων εταιριών του Ομίλου:","o":[{"k":"α","t":"Εγγράφως, εφόσον υπερβαίνουν τα € 5.000 σε ετήσια βάση."},{"k":"β","t":"Εγγράφως, εφόσον υπερβαίνουν τα € 10.000 σε ετήσια βάση."},{"k":"γ","t":"Προφορικά εντός 2 ημερών."},{"k":"δ","t":"Εγγράφως εντός 2 ημερών."}]},{"n":64,"a":"δ","q":"Μέτοχος ο οποίος αποκτά ή διαθέτει μετοχές με δικαίωμα ψήφου και λόγω αυτής της απόκτησης ή διάθεσης, το ποσοστό των δικαιωμάτων ψήφου που κατέχει, μεταβάλλεται κατά 3%, υποχρεούται να ενημερώσει:","o":[{"k":"α","t":"Τον εκδότη."},{"k":"β","t":"Την ΕΚ και τη ρυθμιζόμενη αγορά."},{"k":"γ","t":"Τον εκδότη, την ΕΚ και τη ρυθμιζόμενη αγορά."},{"k":"δ","t":"Κανέναν από τους ανωτέρω παρά μόνο αν είναι μέτοχος που κατέχει ποσοστό δικαιωμάτων ψήφου μεγαλύτερο του 10 %."}]},{"n":65,"a":"α","q":"Μέτοχος, ο οποίος κατέχει ποσοστό δικαιωμάτων ψήφου μεγαλύτερο από 10%, υποχρεούται να προβαίνει στην προβλεπόμενη ενημέρωση σε κάθε περίπτωση που επέρχεται μεταβολή στο ποσοστό των δικαιωμάτων ψήφου που κατέχει ίση ή μεγαλύτερη:","o":[{"k":"α","t":"Από 3%."},{"k":"β","t":"Από 5%."},{"k":"γ","t":"Από 8%."},{"k":"δ","t":"Από 10%."}]},{"n":66,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Μέτοχος, ο οποίος κατέχει ποσοστό δικαιωμάτων ψήφου μεγαλύτερο από 5%, υποχρεούται να ενημερώσει τον εκδότη σε κάθε περίπτωση που επέρχεται μεταβολή στο ποσοστό των δικαιωμάτων ψήφου που κατέχει ίση προς ή μεγαλύτερη από 3% του συνόλου των δικαιωμάτων ψήφου του εκδότη."},{"k":"β","t":"Μέτοχος, ο οποίος κατέχει ποσοστό δικαιωμάτων ψήφου μεγαλύτερο από 10%, υποχρεούται να ενημερώσει τον εκδότη σε κάθε περίπτωση που επέρχεται μεταβολή στο ποσοστό των δικαιωμάτων ψήφου που κατέχει ίση προς ή μεγαλύτερη από 5% του συνόλου των δικαιωμάτων ψήφου του εκδότη."},{"k":"γ","t":"Μέτοχος, ο οποίος κατέχει ποσοστό δικαιωμάτων ψήφου μεγαλύτερο από 10%, υποχρεούται να ενημερώσει τον εκδότη σε κάθε περίπτωση που επέρχεται μεταβολή στο ποσοστό των δικαιωμάτων ψήφου που κατέχει ίση προς ή μεγαλύτερη από 3% του συνόλου των δικαιωμάτων ψήφου του εκδότη."},{"k":"δ","t":"Μέτοχος, ο οποίος κατέχει ποσοστό δικαιωμάτων ψήφου μεγαλύτερο από 15%, υποχρεούται να ενημερώσει τον εκδότη σε κάθε περίπτωση που επέρχεται μεταβολή στο ποσοστό των δικαιωμάτων ψήφου που κατέχει ίση προς ή μεγαλύτερη από 4% του συνόλου των δικαιωμάτων ψήφου του εκδότη."}]},{"n":67,"a":"γ","q":"Μέτοχος ο οποίος αποκτά ή διαθέτει χρηματοπιστωτικά μέσα που παρέχουν δικαίωμα απόκτησης μετοχών υποχρεούται να γνωστοποιήσει την απόκτηση αυτή εφόσον:","o":[{"k":"α","t":"Οι προς απόκτηση μετοχές έχουν ήδη εκδοθεί και ενσωματώνουν δικαιώματα ψήφου."},{"k":"β","t":"Οι προς απόκτηση μετοχές ενσωματώνουν δικαιώματα ψήφου που υπερβαίνουν τα προβλεπόμενα στο νόμο ποσοστά."},{"k":"γ","t":"Οι προς απόκτηση μετοχές έχουν ήδη εκδοθεί και ενσωματώνουν δικαιώματα ψήφου τα οποία υπερβαίνουν τα προβλεπόμενα στο νόμο ποσοστά."},{"k":"δ","t":"Οι προς απόκτηση μετοχές διαπραγματεύονται μόνον σε Πολυμερείς Μηχανισμούς Διαπραγμάτευσης (ΠΜΔ)."}]},{"n":68,"a":"α","q":"Νέος μέτοχος αποφασίζει την αγορά του 35% των δικαιωμάτων ψήφου σε εκδότη που οι μετοχές διαπραγματεύονται σε ρυθμιζόμενη αγορά. Τι πρέπει να πράξει από πλευράς ενημέρωσης;","o":[{"k":"α","t":"Να ενημερώσει τον εκδότη και την ΕΚ."},{"k":"β","t":"Δεν απαιτείται καμία μορφή ενημέρωσης."},{"k":"γ","t":"Να ενημερώσει την ΕΚ."},{"k":"δ","t":"Να ενημερώσει το επενδυτικό κοινό."}]},{"n":69,"a":"δ","q":"Σύμφωνα με το Ν. 3401/2005, σε ποια από τις παρακάτω περιπτώσεις είναι υποχρεωτική η δημοσίευση ενημερωτικού δελτίου:","o":[{"k":"α","t":"Σε προσφορά που απευθύνεται μόνο σε λιγότερους από 150 μη «ειδικούς» επενδυτές."},{"k":"β","t":"Σε προσφορά κινητών αξιών σε επενδυτές που αποκτούν κινητές αξίες με συνολική αξία τουλάχιστον 100.000 €."},{"k":"γ","t":"Σε προσφορά κινητών αξιών με ονομαστική αξία ανά μονάδα τουλάχιστον 100.000 €."},{"k":"δ","t":"Σε προσφορά σε 1500 επενδυτές."}]},{"n":70,"a":"β","q":"Η δημόσια προσφορά κινητών αξιών αφορά ανακοίνωση:","o":[{"k":"α","t":"Για τους όρους εξαγοράς κινητών αξιών από τον προτείνοντα στους μετόχους της εισηγμένης."},{"k":"β","t":"Για τις νέες κινητές αξίες στην περίπτωση αύξησης του μετοχικού κεφαλαίου."},{"k":"γ","t":"Για τους όρους και τις προσφερόμενες υφιστάμενες αξίες στην περίπτωση της ιδιωτικής τοποθέτησης."},{"k":"δ","t":"Προς το ευρύ επενδυτικό κοινό πριν την δημοσίευση του Ενημερωτικού Δελτίου."}]},{"n":71,"a":"β","q":"Η χρονική διάρκεια των δημοσίων προσφορών και τήρησης βιβλίου προσφορών είναι:","o":[{"k":"α","t":"Πέντε εργάσιμες ημέρες."},{"k":"β","t":"Τρεις εργάσιμες ημέρες."},{"k":"γ","t":"Δύο εργάσιμες ημέρες"},{"k":"δ","t":"Μία εργάσιμη ημέρα."}]},{"n":72,"a":"β","q":"Το Βιβλίο Προσφορών (bookbuilding) είναι ένας μηχανισμός, όπου η τιμή έκδοσης μιας μετοχής, η οποία είναι αντικείμενο Δημόσιας Εγγραφής, προκύπτει μέσω:","o":[{"k":"α","t":"Συμφωνίας με Ειδικό Διαπραγματευτή."},{"k":"β","t":"Διενέργειας των προσφορών."},{"k":"γ","t":"Συνεχούς διαπραγμάτευσης κατά την ημέρα εισαγωγής."},{"k":"δ","t":"Καθορισμού από τον Ανάδοχο."}]},{"n":73,"a":"β","q":"Υπεύθυνος για την τήρηση του Βιβλίου Προσφορών είναι:","o":[{"k":"α","t":"Ο Ειδικός Διαπραγματευτής της μετοχής."},{"k":"β","t":"Ο Κύριος Ανάδοχος."},{"k":"γ","t":"Ο Εκδότης."},{"k":"δ","t":"Το ΧΑ."}]},{"n":74,"a":"β","q":"Ο εκδότης δημοσιοποιεί όλες τις πληροφορίες που περιέχει η ενημέρωση μετόχου του σε περίπτωση μεταβολής ποσοστού δικαιωμάτων ψήφου στα όρια των 5%, 10%, 15%, 20%, 25%, 1/3, 50% και 2/3, συνεπεία απόκτησης ή διάθεσης εισηγμένων μετοχών της, άμεσα με την παραλαβή της εν λόγω ενημέρωσης και σε κάθε περίπτωση το αργότερο εντός ....... ημέρας/ημερών διαπραγμάτευσης από την ημερομηνία της παραπάνω παραλαβής:","o":[{"k":"α","t":"Μίας (1)."},{"k":"β","t":"Δύο (2)."},{"k":"γ","t":"Τριών (3)."},{"k":"δ","t":"Τεσσάρων (4)."}]},{"n":75,"a":"γ","q":"Ποιοι από τους παρακάτω εκδότες δεν έχουν υποχρέωση δημοσιοποίησης ετήσιων και εξαμηνιαίων οικονομικών καταστάσεων; i. Το Ελληνικό Δημόσιο και οι οργανισμοί τοπικής αυτοδιοίκησης. ii. Η Ευρωπαϊκή Κεντρική Τράπεζα, ο Ευρωπαϊκός Μηχανισμός Σταθερότητας και η Τράπεζα της Ελλάδος. iii. Σε εκδότες που εκδίδουν αποκλειστικά χρεωστικούς τίτλους που έχουν εισαχθεί προς διαπραγμάτευση σε ρυθμιζόμενη αγορά, των οποίων η ανά μονάδα ονομαστική αξία είναι τουλάχιστον εκατό χιλιάδες (100.000) ευρώ. iv. Εκδότες οι οποίοι ανήκουν στο ναυτιλιακό κλάδο.","o":[{"k":"α","t":"i και iv."},{"k":"β","t":"i, ii, iii και iv."},{"k":"γ","t":"i, ii και iii."},{"k":"δ","t":"ii."}]},{"n":76,"a":"γ","q":"Μέσω της Έκδοσης Ενημερωτικού Δελτίου, η εκδότρια:","o":[{"k":"α","t":"Εγγυάται τη διαμόρφωση της τιμής της μετοχής στην τιμή έκδοσης."},{"k":"β","t":"Δεσμεύεται για την εισαγωγή συγκεκριμένου αριθμού μετοχών στη χρηματιστηριακή αγορά."},{"k":"γ","t":"Παρέχει πληροφόρηση προς τους επενδυτές, δυνητικούς μετόχους της, σχετική με την εταιρία."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":77,"a":"α","q":"Δεν υφίσταται υποχρέωση υποβολής δημόσιας πρότασης εφόσον:","o":[{"k":"α","t":"Η απόκτηση κινητών αξιών είναι αποτέλεσμα μεταβίβασης λόγω γονικής παροχής ή κληρονομικής διαδοχής."},{"k":"β","t":"Η απόκτηση κινητών αξιών είναι αποτέλεσμα μεταβίβασης λόγω δωρεάς."},{"k":"γ","t":"Η απόκτηση κινητών αξιών είναι αποτέλεσμα μεταβίβασης λόγω εξωχρηματιστηριακής πώλησης μεταξύ συγγενών."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":78,"a":"δ","q":"Για το περιεχόμενο του Ενημερωτικού Δελτίου:","o":[{"k":"α","t":"Δεν ευθύνονται τα μέλη του ΔΣ."},{"k":"β","t":"Δεν ευθύνεται ο εκδότης."},{"k":"γ","t":"Ευθύνεται μόνο ο ανάδοχος."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":79,"a":"δ","q":"Η ιδιωτική τοποθέτηση:","o":[{"k":"α","t":"Απευθύνεται σε περιορισμένο επενδυτικό κοινό, ειδικούς και μη ειδικούς επενδυτές."},{"k":"β","t":"Απευθύνεται σε απεριόριστο αριθμό επενδυτών."},{"k":"γ","t":"Έχει ποσοτικό όριο στον αριθμό μετοχών που μπορεί να αποκτήσει ένας επενδυτής."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":80,"a":"β","q":"Σε περίπτωση είτε υποχρεωτικής είτε προαιρετικής δημόσιας πρότασης, ο προτείνων, πριν προβεί σε οποιαδήποτε σχετική ανακοίνωση προς το κοινό, ενημερώνει εγγράφως:","o":[{"k":"α","t":"Την Επιτροπή Κεφαλαιαγοράς, το Χρηματιστήριο Αθηνών και το Διοικητικό Συμβούλιο της υπό εξαγορά εταιρείας."},{"k":"β","t":"Την Επιτροπή Κεφαλαιαγοράς και το Διοικητικό Συμβούλιο της υπό εξαγορά εταιρείας."},{"k":"γ","t":"Το Χρηματιστήριο Αθηνών και το Διοικητικό Συμβούλιο της υπό εξαγορά εταιρείας."},{"k":"δ","t":"Το Υπουργείο Οικονομικών, την Επιτροπή Κεφαλαιαγοράς και το Διοικητικό Συμβούλιο της υπό εξαγορά εταιρείας."}]}],"ΠΡΟΣΤΑΣΙΑ":[{"n":1,"a":"δ","q":"Η απαγόρευση κατάχρησης προνομιακών πληροφοριών δεν ισχύει:","o":[{"k":"α","t":"Στα νομικά πρόσωπα."},{"k":"β","t":"Στα νομικά πρόσωπα δημοσίου δικαίου."},{"k":"γ","t":"Στους επαγγελματίες επενδυτές."},{"k":"δ","t":"Στις συναλλαγές που πραγματοποιούνται προς εκπλήρωση μιας απαιτητής υποχρέωσης που αναλήφθηκε πριν την απόκτηση της προνομιακής πληροφορίας."}]},{"n":2,"a":"δ","q":"Η απαγόρευση χρήσης προνομιακών πληροφοριών για ίδιο λογαριασμό αφορά γενικώς: I.Τα μέλη διοικητικού συμβουλίου των εισηγμένων εταιριών. II.Τους μετόχους των εισηγμένων εταιριών. III.Τους εργαζόμενους στις εισηγμένες εταιρίες που βρίσκονται κοντά στη λήψη επιχειρηματικών αποφάσεων. IV.Όσους κατέχουν την πληροφορία από κάποιο από τα ανωτέρω πρόσωπα.","o":[{"k":"α","t":"I, II και III μόνο."},{"k":"β","t":"I, II και IV μόνο."},{"k":"γ","t":"II, III και IV μόνο."},{"k":"δ","t":"I, II, III και IV."}]},{"n":3,"a":"α","q":"Μεταξύ των προϋποθέσεων για τη μη εφαρμογή των απαγορεύσεων κατάχρησης, ανακοίνωσης προνομιακών πληροφοριών και χειραγώγησης αγοράς στις συναλλαγές σε ίδιες μετοχές που διενεργούνται στο πλαίσιο προγραμμάτων επαναγοράς είναι:","o":[{"k":"α","t":"Να τηρούνται επαρκή όρια όσον αφορά την τιμή και τον όγκο."},{"k":"β","t":"Τα πλήρη στοιχεία του προγράμματος να δημοσιοποιούνται μετά την έναρξη της διαπραγμάτευσης."},{"k":"γ","t":"Να έχει ληφθεί προηγούμενη σχετική έγκριση του Υπουργείου Οικονομικών."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":4,"a":"γ","q":"Η εισηγμένη εταιρία δικαιούται να αναβάλει προσωρινά τη δημοσιοποίηση μιας προνομιακής πληροφορίας:","o":[{"k":"α","t":"Εφόσον κρίνεται ότι η δημοσιοποίηση θα επηρεάσει αρνητικά την τιμή της μετοχής της."},{"k":"β","t":"Ύστερα από απόφαση του διοικητικού της συμβουλίου που λαμβάνεται με πλειοψηφία των 2/3 των μελών του."},{"k":"γ","t":"Εφόσον η άμεση δημοσιοποίησή της ενδέχεται να βλάψει τα νόμιμα συμφέροντά της, η αναβολή της δεν ενδέχεται να παραπλανήσει το κοινό και η εταιρία έχει διασφαλίσει την εμπιστευτικότητά της."},{"k":"δ","t":"Ύστερα από άδεια του αρμόδιου δικαστηρίου."}]},{"n":5,"a":"α","q":"Οι σωρευτικές προϋποθέσεις, μεταξύ άλλων, για το επιτρεπτό της προσωρινής αναβολής δημοσιοποίησης, από τον εκδότη, προνομιακών πληροφοριών είναι:","o":[{"k":"α","t":"H ανυπαρξία κινδύνου παραπλάνησης του επενδυτικού κοινού και η διασφάλιση της εμπιστευτικότητας της πληροφορίας."},{"k":"β","t":"H ανυπαρξία κινδύνου παραπλάνησης του επενδυτικού κοινού, η διασφάλιση της εμπιστευτικότητας της πληροφορίας και η σχετική έγκριση της ΕΚ."},{"k":"γ","t":"H λήψη απόφασης από το ΔΣ τον εκδότη με σύμφωνη γνώμη του 70% τουλάχιστον των μη εκτελεστικών μελών."},{"k":"δ","t":"H έγκριση της ΓΣ των μετόχων του εκδότη, εφόσον η σχετική απόφαση λαμβάνεται «κεκλεισμένων των θυρών»."}]},{"n":6,"a":"δ","q":"Τυχόν διαρροή, εκ προθέσεως ή εξ αμελείας, προνομιακής πληροφορίας από τον εκδότη, διαρκούσης της αναβολής, συνεπάγεται αυτοδικαίως:","o":[{"k":"α","t":"Eπιβολή προστίμου από την ΕΚ ύψους, κατά περίπτωση, 3.000-100.000 ευρώ."},{"k":"β","t":"Σύγκληση έκτακτης ΓΣ του εκδότη για λήψη αποφάσεων επί του πρακτέου."},{"k":"γ","t":"Υποχρέωση του εκδότη, μετά από απόφαση του ΔΣ, να αιτιολογήσει τη διαρροή στην ΕΚ."},{"k":"δ","t":"Υποχρέωση του εκδότη να δημοσιοποιήσει αμέσως την προνομιακή πληροφορία."}]},{"n":7,"a":"β","q":"Υποχρέωση αναφοράς προνομιακής πληροφόρησης δημιουργείται:","o":[{"k":"α","t":"Εάν έχει λάβει χώρα το γεγονός."},{"k":"β","t":"Εάν έχει λάβει χώρα ή ενδέχεται να λάβει με βεβαιότητα χώρα το γεγονός."},{"k":"γ","t":"Εάν δεν έχει λάβει χώρα το γεγονός."},{"k":"δ","t":"Βάσει αντικειμενικής αξιολόγησης."}]},{"n":8,"a":"δ","q":"Η εισηγμένη εταιρία μπορεί να αναβάλει τη δημοσιοποίηση μιας προνομιακής πληροφορίας:","o":[{"k":"α","t":"Χωρίς προϋποθέσεις."},{"k":"β","t":"Δεν μπορεί ποτέ να αναβάλει τη δημοσιοποίηση μιας προνομιακής πληροφορίας."},{"k":"γ","t":"Μπορεί να το κάνει για διάστημα έως 5 ημέρες"},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":9,"a":"β","q":"Ο ελάχιστος προβλεπόμενος χρόνος για την εμφάνιση στην ιστοσελίδα εκδότη των δημοσιοποιούμενων από αυτόν προνομιακών πληροφοριών είναι:","o":[{"k":"α","t":"1 χρόνο."},{"k":"β","t":"5 χρόνια."},{"k":"γ","t":"6 μήνες."},{"k":"δ","t":"3 χρόνια."}]},{"n":10,"a":"γ","q":"Οι εκδότες εκπληρώνουν την υποχρέωση δημοσιοποίησης προνομιακών πληροφοριών:","o":[{"k":"α","t":"Όταν ενημερώνουν για τη δημιουργία μιας κατάστασης ή την επέλευση ενός γεγονότος, μόνον όταν αυτό έχει οριστικοποιηθεί."},{"k":"β","t":"Όταν πιθανολογούν, αναφέροντας και ποσοστό πιθανοτήτων, τη δημιουργία μιας κατάστασης ή την επέλευση ενός γεγονότος."},{"k":"γ","t":"Όταν, κατά τη δημιουργία μιας κατάστασης ή την επέλευση ενός γεγονότος, ενημερώνουν χωρίς υπαίτια βραδύτητα το επενδυτικό κοινό, χωρίς να αναμένουν την οριστικοποίηση αυτής της κατάστασης ή του γεγονότος."},{"k":"δ","t":"Όταν, μετά την οριστικοποίηση μιας κατάστασης ή την επέλευση ενός γεγονότος, ενημερώνουν την ΕΚ, προκειμένου να λάβουν οδηγίες για το περιεχόμενο της ενημέρωσης του επενδυτικού κοινού."}]},{"n":11,"a":"δ","q":"Δεν θεωρείται εκμετάλλευση προνομιακής πληροφορίας:","o":[{"k":"α","t":"Το να ενημερώσει ο κάτοχος της πληροφορίας, που είναι μέλος του διοικητικού συμβουλίου εκδότη, έναν φίλο του να αγοράσει μετοχές."},{"k":"β","t":"Η εντολή για τη διενέργεια συναλλαγής, βάσει της πληροφορίας, εάν δεν ολοκληρώθηκε η συναλλαγή."},{"k":"γ","t":"Η συναλλαγή που ολοκληρώθηκε από τον κάτοχο της προνομιακής πληροφορίας η οποία όμως του επέφερε ζημία."},{"k":"δ","t":"Η διενέργεια συναλλαγών στη βάση της πληροφορίας, εάν προηγουμένως η πληροφορία έχει δημοσιευθεί από τον εκδότη."}]},{"n":12,"a":"δ","q":"Σύμφωνα με το νομοθετικό πλαίσιο για την κατάχρηση της αγοράς απαγορεύεται σε κατόχους προνομιακών πληροφοριών:","o":[{"k":"α","t":"Να τις χρησιμοποιούν για να αποκτήσουν ή να διαθέσουν ή για να προσπαθήσουν να αποκτήσουν ή να διαθέσουν, για λογαριασμό τους ή για λογαριασμό τρίτων, αμέσως ή εμμέσως χρηματοπιστωτικά μέσα στα οποία αφορούν οι πληροφορίες αυτές."},{"k":"β","t":"Να τις χρησιμοποιούν για να αποκτήσουν ή να διαθέσουν για λογαριασμό τους χρηματοπιστωτικά μέσα στα οποία αφορούν οι πληροφορίες αυτές, καθώς και να τις ανακοινώνουν σε άλλο πρόσωπο."},{"k":"γ","t":"Να τις ανακοινώνουν σε άλλο πρόσωπο, καθώς και να συνιστούν σε άλλο πρόσωπο ή να το παρακινούν, βάσει των πληροφοριών αυτών να αποκτήσει ή να διαθέσει, το ίδιο ή μέσω άλλου, τα χρηματοπιστωτικά μέσα στα οποία αφορούν οι πληροφορίες."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":13,"a":"δ","q":"Η αναφορά ενός προσώπου στον κατάλογο που συνέταξε ο εκδότης για τα πρόσωπα που έχουν πρόσβαση σε προνομιακές πληροφορίες:","o":[{"k":"α","t":"Απαλλάσσει το πρόσωπο αυτό από την υποχρέωση να απέχει από πράξεις κατάχρησης προνομιακών πληροφοριών."},{"k":"β","t":"Συνεπάγεται απόλυτη απαγόρευση συναλλαγών για το πρόσωπο αυτό."},{"k":"γ","t":"Συνεπάγεται τη δυνατότητα διενέργειας συναλλαγών από το πρόσωπο αυτό μόνον ύστερα από άδεια της ΕΚ."},{"k":"δ","t":"Δεν απαλλάσσει το πρόσωπο αυτό από την υποχρέωση να απέχει από πράξεις κατάχρησης προνομιακών πληροφοριών."}]},{"n":14,"a":"γ","q":"Ένα φυσικό πρόσωπο μπορεί να πραγματοποιήσει μία ανοιχτή πώληση εισηγμένης μετοχής όταν:","o":[{"k":"α","t":"Έχει στην κατοχή του τη μετοχή αυτή."},{"k":"β","t":"Έχει ενημερώσει έγκαιρα γραπτώς την ΕΠΕΥ με την οποία συνεργάζεται."},{"k":"γ","t":"Έχει συνάψει συμφωνία για να δανειστεί τη μετοχή."},{"k":"δ","t":"Έχει μειωθεί η τιμή της μετοχής αυτής."}]},{"n":15,"a":"γ","q":"H προνομιακή πληροφορία μπορεί να αφορά:","o":[{"k":"α","t":"Φήμη για ψευδή κατάσταση που έλαβε χώρα."},{"k":"β","t":"Ψευδή πληροφορία για γεγονός που ενδέχεται να λάβει χώρα."},{"k":"γ","t":"Μόνον γεγονός ή κατάσταση που έλαβε χώρα ή που ευλόγως αναμένεται ότι θα λάβει χώρα."},{"k":"δ","t":"Μόνον αξιολογικές κρίσεις."}]},{"n":16,"a":"α","q":"Είναι προνομιακή:","o":[{"k":"α","t":"Η πληροφορία σχετικά με επικείμενη συγχώνευση εισηγμένης εταιρίας."},{"k":"β","t":"Η πληροφορία σχετικά με ληφθείσα απόφαση διοικητικού συμβουλίου εισηγμένης για συγχώνευσή της με απορρόφηση."},{"k":"γ","t":"Η εκτίμηση για τα προσδοκώμενα οφέλη από συντελεσθείσα συγχώνευση εισηγμένης εταιρίας."},{"k":"δ","t":"Η πληροφορία σχετικά με την επικείμενη αλλαγή της επωνυμίας εισηγμένης εταιρίας μετά τη συγχώνευση με απορρόφησή της από άλλη."}]},{"n":17,"a":"δ","q":"Οι διατάξεις περί κατάχρησης προνομιακής πληροφορίας εφαρμόζονται, μεταξύ άλλων, σε κάθε πρόσωπο που κατέχει προνομιακή πληροφορία λόγω του ότι:","o":[{"k":"α","t":"Μετέχει με ποσοστό άνω του 5% στο κεφάλαιο του εκδότη."},{"k":"β","t":"Μετέχει με ποσοστό άνω του 20% στο κεφάλαιο του εκδότη."},{"k":"γ","t":"Μετέχει με ποσοστό άνω του 33,3% στο κεφάλαιο του εκδότη."},{"k":"δ","t":"Μετέχει στο κεφάλαιο του εκδότη, ανεξαρτήτως ποσοστού."}]},{"n":18,"a":"α","q":"Μια πληροφορία δεν θεωρείται «προνομιακή», εφόσον:","o":[{"k":"α","t":"Δεν είναι συγκεκριμένη."},{"k":"β","t":"Δεν έχει δημοσιοποιηθεί."},{"k":"γ","t":"Αφορά, άμεσα ή έμμεσα, έναν εκδότη ή μία μετοχή μόνο."},{"k":"δ","t":"Η δημοσιοποίησή της θα μπορούσε να επηρεάσει σημαντικά την τιμή της μετοχής που αφορά."}]},{"n":19,"a":"β","q":"Προνομιακή πληροφορία νοείται εκείνη που:","o":[{"k":"α","t":"Δεν έχει δημοσιοποιηθεί και αφορά άμεσα έναν ή περισσότερους εκδότες ή ένα ή περισσότερα χρηματοπιστωτικά μέσα και η οποία, αν δημοσιοποιούνταν, θα μπορούσε να επιδράσει σημαντικά στην τιμή των χρηματοπιστωτικών μέσων που αφορά."},{"k":"β","t":"Είναι συγκεκριμένη, δεν έχει δημοσιοποιηθεί και αφορά, άμεσα ή έμμεσα, έναν ή περισσότερους εκδότες ή ένα ή περισσότερα χρηματοπιστωτικά μέσα και η οποία, αν δημοσιοποιούνταν, θα μπορούσε να επιδράσει σημαντικά στην τιμή των χρηματοπιστωτικών μέσων που αφορά ή στην τιμή των συνδεόμενων με αυτά παραγώγων χρηματοπιστωτικών μέσων."},{"k":"γ","t":"Είναι γνωστή μόνο στα ανώτατα στελέχη του εκδότη και αφορά στην χρηματοοικονομική του κατάσταση."},{"k":"δ","t":"Παρέχει συγκριτικά πλεονεκτήματα σε περιορισμένο αριθμό προσώπων σε σχέση με τις χρηματιστηριακές τους συναλλαγές."}]},{"n":20,"a":"γ","q":"Παράνομη ανακοίνωση προνομιακής πληροφορίας συντρέχει όταν ένα πρόσωπο κατέχει προνομιακή πληροφορία και τη γνωστοποιεί σε οιοδήποτε άλλο πρόσωπο, εκτός αν η ανακοίνωση γίνεται:","o":[{"k":"α","t":"Κάτω από περιστάσεις ανωτέρας βίας."},{"k":"β","t":"Χάριν της ευστάθειας του χρηματοπιστωτικού συστήματος."},{"k":"γ","t":"Κατά τη συνήθη άσκηση της εργασίας, του επαγγέλματος ή των καθηκόντων του."},{"k":"δ","t":"Χωρίς οποιαδήποτε ωφελήματα για το πρόσωπο που την γνωστοποιεί."}]},{"n":21,"a":"δ","q":"Μια πληροφορία θεωρείται προνομιακή εφόσον:","o":[{"k":"α","t":"Είναι συγκεκριμένη και δεν έχει δημοσιοποιηθεί."},{"k":"β","t":"Δεν έχει δημοσιοποιηθεί και η δημοσιοποίησή της θα μπορούσε να επηρεάσει σημαντικά την τιμή των χρηματοπιστωτικών μέσων."},{"k":"γ","t":"Δεν έχει δημοσιοποιηθεί και αφορά σε εκδότες ή χρηματοπιστωτικά μέσα."},{"k":"δ","t":"Είναι συγκεκριμένη, δεν έχει δημοσιοποιηθεί, αφορά σε εκδότες ή χρηματοπιστωτικά μέσα και η δημοσιοποίησή της θα μπορούσε να επηρεάσει σημαντικά την τιμή των χρηματοπιστωτικών μέσων."}]},{"n":22,"a":"β","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Μόνο οι ΑΕΠΕΥ υποχρεούνται να ειδοποιούν άμεσα την ΕΚ, όταν υπάρχουν σοβαρές υπόνοιες ότι εντολές για την κατάρτιση συναλλαγών ή συναλλαγές που έχουν καταρτισθεί θα μπορούσαν να συνιστούν κατάχρηση της αγοράς."},{"k":"β","t":"Οποιοδήποτε πρόσωπο διαμεσολαβεί κατ’επάγγελμα στην κατάρτιση συναλλαγών, υποχρεούται να ειδοποιεί άμεσα την ΕΚ, όταν υπάρχουν σοβαρές υπόνοιες ότι εντολές για την κατάρτιση συναλλαγών ή συναλλαγές που έχουν καταρτισθεί θα μπορούσαν να συνιστούν κατάχρηση της αγοράς."},{"k":"γ","t":"Οι ΑΕΠΕΥ, ΑΕΕΔ και πιστωτικά ιδρύματα που παρέχουν επενδυτικές υπηρεσίες υποχρεούνται να ειδοποιούν άμεσα την ΕΚ, όταν έχουν αποδείξεις ότι εντολές για την κατάρτιση συναλλαγών ή συναλλαγές που έχουν καταρτισθεί θα μπορούσαν να συνιστούν κατάχρηση της αγοράς."},{"k":"δ","t":"Οι ΑΕΠΕΥ, ΑΕΕΔ και πιστωτικά ιδρύματα που παρέχουν επενδυτικές υπηρεσίες δεν υποχρεούνται να διαθέτουν αποτελεσματικούς μηχανισμούς και διαδικασίες εντοπισμού περιπτώσεων κατάχρησης της αγοράς."}]},{"n":23,"a":"δ","q":"ΑΕΠΕΥ, πιστωτικά ιδρύματα, ΑΕΕΔ υποχρεούνται να ειδοποιούν την ΕΚ σε περίπτωση υπονοιών κατάχρησης αγοράς:","o":[{"k":"α","t":"Εφόσον προηγουμένως ενημερώσουν τον Εισαγγελέα Πλημμελειοδικών."},{"k":"β","t":"Αφού προηγουμένως ζητήσουν διευκρινήσεις από τους τυχόν εμπλεκόμενους."},{"k":"γ","t":"Με την προϋπόθεση ότι έχουν αξιολογήσει ως μη πειστικές τις σχετικές εξηγήσεις."},{"k":"δ","t":"Άνευ ετέρου."}]},{"n":24,"a":"δ","q":"Ο εσωτερικός έλεγχος ΑΕΠΕΥ ή πιστωτικού ιδρύματος οφείλει να ελέγχει σε καθημερινή βάση τις συναλλαγές που εκτέλεσε η ΑΕΠΕΥ ή το πιστωτικό ίδρυμα, στο πλαίσιο αποτροπής πρακτικών κατάχρησης αγοράς:","o":[{"k":"α","t":"Εάν λάβει σχετική εντολή από το τμήμα συναλλαγών της ΑΕΠΕΥ ή του πιστωτικού ιδρύματος."},{"k":"β","t":"Σε περίπτωση που δεν προβαίνει σε καταγραφή των εντολών πελατών που δίδονται τηλεφωνικά."},{"k":"γ","t":"Σε καμία περίπτωση."},{"k":"δ","t":"Εάν αντιπροσωπεύουν σημαντικό ποσοστό του καθημερινού όγκου συναλλαγών επί της σχετικής μετοχής."}]},{"n":25,"a":"β","q":"Εφόσον υπάρχουν σοβαρές υπόνοιες ότι συναλλαγές που έχουν καταρτισθεί θα μπορούσαν να συνιστούν κατάχρηση της αγοράς, τα πρόσωπα που διαμεσολαβούν κατ' επάγγελμα στην κατάρτιση συναλλαγών:","o":[{"k":"α","t":"Υποχρεούνται να ενημερώσουν την εκδότρια εταιρία."},{"k":"β","t":"Υποχρεούνται να ενημερώσουν την ΕΚ."},{"k":"γ","t":"Υποχρεούνται να ενημερώσουν εγγράφως τους πελάτες τους."},{"k":"δ","t":"Υποχρεούνται μόνον να υποβάλουν μηνυτήρια αναφορά στον αρμόδιο εισαγγελέα."}]},{"n":26,"a":"γ","q":"Προκειμένου να μη θεωρηθεί ένα πρόγραμμα επαναγοράς ιδίων μετοχών από εκδότη ως κατάχρηση αγοράς θα πρέπει να έχει ως μοναδικό σκοπό: I. Τη μείωση του κεφαλαίου του εκδότη. II. Να εκπληρώνει υποχρεώσεις παράδοσης μετοχών λόγω λήξης μετατρέψιμων σε μετοχές ομολόγων. III. Να εκπληρώνει υποχρεώσεις προς τους εργαζόμενους της εταιρίας από λήξη stock options. IV. Να έχει στόχο τη στήριξη της τιμής της μετοχής της.","o":[{"k":"α","t":"I, II."},{"k":"β","t":"Ι, ΙΙ, ΙV."},{"k":"γ","t":"I, II, III."},{"k":"δ","t":"II, IV."}]},{"n":27,"a":"α","q":"Μια εισηγμένη στο ΧΑ εταιρία δεν υποχρεούται να δημοσιοποιήσει μια προνομιακή πληροφορία εάν:","o":[{"k":"α","t":"Δεν αφορά άμεσα την εταιρία."},{"k":"β","t":"Δεν την έχει δημοσιοποιήσει μεν αλλά τα στελέχη της έχουν ενημερώσει όλους τους υπαλλήλους της εταιρίας."},{"k":"γ","t":"Η πληροφορία έχει διαρρεύσει στον τύπο από ανώνυμες πηγές."},{"k":"δ","t":"Η ίδια η εταιρία δεν προβαίνει σε αγορά ιδίων μετοχών."}]},{"n":28,"a":"δ","q":"Ο εκδότης κινητών αξιών εισηγμένων σε ρυθμιζόμενη αγορά έχει υποχρέωση να καταρτίζει κατάλογο απασχολούμενων προσώπων που έχουν πρόσβαση σε προνομιακές πληροφορίες. Ο κατάλογος αυτός πρέπει να τηρείται για τουλάχιστον:","o":[{"k":"α","t":"2 έτη."},{"k":"β","t":"3 έτη."},{"k":"γ","t":"4 έτη."},{"k":"δ","t":"5 έτη."}]},{"n":29,"a":"α","q":"Η ακάλυπτη / ανοιχτή πώληση έγκειται:","o":[{"k":"α","t":"Στη λήψη αρνητικής θέσης του επενδυτή στην υποκείμενη αξία."},{"k":"β","t":"Στη λήψη θετικής θέσης του επενδυτή στην υποκείμενη αξία."},{"k":"γ","t":"Στη συμφωνία δανεισμού εισηγμένης μετοχής / κρατικού χρεωστικού τίτλου."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":30,"a":"α","q":"Οι εταιρίες οφείλουν να τηρούν κατάλογο:","o":[{"k":"α","t":"Με τα πρόσωπα που εργάζονται γι’ αυτές είτε με σύμβαση εργασίας είτε άλλως, και τα οποία έχουν πρόσβαση σε προνομιακές πληροφορίες, τον οποίο και τηρούν για τουλάχιστον πέντε έτη."},{"k":"β","t":"Με τα διευθυντικά στελέχη της εταιρίας που έχουν πρόσβαση σε προνομιακές πληροφορίες, τον οποίο και τηρούν για τουλάχιστον πέντε έτη."},{"k":"γ","t":"Με τα πρόσωπα που εργάζονται γι’ αυτές είτε με σύμβαση εργασίας είτε άλλως, και τα οποία έχουν πρόσβαση σε προνομιακές πληροφορίες, τον οποίο και τηρούν για τουλάχιστον τρία έτη."},{"k":"δ","t":"Με τα διευθυντικά στελέχη της εταιρίας και τους έχοντες στενούς δεσμούς με τα στελέχη αυτά που έχουν πρόσβαση σε προνομιακές πληροφορίες, τον οποίο και τηρούν για τουλάχιστον πέντε έτη."}]},{"n":31,"a":"δ","q":"Ο υπάλληλος της εταιρείας που είναι καταχωρημένος στο μητρώο της εταιρείας σχετικά με την τήρηση διαδικασίας για κατοχή προνομιακών πληροφοριών:","o":[{"k":"α","t":"Απαλλάσσεται από την υποχρέωση τήρησης της διαδικασίας σχετικά με την κατοχή προνομιακών πληροφοριών."},{"k":"β","t":"Δεν επιτρέπεται σε καμία περίπτωση να προβαίνει σε συναλλαγές."},{"k":"γ","t":"Επιτρέπεται να κάνει συναλλαγές μόνο ύστερα από έγκριση της ΕΚ."},{"k":"δ","t":"Δεν απαλλάσσεται από την υποχρέωση τήρησης των διαδικασιών σχετικά με την κατοχή προνομιακών πληροφοριών."}]},{"n":32,"a":"β","q":"Ένας συμμετέχων στην αγορά ο οποίος πραγματοποιεί βολιδοσκόπηση αγοράς, εφόσον κατά τη διάρκεια της βολιδοσκόπησης αποκαλύπτει πληροφορίες:","o":[{"k":"α","t":"Δημοσιεύει τις πληροφορίες αυτές στον ιστότοπό του."},{"k":"β","t":"Καταχωρεί εγγράφως το συμπέρασμα στο οποίο κατέληξε και την αιτιολόγησή του."},{"k":"γ","t":"Παύει τη βολιδοσκόπηση, χωρίς υπαίτια καθυστέρηση."},{"k":"δ","t":"Υποχρεούται να μην επαναλάβει τη βολιδοσκόπηση για εκδότη του ίδιου κλάδου."}]},{"n":33,"a":"β","q":"Πρόσωπα που ασκούν διευθυντικά καθήκοντα σε εκδότη με κινητές αξίες εισηγμένες σε ρυθμιζόμενη αγορά έχουν υποχρέωση να γνωστοποιούν στον εκδότη τις συναλλαγές που διενεργούν στις κινητές αξίες του εκδότη το αργότερο εντός:","o":[{"k":"α","t":"Της επόμενης ημέρας από την κατάρτιση της συναλλαγής."},{"k":"β","t":"Εντός τριών ημερών από την κατάρτιση της συναλλαγής."},{"k":"γ","t":"Εντός πέντε ημερών από την κατάρτιση της συναλλαγής."},{"k":"δ","t":"Όποτε αυτό ζητηθεί από την Επιτροπή Κεφαλαιαγοράς."}]},{"n":34,"a":"δ","q":"Σε ό,τι αφορά στη γνωστοποίηση συναλλαγών που πραγματοποιούν πρόσωπα που ασκούν διευθυντικά καθήκοντα σε εκδότη και οι έχοντες στενό δεσμό με αυτά τα πρόσωπα (υπόχρεα πρόσωπα) σε μετοχές του εκδότη, ή παράγωγα ή άλλα συνδεδεμένα χρηματοπιστωτικά μέσα:","o":[{"k":"α","t":"Η σχετική γνωστοποίηση γίνεται από τα υπόχρεα πρόσωπα προς την ΕΚ το αργότερο εντός δύο εργασίμων ημερών από την κατάρτιση των εν λόγω συναλλαγών."},{"k":"β","t":"Η σχετική γνωστοποίηση γίνεται από τα υπόχρεα πρόσωπα προς τον εκδότη το αργότερο εντός δύο εργασίμων ημερών από την κατάρτιση των εν λόγω συναλλαγών και ο τελευταίος διαβιβάζει τη γνωστοποίηση εντός της επόμενης εργάσιμης ημέρας από τη λήψη της στο επενδυτικό κοινό."},{"k":"γ","t":"Η σχετική γνωστοποίηση γίνεται από τα υπόχρεα πρόσωπα προς το κοινό το αργότερο εντός δύο εργασίμων ημερών από την κατάρτιση των εν λόγω συναλλαγών."},{"k":"δ","t":"Η σχετική γνωστοποίηση γίνεται από τα υπόχρεα πρόσωπα προς τον εκδότη το αργότερο εντός τριών εργασίμων ημερών από την κατάρτιση των εν λόγω συναλλαγών και ο τελευταίος την δημοσιοποιεί εντός τριών εργάσιμων ημερών από τη συναλλαγή προς το επενδυτικό κοινό."}]},{"n":35,"a":"δ","q":"Στα «υπόχρεα πρόσωπα», σύμφωνα με το νομοθετικό πλαίσιο για την κατάχρηση αγοράς, εμπίπτουν:","o":[{"k":"α","t":"Τα στελέχη των εποπτικών αρχών του εκδότη."},{"k":"β","t":"Οι ανταγωνίστριες εταιρείες του εκδότη εφόσον είναι ανώνυμες εταιρείες."},{"k":"γ","t":"Η τυχόν μητρική εταιρεία του εκδότη."},{"k":"δ","t":"Τα εξαρτώμενα τέκνα προσώπου που ασκεί διευθυντικά καθήκοντα στον εκδότη."}]},{"n":36,"a":"γ","q":"Ποια, σύμφωνα με το πλαίσιο αποτροπής κατάχρησης αγοράς, από τα παρακάτω πρόσωπα υποχρεούνται να γνωστοποιούν στον εκδότη τις συναλλαγές που διενεργούν και αφορούν μετοχές που εκδίδονται από αυτόν: I. Τα μέλη των διοικητικών, διευθυντικών ή εποπτικών οργάνων του εκδότη. II. Τα ανώτατα διευθυντικά στελέχη που έχουν αφενός πρόσβαση σε προνομιακές πληροφορίες και αφετέρου την εξουσία να λαμβάνουν διαχειριστικές αποφάσεις. III. Οι σημαντικότεροι προμηθευτές. IV. Όσοι έχουν «στενό δεσμό» με τα πρόσωπα της περίπτωσης (Ι) παραπάνω.","o":[{"k":"α","t":"I,II,III και IV."},{"k":"β","t":"I,II και III."},{"k":"γ","t":"I,II και IV."},{"k":"δ","t":"I,III και IV."}]},{"n":37,"a":"γ","q":"Οι κατηγορίες προσώπων που έχουν ορισμένες υποχρεώσεις για την αποτροπή/εντοπισμό ζητημάτων κατάχρησης αγοράς, και δεν αποτελούν στελέχη, μέλη οργάνων κλπ. του εκδότη ή έχοντες στενό δεσμό μ' αυτά είναι:","o":[{"k":"α","t":"Αναλυτής, προμηθευτής, ορκωτοί ελεγκτές."},{"k":"β","t":"Ορκωτοί ελεγκτές, εντολοδόχοι, επόπτες."},{"k":"γ","t":"Αναλυτές, διαχειριστές αγοράς, επαγγελματίες κατάρτισης συναλλαγών."},{"k":"δ","t":"Επαγγελματίες κατάρτισης συναλλαγών, αναλυτές, ορκωτοί ελεγκτές."}]},{"n":38,"a":"α","q":"Ποια από τις παρακάτω προτάσει
