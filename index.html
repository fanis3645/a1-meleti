:"Οργανωμένη αγορά."}]},{"n":6,"a":"α","q":"Τέταρτες αγορές, είναι:","o":[{"k":"α","t":"Αγορές στις οποίες διαπραγματεύονται απευθείας οι αντισυμβαλλόμενοι."},{"k":"β","t":"Αγορές στις οποίες υπάρχει διαχειριστής αγοράς."},{"k":"γ","t":"Χρηματιστηριακές αγορές στις οποίες διαπραγματεύονται αξιόγραφα που δεν είναι εισηγμένα στο χρηματιστήριο."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":7,"a":"γ","q":"Πρωτογενής αγορά είναι:","o":[{"k":"α","t":"Η αγορά όπου τα στελέχη επιχειρήσεων πωλούν υπάρχοντες τίτλους για να αυξήσουν τα κεφάλαια της επιχείρησης."},{"k":"β","t":"Η αγορά όπου ένας χρηματοπιστωτικός οργανισμός μπορεί να αγοράσει ή να πουλήσει υπάρχοντες τίτλους σε μια επενδυτική τράπεζα."},{"k":"γ","t":"Η αγορά όπου προσφέρονται νέοι τίτλοι."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":8,"a":"γ","q":"Ποια από τις κατωτέρω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Η Ηλεκτρονική Δευτερογενής Αγορά Τίτλων (ΗΔΑΤ) είναι δευτερογενής αγορά."},{"k":"β","t":"Στη δευτερογενή αγορά ένας χρηματοπιστωτικός οργανισμός μπορεί να αγοράσει ή να πουλήσει υπάρχοντες τίτλους."},{"k":"γ","t":"Πρωτογενής αγορά είναι αυτή στην οποία πωλούνται ήδη υπάρχοντες τίτλοι."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":9,"a":"δ","q":"Στην Ηλεκτρονική Δευτερογενή Αγορά Τίτλων (ΗΔΑΤ) δεν γίνονται αντικείμενο διαπραγμάτευσης:","o":[{"k":"α","t":"Ομόλογα μηδενικού τοκομεριδίου."},{"k":"β","t":"Αποσυνδεδεμένα τοκομερίδια (STRIPS)."},{"k":"γ","t":"Ομόλογα κυμαινόμενου επιτοκίου."},{"k":"δ","t":"Ομολογίες μετατρέψιμες σε μετοχές."}]},{"n":10,"a":"δ","q":"Στην Ηλεκτρονική Δευτερογενή Αγορά Τίτλων (ΗΔΑΤ) αποτελούν αντικείμενο διαπραγμάτευσης:","o":[{"k":"α","t":"Ομόλογα μηδενικού τοκομεριδίου και ομόλογα κυμαινόμενου επιτοκίου."},{"k":"β","t":"Έντοκα γραμμάτια του Ελληνικού Δημοσίου και ομόλογα σταθερού επιτοκίου."},{"k":"γ","t":"Αποσυνδεδεμένα τοκομερίδια και τίτλοι συνδεδεμένοι με τον πληθωρισμό (inflation indexed)."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":11,"a":"β","q":"Ως κεφαλαιοποίηση μιας εταιρείας εννοούμε:","o":[{"k":"α","t":"Το ύψος των ιδίων κεφαλαίων της."},{"k":"β","t":"Τον γινόμενο του αριθμού των μετοχών της επί την τρέχουσα τιμή της μετοχής."},{"k":"γ","t":"Το σύνολο των κεφαλαίων της."},{"k":"δ","t":"Τον αριθμό των μετοχών της επί την τιμή εισαγωγής της μετοχής στο χρηματιστήριο."}]},{"n":12,"a":"β","q":"Η ακόλουθη έκφραση: «Λόγω της κρίσης η κεφαλαιοποίηση του χρηματιστηρίου μειώθηκε κατά 30%» σημαίνει ότι:","o":[{"k":"α","t":"Ο Γενικός Δείκτης μειώθηκε κατά 30%."},{"k":"β","t":"Η συνολική αξία των μετοχών που είναι εισηγμένες μειώθηκε κατά 30%."},{"k":"γ","t":"Ο όγκος συναλλαγών μειώθηκε κατά 30%."},{"k":"δ","t":"Ο αριθμός των μετοχών του χρηματιστηρίου μειώθηκε κατά 30%."}]},{"n":13,"a":"γ","q":"Μια αγορά αποτελείται από 2 μόνο εισηγμένες εταιρείες, τις Α και Β . Ο πιο κάτω πίνακας περιέχει πληροφορίες για τις μετοχές των δύο αυτών εταιριών: | Εταιρίες | Χρηματιστηριακή | Λογιστική | Ονομαστική αξία | Αριθμός εισηγμένων | | | τιμή μετοχής | τιμή μετοχής | μετοχής | μετοχών | ------------------------------------------------------------------------------------------------------- | Α | 2,0 | 2 | 1,0 | 100.000.000 | ------------------------------------------------------------------------------------------------------- | Β | 1,5 | 2 | 0,5 | 200.000.000 | ------------------------------------------------------------------------------------------------------- Η κεφαλαιοποίηση της αγοράς είναι:","o":[{"k":"α","t":"600 εκ. ευρώ."},{"k":"β","t":"200 εκ. ευρώ."},{"k":"γ","t":"500 εκ. ευρώ."},{"k":"δ","t":"Δεν μπορεί να υπολογισθεί με τα πιο πάνω δεδομένα."}]},{"n":14,"a":"α","q":"Μια εταιρεία έχει εκδώσει 1.000.000 μετοχές με ονομαστική αξία 1 ευρώ. Η τρέχουσα χρηματιστηριακή τιμή της είναι 6 ευρώ ενώ η λογιστική της τιμή είναι 3 ευρώ. Ποια είναι η κεφαλαιοποίησή της σήμερα;","o":[{"k":"α","t":"6.000.000 ευρώ."},{"k":"β","t":"3.000.000 ευρώ."},{"k":"γ","t":"1.000.000 ευρώ."},{"k":"δ","t":"Απροσδιόριστη."}]},{"n":15,"a":"β","q":"Ο όγκος των συναλλαγών αναφέρεται:","o":[{"k":"α","t":"Στο σύνολο των τεμαχίων των μετοχών επί τις αντίστοιχες τιμές στις οποίες πραγματοποιήθηκαν συναλλαγές."},{"k":"β","t":"Στο σύνολο των τεμαχίων των μετοχών που διακινήθηκαν."},{"k":"γ","t":"Στο ύψος των τιμών στις οποίες πραγματοποιήθηκαν συναλλαγές."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":16,"a":"α","q":"Στη δευτερογενή αγορά κεφαλαίου διακινούνται:","o":[{"k":"α","t":"Μακροχρόνιες οικονομικές απαιτήσεις."},{"k":"β","t":"Έντοκα γραμμάτια του Δημοσίου διάρκειας μικρότερης από ένα έτος."},{"k":"γ","t":"Τραπεζικά ομόλογα διάρκειας 6 μηνών."},{"k":"δ","t":"Βραχυχρόνιες οικονομικές απαιτήσεις."}]},{"n":17,"a":"α","q":"Έξω-χρηματιστηριακές αγορές, είναι:","o":[{"k":"α","t":"Άτυπες αγορές στις οποίες διαπραγματεύονται αξιόγραφα που δεν είναι εισηγμένα στο χρηματιστήριο."},{"k":"β","t":"Χρηματιστηριακές αγορές στις οποίες διαπραγματεύονται αξιόγραφα που δεν είναι εισηγμένα στο χρηματιστήριο."},{"k":"γ","t":"Άτυπες αγορές, με συγκεκριμένους όμως κανόνες διαπραγμάτευσης."},{"k":"δ","t":"Αγορές στις οποίες συμμετέχουν μόνο πολύ μεγάλοι επενδυτές."}]},{"n":18,"a":"β","q":"Οι αγορές όπου δεν είναι οργανωμένες κεφαλαιαγορές είναι γνωστές ως:","o":[{"k":"α","t":"Πρωτογενείς αγορές."},{"k":"β","t":"Εξωχρηματιστηριακές αγορές."},{"k":"γ","t":"Δευτερογενείς αγορές."},{"k":"δ","t":"Αγορές Αξιογράφων."}]},{"n":19,"a":"β","q":"Δευτερογενείς ονομάζονται οι κεφαλαιαγορές, στις οποίες:","o":[{"k":"α","t":"Εισάγονται νεοεκδιδόμενα χρηματοοικονομικά προϊόντα."},{"k":"β","t":"Διακινούνται υφιστάμενα χρηματοοικονομικά προϊόντα."},{"k":"γ","t":"Δημιουργούνται χρηματοοικονομικά προϊόντα."},{"k":"δ","t":"Διαπραγματεύονται παράγωγα χρηματοοικονομικά προϊόντα."}]},{"n":20,"a":"δ","q":"Σχετικά με τις δημόσιες και τις ιδιωτικές αγορές τι από τα παρακάτω ισχύει:","o":[{"k":"α","t":"Οι δημόσιες αγορές απευθύνονται στο ευρύ επενδυτικό κοινό."},{"k":"β","t":"Στις δημόσιες αγορές δεν απαιτείται η έκδοση ενημερωτικού δελτίου."},{"k":"γ","t":"Οι ιδιωτικές αγορές απευθύνονται σε επενδυτές με πολύ μεγάλα κεφάλαια."},{"k":"δ","t":"Τα α και γ."}]},{"n":21,"a":"δ","q":"Παρεπόμενες επενδυτικές υπηρεσίες είναι: Ι. Η φύλαξη και διοικητική διαχείριση χρηματοπιστωτικών μέσων (υπηρεσίες θεματοφυλακής). ΙΙ. Η παροχή συμβουλών σε επιχειρήσεις σχετικές με τη διάρθρωση του κεφαλαίου τους, κλαδική στρατηγική, συγχωνεύσεις, εξαγορές. ΙΙΙ. Παροχή υπηρεσιών σχετιζόμενων με την αναδοχή. IV. Παροχή πιστώσεων ή δανείων σε επενδυτή προς διενέργεια συναλλαγής σε ένα ή περισσότερα χρηματοπιστωτικά μέσα, στην οποία μεσολαβεί η Εταιρεία Παροχής Επενδυτικών Υπηρεσιών (ΕΠΕΥ) η οποία παρέχει την πίστωση ή το δάνειο. V. Η έρευνα στον τομέα των επενδύσεων και τη χρηματοοικονομική ανάλυση, ή οι συστάσεις για συναλλαγές σε χρηματοπιστωτικά μέσα.","o":[{"k":"α","t":"I, II και ΙΙΙ."},{"k":"β","t":"Ι, ΙΙΙ και ΙV."},{"k":"γ","t":"I, II και IV."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ, IV και V."}]},{"n":22,"a":"δ","q":"Κύριες επενδυτικές υπηρεσίες είναι: Ι. Η εκτέλεση εντολών για λογαριασμό πελατών. ΙΙ. Η παροχή επενδυτικών συμβουλών προσωπικά σε πελάτη σχετικά με μια ή περισσότερες συναλλαγές που αφορούν χρηματοπιστωτικά μέσα. ΙΙΙ. Η διαχείριση χαρτοφυλακίων επενδυτών (σε ένα ή περισσότερα χρηματοπιστωτικά μέσα) κατόπιν εντολής των επενδυτών. IV. Η λειτουργία πολυμερούς μηχανισμού διαπραγμάτευσης.","o":[{"k":"α","t":"I, II και III."},{"k":"β","t":"II, III και IV."},{"k":"γ","t":"Ι, ΙΙ και IV."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":23,"a":"δ","q":"Όλες οι παρακάτω προτάσεις για τις πρωτογενείς και δευτερογενείς αγορές είναι σωστές, εκτός από:","o":[{"k":"α","t":"Πρωτογενής αγορά είναι αυτή στην οποία πωλούνται νέοι τίτλοι."},{"k":"β","t":"Δευτερογενής αγορά είναι αυτή στην οποία διαπραγματεύονται ήδη υπάρχοντες τίτλοι."},{"k":"γ","t":"Η Ηλεκτρονική Δευτερογενής Αγορά Τίτλων (ΗΔΑΤ) είναι δευτερογενής αγορά."},{"k":"δ","t":"Ο εκδότης των τίτλων, λαμβάνει τα έσοδα από μία πώληση στη δευτερογενή αγορά και όχι ο τωρινός κάτοχος του τίτλου."}]},{"n":24,"a":"α","q":"Οι λειτουργίες που επιτελούν οι πρωτογενείς αγορές είναι:","o":[{"k":"α","t":"Η πραγματοποίηση νέων εκδόσεων χρηματοοικονομικών προϊόντων και η πώλησή τους έναντι μετρητών."},{"k":"β","t":"Ο καθορισμός των τιμών των νέων εκδόσεων χρηματοοικονομικών προϊόντων και η πώλησή τους έναντι μετρητών."},{"k":"γ","t":"Κανένα από τα α και β."},{"k":"δ","t":"Τα α και β είναι σωστά."}]},{"n":25,"a":"γ","q":"Ποια από τις παρακάτω δεν είναι οργανωμένη αγορά;","o":[{"k":"α","t":"Η Αγορά Αξιών του Χρηματιστηρίου Αθηνών."},{"k":"β","t":"Η Αγορά Παραγώγων του Χρηματιστηρίου Αθήνων."},{"k":"γ","t":"Η διατραπεζική αγορά."},{"k":"δ","t":"Η Ηλεκτρονική Δευτερογενής Αγορά Τίτλων."}]},{"n":26,"a":"δ","q":"Ποια από τις παρακάτω αγορές θεωρείται οργανωμένη αγορά;","o":[{"k":"α","t":"Η Αγορά Αξιών του Χρηματιστηρίου Αθηνών."},{"k":"β","t":"Η Αγορά Παραγώγων του Χρηματιστηρίου Αθηνών."},{"k":"γ","t":"Η Ηλεκτρονική Δευτερογενής Αγορά Τίτλων."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":27,"a":"γ","q":"Οργανωμένη αγορά θεωρείται :","o":[{"k":"α","t":"Πολυμερές σύστημα, το οποίο τελεί υπό την διεύθυνση ή τη διαχείριση ενός πελάτη της αγοράς."},{"k":"β","t":"Πολυμερές σύστημα, το οποίο επιτρέπει την διενέργεια συναλλαγών σύμφωνα με τους κανόνες που επιβάλλουν οι συμμετέχοντες σε αυτή."},{"k":"γ","t":"Πολυμερές σύστημα, το οποίο έχει λάβει άδεια λειτουργίας από την εποπτική αρχή της χώρας που λειτουργεί."},{"k":"δ","t":"Ισχύουν τα α και β."}]},{"n":28,"a":"α","q":"Ο Πολυμερής Μηχανισμός Διαπραγμάτευσης (ΠΜΔ) είναι ένα πολυμερές σύστημα το οποίο τελεί υπό τη διεύθυνση ή τη διαχείριση μιας ΕΠΕΥ ή ενός πιστωτικού ιδρύματος ή ενός διαχειριστή αγοράς και επιτρέπει τη διενέργεια συναλλαγών για την αγορά και πώληση χρηματοπιστωτικών μέσων.","o":[{"k":"α","t":"Σωστό."},{"k":"β","t":"Λάθος."},{"k":"γ","t":"null"},{"k":"δ","t":"null"}]},{"n":29,"a":"α","q":"Η Εναλλακτική Αγορά (ΕΝ.Α.) είναι:","o":[{"k":"α","t" νο."},{"k":"δ","t":"I, II, III και IV µόνο."}]},{"n":53,"a":"α","q":"Απευθείας διαπραγμάτευση μεταξύ δύο μερών για μετοχές που είναι εισηγμένες στο χρηματιστήριο, γίνεται στην:","o":[{"k":"α","t":"Τρίτη Αγορά."},{"k":"β","t":"Τέταρτη Αγορά."},{"k":"γ","t":"Εξω-χρηματιστηριακή Αγορά."},{"k":"δ","t":"Οργανωμένη Αγορά."}]},{"n":54,"a":"β","q":"Σε μία αποτελεσματική αγορά:","o":[{"k":"α","t":"Το κόστος των συναλλαγών και η ρευστότητα της αγοράς είναι σε χαμηλό επίπεδο."},{"k":"β","t":"Οι πληροφορίες της αγοράς ενσωματώνονται άμεσα και πλήρως στις τιμές."},{"k":"γ","t":"Η καλή χρήση της θεμελιώδους ανάλυσης μπορεί να οδηγήσει στη συστηματική πραγματοποίηση κερδών."},{"k":"δ","t":"Η καλή χρήση της τεχνικής ανάλυσης μπορεί να οδηγήσει στη συστηματική πραγματοποίηση κερδών."}]},{"n":55,"a":"δ","q":"Ποιο από τα παρακάτω δεν είναι ορθό για τη ρευστότητα μιας μετοχής;","o":[{"k":"α","t":"Οι επενδύσεις σε μετοχές με μεγαλύτερη ρευστότητα εμφανίζουν μεγαλύτερο άνοιγμα μεταξύ τιμής αγοράς και τιμής πώλησης."},{"k":"β","t":"Οι επενδύσεις σε μετοχές με μεγαλύτερη ρευστότητα έχουν κατά κανόνα και τις μεγαλύτερες αποδόσεις."},{"k":"γ","t":"Η ρευστότητα μιας μετοχής είναι συνάρτηση της κεφαλαιοποίησής της."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":56,"a":"β","q":"Σε μια αγορά πότε υπάρχει συνέχεια τιμών;","o":[{"k":"α","t":"Όταν η αγορά έχει μεγάλο εύρος."},{"k":"β","t":"Όταν η αγορά διαθέτει σημαντικό βάθος."},{"k":"γ","t":"Όταν υπάρχει μεγάλος όγκος συναλλαγών."},{"k":"δ","t":"Όταν η αγορά έχει μεγάλο πλάτος."}]},{"n":57,"a":"β","q":"Ο όγκος συναλλαγών μετριέται :","o":[{"k":"α","t":"Με την αξία των μετοχών που διακινήθηκαν εντός μιας ημέρας."},{"k":"β","t":"Με τα τεμάχια των μετοχών που διακινήθηκαν σε μια ημέρα."},{"k":"γ","t":"Ως σταθμικός μέσος των τεμαχίων με στάθμιση την κεφαλαιοποίηση."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":58,"a":"δ","q":"Ποια από τα ακόλουθα μπορούν να χρησιμοποιηθούν για τη μέτρηση της ρευστότητας μιας αγοράς; I. "q":"Οι συναλλαγές των ειδικών διαπραγματευτών στην αγορά αξιών του Χρηματιστηρίου Αθηνών πραγματοποιούνται με το σύστημα:","o":[{"k":"α","t":"Εκφώνησης-αντιφώνησης."},{"k":"β","t":"Καλύτερη τιμή-προποτεραιότητα χρόνου εισαγωγής (order driven market)."},{"k":"γ","t":"Εισαγωγής ζεύγους τιμών αγοράς και πώλησης (quote driven market)."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]}],"ΣΥΝΑΛΛΑΓΕΣ":[{"n":1,"a":"δ","q":"Ποιο από τα κάτωθι είναι προαιρετικό στοιχείο σε μια εντολή για συναλλαγή επί κινητών αξιών;","o":[{"k":"α","t":"Ο λογαριασμός του πελάτη."},{"k":"β","t":"Η θέση/είδος εντολής."},{"k":"γ","t":"Η τιμή του χρηματοπιστωτικού μέσου."},{"k":"δ","t":"Η διάρκεια της εντολής."}]},{"n":2,"a":"δ","q":"Ποιο από τα παρακάτω δεν ισχύει;","o":[{"k":"α","t":"Οι επενδυτές έχουν μερίδα στο Σύστημα Άυλων Τίτλων (ΣΑΤ)"},{"k":"β","t":"Οι εκδότες έχουν μερίδα στο Σύστημα Άυλων Τίτλων (ΣΑΤ)"},{"k":"γ","t":"Οι Ειδικοί Διαπραγματευτές έχουν μερίδα στο Σύστημα Άυλων Τίτλων (ΣΑΤ)"},{"k":"δ","t":"Οι Ειδικοί Διαπραγματευτές δεν έχουν μερίδα στο Σύστημα Άυλων Τίτλων (ΣΑΤ)"}]},{"n":3,"a":"δ","q":"Η μερίδα επενδυτή στο Σύστημα Άυλων Τίτλων (ΣΑΤ) περιλαμβάνει :","o":[{"k":"α","t":"Κωδικό Αριθμό Μερίδας Επενδυτή"},{"k":"β","t":"Λογαριασμό Αξιών"},{"k":"γ","t":"Ειδικό Λογαριασμό"},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":4,"a":"δ","q":"Ποια από τις κατωτέρω δεν είναι μερίδα στο Σύστημα Άυλων Τίτλων (ΣΑΤ);","o":[{"k":"α","t":"Μερίδα επενδυτή."},{"k":"β","t":"Μερίδα εκδότριας."},{"k":"γ","t":"Μερίδα μέλους."},{"k":"δ","t":"Μερίδα της ΕΧΑΕ."}]},{"n":5,"a":"β","q":"Ποια από τις παρακάτω εντολές σχετίζεται με όρους που τίθενται ως προς την τιμή εκτέλεσης της εντολής;","o":[{"k":"α","t":"Εντολή ανοικτής πώλησης (Short Sale)."},{"k":"β","t":"Ελεύθερη Εντολή (Market Order-MKT)."},{"k":"γ","t":"Εντολή έγκυρη μέχρι ημερομηνία (Good Till Date-GTD)."},{"k":"δ","t":"Ημερήσια Εντολή (Good for Day-GFD)."}]},{"n":6,"a":"γ","q":"Ποια εντολή θέτει περιορισμούς ως προς την τιμή;","o":[{"k":"α","t":"Ελεύθερη εντολή (Market Οrder)."},{"k":"β","t":"Fill or Kill (Όλα ή Τίποτα)."},{"k":"γ","t":"Εντολή Ανοικτής Πώλησης (Short Selling)."},{"k":"δ","t":"Εντολή με ημερήσια διάρκεια (Good For Day)."}]},{"n":7,"a":"β","q":"Η Ελεύθερη Εντολή (Market Order - MKT) είναι εντολή που πραγματοποιεί συναλλαγές σε:","o":[{"k":"α","t":"Απεριόριστο αριθμό τεμαχίων μετοχών, στην τρέχουσα τιμή."},{"k":"β","t":"Συγκεκριμένο αριθμό τεμαχίων μετοχών, σε οποιαδήποτε τιμή."},{"k":"γ","t":"Συγκεκριμένο αριθμό τεμαχίων μετοχών, στην τρέχουσα τιμή."},{"k":"δ","t":"Απεριόριστο αριθμό τεμαχίων μετοχών, σε οποιαδήποτε τιμή."}]},{"n":8,"a":"γ","q":"Ποια από τις παρακάτω εντολές σχετίζεται με όρους που τίθενται ως προς τη διάρκεια εκτέλεσης της εντολής;","o":[{"k":"α","t":"Εντολή ανοικτής πώλησης (Short Sale)."},{"k":"β","t":"Οριακή εντολή (Limit Order-LMT)."},{"k":"γ","t":"Εντολή έγκυρη μέχρι να ακυρωθεί (Good Till Cancel-GTC)."},{"k":"δ","t":"Εντολή στο κλείσιμο (At the Close-ATC)."}]},{"n":9,"a":"α","q":"Η Εντολή στο Κλείσιμο (At the Close – ATC) είναι:","o":[{"k":"α","t":"Η εντολή η οποία εισάγεται χωρίς όριο τιμής και αφορά συναλλαγές στην τιμή κλεισίματος όπου και αν διαμορφωθεί αυτή και μπορούν να εισαχθούν οποτεδήποτε κατά τη διάρκεια των μεθόδων αυτόματης κατάρτισης, εκτελούνται όμως μόνο κατά την περίοδο της Μεθόδου Διαπραγμάτευσης στην Τιμή Κλεισίματος."},{"k":"β","t":"Η εντολή η οποία εισάγεται με όριο τιμής και μόνο κατά τη διάρκεια της Μεθόδου Αυτόματης και Στιγμιαίας Κατάρτισης Συναλλαγών (Δημοπρασία – Call Auction) και αφορά συναλλαγές στην Τιμή Κλεισίματος."},{"k":"γ","t":"Η εντολή η οποία εισάγεται χωρίς όριο τιμής και μόνο κατά τη διάρκεια της μεθόδου Αυτόματης και Συνεχούς Κατάρτισης Συναλλαγών και αφορά συναλλαγές στην Τιμή Κλεισίματος."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":10,"a":"γ","q":"Η Εντολή έγκυρη μέχρι να ακυρωθεί (Good Till Cancel - GTC):","o":[{"k":"α","t":"Παραμένει στο σύστημα μέχρι τη λήξη της."},{"k":"β","t":"Παραμένει στο σύστημα για απεριόριστο χρονικό διάστημα."},{"k":"γ","t":"Παραμένει στο σύστημα όσο η τιμή της είναι μέσα στο επιτρεπόμενο όριο τιμής που επιτρέπεται να διαπραγματεύεται η κινητή αξία."},{"k":"δ","t":"Παραμένει στο σύστημα μέχρι τη λήξη της συνεδρίασης."}]},{"n":11,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις περιγράφει καλύτερα ένα χρηματιστήριο το οποίο κάνει χρήση συστήματος ανοικτής δημοπρασίας (call auction) για τον καθορισμό των τιμών των μετοχών;","o":[{"k":"α","t":"Οι τιμές αγοράς καθορίζονται από τους ειδικούς διαπραγματευτές."},{"k":"β","t":"Οι τιμές αγοράς καθορίζονται με βάση συμφωνία μεταξύ αγοραστών και πωλητών."},{"k":"γ","t":"Οι τιμές αγοράς καθορίζονται μοναδικά για όλες τις εκτελεσθείσες συναλλαγές."},{"k":"δ","t":"Οι τιμές αγοράς καθορίζονται για συναλλαγές εκτός χρηματιστηρίου."}]},{"n":12,"a":"γ","q":"Η Εντολή στην Τιμή Ανοίγματος (At the Open - ATO) είναι εντολή που:","o":[{"k":"α","t":"Εισάγεται με συγκεκριμένο όριο τιμής."},{"k":"β","t":"Εισάγεται με συγκεκριμένο όριο τιμής, αλλά αφορά μόνο συναλλαγές στην τιμή ανοίγματος."},{"k":"γ","t":"Εισάγεται χωρίς συγκεκριμένο όριο τιμής και αφορά μόνο συναλλαγές στην τιμή ανοίγματος."},{"k":"δ","t":"Εισάγεται κατά τη στιγμή του ανοίγματος της συνεδρίασης."}]},{"n":13,"a":"β","q":"Στις υπηρεσίες θεματοφυλακής δεν περιλαμβάνεται:","o":[{"k":"α","t":"Η φύλαξη της περιουσίας του πελάτη."},{"k":"β","t":"Η εκτέλεση εντολών αγοράς / πώλησης."},{"k":"γ","t":"Η άσκηση δικαιωμάτων των πελατών σε αυξήσεις μετοχικού κεφαλαίου."},{"k":"δ","t":"Η είσπραξη μερισμάτων."}]},{"n":14,"a":"δ","q":"Μία εντολή με όριο τιμής (limit order):","o":[{"k":"α","t":"Δεν εκτελείται σε καθοδική αγορά."},{"k":"β","t":"Μπορεί να εκτελείται ελεύθερα στην καλύτερη τιμή που υπερκαλύπτει το όριο."},{"k":"γ","t":"Εκτελείται σταδιακά μόνον αν η τιμή διατηρηθεί από το όριο και πέρα."},{"k":"δ","t":"Εκτελείται μόλις προσφερθεί το όριο τιμής."}]},{"n":15,"a":"β","q":"Με μια ελεύθερη εντολή (market order):","o":[{"k":"α","t":"Η χρηματιστηριακή εταιρεία προσπαθεί να επιτύχει την καλύτερη δυνατή τιμή σε μια μεγάλη χρονική περίοδο."},{"k":"β","t":"Η χρηματιστηριακή εταιρεία προσπαθεί να επιτύχει την καλύτερη δυνατή τιμή τη στιγμή εκτέλεσης της εντολής."},{"k":"γ","t":"Ο επενδυτής πρέπει να πληρώσει 100% μετρητά για τους τίτλους που αγοράζει."},{"k":"δ","t":"Η χρηματιστηριακή εταιρεία μπορεί να θέσει περιορισμούς στην εκτέλεση."}]},{"n":16,"a":"β","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Κατά τη διάρκεια της μεθόδου της Επιλεκτικής Κατάρτισης (Hit & Take), γίνονται δεκτές προς εκτέλεση από το σύστημα όλες οι εντολές του Βασικού Πίνακα."},{"k":"β","t":"Κατά τη διάρκεια της μεθόδου της Επιλεκτικής Κατάρτισης (Hit & Take), γίνονται δεκτές προς εκτέλεση από το σύστημα όλες οι εντολές του Πίνακα Ειδικών Όρων."},{"k":"γ","t":"Κατά τη διάρκεια της μεθόδου της Επιλεκτικής Κατάρτισης (Hit & Take), γίνονται δεκτές προς εκτέλεση από το σύστημα όλες οι εντολές του Πίνακα Εκποιήσεων."},{"k":"δ","t":"Κατά τη διάρκεια της μεθόδου της Επιλεκτικής Κατάρτισης (Hit & Take), γίνονται δεκτές προς εκτέλεση από το σύστημα όλες οι εντολές του Πίνακα Προσυμφωνημένων Συναλλαγών."}]},{"n":17,"a":"α","q":"Τι ισχύει για τις εκποιήσεις; Ι. Στο Χρηματιστήριο Αξιών Αθηνών (ΧΑ) γνωστοποιείται το αργότερο δύο εργάσιμες ημέρες πριν την ημέρα εκποίησης, η απόφαση της Επιτροπής Κεφαλαιαγοράς για την εκποίηση ορισμένης ποσότητας κινητών αξιών . ΙΙ. Η εκποίηση διενεργείται κατά τη φάση συγκέντρωσης εντολών για τον προσδιορισμό της τιμής ανοίγματος . ΙΙΙ. Κατά τη διάρκεια της εκποίησης κανένας άλλος συμμετέχων εκτός από το μέλος που τη διενεργεί δεν μπορεί να εισάγει εντολές πώλησης στο σύστημα . ΙV. Οι συμμετέχοντες εισάγουν στο σύστημα εντολές χωρίς όριο τιμής.","o":[{"k":"α","t":"Ι, ΙΙ και ΙΙΙ."},{"k":"β","t":"Ι, ΙΙΙ και ΙV."},{"k":"γ","t":"Ι, ΙΙ και ΙV."},{"k":"δ","t":"ΙΙ, ΙΙΙ και ΙV."}]},{"n":18,"a":"β","q":"Ποιο είναι το σύστημα με το οποίο γίνεται η καταχώρηση της ιδιοκτησίας μετοχικών τίτλων;","o":[{"k":"α","t":"Ολοκληρωμένο Αυτόματο Σύστημα Ηλεκτρονικών Συναλλαγών (ΟΑΣΗΣ)."},{"k":"β","t":"Σύστημα Άυλων Τίτλων (ΣΑΤ)."},{"k":"γ","t":"Ηλεκτρονική Δευτερογενής Αγορά Τίτλων (ΗΔΑΤ)."},{"k":"δ","t":"Κεντρικό Αποθετήριο Αξιών (ΚΑΑ)."}]},{"n":19,"a":"α","q":"Οι κωδικοί του πελάτη στο Σύστημα Άυλων Τίτλων (ΣΑΤ) είναι:","o":[{"k":"α","t":"11ψήφιοι."},{"k":"β","t":"5ψήφιοι."},{"k":"γ","t":"6ψήφιοι."},{"k":"δ","t":"15ψήφιοι."}]},{"n":20,"a":"α","q":"Πότε ενημερώνεται το Σύστημα Άυλων Τίτλων (ΣΑΤ) για τις χρηματιστηριακές συναλλαγές που έγιναν την ημέρα Τ;","o":[{"k":"α","t":"Μετά τη λήξη της συνεδρίασης της Αγοράς ή και κατά τη διάρκειά της."},{"k":"β","t":"Την επόμενη εργάσιμη ημέρα."},{"k":"γ","t":"Την επόμενη ημερολογιακή ημέρα."},{"k":"δ","t":"Εξαρτάται από το είδος της χρηματιστηριακής συναλλαγής."}]},{"n":21,"a":"δ","q":"Ο διακανονισμός των πράξεων στο Χρηματιστήριο :","o":[{"k":"α","t":"Διενεργείται με τη μέθοδο «παράδοση επί πληρωμή»."},{"k":"β","t":"Είναι οριστικός."},{"k":"γ","t":"Πραγματοποιείται από την ATHEXCSD μέχρι τη δεύτερη εργάσιμη ημέρα (Τ+2) μετά από κάθε ημέρα διαπραγμάτευσης (Τ)."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":22,"a":"γ","q":"Σύμφωνα με τον κανονισμό του Συστήματος Άυλων Τίτλων , ποιο από τα παρακάτω είναι λάθος σχετικά με την Κοινή Επενδυτική Μερίδα;","o":[{"k":"α","t":"Οι συνδικαιούχοι Κοινής Επενδυτικής Μερίδας μπορούν να είναι μόνο φυσικά πρόσωπα."},{"k":"β","t":"Οι συνδικαιούχοι Κοινής Επενδυτικής Μερίδας πρέπει να διαθέτουν αυτοτελή μερίδα επενδυτή."},{"k":"γ","t":"Η δημιουργία της Κοινής Επενδυτικής Μερίδας δεν προϋποθέτει ιεράρχηση των συνδικαιούχων."},{"k":"δ","t":"Προσθήκη ή αφαίρεση δικαιούχου σε/από υπάρχουσα Κοινή Επενδυτική Μερίδα δεν είναι δυνατή."}]},{"n":23,"a":"β","q":"Ποια πρόταση είναι λανθασμένη; Το Ολοκληρωμένο Αυτόματο Σύστημα Ηλεκτρονικών Συναλλαγών (ΟΑΣΗΣ) επιτρέπει:","o":[{"k":"α","t":"Υποστήριξη περισσοτέρων της μιας αγοράς."},{"k":"β","t":"Υποστήριξη συναλλαγών μόνο σε ευρώ."},{"k":"γ","t":"Υποστήριξη διαφορετικών τύπων συναλλαγών."},{"k":"δ","t":"Υποστήριξη διαφορετικών πινάκων συναλλαγών."}]},{"n":24,"a":"α","q":"Το «βάθος» αγοράς είναι ………….. που μπορεί να δει ότι ο συμμετέχων εντός του Ολοκληρωμένου Αυτόματου Συστήματος Ηλεκτρονικών Συναλλαγών (ΟΑΣΗΣ). Συμπληρώστε το κενό με την κατάλληλη συνθήκη.","o":[{"k":"α","t":"Τα επίπεδα τιμών των εντολών και των αντίστοιχων όγκων ανά τιμή."},{"k":"β","t":"Τα επίπεδα τιμών των εντολών και τριών (3) καλύτερων τιμών πώλησης και των αντίστοιχων όγκων."},{"k":"γ","t":"Τα σύνολα των τιμών των εντολών και των αντίστοιχων όγκων ανά τιμή."},{"k":"δ","t":"Τα επίπεδα τιμών των εντολών, των αντίστοιχων όγκων ανά τιμή και της αξίας των συναλλαγών."}]},{"n":25,"a":"δ","q":"Ποιο από τα κατωτέρω δεν αποτελεί κριτήριο ταύτισης αντίθετων εντολών στο βασικό σύστημα συναλλαγών;","o":[{"k":"α","t":"Οι εισαγόμενες εντολές αγοράς να έχουν μεγαλύτερη ή ίση τιμή από την χαμηλότερη τιμή εκ των υφισταμένων εντολών πώλησης."},{"k":"β","t":"Οι εισαγόμενες εντολές πώλησης να έχουν μικρότερη ή ίση τιμή από την υψηλότερη τιμή εκ των υφισταμένων εντολών αγοράς."},{"k":"γ","t":"Οι εισαγόμενες ελεύθερες εντολές πληρούν το κριτήριο ταύτισης εφόσον υπάρχουν στο βιβλίο εντολών ενεργές αντίθετες εντολές."},{"k":"δ","t":"Οι εισαγόμενες εντολές αγοράς να έχουν μικρότερη ή ίση τιμή από την χαμηλότερη τιμή εκ των υφιστάμενων εντολών πώλησης."}]},{"n":26,"a":"β","q":"Ποια είναι η σωστή από τις παρακάτω επιλογές;","o":[{"k":"α","t":"Το ποσό που καταβάλουν οι επενδυτές αρχικώς για αγορά μετοχών με πίστωση πέραν του χρόνου εκκαθάρισης, καθορίζεται από το περιθώριο διατήρησης (maintenance margin)."},{"k":"β","t":"Η Εταιρία Εκκαθάρισης Συναλλαγών Χρηματιστήριου Αθηνών Ανώνυμη Εταιρεία (ATHEXClear) είναι ο κεντρικός φορέας για την εκκαθάριση των χρηματιστηριακών συναλλαγών."},{"k":"γ","t":"Σε περίπτωση όχλησης για καταβολή περιθωρίου οι επενδυτές υποχρεούνται να καταθέσουν οπωσδήποτε μετρητά στον λογαριασμό."},{"k":"δ","t":"Οι επενδυτές δύνανται να πραγματοποιούν ανοικτές πωλήσεις επί μετοχών υψηλής ρευστότητας χωρίς συγκεκριμένους περιορισμούς."}]},{"n":27,"a":"γ","q":"Ανοιχτές πωλήσεις έχουμε όταν:","o":[{"k":"α","t":"Πουλάμε μετοχές χωρίς να γνωρίζουμε ποιος είναι ο αγοραστής."},{"k":"β","t":"Πουλάμε μετοχές αφήνοντας ανοικτό το ενδεχόμενο επαναγοράς."},{"k":"γ","t":"Πουλάμε μετοχές που δεν βρίσκονται στη κυριότητά μας."},{"k":"δ","t":"Πουλάμε μετοχές χωρίς να προκαθορίζουμε πότε θα γίνει η πώληση."}]},{"n":28,"a":"β","q":"Υποθέστε ότι πωλήσατε ανοιχτά 300 κοινές μετοχές προς 55 ευρώ έκαστη, με αρχικό περιθώριο 60%. Αν το περιθώριο ασφάλειας είναι 35%, σε ποια τιμή της μετοχής θα λαμβάνατε όχληση για την καταβολή περιθωρίου (margin call);","o":[{"k":"α","t":"51 ευρώ."},{"k":"β","t":"65 ευρώ."},{"k":"γ","t":"35 ευρώ."},{"k":"δ","t":"40 ευρώ."}]},{"n":29,"a":"α","q":"Επενδυτής αγοράζει μία μετοχή για 50 ευρώ. Αν το αρχικό περιθώριο είναι 40% και το περιθώριο διατήρησης είναι 20% σε ποια τιμή θα λάβει margin call;","o":[{"k":"α","t":"37,5 ευρώ."},{"k":"β","t":"20 ευρώ."},{"k":"γ","t":"35,5 ευρώ."},{"k":"δ","t":"10 ευρώ."}]},{"n":30,"a":"γ","q":"Επενδυτής αγοράζει μία μετοχή για 50 ευρώ με πίστωση και την πουλάει 60 ευρώ χωρίς να έχει λάβει ενδιάμεσα οποιοδήποτε μέρισμα. Αν το αρχικό περιθώριο είναι 40%, ποια η απόδοση του επενδυτή;","o":[{"k":"α","t":"25%."},{"k":"β","t":"41,5%."},{"k":"γ","t":"50%."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":31,"a":"β","q":"Μια οριακή εντολή (limit order):","o":[{"k":"α","t":"Σχετίζεται μόνο με τις συναλλαγές στα παράγωγα."},{"k":"β","t":"Θέτει ανώτατη τιμή σε μια εντολή αγοράς."},{"k":"γ","t":"Περιορίζει το ποσό μετοχών που αγοράζει ο επενδυτής με πίστωση."},{"k":"δ","t":"Ζητά από την χρηματιστηριακή εταιρεία να επιτύχει την καλύτερη δυνατή τιμή στο χρόνο εκτέλεσης της εντολής."}]},{"n":32,"a":"β","q":"Οι …………… εντολές πέραν των ορίων διαπραγμάτευσης ………... αποδεκτές από το Ολοκληρωμένο Αυτόματο Σύστημα Ηλεκτρονικών Συναλλαγών (ΟΑΣΗΣ). Συμπληρώστε τα κενά με τις κατά νει 2% κόστος διάθεσης και 3% κόστος εξαγοράς. Αν ο επενδυτής αποφασίσει να ρευστοποιήσει όλα τα μερίδια που έχει στην κατοχή του πόσα χρήματα θα εισπράξει;","o":[{"k":"α","t":"5.432 ευρώ."},{"k":"β","t":"5.488 ευρώ."},{"k":"γ","t":"5.712 ευρώ."},{"k":"δ","t":"5.768 ευρώ."}]}]},"np":{"ΔΕΥΤΕΡΟΓΕΝΗΣ ΔΙΑΠΡΑΓΜΑΤΕΥΣΗ":[{"n":1,"a":"γ","q":"Ποια από τα ακόλουθα χαρακτηριστικά ισχύουν για τις ρυθμιζόμενες αγορές; I. Αποτελούν πολυμερή συστήματα συναλλαγών. II. Η λειτουργία τους διέπεται από κανόνες που επιτρέπουν διακριτική ευχέρεια εκτέλεσης συναλλαγών. III. Πρέπει να εφαρμόζεται η νομοθεσία για κατάχρηση αγορών. IV. Μπορούν να διαπραγματεύονται χρηματοπιστωτικά μέσα που έχουν εισαχθεί σε άλλη ρυθμιζόμενη αγορά στην ΕΕ, χωρίς επιπλέον υποχρεώσεις για τους εκδότες.","o":[{"k":"α","t":"I και III."},{"k":"β","t":"I, II και III."},{"k":"γ","t":"I, III και IV."},{"k":"δ","t":"I, II, III και IV."}]},{"n":2,"a":"γ","q":"Το πρόσωπο το οποίο έχει λάβει άδεια παροχής της υπηρεσίας γνωστοποίησης των λεπτομερειών των συναλλαγών στις αρμόδιες αρχές ή την Ευρωπαϊκή Αρχή Κινητών Αξιών και Αγορών (ΕΑΚΑΑ) για λογαριασμό επιχείρησης επενδύσεων ονομάζεται:","o":[{"k":"α","t":"Π.Ε.ΔΕ.ΣΥ."},{"k":"β","t":"Ε.ΜΗ.ΔΗ.ΣΥ."},{"k":"γ","t":"Ε.ΜΗ.ΓΝΩ.ΣΥ."},{"k":"δ","t":"Συστηματικος Εσωτερικοποιητής"}]},{"n":3,"a":"α","q":"Η ΗΔΑΤ (Ηλεκτρονική Δευτερογενής Αγορά Τίτλων) είναι:","o":[{"k":"α","t":"Ρυθμιζόμενη Αγορά."},{"k":"β","t":"Πολυμερής Μηχανισμός Διαπραγμάτευσης (ΠΜΔ)."},{"k":"γ","t":"Συστηματικός Εσωτερικοποιητής."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":4,"a":"β","q":"Οι Ε.ΜΗ.ΓΝΩ.ΣΥ. διαθέτουν κατάλληλες πολιτικές και ρυθμίσεις για τη γνωστοποίηση των πληροφοριών που απαιτούνται σύμφωνα με τον Κανονισμό (ΕΕ) 600/2014 το συντομότερο δυνατόν και το αργότερο:","o":[{"k":"α","t":"Mέχρι το τέλος της ημέρας που πραγματοποιήθηκε η συναλλαγή (Τ+0)."},{"k":"β","t":"Mέχρι το τέλος της επόμενης εργάσιμης ημέρας από εκείνη που πραγματοποιήθηκε η συναλλαγή (Τ+1)."},{"k":"γ","t":"Έως δύο εργάσιμες ημέρες μετά από εκείνη που πραγματοποιήθηκε η συναλλαγή (Τ+2)."},{"k":"δ","t":"Έως τρεις εργάσιμες ημέρες μετά από εκείνη που πραγματοποιήθηκε η συναλλαγή (Τ+3)."}]},{"n":5,"a":"β","q":"Οι πληροφορίες που δημοσιεύονται από Ε.ΜΗ.ΔΗ.ΣΥ. περιλαμβάνουν, μεταξύ άλλων, τα ακόλουθα στοιχεία: Ι. Tον όγκο της συναλλαγής. ΙΙ. Tη χρονική στιγμή της συναλλαγής. ΙΙΙ. Tον αναγνωριστικό κωδικό του χρηματοπιστωτικού μέσου. IV. Tην τιμή στην οποία πραγματοποιήθηκε η συναλλαγή.","o":[{"k":"α","t":"Τα I και II."},{"k":"β","t":"Τα I, II, III και IV."},{"k":"γ","t":"Τα I, II και III."},{"k":"δ","t":"Τα I και III."}]},{"n":6,"a":"γ","q":"Σύμφωνα με τις υποχρεώσεις προ-συναλλακτικής διαφάνειας που προβλέπονται στον Κανονισμό (ΕΕ) 600/2014 οι διαχειριστές αγοράς και οι επιχειρήσεις επενδύσεων που διαχειρίζονται τόπους διαπραγμάτευσης οφείλουν να δημοσιοποιούν τις ακόλουθες πληροφορίες για μετοχές, πιστοποιητικά αποθετηρίου, ΔΑΚ, πιστοποιητικά και άλλα παρόμοια χρηματοπιστωτικά μέσα: Ι. Τρέχουσες τιμές αγοράς. ΙΙ. Τρέχουσες τιμές πώλησης. ΙΙΙ. Βάθος συναλλακτικού ενδιαφέροντος στις τρέχουσες τιμές αγοράς και πώλησης. ΙV. Τις εντολές μεγάλου μεγέθους σε σύγκριση με το κανονικό μέγεθος της αγοράς.","o":[{"k":"α","t":"Τα I και II."},{"k":"β","t":"Τα I, II, III και IV."},{"k":"γ","t":"Τα I, II και III."},{"k":"δ","t":"Τα I και III."}]},{"n":7,"a":"α","q":"Σύμφωνα με τις υποχρεώσεις προ-συναλλακτικής διαφάνειας που προβλέπονται στον Κανονισμό (ΕΕ) 600/2014, οι διαχειριστές αγοράς και οι επιχειρήσεις επενδύσεων που διαχειρίζονται τόπους διαπραγμάτευσης στους οποίους έχει χορηγηθεί απαλλαγή από την υποχρέωση δημοσιοποίησης συγκεκριμένων πληροφοριών όσον αφορά ομολογίες, δομημένα χρηματοοικονομικά προϊόντα, δικαιώματα εκπομπής ρύπων και παράγωγα που τελούν υπό διαπραγμάτευση σε τόπο διαπραγμάτευσης οφείλουν να πράξουν τα εξής: Ι. Να δημοσιοποιήσουν ενδεικτικές τιμές αγοράς και πώλησης που πλησιάζουν την τιμή του συναλλακτικού ενδιαφέροντος που ανακοινώνεται μέσω των συστημάτων τους. ΙΙ. Να καταστήσουν τις ενδεικτικές τιμές αγοράς και πώλησης που πλησιάζουν την τιμή του συναλλακτικού ενδιαφέροντος που ανακοινώνεται μέσω των συστημάτων τους διαθέσιμες στο κοινό μέσω κατάλληλων ηλεκτρονικών μέσων, συνεχώς κατά τις κανονικές ώρες συναλλαγών. ΙΙΙ.Να διασφαλίσουν ότι οι ενδεικτικές τιμές αγοράς και πώλησης που πλησιάζουν την τιμή του συναλλακτικού ενδιαφέροντος που ανακοινώνεται μέσω των συστημάτων τους παρέχονται υπό εύλογους εμπορικούς όρους. ΙV. Να διασφαλίσουν ότι οι ενδεικτικές τιμές αγοράς και πώλησης που πλησιάζουν την τιμή του συναλλακτικού ενδιαφέροντος που ανακοινώνεται μέσω των συστημάτων τους παρέχονται κατά τρόπο που δεν δημιουργεί διακρίσεις.","o":[{"k":"α","t":"Τα I, II, III και IV."},{"k":"β","t":"Τα Ι και ΙΙ."},{"k":"γ","t":"Τα ΙΙ και ΙΙΙ."},{"k":"δ","t":"Τα Ι, ΙΙΙ, και IV."}]},{"n":8,"a":"γ","q":"Οι συστηματικοί εσωτερικοποιητές που δραστηριοποιούνται σε μετοχές, πιστοποιητικά αποθετηρίου, ΔΑΚ, πιστοποιητικά και άλλα παρόμοια χρηματοπιστωτικά μέσα που τελούν υπό διαπραγμάτευση σε τόπο διαπραγμάτευσης:","o":[{"k":"α","t":"Οφείλουν να δημοσιοποιούν δεσμευτικές προσφορές για τα χρηματοπιστωτικά μέσα στα οποία δραστηριοποιούνται, για τα οποία υπάρχει ρευστή αγορά, κατόπιν αιτήματος των πελατών τους."},{"k":"β","t":"Οφείλουν να δημοσιοποιούν δεσμευτικές προσφορές για τα χρηματοπιστωτικά μέσα στα οποία δραστηριοποιούνται, για τα οποία δεν υπάρχει ρευστή αγορά."},{"k":"γ","t":"Οφείλουν να δημοσιοποιούν δεσμευτικές προσφορές για τα χρηματοπιστωτικά μέσα στα οποία δραστηριοποιούνται, για τα οποία υπάρχει ρευστή αγορά."},{"k":"δ","t":"Δεν οφείλουν να δημοσιοποιούν δεσμευτικές προσφορές για τα χρηματοπιστωτικά μέσα στα οποία δραστηριοποιούνται παρά μόνο αν το αιτηθούν οι πελάτες τους."}]},{"n":9,"a":"α","q":"Οι επιχειρήσεις επενδύσεων που συναλλάσσονται εξωχρηματιστηριακά σε μετοχές, πιστοποιητικά αποθετηρίου, ΔΑΚ, πιστοποιητικά και άλλα παρόμοια χρηματοπιστωτικά μέσα που τελούν υπό διαπραγμάτευση σε τόπο διαπραγμάτευσης:","o":[{"k":"α","t":"Οφείλουν να δημοσιοποιούν τον όγκο, την τιμή και τον χρόνο κατά τον οποίο ολοκληρώθηκαν οι συναλλαγές."},{"k":"β","t":"Οφείλουν να δημοσιοποιούν τον όγκο και την τιμή των συναλλαγών."},{"k":"γ","t":"Οφείλουν να δημοσιοποιούν την τιμή και τον χρόνο κατά τον οποίο ολοκληρώθηκαν οι συναλλαγές."},{"k":"δ","t":"Οφείλουν να δημοσιοποιούν την τιμή και τον χρόνο κατά τον οποίο ολοκληρώθηκαν οι συναλλαγές μόνο κατόπιν αιτήματος των πελατών τους."}]},{"n":10,"a":"γ","q":"Σε περίπτωση μη εμπρόθεσμης εξόφλησης του τιμήματος αγοράς μετοχών από τον πελάτη του το μέλος της ρυθμιζόμενης αγοράς:","o":[{"k":"α","t":"Οφείλει να ενημερώσει την ΕΚ."},{"k":"β","t":"Υποχρεούται να χορηγήσει παράταση δύο ημερών για την εξόφληση του τιμήματος."},{"k":"γ","t":"Εφόσον δεν έχει υπογραφεί σύμβαση πίστωσης προβαίνει σε εκποίηση των μετοχών που αγοράστηκαν."},{"k":"δ","t":"Υποχρεούται να ακυρώσει τη συναλλαγή του πελάτη του."}]},{"n":11,"a":"δ","q":"Ο ειδικός διαπραγματευτής μετοχών έχει σκοπό:","o":[{"k":"α","t":"Να οδηγεί την αγορά στην ορθή τιμή."},{"k":"β","t":"Να διευκολύνει τη δραστηριότητα των ανοικτών πωλήσεων μετοχών."},{"k":"γ","t":"Να παρεμποδίζει την πτώση των τιμών."},{"k":"δ","t":"Να βελτιώνει την εμπορευσιμότητα των μετοχών."}]},{"n":12,"a":"α","q":"O ειδικός διαπραγματευτής:","o":[{"k":"α","t":"Αναλαμβάνει να διενεργεί συναλλαγές σε συνεχή βάση για ίδιο λογαριασμό σε τιμές που έχει καθορίσει ο ίδιος."},{"k":"β","t":"Αναλαμβάνει να διενεργεί συναλλαγές σε συνεχή βάση για λογαριασμό των πελατών του σε τιμές που έχει καθορίσει ο ίδιος."},{"k":"γ","t":"Αναλαμβάνει να διενεργεί συναλλαγές σε περιοδική βάση για ίδιο λογαριασμό στις τιμές που είναι διαθέσιμες στην αγορά."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":13,"a":"δ","q":"Προκειμένου να αποκτήσει την ιδιότητα του Ειδικού Διαπραγματευτή ένας οργανισμός πρέπει: Ι. Να έχει Υπηρεσία Ειδικής Διαπραγμάτευσης. ΙΙ. Να διορίσει Υπεύθυνο Ειδικής Διαπραγμάτευσης. ΙΙΙ. Να έχει την άδεια της διαπραγμάτευσης για ίδιο λογαριασμό. ΙV. Όλα τα παραπάνω.","o":[{"k":"α","t":"Ι και ΙΙ."},{"k":"β","t":"Ι και ΙΙΙ."},{"k":"γ","t":"ΙΙ και ΙΙΙ."},{"k":"δ","t":"ΙV μόνο."}]},{"n":14,"a":"γ","q":"Ο Ειδικός Διαπραγματευτής οφείλει να τηρεί πλήρη στοιχεία των συναλλαγών που διενεργεί για ίδιο λογαριασμό στη διάθεση της Επιτροπής Κεφαλαιαγοράς:","o":[{"k":"α","t":"Για έναν (1) τουλάχιστον χρόνο."},{"k":"β","t":"Για δύο (2) τουλάχιστον χρόνια."},{"k":"γ","t":"Για πέντε (5) τουλάχιστον χρόνια."},{"k":"δ","t":"Για έξι (6) τουλάχιστον χρόνια."}]},{"n":15,"a":"α","q":"Μέλος του ΧΑ που διαθέτει άδεια διαπραγμάτευσης για ίδιο λογαριασμό μπορεί να ενεργεί ως Ειδικός Διαπραγματευτής:","o":[{"k":"α","t":"Μετά από άδεια του ΧΑ, η οποία αποκτάται ανά αγορά και χρηματοπιστωτικό μέσο."},{"k":"β","t":"Μετά από άδεια της Επιτροπής Κεφαλαιαγοράς, η οποία αποκτάται ανά αγορά και χρηματοπιστωτικό μέσο."},{"k":"γ","t":"Μετά από άδεια της Επιτροπής Κεφαλαιαγοράς για τις ΑΕΠΕΥ και μετά από άδεια της ΤτΕ για τα πιστωτικά ιδρύματα, η οποία αποκτάται ανά αγορά και χρηματοπιστωτικό μέσο."},{"k":"δ","t":"Μετά από άδεια του ΧΑ, η οποία αποκτάται ανά αγορά και δίνει τη δυνατότητα διενέργειας συναλλαγών σε κάθε χρηματοπιστωτικό μέσο που διαπραγματεύεται σ’ αυτήν την αγορά."}]},{"n":16,"a":"β","q":"Ποια πρόταση από τις παρακάτω είναι σωστή;","o":[{"k":"α","t":"Ο Eιδικός Διαπραγματευτής υποχρεούται να διορίσει υπεύθυνο ίδιας διαπραγμάτευσης που θα πρέπει να είναι πιστοποιημένος διαπραγματευτής αξιών / παραγώγων ανάλογα με την περίπτωση & να γνωστοποιεί στο ΧΑ τα στοιχεία του, καθώς και κάθε μεταβολή αυτών."},{"k":"β","t":"Ο Eιδικός Διαπραγματευτής μπορεί να δραστηριοποιείται σε περισσότερες από μία κινητές αξίες."},{"k":"γ","t":"Ο Eιδικός Διαπραγματευτής είναι υποχρεωτικά μέλος της ΗΔΑΤ (Ηλεκτρονική Δευτερογενής Αγορά Τίτλων)."},{"k":"δ","t":"Ο Eιδικός Διαπραγματευτής εποπτεύεται από την ΤτΕ."}]},{"n":17,"a":"γ","q":"Ποιο από τα παρακάτω περιγράφει ακριβέστερα την έννοια του \"Συστηματικού Εσωτερικοποιητή\";","o":[{"k":"α","t":"Εναλλακτική ονομασία του Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ)."},{"k":"β","t":"Εναλλακτική ονομασία της ρυθμιζόμενης αγοράς."},{"k":"γ","t":"Επιχείρηση επενδύσεων η οποία διενεργεί συναλλαγές για ίδιο λογαριασμό κατά τρόπο οργανωμένο, συχνά, συστηματικά και σε σημαντικό βαθμό, όταν εκτελεί εντολές πελατών εκτός ρυθμιζόμενης αγοράς, ΠΜΔ ή ΜΟΔ, χωρίς να λειτουργεί πολυμερές σύστημα."},{"k":"δ","t":"Επιχείρηση επενδύσεων η οποία διενεργεί συναλλαγές για ίδιο λογαριασμό κατά τρόπο οργανωμένο, συχνά, συστηματικά και σε σημαντικό βαθμό, όταν εκτελεί εντολές πελατών εντός ρυθμιζόμενης αγοράς, ΠΜΔ ή ΜΟΔ, χωρίς να λειτουργεί πολυμερές σύστημα."}]},{"n":18,"a":"δ","q":"Ως συστηματικοί εσωτερικοποιητές μπορούν να ενεργούν:","o":[{"k":"α","t":"Πιστωτικά ιδρύματα μόνο."},{"k":"β","t":"ΑΕΠΕΥ και πιστωτικά ιδρύματα."},{"k":"γ","t":"Πιστωτικά ιδρύματα, ΑΕΠΕΥ και ασφαλιστικές επιχειρήσεις."},{"k":"δ","t":"ΑΕΠΕΥ μόνο."}]},{"n":19,"a":"δ","q":"Ο Συστηματικός Εσωτερικοποιητής συναλλάσσεται:","o":[{"k":"α","t":"Με οργανωμένο τρόπο."},{"k":"β","t":"Με συνεχή και συστηματικό τρόπο."},{"k":"γ","t":"Με μη οργανωμένο τρόπο."},{"k":"δ","t":"Με οργανωμένο τρόπο εκτός ρυθμιζόμενης αγοράς, Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ) και Μηχανισμού Οργανωμένης Διαπραγμάτευσης (ΜΟΔ)."}]},{"n":20,"a":"β","q":"Συστηματικός εσωτερικοποιητής είναι η επιχείρηση επενδύσεων που συναλλάσσεται:","o":[{"k":"α","t":"Για ίδιο λογαριασμό κατά τρόπο μη οργανωμένο, αλλά συχνά, συστηματικά και σε σημαντικό βαθμό, όταν εκτελεί εντολές πελατών εκτός ρυθμιζόμενης αγοράς, Πολυμερούς Μηχανισμού Διαπραγμάτευσης (ΠΜΔ) ή Μηχανισμού Οργανωμένης Διαπραγμάτευσης (ΜΟΔ)."},{"k":"β","t":"Για ίδιο λογαριασμό κατά τρόπο οργανωμένο, συχνά, συστηματικά και σε σημαντικό βαθμό, όταν εκτελεί εντολές πελατών εκτός ρυθμιζόμενης αγοράς, ΠΜΔ ή ΜΟΔ."},{"k":"γ","t":"Κατά τρόπο μη οργανωμένο αλλά συστηματικά και σε σημαντικό βαθμό, όταν εκτελεί εντολές πελατών του, εκτός ρυθμιζόμενης αγοράς, ΠΜΔ ή ΜΟΔ."},{"k":"δ","t":"Κατά τρόπο οργανωμέν ν του εκπροσωπείται από την ΕΤ.ΕΚ. που ενεργεί ως διαχειριστής του."},{"k":"β","t":"Αποτελεί σύνολο περιουσίας που σχηματίζεται προς εξυπηρέτηση του σκοπού του από τις εισφορές των Εκκαθαριστικών Μελών και του οποίου τα διαθέσιμα ανήκουν εξ αδιαιρέτου στα Εκκαθαριστικά Μέλη κατά το μέρος της συμμετοχής τους σε αυτό. Το Κεφάλαιο Εκκαθαρίσεως αποτελεί νομικό πρόσωπο, ενώ ως προς το σύνολο των έννομων σχέσεών του εκπροσωπείται από την ΕΤ.ΕΚ. που ενεργεί ως διαχειριστής του."},{"k":"γ","t":"Αποτελεί σύνολο περιουσίας που σχηματίζεται προς εξυπηρέτηση του σκοπού του από τις εισφορές των Εκκαθαριστικών Μελών και του οποίου τα διαθέσιμα ανήκουν εξ αδιαιρέτου στα Εκκαθαριστικά Μέλη κατά το μέρος της συμμετοχής τους σε αυτό. Το Κεφάλαιο Εκκαθαρίσεως δεν αποτελεί νομικό πρόσωπο, ενώ ως προς το σύνολο των έννομων σχέσεών του εκπροσωπείται από την Ε.Κ. που ενεργεί ως διαχειριστής του."},{"k":"δ","t":"Αποτελεί σύνολο περιουσίας που σχηματίζεται προς εξυπηρέτηση του σκοπού του από τις εισφορές των Εκκαθαριστικών Μελών και του οποίου τα διαθέσιμα ανήκουν εξ αδιαιρέτου στα Εκκαθαριστικά Μέλη κατά το μέρος της συμμετοχής τους σε αυτό. Το Κεφάλαιο Εκκαθαρίσεως δεν αποτελεί νομικό πρόσωπο, ενώ ως προς το σύνολο των έννομων σχέσεών του εκπροσωπείται από την ΕΤ.ΕΚ. που ενεργεί ως θεματοφύλακας του."}]},{"n":30,"a":"γ","q":"Ποιο από τα παρακάτω ισχύει;","o":[{"k":"α","t":"Η συμμετοχή κάθε Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης προσδιορίζεται από τη μερίδα του. Η μερίδα αποτελείται από τις εισφορές του Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης επί έλαττον των προσόδων που αντιστοιχούν σε αυτή βάσει των κανόνων διαχειρίσεως και επενδύσεων που εφαρμόζει η ΕΤ.ΕΚ. και μείον τα πάσης φύσεως έξοδα ιδίως αυτά της διαχειρίσεως κινδύνων και ασφαλειών, όπως προσδιορίζονται με τις διαδικασίες της ΕΤ.ΕΚ.. Οι πρόσοδοι και τα έξοδα επιμερίζονται ως προς κάθε μερίδα Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθαρίσεως ανάλογα με το ύψος αυτής."},{"k":"β","t":"Η συμμετοχή κάθε Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης προσδιορίζεται από τη μερίδα του. Η μερίδα αποτελείται από τις εισφορές του Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης πλέον των προσόδων που αντιστοιχούν σε αυτή βάσει των κανόνων διαχειρίσεως και επενδύσεων που εφαρμόζει η ΕΤ.ΕΚ. και προστίθενται τα πάσης φύσεως έξοδα ιδίως αυτά της διαχειρίσεως κινδύνων και ασφαλειών, όπως προσδιορίζονται με τις διαδικασίες της ΕΤ.ΕΚ.. Οι πρόσοδοι και τα έξοδα επιμερίζονται ως προς κάθε μερίδα Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθαρίσεως ανάλογα με το ύψος αυτής."},{"k":"γ","t":"Η συμμετοχή κάθε Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης προσδιορίζεται από τη μερίδα του. Η μερίδα αποτελείται από τις εισφορές του Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης πλέον των προσόδων που αντιστοιχούν σε αυτή βάσει των κανόνων διαχειρίσεως και επενδύσεων που εφαρμόζει η ΕΤ.ΕΚ. και μείον τα πάσης φύσεως έξοδα ιδίως αυτά της διαχειρίσεως κινδύνων και ασφαλειών, όπως προσδιορίζονται με τις διαδικασίες της ΕΤ.ΕΚ.. Οι πρόσοδοι και τα έξοδα επιμερίζονται ως προς κάθε μερίδα Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης ανάλογα με το ύψος αυτής."},{"k":"δ","t":"Η συμμετοχή κάθε Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης προσδιορίζεται από τη μερίδα του. Η μερίδα αποτελείται από τις εισφορές του Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης πλέον των προσόδων που αντιστοιχούν σε αυτή βάσει των κανόνων διαχειρίσεως και επενδύσεων που εφαρμόζει η ΕΤ.ΕΚ. και μείον τα πάσης φύσεως έξοδα εκτός από αυτά της διαχειρίσεως κινδύνων και ασφαλειών, όπως προσδιορίζονται με τις διαδικασίες της ΕΤ.ΕΚ.. Οι πρόσοδοι και τα έξοδα επιμερίζονται ως προς κάθε μερίδα Εκκαθαριστικού Μέλους στο Κεφάλαιο Εκκαθάρισης ανάλογα με το ύψος αυτής."}]},{"n":31,"a":"β","q":"Πρόσβαση στο «Σύστημα εκκαθάρισης συναλλαγών επί των κινητών αξιών» για την εκκαθάριση των συναλλαγών που διενεργούνται στις αγορές έχουν:","o":[{"k":"α","t":"Η «Εταιρία Εκκαθάρισης Συναλλαγών Χρηματιστηρίου Αθηνών Α.Ε. (ΕΤ.ΕΚ.), το Χρηματιστήριο Αθηνών και τα Μέ
