ε κοινό λογαριασμό από έναν από τους συνδικαιούχους του."}]},{"n":10,"a":"β","q":"Η πιστοποίηση και επαλήθευση των στοιχείων ταυτότητας του πελάτη, άλλου προσώπου για λογαριασμό του οποίου ενεργεί ο πελάτης και του πραγματικού δικαιούχου πραγματοποιείται:","o":[{"k":"α","t":"Πριν από τη σύναψη επιχειρηματικών σχέσεων ή τη διενέργεια της συναλλαγής σε κάθε περίπτωση."},{"k":"β","t":"Πριν από τη σύναψη επιχειρηματικών σχέσεων ή τη διενέργεια της συναλλαγής και κατ’ εξαίρεση κατά τη σύναψη επιχειρηματικών σχέσεων, εφόσον αυτό απαιτείται για να μην διακοπεί η ομαλή διεξαγωγή των συναλλαγών και εφόσον ο κίνδυνος νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες είναι μικρός."},{"k":"γ","t":"Σε χρόνο που κρίνεται εύλογος από το υπόχρεο πρόσωπο."},{"k":"δ","t":"Αμέσως μετά τη σύναψη επιχειρηματικών σχέσεων ή τη διενέργεια της συναλλαγής."}]},{"n":11,"a":"δ","q":"Τα υπόχρεα πρόσωπα δεν υπόκεινται στις υποχρεώσεις επαλήθευσης της ταυτότητας:","o":[{"k":"α","t":"Όταν οι πελάτες είναι εταιρίες των οποίων οι μετοχές είναι εισηγμένες σε μία ή περισσότερες ρυθμιζόμενες αγορές της Ευρωπαϊκής Ένωσης."},{"k":"β","t":"Όταν οι πελάτες είναι ελληνική δημόσια αρχή ή νομικό πρόσωπο δημοσίου δικαίου ή επιχείρηση ή οργανισμός που ανήκει κατά 51% τουλάχιστον στο Δημόσιο."},{"k":"γ","t":"Όταν οι πελάτες είναι ΟΣΕΚΑ."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":12,"a":"γ","q":"Οι υποχρεώσεις επαλήθευσης της ταυτότητας του πελάτη για την πρόληψη νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες δεν ισχύουν:","o":[{"k":"α","t":"Όταν ο πελάτης είναι εταιρία της οποίας οι κινητές αξίες έχουν προσφερθεί στο ευρύ κοινό με δημόσια προσφορά σε κράτος μέλος της ΕΕ."},{"k":"β","t":"Όταν ο πελάτης είναι εταιρία της οποίας οι κινητές αξίες έχουν προσφερθεί στο ευρύ κοινό με δημόσια προσφορά και για την προσφορά αυτή η εταιρία είχε λάβει εξαίρεση από την υποχρέωση δημοσίευσης ενημερωτικού δελτίου."},{"k":"γ","t":"Όταν ο πελάτης είναι εταιρία της οποίας οι κινητές αξίες είναι εισηγμένες σε ρυθμιζόμενη αγορά κράτους μέλους της ΕΕ."},{"k":"δ","t":"Όταν ο πελάτης είναι εταιρία της οποίας οι κινητές αξίες έχουν ενταχθεί προς διαπραγμάτευση σε πολυμερή μηχανισμό διαπραγμάτευσης κράτους μέλους της ΕΕ."}]},{"n":13,"a":"δ","q":"Νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες συνιστά:","o":[{"k":"α","t":"Η απόκρυψη ή η συγκάλυψη της αλήθειας, όσον αφορά τη φύση, προέλευση, διάθεση, διακίνηση ή χρήση περιουσίας ή τον τόπο όπου αυτή αποκτήθηκε ή ευρίσκεται ή την κυριότητα επί περιουσίας ή σχετικών με αυτή δικαιωμάτων, εν γνώσει του γεγονότος ότι η περιουσία αυτή προέρχεται από εγκληματική δραστηριότητα ή από πράξη συμμετοχής σε τέτοια εγκλήματα."},{"k":"β","t":"Η απόκτηση, κατοχή, ή χρήση περιουσίας, εν γνώσει, κατά το χρόνο της κτήσης ή της διαχείρισης της, του γεγονότος ότι η περιουσία προέρχεται από εγκληματική δραστηριότητα ή από πράξη συμμετοχής σε τέτοια δραστηριότητα."},{"k":"γ","t":"Η απόκτηση, κατοχή ή χρήση περιουσίας, εν γνώσει κατά το χρόνο της κτήσης ή της διαχείρισής της, του γεγονότος ότι η περιουσία προέρχεται από οποιοδήποτε αδίκημα τιμωρητέο με ποινή στερητική της ελευθερίας, της οποίας το ελάχιστο όριο είναι άνω του ενός έτους ή από πράξη συμμετοχής σε τέτοιο αδίκημα."},{"k":"δ","t":"Η απόκρυψη ή η συγκάλυψη της αλήθειας, όσον αφορά τη φύση, προέλευση, διάθεση, διακίνηση ή χρήση περιουσίας ή τον τόπο όπου αυτή αποκτήθηκε ή ευρίσκεται ή την κυριότητα επί περιουσίας ή σχετικών με αυτή δικαιωμάτων, εν γνώσει του γεγονότος ότι η περιουσία αυτή προέρχεται από εγκληματική δραστηριότητα ή από πράξη συμμετοχής σε τέτοια εγκλήματα, καθώς και η απόκτηση, κατοχή, ή χρήση περιουσίας, εν γνώσει, κατά το χρόνο της κτήσης ή της διαχείρισής της, του γεγονότος ότι η περιουσία προέρχεται από εγκληματική δραστηριότητα ή από πράξη συμμετοχής σε τέτοια δραστηριότητα."}]},{"n":14,"a":"γ","q":"Οι λίστες κυρώσεων OFAC και ΕΕ περιλαμβάνουν:","o":[{"k":"α","t":"Πρόσωπα που έχουν εμπλακεί καθ’ υποτροπή σε απατηλές συναλλαγές."},{"k":"β","t":"Πρόσωπα που έχουν κατηγορηθεί για παράνομα διαδικτυακά τυχερά παίγνια."},{"k":"γ","t":"Φυσικά και Νομικά πρόσωπα."},{"k":"δ","t":"Τρομοκρατικές οργανώσεις μόνον."}]},{"n":15,"a":"β","q":"Στα βασικά εγκλήματα του Ν.4557/2018 δεν περιλαμβάνεται:","o":[{"k":"α","t":"Η εμπορία και διακίνηση ναρκωτικών."},{"k":"β","t":"Κάθε αξιόποινη πράξη που τιμωρείται με φυλάκιση τουλάχιστον 6 μηνών."},{"k":"γ","t":"Η εμπορία αρχαιοτήτων."},{"k":"δ","t":"Η λαθρομετανάστευση."}]},{"n":16,"a":"α","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Όσον αφορά τις συναλλαγές ή τις επιχειρηματικές σχέσεις με πολιτικώς εκτεθειμένα πρόσωπα, τα υπόχρεα πρόσωπα οφείλουν να ενημερώνουν την ΤτΕ προκειμένου να λάβουν σχετική έγκριση για τη σύναψη των σχέσεων."},{"k":"β","t":"Όσον αφορά τις συναλλαγές ή τις επιχειρηματικές σχέσεις με πολιτικώς εκτεθειμένα πρόσωπα, τα υπόχρεα πρόσωπα οφείλουν να εξασφαλίζουν την έγκριση από τα ανώτερα διοικητικά στελέχη για τη σύναψη επιχειρηματικών σχέσεων με τους πελάτες αυτούς."},{"k":"γ","t":"Όσον αφορά τις συναλλαγές ή τις επιχειρηματικές σχέσεις με πολιτικώς εκτεθειμένα πρόσωπα, τα υπόχρεα πρόσωπα οφείλουν να λαμβάνουν επαρκή μέτρα για να διαπιστώνουν την πηγή του πλούτου και την προέλευση των κεφαλαίων στα οποία αφορά η επιχειρηματική σχέση ή η συναλλαγή."},{"k":"δ","t":"Όσον αφορά τις συναλλαγές ή τις επιχειρηματικές σχέσεις με πολιτικώς εκτεθειμένα πρόσωπα, τα υπόχρεα πρόσωπα οφείλουν να διενεργούν ενισχυμένη και συνεχή παρακολούθηση της επιχειρηματικής σχέσης."}]},{"n":17,"a":"δ","q":"Ποιες από τις παρακάτω δεν συνιστούν ενδείξεις ότι συγκεκριμένη συναλλαγή είναι ύποπτη για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες;","o":[{"k":"α","t":"Η πληρωμή μεγάλων ποσών σε μετρητά ή επιταγές."},{"k":"β","t":"Η άρνηση του πελάτη να έχει προσωπικές επαφές με την ΑΕΠΕΥ ή το πιστωτικό ίδρυμα."},{"k":"γ","t":"Το αίτημα του πελάτη για μεταφορά χρηματικών ποσών σε λογαριασμούς άλλων πελατών με τους οποίους δεν συνδέεται με επαγγελματικούς ή συγγενικούς δεσμούς."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":18,"a":"β","q":"Στην κατηγορία υψηλού κινδύνου για την πρόληψη της χρησιμοποίησης του χρηματοπιστωτικού συστήματος για τη νομιμοποίηση εσόδων από εγκληματικές δραστηριότητας, δεν εντάσσονται υποχρεωτικά:","o":[{"k":"α","t":"Τα πολιτικώς εκτεθειμένα πρόσωπα."},{"k":"β","t":"Οι εταιρίες με ονομαστικές μετοχές (που δεν είναι εισηγμένες σε ρυθμιζόμενη αγορά)."},{"k":"γ","t":"Οι υπεράκτιες εταιρίες."},{"k":"δ","t":"Οι εταιρίες ειδικού σκοπού."}]},{"n":19,"a":"β","q":"Βάσει της Απόφασης ΕΤΠΘ 281/17.3.2009, στην κατηγορία Υψηλού Κινδύνου εντάσσονται:","o":[{"k":"α","t":"Οι Ανώνυμες Εταιρείες."},{"k":"β","t":"Οι στενοί συγγενείς ημεδαπών Πολιτικώς Εκτεθειμένων Προσώπων."},{"k":"γ","t":"Φυσικά Πρόσωπα που δεν προσκομίζουν το εκκαθαριστικό τους."},{"k":"δ","t":"Νομικά Πρόσωπα που έχουν συχνές συναλλαγές με εταιρείες συναφούς αντικειμένου."}]},{"n":20,"a":"β","q":"Σε περίπτωση λήψης εμβασμάτων με ελλιπείς πληροφορίες σχετικά με την ταυτότητα του εντολέα, η Τράπεζα λήψης:","o":[{"k":"α","t":"Οφείλει να ενημερώσει τον πελάτη της."},{"k":"β","t":"Οφείλει είτε να απορρίπτει την πληρωμή είτε να ζητά πλήρη στοιχεία."},{"k":"γ","t":"Οφείλει να ολοκληρώσει τη συναλλαγή."},{"k":"δ","t":"Δεν υποχρεούται να προβεί σε ελέγχους εφόσον η Τράπεζα του εντολέα φέρει την ευθύνη."}]},{"n":21,"a":"γ","q":"Ποια η σημασία της ένταξης στην κατηγορία υψηλού κινδύνου;","o":[{"k":"α","t":"Είναι υποχρεωτική η προσκόμιση του εκκαθαριστικού σημειώματος ετησίως."},{"k":"β","t":"Η εξακρίβωση της ταυτότητας γίνεται όταν διενεργείται συναλλαγή > € 15.000 με μια ή περισσότερες πράξεις που γίνονται την ίδια μέρα ή ανάγονται στην ίδια έννομη σχέση."},{"k":"γ","t":"Απαιτείται η εφαρμογή μέτρων αυξημένης δέουσας επιμέλειας."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":22,"a":"δ","q":"Σε ποια από τα παρακάτω πρόσωπα δεν εφαρμόζεται η διαδικασία της αυξημένης δέουσας επιμέλειας;","o":[{"k":"α","t":"Τα Πολιτικώς Εκτεθειμένα Πρόσωπα (ΠΕΠ)."},{"k":"β","t":"Τις υπεράκτιες εταιρείες."},{"k":"γ","t":"Τις εταιρείες ειδικού σκοπού."},{"k":"δ","t":"Τις εταιρείες με ονομαστικές μετοχές."}]},{"n":23,"a":"γ","q":"Σύμφωνα με το Ν. 4557/2018 ποιο από τα παρακάτω πρόσωπα χαρακτηρίζεται ως Πολιτικώς Εκτεθειμένο Πρόσωπο (ΠΕΠ):","o":[{"k":"α","t":"Ο Δήμαρχος της Αθήνας."},{"k":"β","t":"Ο γραμματέας της Αμερικάνικης Πρεσβείας στην Αθήνα."},{"k":"γ","t":"Ο σύζυγος της Γαλλίδας Υφυπουργού Πολιτισμού."},{"k":"δ","t":"Η σύζυγος του Ιατρικού Ακολούθου της Ελληνικής Πρεσβείας στη Γαλλία."}]},{"n":24,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Ως «πολιτικώς εκτεθειμένα πρόσωπα» νοούνται τα μέλη κοινοβουλίων ή αντίστοιχων νομοθετικών σωμάτων."},{"k":"β","t":"Ως «πολιτικώς εκτεθειμένα πρόσωπα» νοούνται τα μέλη διοικητικών συμβουλίων κεντρικών τραπεζών."},{"k":"γ","t":"Ως «πολιτικώς εκτεθειμένα πρόσωπα» νοούνται τα τέκνα και οι σύζυγοι ή πρόσωπα εξομοιούμενα με τους τελευταίους σύμφωνα με την εκάστοτε εθνική νομοθεσία."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":25,"a":"γ","q":"Τα πρόσωπα που είναι από το νόμο υπόχρεα να εφαρμόζουν μέτρα δέουσας επιμέλειας για την πρόληψη νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες:","o":[{"k":"α","t":"Δεν επιτρέπεται να διενεργούν συναλλαγές για πελάτη χωρίς τη φυσική παρουσία αυτού."},{"k":"β","t":"Μπορούν να διενεργούν συναλλαγές για πελάτη χωρίς τη φυσική παρουσία αυτού εφόσον ο πελάτης είναι χρηματοπιστωτικός οργανισμός."},{"k":"γ","t":"Έχουν υποχρεώσεις αυξημένης δέουσας επιμέλειας όταν ο πελάτης τους είναι σύμφωνα με το νόμο πολιτικώς εκτεθειμένο πρόσωπο."},{"k":"δ","t":"Δεν επιτρέπεται να διενεργούν συναλλαγές για πελάτη χωρίς τη φυσική παρουσία αυτού εφόσον ο πελάτης είναι σύμφωνα με το νόμο πολιτικώς εκτεθειμένο πρόσωπο."}]},{"n":26,"a":"δ","q":"Σε περιπτώσεις συναλλαγών που πραγματοποιούνται χωρίς τη φυσική παρουσία του πελάτη, η ΑΕΠΕΥ ή το πιστωτικό ίδρυμα:","o":[{"k":"α","t":"Λαμβάνουν επιπρόσθετα μέτρα για την ταυτοποίηση του πελάτη ζητώντας επιβεβαίωση από πιστωτικό ίδρυμα που λειτουργεί σε κράτος-μέλος της Ευρωπαϊκής Ένωσης ή χώρα-μέλος της FATF."},{"k":"β","t":"Ζητούν η πρώτη πληρωμή στο πλαίσιο των συναλλαγών να πραγματοποιείται μέσω λογαριασμού, ο οποίος έχει ανοιχθεί επ’ ονόματι του πελάτη σε πιστωτικό ίδρυμα εγκατεστημένο στην Ευρωπαϊκή Ένωση ή χώρα-μέλος της FATF."},{"k":"γ","t":"Αρνούνται τη συναλλαγή."},{"k":"δ","t":"Λαμβάνουν επιπρόσθετα μέτρα για την ταυτοποίηση του πελάτη ζητώντας επιβεβαίωση από πιστωτικό ίδρυμα που λειτουργεί σε κράτος-μέλος της Ευρωπαϊκής Ένωσης ή χώρα-μέλος της FATF και ζητούν η πρώτη πληρωμή στο πλαίσιο των συναλλαγών να πραγματοποιείται μέσω λογαριασμού, ο οποίος έχει ανοιχθεί επ’ ονόματι του πελάτη σε πιστωτικό ίδρυμα εγκατεστημένο στην Ευρωπαϊκή Ένωση ή χώρα-μέλος της FATF."}]},{"n":27,"a":"β","q":"Οι συναλλαγές που διενεργούνται χωρίς φυσική παρουσία πελάτη θεωρούνται:","o":[{"k":"α","t":"Κανονικού κινδύνου."},{"k":"β","t":"Υψηλού κινδύνου."},{"k":"γ","t":"Ύποπτες συναλλαγές."},{"k":"δ","t":"Ασυνήθεις συναλλαγές."}]},{"n":28,"a":"α","q":"Τα πρόσωπα, που από το νόμο έχουν την υποχρέωση τήρησης μέτρων δέουσας επιμέλειας ως προς τους πελάτες τους για την πρόληψη νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες, εφαρμόζουν τα μέτρα αυτά:","o":[{"k":"α","t":"Όταν συνάπτουν επιχειρηματικές σχέσεις με τον πελάτη."},{"k":"β","t":"Όταν το ύψος των συναλλαγών του πελάτη σε εξαμηνιαία βάση είναι μεγαλύτερο των 15.000€."},{"k":"γ","t":"Κάθε φορά που ο πελάτης διενεργεί συναλλαγή σε χρηματοπιστωτικά μέσα ρυθμιζόμενης αγοράς."},{"k":"δ","t":"Μόνο όταν υπάρχουν υπόνοιες για απόπειρα ή διάπραξη αδικημάτων από τον πελάτη που συνιστούν νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες."}]},{"n":29,"a":"β","q":"Εφόσον υπάρχουν βάσιμες υπόνοιες για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες, μπορεί να επιβληθεί απαγόρευση κίνησης λογαριασμών, τίτλων ή λοιπών προϊόντων, ανοίγματος θυρίδων θησαυροφυλακίου και εκποίησης ορισμένου ακινήτου:","o":[{"k":"α","t":"Από τον ανακριτή και εισαγγελέα."},{"k":"β","t":"Από τον ανακριτή και εισαγγελέα καθώς επίσης και από το δικαστικό συμβούλιο."},{"k":"γ","t":"Από το αρμόδιο διευθυντικό στέλεχος που έχει ορίσει το πιστωτικό ίδρυμα ή ο χρηματοπιστωτικός οργανισμός."},{"k":"δ","t":"Εάν υπάρξει καταδικαστική απόφαση."}]},{"n":30,"a":"β","q":"Σύμφωνα με την Αποφ. 281/5/17.3.2009 της ΕΤΠΘ/Τ.τ.Ε. για τα Πιστωτικά Ιδρύματα -Π.Ι.) και την Αποφ. 1/506/8.4.2009 του ΔΣ/ΕΚ (για τις ΑΕΠΕΥ κ.τ.λ.), τα πιστωτικά ιδρύματα και οι ΑΕΠΕΥ προβαίνουν στη διαβάθμιση/κατάταξη των πελατών τους (από πλευράς βαθμού κινδύνου για ενδεχόμενο «ξέπλυμα βρώμικου χρήματος και χρηματοδότηση τρομοκρατίας») αντιστοίχως ως εξής:","o":[{"k":"α","t":"Τα πιστωτικά ιδρύματα σε 2 τουλάχιστον κατηγορίες, ενώ οι ΑΕΠΕΥ σε 3 τουλάχιστον κατηγορίες."},{"k":"β","t":"Τα πιστωτικά ιδρύματα σε 3 τουλάχιστον κατηγορίες, ενώ οι ΑΕΠΕΥ σε 2 τουλάχιστον κατηγορίες."},{"k":"γ","t":"Τα πιστωτικά ιδρύματα σε 4 τουλάχιστον κατηγορίες, ενώ οι ΑΕΠΕΥ σε 2 τουλάχιστον κατηγορίες."},{"k":"δ","t":"Τα πιστωτικά ιδρύματα σε 2 τουλάχιστον κατηγορίες, ενώ και οι ΑΕΠΕΥ σε 2 τουλάχιστον κατηγορίες."}]},{"n":31,"a":"δ","q":"Τα υπόχρεα πρόσωπα εφαρμόζουν τα μέτρα δέουσας επιμέλειας ως προς τον πελάτη στις εξής περιπτώσεις:","o":[{"k":"α","t":"Όταν συνάπτουν επιχειρηματικές σχέσεις."},{"k":"β","t":"Όταν διενεργούν περιστασιακές συναλλαγές που ανέρχονται σε ποσό ίσο ή μεγαλύτερο 15.000 Ευρώ."},{"k":"γ","t":"Μετά τη σύναψη επιχειρηματικών σχέσεων."},{"k":"δ","t":"Όταν συνάπτουν επιχειρηματικές σχέσεις και όταν διενεργούν περιστασιακές συναλλαγές που ανέρχονται σε ποσό ίσο ή μεγαλύτερο 15.000 Ευρώ."}]},{"n":32,"a":"γ","q":"Ποια από τις παρακάτω προτάσεις είναι λανθασμένη όσον αφορά τις υποχρεώσεις των Πιστωτικών Ιδρυμάτων και των Χρηματοπιστωτικών Οργανισμών σύμφωνα με το Ν. 4557/2018 για την πρόληψη και καταστολή της νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες;","o":[{"k":"α","t":"Στη σύναψη επιχειρηματικής σχέσης εφαρμόζονται μέτρα δέουσας επιμέλειας."},{"k":"β","t":"Στη διενέργεια περιστασιακής συναλλαγής από 15.000 € και πάνω εφαρμόζονται μέτρα δέουσας επιμέλειας."},{"k":"γ","t":"Στις διασυνοριακές σχέσεις τραπεζικής ανταπόκρισης με ιδρύματα από τρίτες χώρες εφαρμόζονται μέτρα δέουσας επιμέλειας."},{"k":"δ","t":"Στη διενέργεια συναλλαγών χωρίς τη φυσική παρουσία του πελάτη εφαρμόζονται μέτρα αυξημένης δέουσας επιμέλειας."}]},{"n":33,"a":"δ","q":"Βασικές αρμοδιότητες της «Αρχής Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες» είναι:","o":[{"k":"α","t":"Η διερεύνηση και αξιολόγηση των πληροφοριών που της διαβιβάζονται από τα υπόχρεα πρόσωπα, αλλά και κάθε σχετικής πληροφορίας από οποιαδήποτε πηγή."},{"k":"β","t":"Η καθοδήγηση των «υπόχρεων προσώπων»."},{"k":"γ","t":"Η αξιολόγηση των υποθέσεων που διερευνά προκειμένου, ανάλογα με την αξιολόγηση, είτε να τεθούν στο αρχείο είτε να παραπεμφθούν στον αρμόδιο εισαγγελέα."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":34,"a":"δ","q":"Τα υπόχρεα πρόσωπα εφαρμόζουν τα μέτρα δέουσας επιμέλειας ως προς τον πελάτη στις εξής περιπτώσεις:","o":[{"k":"α","t":"Όταν υπάρχει υπόνοια νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες ή χρηματοδότησης της τρομοκρατίας, ανεξάρτητα από κάθε παρέκκλιση, εξαίρεση ή κατώτατο όριο ποσού."},{"k":"β","t":"Όταν υπάρχουν αμφιβολίες για την ακρίβεια, την πληρότητα ή την επάρκεια των στοιχείων που συγκεντρώθηκαν προηγουμένως για την πιστοποίηση και επαλήθευση της ταυτότητας του πελάτη ή του πραγματικού δικαιούχου."},{"k":"γ","t":"Όταν πρόκειται για πρόσωπα που εμπορεύονται αγαθά και διενεργούν περιστασιακή συναλλαγή σε μετρητά που αφορά ποσό 10.000 ευρώ τουλάχιστον, ανεξάρτητα από το αν διενεργείται με μια μόνη πράξη ή με περισσότερες που φαίνεται να συνδέονται μεταξύ τους."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":35,"a":"δ","q":"Τι από τα παρακάτω ισχύει;","o":[{"k":"α","t":"Τα πιστωτικά ιδρύματα και οι χρηματοπιστωτικοί οργανισμοί δεν επιτρέπεται να τηρούν μυστικούς, ανώνυμους ή μόνον αριθμημένους λογαριασμούς."},{"k":"β","t":"Τα πιστωτικά ιδρύματα και οι χρηματοπιστωτικοί οργανισμοί δεν επιτρέπεται να τηρούν ανώνυμα βιβλιάρια καταθέσεων, ανώνυμες θυρίδες ασφαλείας, λογαριασμούς με εικονικά ονόματα ή λογαριασμούς που δεν έχουν το πλήρες όνομα του δικαιούχου τους."},{"k":"γ","t":"Τα καζίνο οφείλουν να εξακριβώνουν την ταυτότητα των πελατών τους κατά την είσοδό τους στις εγκαταστάσεις των παιγνίων."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":36,"a":"δ","q":"Τα μέτρα της συνήθους δέουσας επιμέλειας που εφαρμόζουν τα υπόχρεα πρόσωπα ως προς τον πελάτη περιλαμβάνουν:","o":[{"k":"α","t":"Την εξακρίβωση και την επαλήθευση της ταυτότητας του πελάτη βάσει εγγράφων, δεδομένων ή πληροφοριών από αξιόπιστη και ανεξάρτητη πηγή."},{"k":"β","t":"Την εξακρίβωση της ταυτότητας του πραγματικού δικαιούχου, την επικαιροποίηση των στοιχείων και τη λήψη εύλογων μέτρων, όπως αυτά εξειδικεύονται με αποφάσεις της ΤτΕ και της ΕΚ ."},{"k":"γ","t":"Την αξιολόγηση και, ανάλογα με την περίπτωση, τη συλλογή πληροφοριών για το αντικείμενο και το σκοπό της επιχειρηματικής σχέσης ."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":37,"a":"α","q":"Η τήρηση αρχείων εγγράφων, στο πλαίσιο της νομοθεσίας για το ξέπλυμα βρώμικου χρήματος, είναι υποχρεωτική για τουλάχιστον:","o":[{"k":"α","t":"5 έτη."},{"k":"β","t":"2 έτη."},{"k":"γ","t":"10 έτη."},{"k":"δ","t":"15 έτη."}]},{"n":38,"a":"δ","q":"Η τήρηση αρχείου είναι υποχρεωτική:","o":[{"k":"α","t":"Για συναλλαγές > € 55.000."},{"k":"β","t":"Για τις ύποπτες συναλλαγές ανεξαρτήτως ποσού."},{"k":"γ","t":"Για συναλλαγές > € 15.000."},{"k":"δ","t":"Για όλες τις συναλλαγές."}]},{"n":39,"a":"β","q":"Στις περιπτώσεις κατά τις οποίες το υπόχρεο πρόσωπο δεν μπορεί να επαληθεύσει την ταυτότητα των πελατών πριν από τη σύναψη επιχειρηματικών σχέσεων ή τη διενέργεια της συναλλαγής ή να συμμορφωθεί με τις απαιτήσεις των μέτρων δέουσας επιμέλειας:","o":[{"k":"α","t":"Εκτελεί τη συναλλαγή, συνάπτει την επιχειρηματική σχέση και αναφέρει στην Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες."},{"k":"β","t":"Δεν εκτελεί τη συναλλαγή, δεν συνάπτει επιχειρηματική σχέση ή διακόπτει οριστικά αυτήν και εξετάζει αν συντρέχει υποχρέωση αναφοράς στην Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες."},{"k":"γ","t":"Εκτελεί τη συναλλαγή, συνάπτει την επιχειρηματική σχέση και προσπαθεί εκ των υστέρων να ικανοποιήσει με κάθε τρόπο τις απαιτήσεις των μέτρων δέουσας επιμέλειας."},{"k":"δ","t":"Δεν εκτελεί τη συναλλαγή, δεν συνάπτει επιχειρηματική σχέση ή διακόπτει οριστικά αυτήν."}]},{"n":40,"a":"α","q":"Η κερδοσκοπία από κατάχρηση προνομιακής πληροφορίας αποτελεί ένδειξη για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες:","o":[{"k":"α","t":"Σε κάθε περίπτωση."},{"k":"β","t":"Όταν προέρχεται από χρήση προνομιακών πληροφοριών."},{"k":"γ","t":"Όταν προέρχεται από χειραγώγηση αγοράς."},{"k":"δ","t":"Σε καμία περίπτωση."}]},{"n":41,"a":"α","q":"Ποιες από τις παρακάτω συναλλαγές θα χαρακτηρίζατε ύποπτες για ξέπλυμα χρήματος; Ι. Τήρηση πολλών τραπεζικών λογαριασμών στους οποίους κατατίθενται συχνά μικρά ποσά και τα οποία μεταφέρονται από ένα λογαριασμό στον άλλο. ΙΙ. Ενεργοποίηση αδρανών λογαριασμών. ΙΙΙ. Αγορά περίπλοκων χρηματοοικονομικών προϊόντων. ΙV. Πολλές μεταφορές κεφαλαίων από χώρες υψηλού κινδύνου.","o":[{"k":"α","t":"Ι, ΙΙ και IV."},{"k":"β","t":"ΙΙ, ΙΙΙ και IV."},{"k":"γ","t":"Ι, ΙΙΙ και IV."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":42,"a":"δ","q":"Ποιες από τις παρακάτω συναλλαγές θα χαρακτηρίζατε ύποπτες για ξέπλυμα χρήματος; Ι. Φυσικό ή νομικό πρόσωπο επιλέγει να κλείσει τους λογαριασμούς του λόγω αρνητικής δημοσιότητας. ΙΙ. Διαπιστώνεται η υπερτιμολόγηση ή υπο-τιμολόγηση προϊόντων, μέσω διαφόρων τεχνικών. ΙΙΙ. Πελάτης λαμβάνει δάνειο και δεν το χρησιμοποιεί για το σκοπό για τον οποίο το ζήτησε, αλλά το καταθέτει σε λογαριασμό για κάποιο διάστημα και στην συνέχεια το αναλαμβάνει σε μετρητά. IV. Διενεργούνται μεγάλου ύψους συναλλαγές από προσφάτως ιδρυθέντα νομικά πρόσωπα, οι οποίες δεν δικαιολογούνται από τα περιουσιακά τους στοιχεία.","o":[{"k":"α","t":"Ι, ΙΙ και ΙV μόνο."},{"k":"β","t":"ΙΙ, ΙΙΙ και IV μόνο."},{"k":"γ","t":"Ι, ΙΙ και IΙΙ μόνο."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":43,"a":"δ","q":"Ποια από τις παρακάτω δραστηριότητες ενδεχομένως υποδηλώνει ξέπλυμα χρήματος;","o":[{"k":"α","t":"Πελάτης πιστώνει το λογαριασμό του με ποσά σημαντικού ύψους σχεδόν αποκλειστικά μέσω ΑΤΜ."},{"k":"β","t":"Πραγματοποιείται μεταβίβαση ακινήτου σε τιμή ασυνήθιστα μεγαλύτερη από την αντικειμενική αξία του."},{"k":"γ","t":"Εξοφλείται τίμημα αγοράς ακινήτου με χρήματα προερχόμενα από λογαριασμό τρίτου πρόσωπου."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":44,"a":"δ","q":"Ποια από τις παρακάτω δραστηριότητες ενδεχομένως υποδηλώνει ξέπλυμα χρήματος:","o":[{"k":"α","t":"Διαπιστώνεται η υπερτιμολόγηση ή υπο-τιμολόγηση προϊόντων, μέσω διαφόρων τεχνικών."},{"k":"β","t":"Υπάλληλος της τράπεζας που είναι απρόθυμος να πάρει άδεια."},{"k":"γ","t":"Πελάτες εξοφλούν αιφνιδίως ληξιπρόθεσμα δάνεια."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":45,"a":"γ","q":"Ποια από τις παρακάτω δραστηριότητες ενδεχομένως υποδηλώνει ξέπλυμα χρήματος;","o":[{"k":"α","t":"Πελάτης διατηρεί κοινωνικές σχέσεις με στελέχη της τράπεζας."},{"k":"β","t":"Υπάλληλος της τράπεζας που δεν επιθυμεί μετακίνησή του σε άλλο κατάστημα."},{"k":"γ","t":"Πελάτης λαμβάνει δάνειο και δεν το χρησιμοποιεί για το σκοπό για τον οποίο το ζήτησε."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":46,"a":"β","q":"Ποια από τις παρακάτω προτάσεις είναι λάθος;","o":[{"k":"α","t":"Το προϊόν του βασικού εγκλήματος ή της νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες κατάσχεται και μπορεί να δημευθεί."},{"k":"β","t":"Το προϊόν της νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες δεν δημεύεται."},{"k":"γ","t":"Σε περίπτωση που η περιουσία ή το προϊόν του βασικού εγκλήματος ή της νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες δεν υπάρχει πλέον κατάσχονται και δημεύονται περιουσιακά στοιχεία ίσης αξίας."},{"k":"δ","t":"Το Δημόσιο μπορεί να αξιώσει ενώπιον των αρμόδιων πολιτικών δικαστηρίων από τον αμετακλήτως καταδικασμένο σε ποινή καθείρξεως για βασικό έγκλημα ή αδίκημα που συνιστά νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες, κάθε άλλη περιουσία που αυτός έχει αποκτήσει από άλλο βασικό έγκλημα ή αδίκημα που συνιστά νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες."}]},{"n":47,"a":"α","q":"Ο υπάλληλος υποκαταστήματος πιστωτικού ιδρύματος που εντοπίζει συναλλαγή ύποπτη να συνιστά νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες:","o":[{"k":"α","t":"Αναφέρεται κατευθείαν στο διευθυντή του υποκαταστήματος, ο οποίος αναφέρεται αμέσως στο αρμόδιο για τη λήψη των σχετικών αναφορών διευθυντικό στέλεχος, εφόσον συμμερίζεται τις υπόνοιες. Αν κωλύεται ή αρνείται ή αμελεί ή δεν συμμερίζεται τις υπόνοιες του αναφέροντος υπαλλήλου, ο υπάλληλος δύναται να αναφερθεί στο αρμόδιο για τη λήψη των σχετικών αναφορών διευθυντικό στέλεχος του πιστωτικού ιδρύματος."},{"k":"β","t":"Αναφέρεται κατευθείαν στο διευθυντή του υποκαταστήματος, ο οποίος αναφέρεται αμέσως στο αρμόδιο για τη λήψη των σχετικών αναφορών διευθυντικό στέλεχος, εφόσον συμμερίζεται τις υπόνοιες. Αν κωλύεται ή αρνείται ή αμελεί ή δεν συμμερίζεται τις υπόνοιες του αναφέροντος υπαλλήλου, ο υπάλληλος αναφέρεται ο ίδιος στην ΤτΕ."},{"k":"γ","t":"Αναφέρεται κατευθείαν στο διευθυντή του υποκαταστήματος, ο οποίος αναφέρεται αμέσως στην ΤτΕ, εφόσον συμμερίζεται τις υπόνοιες, ενώ σε περίπτωση που ο διευθυντής του υποκαταστήματος κωλύεται ή αρνείται ή αμελεί ή δεν συμμερίζεται τις υπόνοιες του αναφέροντος υπαλλήλου, ο υπάλληλος αναφέρεται ο ίδιος στην ΤτΕ."},{"k":"δ","t":"Αναφέρεται κατευθείαν στο διευθυντή του υποκαταστήματος, ο οποίος αναφέρεται αμέσως στην Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες."}]},{"n":48,"a":"γ","q":"Σε περίπτωση που υπάλληλος πιστωτικού ιδρύματος έχει εντοπίσει ασυνήθη ή ύποπτη συναλλαγή η οποία να συνιστά νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες, και ο διευθυντής του αμελεί ή κωλυσιεργεί για την αποστολή αναφοράς στο διευθυντικό στέλεχος, ο υπάλληλος:","o":[{"k":"α","t":"Αναφέρεται απευθείας στην Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες."},{"k":"β","t":"Αναφέρεται απευθείας στην ΤτΕ."},{"k":"γ","t":"Αναφέρεται στο αρμόδιο διευθυντικό στέλεχος για τη λήψη των σχετικών αναφορών, και ο τελευταίος ενημερώνει σχετικά την Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες."},{"k":"δ","t":"Αναφέρεται στο αρμόδιο διευθυντικό στέλεχος για τη λήψη των σχετικών αναφορών, και ο τελευταίος ενημερώνει σχετικά την ΤτΕ."}]},{"n":49,"a":"α","q":"Η Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες («Αρχή») του Ν.4557/2018:","o":[{"k":"α","t":"Είναι Ανεξάρτητη Αρχή."},{"k":"β","t":"Εποπτεύεται από τον Υπουργό Οικονομικών."},{"k":"γ","t":"Εποπτεύεται από την ΕΚ, την ΤτΕ και την Επιτροπή Εποπτείας Ιδιωτικής Ασφάλισης."},{"k":"δ","t":"Εποπτεύεται από το Υπουργείο Δικαιοσύνης."}]},{"n":50,"a":"γ","q":"Σύμφωνα με το Ν. 4557/2018 για την πρόληψη και καταστολή της νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες:","o":[{"k":"α","t":"Το αρμόδιο Διευθυντικό Στέλεχος ΑΕΠΕΥ οφείλει να αναφέρει κάθε συναλλαγή που θεωρεί ύποπτη για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες στην ΕΚ."},{"k":"β","t":"Το αρμόδιο Διευθυντικό Στέλεχος Πιστωτικού Ιδρύματος οφείλει να αναφέρει κάθε συναλλαγή που θεωρεί ύποπτη για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες στην ΤτΕ."},{"k":"γ","t":"Τα αρμόδια Διευθυντικά Στελέχη ΑΕΠΕΥ και Πιστωτικών Ιδρυμάτων οφείλουν να αναφέρουν κάθε συναλλαγή που θεωρούν ύποπτη για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες στην Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες."},{"k":"δ","t":"Το αρμόδιο Διευθυντικό Στέλεχος ΑΕΠΕΥ οφείλει να αναφέρει κάθε συναλλαγή που θεωρεί ύποπτη για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες στην ΕΚ και στην Επιτροπή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες και Χρηματοδότησης της Τρομοκρατίας και το αρμόδιο Διευθυντικό Στέλεχος Πιστωτικού Ιδρύματος οφείλει να αναφέρει κάθε συναλλαγή που θεωρεί ύποπτη για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες στην ΤτΕ και στην Επιτροπή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες και Χρηματοδότησης της Τρομοκρατίας."}]},{"n":51,"a":"β","q":"Οι ΑΕΠΕΥ αναφέρουν τις ασυνήθεις ή ύποπτες συναλλαγές:","o":[{"k":"α","t":"Στην ΤτΕ."},{"k":"β","t":"Στην Αρχή Καταπολέμησης της Νομιμοποίησης Εσόδων από Εγκληματικές Δραστηριότητες."},{"k":"γ","t":"Στην ΕΚ."},{"k":"δ","t":"Στην Εισαγγελία Πλημμελειοδικών."}]},{"n":52,"a":"α","q":"Σε σχέση με ζητήματα Ξεπλύματος Βρώμικου Χρήματος (εφαρμογή διαδικασιών κ.τ.λ.) αρμόδια Αρχή για τις ΑΕΔΑΚ είναι:","o":[{"k":"α","t":"Η ΕΚ."},{"k":"β","t":"Η ΤτΕ."},{"k":"γ","t":"Η ΥΠΕΕ."},{"k":"δ","t":"Η FATF."}]},{"n":53,"a":"δ","q":"Ο υπάλληλος που εκτελεί εντολή πελάτη η οποία είναι ύποπτη για ξέπλυμα:","o":[{"k":"α","t":"Έχει τις ίδιες ευθύνες με τον εντολέα του."},{"k":"β","t":"Έχει λιγότερες ευθύνες από τον εντολέα του."},{"k":"γ","t":"Δεν έχει καθόλου ευθύνες."},{"k":"δ","t":"Δεν έχει καμία ευθύνη εάν ενημερώσει το διευθυντή της μονάδος του και αυτός το αρμόδιο διευθυντικό στέλεχος."}]},{"n":54,"a":"δ","q":"Ποια από τις παρακάτω προτάσεις είναι σωστή;","o":[{"k":"α","t":"Κάθε πιστωτικό ίδρυμα ή χρηματοπιστωτικός οργανισμός οφείλει να ορίσει ένα διευθυντικό στέλεχος, στο οποίο τα άλλα διευθυντικά στελέχη και οι υπάλληλοι θα αναφέρουν κάθε συναλλαγή που θεωρούν ασυνήθη ή ύποπτη για απόπειρα ή διάπραξη των αδικημάτων νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες."},{"k":"β","t":"Στα υποκαταστήματα ή σε ειδικές διευθύνσεις ή μονάδες η αναφορά για κάθε συναλλαγή που θεωρούν ασυνήθη ή ύποπτη για απόπειρα ή διάπραξη των αδικημάτων νομιμοποίησης εσόδων από εγκληματικές δραστηριότητες γίνεται κατευθείαν στο διευθυντή του υποκαταστήματος ή της διεύθυνσης ή της μονάδας."},{"k":"γ","t":"Κάθε χρηματοπιστωτικός όμιλος οφείλει να ορίζει ένα διευθυντικό στέλεχος, από τη μεγαλύτερη εταιρία του ομίλου, ως συντονιστή για την εξασφάλιση της τήρησης των υποχρεώσεων του ν. 4557/2018 για το ξέπλυμα βρώμικου χρήματος."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":55,"a":"α","q":"Ποιες από τις παρακάτω συναλλαγές θα χαρακτηρίζατε ύποπτες για ξέπλυμα χρήματος; Ι. Τήρηση πολλών τραπεζικών λογαριασμών στους οποίους κατατίθενται συχνά μικρά ποσά και τα οποία μεταφέρονται από ένα λογαριασμό στον άλλο. ΙΙ. Επαναλαμβανόμενες όμοιες συναλλαγές για ποσά μικρότερα των €15.000. ΙΙΙ. Επαναλαμβανόμενες όμοιες συναλλαγές για ποσά μεγαλύτερα των €15.000. ΙV. Λογαριασμοί που κινούνται μόνο για κινήσεις κεφαλαίων στο εξωτερικό.","o":[{"k":"α","t":"Ι, II και IV μόνο."},{"k":"β","t":"II, IIΙ και IV μόνο."},{"k":"γ","t":"II και IV μόνο."},{"k":"δ","t":"I, II, III και IV."}]},{"n":56,"a":"δ","q":"Σε ποιους από τους παρακάτω λογαριασμούς εφαρμόζεται αυξημένη δέουσα επιμέλεια;","o":[{"k":"α","t":"Σε λογαριασμούς Πολιτικά Εκτεθειμένων Προσώπων."},{"k":"β","t":"Σε λογαριασμούς υπεράκτιων εταιρειών (offshore)."},{"k":"γ","t":"Σε λογαριασμούς εταιρειών με ανώνυμες μετοχές που δεν είναι εισηγμένες σε οργανωμένη αγορά."},{"k":"δ","t":"Όλες οι απαντήσεις είναι σωστές."}]},{"n":57,"a":"δ","q":"Ποια από τις παρακάτω συναλλαγές θα χαρακτηρίζατε ύποπτες για ξέπλυμα χρήματος; I. Σημαντική αύξηση καταθέσεων, χωρίς σημαντική αύξηση δραστηριότητας. II. Καταθέσεις μεγάλων ποσών σε μετρητά. III. Παροχή εγγύησης για δάνειο από εγγυητή, ο οποίος δεν έχει προφανή σχέση με τον δικαιούχο του δανείου. IV. Αγορά τίτλων μεγάλης αξίας, που διακρατείται από την τράπεζα προς φύλαξη αν και δεν δικαιολογείται από την οικονομική κατάσταση του δικαιούχου.","o":[{"k":"α","t":"Ι, II και IV μόνο."},{"k":"β","t":"II, IIΙ και IV μόνο."},{"k":"γ","t":"I, III και IV μόνο."},{"k":"δ","t":"I, II, III και IV."}]},{"n":58,"a":"α","q":"Για τον προσδιορισμό του κινδύνου φοροδιαφυγής, λαμβάνονται υπόψη:","o":[{"k":"α","t":"Η νομική μορφή & χώρα που εδρεύει το νομικό πρόσωπο."},{"k":"β","t":"Η μόνιμη κατοικία του φυσικού προσώπου."},{"k":"γ","t":"Το νόμισμα στο οποίο τηρείται ο λογαριασμός."},{"k":"δ","t":"Το πλήθος των Τραπεζών με τις οποίες συνεργάζεται ο πελάτης –φυσικό ή νομικό πρόσωπο."}]},{"n":59,"a":"δ","q":"Ποια περίπτωση από τις κάτωθι δεν συνιστά ένδειξη για ξέπλυμα χρήματος;","o":[{"k":"α","t":"Ενεργοποίηση αδρανούς λογαριασμού."},{"k":"β","t":"Συχνές συναλλαγές μέχρι 15.000 ευρώ."},{"k":"γ","t":"Καταθέσεις μεγάλων ποσών σε μετρητά και επιταγές."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":60,"a":"δ","q":"Ποιες από τις παρακάτω συναλλαγές θα χαρακτηρίζατε ύποπτες για ξέπλυμα χρήματος; Ι. Άνοιγμα με αυξανόμενη συχνότητα θυρίδων σε ορισμένα υποκαταστήματα. ΙΙ. Μερική ή ολική αποπληρωμή δανείου χωρίς να μπορεί να δικαιολογηθεί η προέλευση των κεφαλαίων. ΙΙΙ. Πίστωση σε λογαριασμό υψηλών ποσών αποκλειστικά μέσω ΑΤΜ. IV. Κατάθεση μετρητών που προέρχεται από μεταβίβαση ακινήτου σε τιμή ασυνήθιστα μεγαλύτερη από την αντικειμενική του αξία.","o":[{"k":"α","t":"Ι, ΙΙ και ΙV μόνο."},{"k":"β","t":"ΙΙ, ΙΙΙ και IV μόνο."},{"k":"γ","t":"Ι, ΙΙΙ και IV μόνο."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":61,"a":"γ","q":"Ποια από τα παρακάτω θα χαρακτηρίζατε ύποπτα για ξέπλυμα χρήματος; Ι. Πελάτης δεν παρέχει στοιχεία για λογαριασμό τρίτου για τον οποίο ενεργεί. ΙΙ. Συχνές μεταφορές κεφαλαίων σε εμπορικούς του εταίρους στο εξωτερικό. ΙΙΙ. Εκδήλωση νευρικότητας κατά τη διεξαγωγή της συναλλαγής. IV. Πελάτης εμφανίζει, σε μικρό χρονικό διάστημα, δυσανάλογα υψηλά έσοδα από τυχερά παιγνίδια ή στοιχήματα.","o":[{"k":"α","t":"Ι, ΙΙ και ΙV μόνο."},{"k":"β","t":"ΙΙ, ΙΙΙ και IV μόνο."},{"k":"γ","t":"Ι, ΙΙΙ και IV μόνο."},{"k":"δ","t":"Ι, ΙΙ, ΙΙΙ και IV."}]},{"n":62,"a":"β","q":"Ποιοί από τους παρακάτω δεν νοούνται ως υπόχρεα πρόσωπα σύμφωνα με το Ν. 4557/2018 για την πρόληψη και αναφορά συναλλαγών ύποπτων να συνιστούν ξέπλυμα βρώμικου χρήματος; Ι. Επιχειρήσεις εμπορίας πολύτιμων μετάλλων, όταν η αξία της συναλλαγής δεν υπερβαίνει τα 10.000 Ευρώ. ΙΙ. Οι ιδιώτες ελεγκτές. ΙΙΙ. Οι συνδεδεμένοι αντιπρόσωποι ΑΕΠΕΥ. IV. Φορέας που παρέχει υπηρεσίες τυχερών παιγνίων, όταν η αξία της συναλλαγής δεν υπερβαίνει τα 10.000 Ευρώ.","o":[{"k":"α","t":"I και IV μόνο."},{"k":"β","t":"Ι μόνο."},{"k":"γ","t":"ΙΙΙ μόνο."},{"k":"δ","t":"ΙΙ και ΙΙΙ μόνο."}]},{"n":63,"a":"β","q":"Ως υπόχρεα πρόσωπα για τους σκοπούς του Ν. 4557/2018 νοούνται: Ι. Οι ενεχυροδανειστές και αργυραμοιβοί, ανεξαρτήτως αξίας της συναλλαγής. ΙΙ. Οι οίκοι δημοπρασίας, ανεξαρτήτως αξίας της συναλλαγής. ΙΙΙ. Οι επιχειρήσεις εμπορίας πολύτιμων και ημιπολύτιμων λίθων, όταν η αξία της συναλλαγής ανέρχεται σε τουλάχιστον 10.000 Ευρώ. IV. Τα καζίνο που λειτουργούν επί πλοίων στην Ελλάδα, ανεξαρτήτως της σημαίας του πλοίου.","o":[{"k":"α","t":"Ι, ΙΙ, III και IV."},{"k":"β","t":"III και IV μόνο."},{"k":"γ","t":"I, II και IV μόνο."},{"k":"δ","t":"Ι, ΙΙΙ και IV μόνο."}]},{"n":64,"a":"α","q":"Στα υπόχρεα πρόσωπα του Ν. 4557/2018 περιλαμβάνονται: Ι. Οι εταιρίες κεφαλαίου επιχειρηματικών συμμετοχών. ΙΙ. Οι επιχειρήσεις καζίνο και τα καζίνο που λειτουργούν επί πλοίων στην Ελλάδα ή υπό ελληνική σημαία. ΙΙΙ. Τα πρόσωπα που παρέχουν υπηρεσίες σε εταιρείες ή καταπιστεύματα (trusts) (υπό τις εξαιρέσεις του Ν. 4557/2018). IV. Επιχειρήσεις εμπορίας ενδυμάτων, όταν η αξία της συναλλαγής ανέρχεται σε τουλάχιστον 10.000 Ευρώ.","o":[{"k":"α","t":"I, ΙΙ, ΙΙΙ και IV."},{"k":"β","t":"I, II, και III, μόνο."},{"k":"γ","t":"Ι, ΙΙ, και IV μόνο."},{"k":"δ","t":"ΙΙ, ΙΙΙ, και IV μόνο."}]},{"n":65,"a":"α","q":"Σύμφωνα με το Ν. 4557/2018 για το ξέπλυμα χρήματος, ποιό από τα παρακάτω δεν συνιστά \"βασικό έγκλημα\":","o":[{"k":"α","t":"Η παράνομη παρασκευή εκρηκτικών υλών."},{"k":"β","t":"Η εμπορία ανθρώπων."},{"k":"γ","t":"Η απάτη με υπολογιστή."},{"k":"δ","t":"Η εγκληματική οργάνωση."}]},{"n":66,"a":"δ","q":"Τι από τα παρακάτω περιλαμβάνει ος τον πελάτη: I. Πριν συνάψουν νέες επαγγελματικές συμβάσεις. II. Όταν διενεργούν συναλλαγές αξίας τουλάχιστον €15.000. ΙΙΙ. Όταν διενεργούν συναλλαγές αξίας μικρότερης €15.000. IV. Όταν υπάρχουν αμφιβολίες για την ακρίβεια των ιστορικών δεδομένων που έχουν συγκεντρωθεί.","o":[{"k":"α","t":"I και II μόνο."},{"k":"β","t":"I, II και IV μόνο."},{"k":"γ","t":"I, III και IV μόνο."},{"k":"δ","t":"I, II, III και IV."}]},{"n":72,"a":"δ","q":"Προκειμένου για τις ΑΕΠΕΥ:","o":[{"k":"α","t":"Οι εξωτερικοί ελεγκτές της εταιρίας (τακτικοί ή μη) υποβάλλουν κάθε 1 χρόνo το αργότερο εντός του μηνός Ιουνίου έκθεση η οποία αιτιολογεί τη επάρκεια και αποτελεσματικότητα των διαδικασιών που εφαρμόζονται για την αποτροπή της νομιμοποιήσεως εσόδων από εγκληματικές δραστηριότητες και τη χρηματοδότηση της τρομοκρατίας. Αντίγραφο της εκθέσεως υποβάλλεται στην ΕΚ."},{"k":"β","t":"Οι εξωτερικοί ελεγκτές της εταιρίας (τακτικοί ή μη) υποβάλλουν κάθε 2 χρόνια το αργότερο εντός του μηνός Ιουνίου έκθεση η οποία αιτιολογεί τη επάρκεια και αποτελεσματικότητα των διαδικασιών που εφαρμόζονται για την αποτροπή της νομιμοποιήσεως εσόδων από εγκληματικές δραστηριότητες και τη χρηματοδότηση της τρομοκρατίας. Αντίγραφο της εκθέσεως υποβάλλεται στην ΕΚ."},{"k":"γ","t":"Οι εξωτερικοί ελεγκτές της εταιρίας (τακτικοί ή μη) υποβάλλουν κάθε 3 χρόνια το αργότερο εντός του μηνός Φεβρουαρίου έκθεση η οποία αιτιολογεί τη επάρκεια και αποτελεσματικότητα των διαδικασιών που εφαρμόζονται για την αποτροπή της νομιμοποιήσεως εσόδων από εγκληματικές δραστηριότητες και τη χρηματοδότηση της τρομοκρατίας. Αντίγραφο της εκθέσεως υποβάλλεται στην ΕΚ."},{"k":"δ","t":"Οι εξωτερικοί ελεγκτές της εταιρίας (τακτικοί ή μη) υποβάλλουν κάθε 3 χρόνια το αργότερο εντός του μηνός Ιουνίου έκθεση η οποία αιτιολογεί τη επάρκεια και αποτελεσματικότητα των διαδικασιών που εφαρμόζονται για την αποτροπή της νομιμοποιήσεως εσόδων από εγκληματικές δραστηριότητες και τη χρηματοδότηση της τρομοκρατίας. Αντίγραφο της εκθέσεως υποβάλλεται στην ΕΚ."}]},{"n":73,"a":"γ","q":"Οι ΑΕΠΕΥ και τα πιστωτικά ιδρύματα δεν οφείλουν να εφαρμόζουν μέτρα δέουσας επιμέλειας έναντι ξεπλύματος χρήματος ως προς τον πελάτη:","o":[{"k":"α","t":"Όταν διενεργούν συναλλαγές αξίας μικρότερης των €20.000."},{"k":"β","t":"Όταν διενεργούν συναλλαγές αξίας τουλάχιστον €15.000."},{"k":"γ","t":"Όταν διενεργούν συναλλαγές αξίας μικρότερης των €15.000."},{"k":"δ","t":"Όταν υπάρχουν αμφιβολίες για την ακρίβεια των ιστορικών δεδομένων που έχουν συγκεντρωθεί."}]},{"n":74,"a":"γ","q":"Τα πιστωτικά ιδρύματα και οι ΑΕΠΕΥ οφείλουν, στο πλαίσιο της πρόληψης της χρησιμοποίησης του χρηματοπιστωτικού συστήματος για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες, να κατατάσσουν τους πελάτες τους σε κατηγορίες κινδύνου ώστε:","o":[{"k":"α","t":"Να εγκρίνουν εκ των προτέρων τις συναλλαγές των πελατών που έχουν καταταγεί στις κατηγορίες υψηλού κινδύνου."},{"k":"β","t":"Να ενημερώνουν σχετικά την ΤτΕ και την ΕΚ αντίστοιχα."},{"k":"γ","t":"Να μπορούν να παρακολουθούν με αυξημένη προσοχή τις συναλλαγές των πελατών που έχουν καταταγεί στις κατηγορίες υψηλού κινδύνου στο πλαίσιο της παρακολούθησης με βάση τον κίνδυνο (risk based approach)."},{"k":"δ","t":"Να πληροφορούν τους πελάτες για συναλλαγές τους που χαρακτηρίζονται ως ύποπτες για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες."}]},{"n":75,"a":"γ","q":"Για τους πελάτες υψηλού κινδύνου είναι υποχρεωτική η προσκόμιση:","o":[{"k":"α","t":"Της φορολογικής δήλωσης ετησίως."},{"k":"β","t":"Του ΑΦΜ ετησίως."},{"k":"γ","t":"Του εκκαθαριστικού σημειώματος ετησίως."},{"k":"δ","t":"Του εκκαθαριστικού σημειώματος σε κάθε συναλλαγή που αποκλίνει από το οικονομικό / συναλλακτικό του προφίλ."}]},{"n":76,"a":"γ","q":"Ποιες από τις παρακάτω κατηγορίες πελατών/ σχέσεων θεωρούνται υψηλού κινδύνου από πλευράς ξεπλύματος χρήματος:","o":[{"k":"α","t":"Επιχειρηματικές σχέσεις και συναλλαγές που ενέχουν αυξημένο κίνδυνο φοροδιαφυγής."},{"k":"β","t":"Σχήματα ή οντότητες που στερούνται νομικής προσωπικότητας."},{"k":"γ","t":"Επιχειρηματικές σχέσεις και συναλλαγές που ενέχουν αυξημένο κίνδυνο φοροδιαφυγής και σχήματα ή οντότητες που στερούνται νομικής προσωπικότητας."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":77,"a":"δ","q":"Οι λογαριασμοί ενώσεων προσώπων μη κερδοσκοπικού χαρακτήρα εμπίπτουν στην κατηγορία:","o":[{"k":"α","t":"Πελατών χαμηλού κινδύνου."},{"k":"β","t":"Πελατών ειδικού κινδύνου."},{"k":"γ","t":"Πελατών ειδικού χειρισμού."},{"k":"δ","t":"Πελατών υψηλού κινδύνου."}]},{"n":78,"a":"δ","q":"Οι ΑΕΠΕΥ και τα πιστωτικά ιδρύματα οφείλουν να γνωρίζουν τον τελικό δικαιούχο (beneficial owner) κάθε λογαριασμού που ανοίγουν:","o":[{"k":"α","t":"Εάν το ζητήσει η μονάδα ή ο υπεύθυνος κανονιστικής συμμόρφωσης."},{"k":"β","t":"Εάν διενεργεί συναλλαγές που χαρακτηρίζονται ύποπτες για νομιμοποίηση εσόδων από εγκληματικές δραστηριότητες."},{"k":"γ","t":"Σε καμία περίπτωση."},{"k":"δ","t":"Σε κάθε περίπτωση."}]},{"n":79,"a":"δ","q":"Στο ξέπλυμα βρώμικου χρήματος, ο υπάλληλος που εκτελεί εντολή πελάτη:","o":[{"k":"α","t":"Δε φέρει ποτέ ευθύνη."},{"k":"β","t":"Φέρει πάντοτε ευθύνη εντολέα."},{"k":"γ","t":"Φέρει ευθύνη ανάλογα με το είδος του εντολέα."},{"k":"δ","t":"Καμία από τις απαντήσεις δεν είναι σωστή."}]},{"n":80,"a":"δ","q":"Όσον αφορά μη εισηγμένη ανώνυμη εταιρεία ως \"πραγματικός δικαιούχος\" για τους σκοπούς του Ν. 4557/2018 θεωρείται, μεταξύ άλλων:","o":[{"k":"α","t":"Φυσικό πρόσωπο που κατέχει ποσοστό μετοχών άνω του 5%."},{"k":"β","t":"Φυσικό πρόσωπο που κατέχει ποσοστό μετοχών άνω του 15%."},{"k":"γ","t":"Φυσικό πρόσωπο που κατέχει ποσοστό μετοχών άνω του 20%."},{"k":"δ","t":"Φυσικό πρόσωπο που κατέχει ποσοστό μετοχών άνω του 25%."}]},{"n":81,"a":"β","q":"Ποιοι από τους παρακάτω νοούνται ως \"Χρηματοπιστωτικοί Οργανισμοί\" για τους σκοπούς του Ν. 4557/2018: I. Τα ανταλλακτήρια συναλλάγματος. II. Τα πιστωτικά ιδρύματα. III. Οι ταχυδρομικές εταιρείες, στο μέτρο που ασκούν υπηρεσίες πληρωμών . IV. Οι ΑΕΠΕΥ.","o":[{"k":"α","t":"I, ΙΙ, ΙΙΙ και IV."},{"k":"β","t":"I, III και IV μόνο."},{"k":"γ","t":"Ι, ΙΙ και IV μόνο."},{"k":"δ","t":"ΙΙ, ΙΙΙ και IV μόνο."}]},{"n":82,"a":"γ","q":"Ποιοι από τους παρακάτω νοούνται ως \"υπόχρεα πρόσωπα\" για τους σκοπούς του Ν. 4557/2018: Ι. Τα πιστωτικά ιδρύματα. ΙΙ. Οι ΑΕΠΕΥ. ΙΙΙ. Οι ενεχυροδανειστές και οι αργυραμοιβοί, ανεξαρτήτως αξίας της συναλλαγής. IV. Οι εταιρίες διαχείρισης απαιτήσεων πιστωτικών ιδρυμάτων από δάνεια και πιστώσεις.","o":[{"k":"α","t":"I, ΙΙ, ΙΙΙ και IV."},{"k":"β","t":"I, III και IV μόνο."},{"k":"γ","t":"Ι, ΙΙ και IV μόνο."},{"k":"δ","t":"ΙΙ, ΙΙΙ και IV μόνο."}]},{"n":83,"a":"δ","q":"Σύμφωνα με το Ν. 4557/2018, τα υπόχρεα πρόσωπα θα οφείλουν να εφαρμόσουν τα μέτρα δέουσας επιμέλειας ως προς τον πελάτη τους στις εξής περιπτώσεις: Ι. Όταν διενεργήσουν μια περιστασιακή συναλλαγή που ανέρχεται σε ποσό €10.000 και η συναλλαγή αυτή πραγματοποιείται με μια και μόνη πράξη. ΙΙ. Όταν διενεργήσουν μια περιστασιακή συναλλαγή που αποτελεί μεταφορά χρηματικού ποσού (σύμφωνα με τον ορισμό του στοιχείου 9 του άρθρου 3 του Κανονισμού (ΕΕ) 2015/847) €1.500. ΙΙΙ. Όταν πρόκειται για πρόσωπα που εμπορεύονται αγαθά και διενεργήσουν μια περιστασιακή συναλλαγή σε μετρητά που αφορά ποσό €10.000 και η συναλλαγή αυτή πραγματοποιείται με περισσότερες πράξεις που φαίνονται να συνδέονται μεταξύ τους. IV. Όταν υπάρχουν αμφιβολίες για την ακρίβεια, την πληρότητα ή την επάρκεια των στοιχείων που συγκεντρώθηκαν προηγουμένως για την πιστοποίηση και την επαλήθευση της ταυτότητας του πελάτη ή του πραγματικού δικαιούχου.","o":[{"k":"α","t":"I, ΙΙ, ΙΙΙ και IV."},{"k":"β","t":"I, III και IV μόνο."},{"k":"γ","t":"Ι, ΙΙ και IV μόνο."},{"k":"δ","t":"ΙΙ, ΙΙΙ και IV μόνο."}]}]}};
    const WHY = {"np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:1":"Οι υπηρεσίες που απλώς σχετίζονται με την αναδοχή είναι παρεπόμενη υπηρεσία. Συμβουλή, αναδοχή ή τοποθέτηση με δέσμευση, και λειτουργία ΠΜΔ είναι επενδυτικές υπηρεσίες.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:2":"Η λειτουργία πολυμερούς μηχανισμού διαπραγμάτευσης είναι επενδυτική δραστηριότητα. Η πίστωση σε επενδυτή είναι παρεπόμενη, και η ρυθμιζόμενη αγορά δεν είναι επενδυτική υπηρεσία.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:3":"Η ρυθμιζόμενη αγορά δεν ανήκει στον κατάλογο των επενδυτικών υπηρεσιών. Η λήψη εντολών, η διαχείριση χαρτοφυλακίου και ο ΠΜΔ ανήκουν.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:4":"Και ο ΠΜΔ, και η τοποθέτηση με δέσμευση, και η τοποθέτηση χωρίς δέσμευση είναι επενδυτικές υπηρεσίες.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:5":"Η τοποθέτηση χωρίς δέσμευση ανάληψης είναι η ίδια επενδυτική υπηρεσία, όχι παρεπόμενη.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:6":"Η τοποθέτηση με δέσμευση ανάληψης είναι επενδυτική υπηρεσία. Συμβουλές για τη διάρθρωση κεφαλαίου, υπηρεσίες σχετικές με την αναδοχή και θεματοφυλακή είναι παρεπόμενες.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:7":"Η πίστωση ή το δάνειο σε επενδυτή για να κάνει συναλλαγή είναι παρεπόμενη υπηρεσία, όχι επενδυτική.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:8":"Πιστοποίηση χρειάζονται όσοι δίνουν συμβουλές, διαχειρίζονται χαρτοφυλάκιο ή εκτελούν εντολές. Ισχύουν και οι τρεις περιπτώσεις.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:9":"Η φύλαξη και διαχείριση χρηματοπιστωτικών μέσων για λογαριασμό πελατών είναι παρεπόμενη υπηρεσία.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:10":"Η φύλαξη τίτλων είναι παρεπόμενη υπηρεσία, όχι επενδυτική.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:11":"Οι ανώνυμες εταιρείες επενδύσεων χαρτοφυλακίου δεν παρέχουν επενδυτικές υπηρεσίες σε τρίτους.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:12":"Στην παρακολούθηση προϊόντος η ΑΕΠΕΥ ορίζει και την αγορά-στόχο και τις κατηγορίες πελατών. Δεν αρκεί μόνο το ένα σκέλος.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:13":"Στα πιστωτικά ιδρύματα η Τράπεζα της Ελλάδος έχει την προληπτική εποπτεία και η Επιτροπή Κεφαλαιαγοράς τη δεοντολογία. Στις ΑΕΠΕΥ και τα δύο ανήκουν στην Επιτροπή Κεφαλαιαγοράς.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:14":"Εσωτερικό δίαυλο καταγγελιών πρέπει να έχουν ΑΕΠΕΥ, διαχειριστές αγοράς, ΑΕΔΑΚ, διαχειριστές ΟΕΕ, πάροχοι δεδομένων και πιστωτικά ιδρύματα.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:15":"Στη λήψη και διαβίβαση εντολών ο έλεγχος συμβατότητας παραλείπεται μόνο αν η πρωτοβουλία είναι του πελάτη, το μέσο δεν είναι πολύπλοκο και ο πελάτης έχει ενημερωθεί γι' αυτό.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:16":"Η εισαγωγή σε ρυθμιζόμενη αγορά δεν κάνει από μόνη της μια εταιρεία επαγγελματία πελάτη.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:17":"Όποιος κάνει αλγοριθμικές συναλλαγές το γνωστοποιεί στην Επιτροπή Κεφαλαιαγοράς και στην αρχή του τόπου διαπραγμάτευσης.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:18":"Ο επαγγελματίας γίνεται ιδιώτης μόνο αν το ζητήσει ο ίδιος γραπτώς και η εταιρεία τον ενημερώσει για την αλλαγή προστασίας.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:19":"Σύσταση για το πότε να εκτελεστεί μια εντολή είναι προσωπική επενδυτική συμβουλή.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:20":"Συμβουλή είναι η προσωπική σύσταση για τον χρόνο της συναλλαγής και η σύσταση να ρευστοποιηθούν επενδύσεις σε καταθέσεις. Η χρήση προνομιακής πληροφορίας δεν είναι συμβουλή, και η σκέτη σύγκριση μέσων χωρίς προσωπική σύσταση επίσης όχι.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:21":"Στον μηχανισμό οργανωμένης διαπραγμάτευσης μπαίνουν ομόλογα, δομημένα προϊόντα και παράγωγα, όχι μετοχές.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:22":"Η προσωπική σύσταση για συναλλαγή σε χρηματοπιστωτικό μέσο είναι επενδυτική υπηρεσία.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:23":"Παρεπόμενες είναι η επενδυτική έρευνα και οι συμβουλές σε επιχειρήσεις για τη διάρθρωση του κεφαλαίου. Η εκτέλεση εντολών και η αναδοχή είναι επενδυτικές υπηρεσίες.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:24":"Για την άδεια ΑΕΠΕΥ η Επιτροπή πρέπει να ξέρει τους μετόχους που κρατούν τουλάχιστον το 10%.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:25":"Η άδεια κοιτάζει κεφάλαιο, διοίκηση, μετόχους με ειδική συμμετοχή και οργανωτικές προϋποθέσεις, όλα μαζί.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:26":"Ειδική συμμετοχή, άρα έλεγχος μετόχου, αρχίζει από ποσοστό άνω του 10%.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:27":"Η αίτηση άδειας πρέπει να απαριθμεί όλες τις υπηρεσίες και όλα τα μέσα στα οποία θα δραστηριοποιηθεί η εταιρεία.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:28":"Με την άδεια της μπορεί να περάσει σε άλλο κράτος μέλος όποια υπηρεσία περιλαμβάνει η άδεια, είτε με υποκατάστημα είτε απευθείας.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:29":"Η προληπτική εποπτεία μένει πάντα στην Ελλάδα. Τη δεοντολογία, αν η υπηρεσία περνάει απευθείας, την έχει η Επιτροπή Κεφαλαιαγοράς· αν υπάρχει υποκατάστημα, την έχει η αρχή του κράτους υποδοχής.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:30":"Η ανάθεση λειτουργίας σε τρίτον δεν μεταφέρει την ευθύνη. Η Επιτροπή Κεφαλαιαγοράς συνεχίζει να εποπτεύει την ίδια την ΑΕΠΕΥ.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:31":"Το έγγραφο βασικών πληροφοριών περιλαμβάνει τι είναι το προϊόν, ποιους κινδύνους και ποιο κέρδος έχει, και ποιο είναι το κόστος.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:32":"Κίνδυνος κανονιστικής συμμόρφωσης είναι η ζημία επειδή η εταιρεία δεν τήρησε το νομικό πλαίσιο.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:33":"Ο χρόνος που χρειάζεται ο ιδιώτης για το έγγραφο βασικών πληροφοριών κρίνεται από τη γνώση και την εμπειρία του σε αυτό ή σε παρόμοιο προϊόν.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:34":"Όποιος κρατά χρήματα ή τίτλους πελατών τους στέλνει, σε σταθερό μέσο, κατάσταση περιουσιακών στοιχείων τουλάχιστον μία φορά τον χρόνο.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:35":"Στον ιδιώτη πελάτη η βέλτιστη εκτέλεση κρίνεται από το συνολικό τίμημα: την τιμή του μέσου συν το κόστος εκτέλεσης.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:36":"Η ενημέρωση προς ιδιώτες μπορεί να τονίζει το όφελος μόνο αν δίπλα επισημαίνει καθαρά και τον σχετικό κίνδυνο.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:37":"Η οικονομική κατάσταση του πελάτη δεν περιγράφεται με ένα μόνο στοιχείο. Μετράνε όλα όσα απαριθμεί η ερώτηση.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:38":"Αφού κάποιος έχει ήδη ειδική συμμετοχή, νέα γνωστοποίηση χρειάζεται όταν φτάνει ή περνάει το 20%, το 33,3% ή το 50%.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:39":"Με νέο ιδιώτη πελάτη η εταιρεία συνάπτει γραπτή σύμβαση πριν του παράσχει επενδυτικές υπηρεσίες.","np:ΕΠΕΝΔΥΤΙΚΕΣ ΥΠΗΡΕΣΙΕΣ:40":"Τα ουσιώδη της εκτέλεσης δίνονται αμέσως. Στον ιδιώτη, η επιβεβαίωση σε σταθερό μέσο φεύγει το αργότερο την επόμενη εργάσιμη."};

      const rep = document.querySelector("#go-repeat");
      if (rep) rep.onclick = () => startList(all.filter((it) => rec(it.id).wrongs >= 2 && rec(it.id).streak < 2), "Λάθη που επαναλαμβάνονται");
    }

    function pool(items) {
      const open = items.filter((it) => rec(it.id).streak < 2);
      return open.length ? open : items;
    }
    function startRandom(n) {
      const items = shuffle(pool(allItems())).slice(0, n);
      startList(items, n + " τυχαίες");
    }
    function startList(items, label) {
      if (!items.length) { alert("Δεν υπάρχουν ερωτήσεις σε αυτή την ομάδα."); return; }
      session = { label, queue: items.slice(), left: items.length, firstCorrect: 0, firstSeen: {} };
      tab = "solve";
      render();
    }

    function chapters() {
      app.innerHTML = `<h1>Κεφάλαιο</h1><p class="sub">Μπαίνουν τυχαίες όσες δεν έχεις κλείδωσει. Αν τις έχεις κλείδωσει όλες, ξαναμπαίνει το κεφάλαιο για επανάληψη.</p><div class="stack">${
        CHAPTERS.map((ch, i) => {
          const items = chapterItems(ch);
          const seen = seenCount(items);
          const ok = correctNow(items);
          const pct = seen ? Math.round(ok / seen * 100) : 0;
          return `<button class="ch" data-i="${i}" type="button"><strong>${esc(ch.title)}</strong><div class="row"><span>${seen}/${items.length} είδες · ${lockedCount(items)} κλειδωμένες</span><span>${seen ? pct + "%" : ""}</span></div><div class="bar ${seen && pct < 70 ? "warn" : ""}"><span style="width:${seen ? pct : 0}%"></span></div></button>`;
        }).join("")
      }</div>`;
      app.querySelectorAll(".ch").forEach((b) => b.onclick = () => {
        const ch = CHAPTERS[Number(b.dataset.i)];
        startList(shuffle(pool(chapterItems(ch))), ch.title);
      });
    }

    function solve() {
      if (!session) { tab = "home"; render(); return; }
      if (!session.queue.length) { summary(); return; }
      if (!session.view) session.view = present(session.queue[0]);
      const view = session.view;
      const item = view.item;
      const open = session.queue.filter((q, i) => session.queue.findIndex((x) => x.id === q.id) === i && rec(q.id).streak < 2).length;
      const done = session.pick != null;
      const why = WHY[item.id];
      app.innerHTML = `
        <div class="top"><button class="back" id="back" type="button">←</button><div><p class="kicker">${esc(session.label)} · ${esc(item.title)}</p><p class="sub" style="margin:0">Μένουν ${open} για κλείδωμα</p></div></div>
        <h2>${esc(item.q)}</h2>
        <div class="opts">${view.opts.map((o) => {
          let cls = "opt";
          if (done && o.show === view.correct) cls += " good";
          if (done && o.show === session.pick && o.show !== view.correct) cls += " bad";
          return `<button class="${cls}" data-k="${o.show}" type="button" ${done ? "disabled" : ""}><b>${o.show}</b><span>${esc(o.t)}</span></button>`;
        }).join("")}</div>
        ${done ? `<div class="why"><strong>${session.note}</strong>${session.whyText ? "<p>" + esc(session.whyText) + "</p>" : ""}</div><button class="btn" id="next" type="button" style="margin-top:10px">Επόμενη</button>` : ""}
      `;
      document.querySelector("#back").onclick = () => { if (confirm("Να μείνει στη μέση η συνεδρία; Η πρόοδος των απαντήσεων έχει ήδη κρατηθεί.")) { session = null; tab = "home"; render(); } };
      app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
        if (session.pick != null) return;
        session.pick = b.dataset.k;
        const before = rec(item.id).tries;
        const next = grade(item, session.pick, view.correct);
        if (!session.firstSeen[item.id]) {
          session.firstSeen[item.id] = true;
          if (next.lastOk) session.firstCorrect++;
        }
        if (!next.lastOk) {
          session.note = "Λάθος. Σωστό είναι το " + view.correct + ".";
          session.whyText = why || view.opts.find((o) => o.show === view.correct).t;
          session.requeue = true;
        } else if (next.streak < 2) {
          session.note = "Σωστό. Μένει άλλη μία φορά για να κλειδώσει.";
          session.whyText = "";
          session.requeue = true;
        } else {
          session.note = "Κλείδωσε.";
          session.whyText = "";
          session.requeue = false;
        }
        render();
      });
      const nxt = document.querySelector("#next");
      if (nxt) nxt.onclick = () => {
        const cur = session.queue.shift();
        if (session.requeue) session.queue.push(cur);
        session.view = null;
        session.pick = null;
        session.requeue = false;
        render();
      };
    }

    function summary() {
      const n = Object.keys(session.firstSeen).length;
      app.innerHTML = `
        <p class="kicker">${esc(session.label)}</p>
        <h1>Τέλος συνεδρίας</h1>
        <div class="grid">
          <div class="stat"><b>${session.firstCorrect}/${n}</b><span>σωστές με την πρώτη</span></div>
          <div class="stat"><b>${n - session.firstCorrect}</b><span>γύρισαν πίσω</span></div>
        </div>
        <p class="sub">Κάθε ερώτηση της συνεδρίας την είπες σωστά δύο φορές στη σειρά. Από εδώ και πέρα μετράει ως κλειδωμένη.</p>
        <div class="stack">
          <button class="btn" id="again" type="button">Άλλες 10</button>
          <button class="btn ghost" id="home" type="button">Αρχική</button>
        </div>`;
      document.querySelector("#again").onclick = () => startRandom(10);
      document.querySelector("#home").onclick = () => { session = null; tab = "home"; render(); };
    }

    function newExam() {
      const paper = [];
      for (const ch of CHAPTERS) {
        for (const item of shuffle(chapterItems(ch)).slice(0, ch.draw)) {
          const view = present(item);
          paper.push({ item, title: ch.title, q: item.q, opts: view.opts, correct: view.correct, pick: null });
        }
      }
      exam = { paper: shuffle(paper), i: 0, done: false, started: Date.now() };
      render();
    }
    function fmt(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

    function examScreen() {
      if (!exam) {
        const last = db.exams[0];
        app.innerHTML = `
          <p class="kicker">Τεστ όπως στην εξέταση</p>
          <h1>40 ερωτήσεις</h1>
          <p class="sub">Εδώ η αναλογία είναι της εξέτασης, όχι τυχαίο δείγμα. Βάση 28. Μία προσπάθεια, χωρίς να γυρίζει πίσω η ερώτηση.</p>
          <p class="sub">${last ? (last.score >= 28 ? "Με το τελευταίο τεστ θα περνούσες (" + last.score + "/40)." : "Με το τελευταίο τεστ δεν θα περνούσες (" + last.score + "/40).") : "Δεν έχεις δώσει τεστ ακόμα."}</p>
          <button class="btn" id="start" type="button">Έναρξη</button>`;
        document.querySelector("#start").onclick = newExam;
        return;
      }
      if (exam.done) {
        const ok = exam.paper.filter((q) => q.pick === q.correct).length;
        const q = exam.paper[exam.i];
        const why = WHY[q.item.id];
        app.innerHTML = `
          <p class="kicker">Αποτέλεσμα</p>
          <h1 class="${ok >= 28 ? "pass" : "fail"}">${ok} / 40</h1>
          <p class="sub">${ok >= 28 ? "Θα περνούσες." : "Δεν θα περνούσες. Βάση 28."} Χρόνος ${fmt(Date.now() - exam.started)}.</p>
          <div class="dots">${exam.paper.map((item, i) => `<button class="dot ${item.pick === item.correct ? "good" : "bad"}" data-i="${i}" type="button">${i + 1}</button>`).join("")}</div>
          <p class="kicker">${esc(q.title)}</p>
          <h2>${esc(q.q)}</h2>
          <div class="opts">${q.opts.map((o) => `<div class="opt ${o.show === q.correct ? "good" : ""} ${o.show === q.pick && o.show !== q.correct ? "bad" : ""}"><b>${o.show}</b><span>${esc(o.t)}</span></div>`).join("")}</div>
          ${q.pick !== q.correct ? `<div class="why"><strong>Γιατί</strong><p>${esc(why || q.opts.find((o) => o.show === q.correct).t)}</p></div>` : ""}
          <button class="btn ghost" id="clear-exam" type="button" style="margin-top:12px">Νέο τεστ</button>`;
        app.querySelectorAll(".dot").forEach((d) => d.onclick = () => { exam.i = Number(d.dataset.i); render(); });
        document.querySelector("#clear-exam").onclick = () => { exam = null; render(); };
        return;
      }
      const q = exam.paper[exam.i];
      const answered = exam.paper.filter((item) => item.pick).length;
      app.innerHTML = `
        <p class="kicker">${esc(q.title)} · ${fmt(Date.now() - exam.started)}</p>
        <p class="sub">${exam.i + 1} / 40 · απαντημένες ${answered}</p>
        <div class="dots">${exam.paper.map((item, i) => `<button class="dot ${i === exam.i || item.pick ? "on" : ""}" data-i="${i}" type="button">${i + 1}</button>`).join("")}</div>
        <h2>${esc(q.q)}</h2>
        <div class="opts">${q.opts.map((o) => `<button class="opt" data-k="${o.show}" type="button"><b>${o.show}</b><span>${esc(o.t)}</span></button>`).join("")}</div>
        <button class="btn" id="submit" type="button" style="margin-top:12px">Υποβολή</button>`;
      app.querySelectorAll(".dot").forEach((d) => d.onclick = () => { exam.i = Number(d.dataset.i); render(); });
      app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
        q.pick = b.dataset.k;
        app.querySelectorAll(".opt").forEach((el) => el.style.outline = el.dataset.k === q.pick ? "2px solid #1a3352" : "");
      });
      document.querySelector("#submit").onclick = () => {
        const missing = exam.paper.filter((item) => !item.pick).length;
        if (missing && !confirm("Έχεις αφήσει " + missing + " κενές. Να υποβληθεί;")) return;
        for (const item of exam.paper) if (item.pick) grade(item.item, item.pick, item.correct);
        const score = exam.paper.filter((item) => item.pick === item.correct).length;
        db.exams.unshift({ score, at: Date.now() });
        db.exams = db.exams.slice(0, 30);
        save();
        exam.done = true;
        exam.i = Math.max(0, exam.paper.findIndex((item) => item.pick !== item.correct));
        render();
      };
    }

    function stats() {
      const all = allItems();
      const seen = seenCount(all);
      const locked = lockedCount(all);
      const last = db.exams[0];
      const repeats = all.filter((it) => rec(it.id).wrongs >= 2).sort((a, b) => rec(b.id).wrongs - rec(a.id).wrongs);
      app.innerHTML = `
        <h1>Στατιστικά</h1>
        <div class="grid">
          <div class="stat"><b>${seen}/${TOTAL}</b><span>κάλυψη τράπεζας</span></div>
          <div class="stat"><b>${locked}</b><span>κλειδωμένες</span></div>
        </div>
        <div class="card" style="padding:12px 14px;margin-bottom:14px">
          <strong>${last ? (last.score >= 28 ? "Με το τελευταίο τεστ θα περνούσες." : "Με το τελευταίο τεστ δεν θα περνούσες.") : "Δεν έχεις δώσει τεστ, άρα δεν ξέρουμε ακόμα αν θα περνούσες."}</strong>
          ${last ? "<p class=sub>Τελευταίο: " + last.score + "/40 στις " + new Date(last.at).toLocaleDateString("el-GR") + ".</p>" : ""}
          ${db.exams.slice(0, 8).map((e) => `<div class="exam-item"><span>${new Date(e.at).toLocaleDateString("el-GR")}</span><strong class="${e.score >= 28 ? "pass" : "fail"}">${e.score}/40</strong></div>`).join("")}
        </div>
        <h2>Ανά κεφάλαιο</h2>
        <div class="stack" style="margin-bottom:16px">${CHAPTERS.map((ch) => {
          const items = chapterItems(ch);
          const s = seenCount(items);
          const ok = correctNow(items);
          const pct = s ? Math.round(ok / s * 100) : 0;
          return `<div class="ch"><strong>${esc(ch.title)}</strong><div class="row"><span>${ok} σωστές τώρα / ${s} είδες / ${items.length}</span><span>${s ? pct + "%" : "–"}</span></div><div class="bar ${s && pct < 70 ? "warn" : ""}"><span style="width:${s ? pct : 0}%"></span></div></div>`;
        }).join("")}</div>
        <h2>Τις χάνεις ξανά και ξανά</h2>
        ${repeats.length ? repeats.slice(0, 30).map((it) => `<div class="miss"><strong>${rec(it.id).wrongs} φορές</strong> · ${esc(it.title)}<div>${esc(it.q.slice(0, 140))}</div></div>`).join("") : "<p class=sub>Ακόμα καμία δεν έχει πέσει λάθος δύο φορές.</p>"}
        ${repeats.length ? '<button class="btn" id="drill" type="button" style="margin-top:12px">Λύσε όσες δεν έχουν κλειδώσει</button>' : ""}
        <button class="btn ghost" id="reset" type="button" style="margin-top:16px">Μηδενισμός σε αυτό το κινητό</button>`;
      const drill = document.querySelector("#drill");
      if (drill) drill.onclick = () => startList(shuffle(repeats.filter((it) => rec(it.id).streak < 2)), "Επαναλαμβανόμενα λάθη");
      document.querySelector("#reset").onclick = () => {
        if (!confirm("Να σβηστούν οι απαντήσεις και τα τεστ από αυτό το κινητό;")) return;
        db = { answers: {}, exams: [] };
        save();
        session = null;
        exam = null;
        render();
      };
    }

    function render() {
      document.querySelectorAll(".navbtn").forEach((b) => {
        const on = (tab === "solve" && b.dataset.tab === "practice") || b.dataset.tab === tab;
        if (on) b.setAttribute("aria-current", "page");
        else b.removeAttribute("aria-current");
      });
      if (tab === "home") home();
      else if (tab === "practice") chapters();
      else if (tab === "solve") solve();
      else if (tab === "exam") examScreen();
      else stats();
      window.scrollTo(0, 0);
    }
    document.querySelectorAll(".navbtn").forEach((b) => b.onclick = () => {
      if (tab === "solve" && session && b.dataset.tab !== "practice") {
        if (!confirm("Φεύγεις από τη συνεδρία. Οι απαντήσεις μένουν.")) return;
        session = null;
      }
      tab = b.dataset.tab;
      render();
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
    render();
  </script>
</body>
</html>
